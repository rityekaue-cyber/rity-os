                            ))}
                          </div>
                        );
                      })()}
                      {!matFeita&&(
                        <div style={{display:'flex',gap:6}}>
                          <button onClick={()=>marcarAnkiMat(m.mat)} style={{flex:2,padding:'8px',borderRadius:8,border:'none',background:'#a78bfa',color:'#0f172a',fontSize:14,fontWeight:800,cursor:'pointer'}}>✅ Fiz — {m.mat.split(' ')[0]}</button>
                          <button onClick={()=>{setNaoFizModal('anki');setNaoFizMotivo('');}} style={{padding:'8px 10px',borderRadius:8,border:'1px solid rgba(248,113,113,.3)',background:'transparent',color:'#f87171',fontSize:14,cursor:'pointer'}}>❌</button>
                        </div>
                      )}
                    </div>
                  );
                })}
                {/* Total e botão geral */}
                {(()=>{
                  const nFeitas=Object.values(ankiFeitosMat).filter(v=>v.feito).length;
                  const totalCards=Object.values(ankiFeitosMat).reduce((s,v)=>s+(v.cards||0),0);
                  if(nFeitas===0)return null;
                  return(
                    <div style={{padding:'8px 12px',borderRadius:9,background:'rgba(52,211,153,.06)',border:'1px solid rgba(52,211,153,.2)',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span style={{fontSize:14,color:'#34d399'}}>{nFeitas}/{ankiMaterias.length} matérias feitas · {totalCards} cards</span>
                      {nFeitas<ankiMaterias.length&&<button onClick={marcarAnki} style={{padding:'6px 12px',borderRadius:7,border:'none',background:'#a78bfa',color:'#0f172a',fontSize:14,fontWeight:800,cursor:'pointer'}}>✅ Marcar todas</button>}
                    </div>
                  );
                })()}
                <BtnNaoFiz tipo="anki"/>
              </div>}
              {abertos.anki&&ankiFeito&&<div style={{padding:'0 14px 14px'}}>
                <div style={{fontSize:14,color:'#34d399',fontWeight:700,marginBottom:6}}>✅ Feito hoje — {ankiFeito.cards} cards</div>
                {ankiFeito.mats?.map(m=><div key={m.mat} style={{fontSize:13,color:'var(--text4)',marginBottom:2}}>• {m.mat}: {ankiFeito.porMat?.[m.mat]||m.cards} cards</div>)}
              </div>}
            </div>
            {/* NLM — card mínimo tempo morto */}
            <div>
              {(()=>{
                const nlmFeito=lsGet(`nlm_feito_${hoje}`,false);
                const fila=nlmSugerido?.fila||[];
                const idxValido=Math.min(nlmFilaIdx,Math.max(fila.length-1,0));
                const matAtual=fila[idxValido]||nlmSugerido;
                const podeProximo=fila.length>1&&idxValido<fila.length-1;
                // Assunto específico do Guruja para a matéria sugerida
                const assuntosManut=matAtual?getAssuntosManutencao(matAtual.mat,1):[];
                const assuntoEspecifico=assuntosManut[0]||null;
                return(
                  <>
                    <CardHeader emoji="🎧" titulo="NLM — tempo morto" resumo={nlmFeito?'✅ ouvido hoje':`${assuntoEspecifico?assuntoEspecifico.titulo.slice(0,28)+'…':matAtual?.mat||'—'} · manutenção`} key_="nlm" cor="#34d399" feito={!!nlmFeito} nfz={!!naoFiz.nlm}/>
                    {abertos.nlm&&!naoFiz.nlm&&!nlmFeito&&matAtual&&(
                      <div style={{padding:'0 14px 14px'}}>
                        <div style={{padding:'18px 16px',borderRadius:12,background:'rgba(52,211,153,.07)',border:'2px solid rgba(52,211,153,.3)',marginBottom:10,textAlign:'center'}}>
                          <div style={{fontSize:13,color:'#34d399',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'2px',marginBottom:8}}>🎧 OUVIR AGORA — manutenção</div>
                          <div style={{fontSize:20,fontWeight:900,color:'var(--text)',fontFamily:"'DM Serif Display',serif",marginBottom:3}}>{matAtual.mat}</div>
                          {assuntoEspecifico?(
                            <>
                              <div style={{fontSize:14,color:'#34d399',marginBottom:4,fontWeight:700}}>{assuntoEspecifico.titulo}</div>
                              <div style={{fontSize:13,color:'var(--text4)'}}>{assuntoEspecifico.acerto}% acerto{assuntoEspecifico.diffMedia>0?` · ⬆️${assuntoEspecifico.diffMedia}% da média`:''}</div>
                            </>
                          ):(
                            <div style={{fontSize:14,color:'#34d399'}}>NotebookLM · teoria</div>
                          )}
                        </div>
                        <div style={{display:'flex',gap:6}}>
                          <button onClick={()=>{lsSet(`nlm_feito_${hoje}`,true);if(onAddHoras)onAddHoras({mat:`NLM — ${matAtual?.mat||''}`,min:45,dt:Date.now()});}} style={{flex:2,padding:'10px',borderRadius:9,border:'none',background:'#34d399',color:'#0f172a',fontSize:15,fontWeight:800,cursor:'pointer'}}>✅ Ouvi hoje</button>
                          {podeProximo&&<button onClick={()=>setNlmFilaIdx(i=>Math.min(i+1,fila.length-1))} style={{padding:'10px 14px',borderRadius:9,border:'1px solid rgba(52,211,153,.3)',background:'transparent',color:'#34d399',fontSize:15,cursor:'pointer'}}>🔄 Trocar</button>}
                          <BtnNaoFiz tipo="nlm"/>
                        </div>
                      </div>
                    )}
                    {abertos.nlm&&nlmFeito&&<div style={{padding:'0 14px 14px',fontSize:14,color:'#34d399',fontWeight:700}}>✅ Ouvido hoje!</div>}
                  </>
                );
              })()}
            </div>
          </div>
        </div>
      )}

      {/* ── SUB-ABA: TEC — cards simplificados Modelo 1 ── */}
      {subAba==='tec'&&(()=>{
        const todosItens=lsGet('rev_caderno',[]);
        const ativos=todosItens.filter(t=>!t.dominado);
        const dominados=todosItens.filter(t=>t.dominado);
        // Ordena só por dificuldade (desc) depois % acerto (asc) — sem datas
        const ordenados=[...ativos].sort((a,b)=>{
          const difA=a.dificuldade||3,difB=b.dificuldade||3;
          if(difB!==difA)return difB-difA;
          const pctA=a.pct??50,pctB=b.pct??50;
          return pctA-pctB;
        });
        // Resumo da semana — quantas questões revisadas nos últimos 7 dias
        const seteAtras=new Date();seteAtras.setDate(seteAtras.getDate()-7);
        const seteAtrasStr=seteAtras.toISOString().split('T')[0];
        let questoesSemana=0;
        todosItens.forEach(t=>{(t.historico||[]).forEach(h=>{if(h.data>=seteAtrasStr&&h.questoes)questoesSemana+=h.questoes;});});

        // Card com registro inline de revisão — Forma 1 completa
        const CardTEC=({t})=>{
          const[expandido,setExpandido]=useState(false);
          const[novasQ,setNovasQ]=useState('');
          const[novosA,setNovosA]=useState('');
          const[novaDif,setNovaDif]=useState(t.dificuldade||3);
          const pctCor=t.pct===null||t.pct===undefined?'#aab6c8':t.pct>=80?'#34d399':t.pct>=60?'#fbbf24':'#f87171';
          const difCors=['','#34d399','#a3e635','#fbbf24','#fb923c','#f87171'];
          const difLabels=['','Muito fácil','Fácil','Médio','Difícil','Muito difícil'];
          const dif=t.dificuldade||3;
          const salvar=()=>{
            const q=parseInt(novasQ)||0;
            const a=parseInt(novosA)||0;
            if(q===0)return;
            registrarRevisaoTec(t.id,q,a,novaDif);
            setNovasQ('');setNovosA('');setExpandido(false);
          };
          return(
            <div style={{borderRadius:12,background:'rgba(255,255,255,.02)',border:`1px solid ${difCors[dif]}30`,marginBottom:8,overflow:'hidden'}}>
              {/* Linha principal */}
              <div onClick={()=>setExpandido(e=>!e)} style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',cursor:'pointer'}}>
                <div style={{textAlign:'center',flexShrink:0,width:44}}>
                  <div style={{fontSize:20,fontWeight:900,color:pctCor,fontFamily:"'DM Mono',monospace",lineHeight:1}}>{t.pct!==null&&t.pct!==undefined?t.pct+'%':'—'}</div>
                  {t.feitas>0&&<div style={{fontSize:13,color:'var(--text4)'}}>{t.feitas}Q</div>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:15,fontWeight:800,color:'var(--text)'}}>{t.mat}</div>
                  {t.assunto&&<div style={{fontSize:13,color:'var(--text4)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.assunto}</div>}
                  <div style={{display:'flex',gap:5,marginTop:4,flexWrap:'wrap',alignItems:'center'}}>
                    <span style={{fontSize:13,padding:'1px 6px',borderRadius:4,background:`${difCors[dif]}18`,color:difCors[dif],fontFamily:"'DM Mono',monospace",fontWeight:700}}>{'⭐'.repeat(dif)} {difLabels[dif]}</span>
                    {(t.tentativas||0)>0&&<span style={{fontSize:13,color:'#a78bfa',fontFamily:"'DM Mono',monospace"}}>↻ {t.tentativas}x revisado</span>}
                  </div>
                </div>
                <span style={{fontSize:14,color:'var(--text4)',flexShrink:0}}>{expandido?'▲':'▼'}</span>
              </div>

              {/* Painel de registro — expande ao tocar */}
              {expandido&&(
                <div style={{borderTop:'1px solid var(--border)',padding:'12px 14px'}}>
                  {/* Linha do tempo, se tiver histórico */}
                  {(t.historico||[]).length>0&&(
                    <div style={{marginBottom:10,padding:'8px 10px',borderRadius:8,background:'rgba(255,255,255,.02)'}}>
                      <div style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace",marginBottom:4}}>HISTÓRICO</div>
                      {[...(t.historico||[])].slice(-4).reverse().map((h,i)=>(
                        <div key={i} style={{fontSize:13,color:'var(--text4)',marginBottom:2}}>
                          {h.data} — {h.questoes!==undefined?`${h.questoes}Q, ${h.acertos}✓ · `:''}{h.dificuldade?`${'⭐'.repeat(h.dificuldade)}`:h.acao||''}
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{fontSize:13,color:'var(--text4)',marginBottom:6,fontFamily:"'DM Mono',monospace"}}>REGISTRAR NOVA REVISÃO</div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
                    <div>
                      <div style={{fontSize:13,color:'var(--text4)',marginBottom:3}}>QUESTÕES</div>
                      <input type="number" value={novasQ} onChange={e=>setNovasQ(e.target.value)} placeholder="ex: 10"
                        style={{width:'100%',padding:'9px',borderRadius:8,border:'1px solid var(--border)',background:'rgba(255,255,255,.03)',color:'var(--text)',fontSize:16,fontWeight:700,fontFamily:"'DM Mono',monospace",textAlign:'center',outline:'none',boxSizing:'border-box'}}/>
                    </div>
                    <div>
                      <div style={{fontSize:13,color:'var(--text4)',marginBottom:3}}>ACERTOS</div>
                      <input type="number" value={novosA} onChange={e=>setNovosA(e.target.value)} placeholder="ex: 7"
                        style={{width:'100%',padding:'9px',borderRadius:8,border:'1px solid rgba(52,211,153,.25)',background:'rgba(52,211,153,.04)',color:'#34d399',fontSize:16,fontWeight:700,fontFamily:"'DM Mono',monospace",textAlign:'center',outline:'none',boxSizing:'border-box'}}/>
                    </div>
                  </div>
                  <div style={{fontSize:13,color:'var(--text4)',marginBottom:4}}>QUÃO DIFÍCIL FOI DESSA VEZ?</div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr 1fr',gap:4,marginBottom:10}}>
                    {[1,2,3,4,5].map(v=>(
                      <button key={v} onClick={()=>setNovaDif(v)}
                        style={{padding:'7px 2px',borderRadius:7,border:`2px solid ${novaDif===v?difCors[v]:'var(--border)'}`,background:novaDif===v?`${difCors[v]}18`:'transparent',fontSize:14,cursor:'pointer'}}>⭐</button>
                    ))}
                  </div>
                  <div style={{display:'flex',gap:6}}>
                    <button onClick={salvar} disabled={!novasQ} style={{flex:1,padding:'10px',borderRadius:9,border:'none',background:novasQ?'#60a5fa':'var(--border)',color:novasQ?'#0f172a':'var(--text4)',fontSize:15,fontWeight:800,cursor:'pointer'}}>💾 Salvar revisão</button>
                    <button onClick={()=>marcarDominado(t.id)} style={{padding:'10px 12px',borderRadius:9,border:'1px solid rgba(52,211,153,.35)',background:'rgba(52,211,153,.08)',color:'#34d399',fontSize:15,fontWeight:800,cursor:'pointer',whiteSpace:'nowrap'}}>✅ Dominei</button>
                  </div>
                </div>
              )}
            </div>
          );
        };

        return(
          <div>
            {/* Resumo fixo no topo */}
            <div style={{padding:'12px 14px',borderRadius:12,background:'rgba(96,165,250,.06)',border:'1px solid rgba(96,165,250,.2)',marginBottom:14}}>
              <div style={{display:'flex',gap:16}}>
                <div>
                  <div style={{fontSize:21,fontWeight:900,color:'#60a5fa',fontFamily:"'DM Mono',monospace",lineHeight:1}}>{questoesSemana}</div>
                  <div style={{fontSize:13,color:'var(--text4)',marginTop:2}}>questões essa semana</div>
                </div>
                <div>
                  <div style={{fontSize:21,fontWeight:900,color:'#34d399',fontFamily:"'DM Mono',monospace",lineHeight:1}}>{dominados.length}</div>
                  <div style={{fontSize:13,color:'var(--text4)',marginTop:2}}>dominadas no total</div>
                </div>
                <div>
                  <div style={{fontSize:21,fontWeight:900,color:'#f87171',fontFamily:"'DM Mono',monospace",lineHeight:1}}>{ativos.filter(t=>(t.dificuldade||3)>=4).length}</div>
                  <div style={{fontSize:13,color:'var(--text4)',marginTop:2}}>difíceis ativas</div>
                </div>
              </div>
            </div>

            {/* Lista ordenada por dificuldade */}
            {ordenados.length>0?<>
              <div style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace",fontWeight:700,marginBottom:8,letterSpacing:'1px'}}>MAIS DIFÍCIL PRIMEIRO — toque para registrar</div>
              {ordenados.map(t=><CardTEC key={t.id} t={t}/>)}
            </>:(
              <div style={{textAlign:'center',padding:'32px 20px',color:'var(--text4)'}}>
                <div style={{fontSize:28,marginBottom:8}}>✅</div>
                <div style={{fontSize:15,fontWeight:700,color:'#34d399'}}>Nenhum item ativo</div>
                <div style={{fontSize:14,marginTop:4}}>Registre um erro para começar.</div>
              </div>
            )}

            {/* Dominadas — colapsável */}
            {dominados.length>0&&(
              <details style={{marginTop:14}}>
                <summary style={{fontSize:13,color:'#34d399',fontFamily:"'DM Mono',monospace",fontWeight:700,cursor:'pointer',padding:'8px 10px',borderRadius:8,background:'rgba(52,211,153,.05)',border:'1px solid rgba(52,211,153,.2)',listStyle:'none',display:'flex',justifyContent:'space-between'}}>
                  <span>✅ DOMINADAS ({dominados.length})</span><span style={{opacity:.5}}>▼</span>
                </summary>
                <div style={{marginTop:6}}>
                  {[...dominados].sort((a,b)=>{
                    const da=(a.historico||[]).slice(-1)[0]?.data||'';
                    const db=(b.historico||[]).slice(-1)[0]?.data||'';
                    return db.localeCompare(da);
                  }).map(t=>{
                    const ultimaData=(t.historico||[]).slice(-1)[0]?.data||t.dia;
                    return(
                      <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:9,background:'rgba(52,211,153,.04)',border:'1px solid rgba(52,211,153,.15)',marginBottom:5}}>
                        <span style={{fontSize:16,color:'#34d399'}}>✓</span>
                        <div style={{flex:1}}>
                          <div style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>{t.mat}{t.assunto?` — ${t.assunto}`:''}</div>
                          <div style={{fontSize:13,color:'var(--text4)'}}>dominado em {ultimaData} · {t.tentativas||1}x revisado</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </details>
            )}
          </div>
        );
      })()}

      {/* ── SUB-ABA: RADAR DO EDITAL ── */}
      {subAba==='radar'&&(()=>{
        const perigos=calcTop5Perigos(8);
        return(
          <div>
            <div style={{padding:'10px 12px',borderRadius:10,background:'rgba(248,113,113,.06)',border:'1px solid rgba(248,113,113,.2)',marginBottom:12}}>
              <div style={{fontSize:13,color:'#f87171',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:2}}>🎯 RADAR DO EDITAL — TOP PERIGOS</div>
              <div style={{fontSize:13,color:'var(--text4)'}}>peso da prova × seu déficit de acerto × tempo parado</div>
            </div>
            {perigos.map((p,i)=>{
              const scoreNorm=Math.min(Math.round(p.score),100);
              const c=p.acerto!==null?(p.acerto<50?'#f87171':p.acerto<70?'#fbbf24':'#34d399'):'#aab6c8';
              const prioridade=scoreNorm>=60?'🔴 ATACAR AGORA':scoreNorm>=30?'🟡 MANTER VIVO':'⬜ PODE ESPERAR';
              const corPri=scoreNorm>=60?'#f87171':scoreNorm>=30?'#fbbf24':'#aab6c8';
              return(
                <div key={i} style={{padding:'11px 13px',borderRadius:11,background:`${corPri}08`,border:`1px solid ${corPri}22`,marginBottom:7}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:5}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,color:'var(--text4)',marginBottom:1}}>{p.mat}</div>
                      <div style={{fontSize:15,fontWeight:700,color:'var(--text)',lineHeight:1.3,paddingRight:8}}>{p.topico}</div>
                    </div>
                    <span style={{fontSize:13,padding:'2px 7px',borderRadius:5,background:`${corPri}18`,color:corPri,fontWeight:800,fontFamily:"'DM Mono',monospace",whiteSpace:'nowrap',flexShrink:0}}>{prioridade}</span>
                  </div>
                  <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
                    <span style={{fontSize:13,padding:'1px 6px',borderRadius:4,background:'rgba(96,165,250,.12)',color:'#60a5fa',fontFamily:"'DM Mono',monospace"}}>📊 {p.pesoEdital}% da prova</span>
                    {p.acerto!==null
                      ?<span style={{fontSize:13,padding:'1px 6px',borderRadius:4,background:`${c}12`,color:c,fontFamily:"'DM Mono',monospace"}}>🎯 você: {p.acerto}%</span>
                      :<span style={{fontSize:13,color:'var(--text4)'}}>sem dado ainda</span>
                    }
                    {p.diasSem>0&&<span style={{fontSize:13,color:'var(--text4)'}}>{p.diasSem}d parado</span>}
                  </div>
                </div>
              );
            })}
          </div>
        );
      })()}

      {/* MODAL NÃO FIZ */}
      {naoFizModal&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:200,display:'flex',alignItems:'flex-end'}}>
        <div style={{width:'100%',background:'var(--card)',border:'1px solid var(--border)',borderRadius:'16px 16px 0 0',padding:'20px 16px'}}>
          <div style={{fontSize:15,color:'var(--text)',fontWeight:700,marginBottom:12}}>❌ Por que não fez {naoFizModal==='anki'?'o Anki':naoFizModal==='tec'?'o TEC':'o NLM'}?</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:12}}>
            {['Falta de tempo','Cansaço','Sem material','Esqueci','Outro'].map(m=>(
              <button key={m} onClick={()=>setNaoFizMotivo(m)} style={{padding:'7px 12px',borderRadius:8,border:`1px solid ${naoFizMotivo===m?'#f87171':'var(--border)'}`,background:naoFizMotivo===m?'rgba(248,113,113,.15)':'transparent',color:naoFizMotivo===m?'#f87171':'var(--text3)',fontSize:14,cursor:'pointer'}}>{m}</button>
            ))}
          </div>
          <input value={naoFizMotivo} onChange={e=>setNaoFizMotivo(e.target.value)} placeholder="ou escreva aqui..." style={{width:'100%',padding:'9px 12px',borderRadius:9,border:'1px solid var(--border)',background:'var(--input-bg)',color:'var(--text)',fontSize:15,outline:'none',boxSizing:'border-box',marginBottom:12}}/>
          <div style={{display:'flex',gap:6}}>
            <button onClick={marcarNaoFiz} disabled={!naoFizMotivo} style={{flex:2,padding:'11px',borderRadius:9,border:'none',background:naoFizMotivo?'#f87171':'var(--border)',color:naoFizMotivo?'#0f172a':'var(--text4)',fontSize:15,fontWeight:800,cursor:'pointer'}}>Salvar</button>
            <button onClick={()=>setNaoFizModal(null)} style={{flex:1,padding:'11px',borderRadius:9,border:'1px solid var(--border)',background:'transparent',color:'var(--text4)',fontSize:15,cursor:'pointer'}}>Cancelar</button>
          </div>
        </div>
      </div>}

// ═══ REGISTRO RÁPIDO — atividade feita fora do bloco (tempo livre): tempo + questões + acertos ═══
function RegistroRapido({item,onClose,onSave}){
  const[tempo,setTempo]=useState(String(item.min||30));
  const[q,setQ]=useState('');
  const[a,setA]=useState('');
  const[dif,setDif]=useState(0);
  const[obs,setObs]=useState('');
  const[inteira,setInteira]=useState(true);
  const nq=parseInt(q)||0, na=parseInt(a)||0, nt=parseInt(tempo)||0;
  const erroQ=q!==''&&a!==''&&na>nq;
  const faltaA=nq>0&&a==='';
  const ok=nt>0&&!erroQ&&!faltaA;
  const pct=nq>0&&a!==''&&!erroQ?Math.round(na/nq*100):null;
  const cp=pct==null?'#aab6c6':pct>=80?'#34d399':pct>=60?'#fbbf24':'#f87171';
  const inp=(cor)=>({width:'100%',padding:'12px',borderRadius:8,border:`1px solid ${cor}55`,background:`${cor}10`,color:cor,fontSize:20,fontWeight:900,fontFamily:"'DM Mono',monospace",textAlign:'center',outline:'none',boxSizing:'border-box'});
  const lab={fontSize:13,color:'#c2ccd8',marginBottom:4};
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.9)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:150,padding:14,overflowY:'auto'}}>
      <div style={{background:'#454f61',border:'1px solid rgba(52,211,153,.35)',borderRadius:16,padding:'18px',maxWidth:360,width:'100%',maxHeight:'94vh',overflowY:'auto'}}>
        <div style={{fontSize:14,fontWeight:800,color:'#34d399',fontFamily:"'DM Mono',monospace",letterSpacing:'1px',marginBottom:4}}>⚡ REGISTRO RÁPIDO</div>
        <div style={{fontSize:15,fontWeight:700,color:'#e8edf5'}}>{item.ic||'📌'} {item.mat}</div>
        <div style={{fontSize:13,color:'#b4c0d1',margin:'2px 0 12px',lineHeight:1.5}}>{item.conteudo}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
          <div><div style={lab}>⏱ TEMPO (min)</div><input type="number" inputMode="numeric" value={tempo} onChange={e=>setTempo(e.target.value)} style={inp('#60a5fa')}/></div>
          <div><div style={lab}>📊 APROVEITAMENTO</div><div style={{...inp(cp),border:`2px solid ${cp}55`}}>{pct==null?'—%':pct+'%'}</div></div>
          <div><div style={lab}>📝 QUESTÕES</div><input type="number" inputMode="numeric" value={q} onChange={e=>setQ(e.target.value)} placeholder="0" style={inp('#fbbf24')}/></div>
          <div><div style={lab}>✅ ACERTEI</div><input type="number" inputMode="numeric" value={a} onChange={e=>setA(e.target.value)} placeholder="0" style={inp('#34d399')}/></div>
        </div>
        {erroQ&&<div style={{fontSize:13,color:'#f87171',marginBottom:8}}>Acertos não podem passar do total de questões.</div>}
        {faltaA&&<div style={{fontSize:13,color:'#fb923c',marginBottom:8}}>Informe quantas acertou (pode ser 0).</div>}
        <div style={{marginBottom:10}}>
          <div style={lab}>DIFICULDADE (opcional)</div>
          <div style={{display:'flex',gap:5}}>
            {[1,2,3,4,5].map(n=>{const cors=['#34d399','#a3e635','#fbbf24','#fb923c','#f87171'];return(
              <button key={n} onClick={()=>setDif(d=>d===n?0:n)} style={{flex:1,padding:'9px 4px',borderRadius:8,border:`2px solid ${dif>=n?cors[n-1]:'rgba(148,163,184,.28)'}`,background:dif>=n?`${cors[n-1]}22`:'rgba(255,255,255,.02)',fontSize:17,cursor:'pointer'}}>⭐</button>
            );})}
          </div>
        </div>
        <input value={obs} onChange={e=>setObs(e.target.value)} placeholder="Observação (opcional): onde travou, o que revisar…" style={{width:'100%',padding:'9px 11px',borderRadius:8,border:'1px solid rgba(148,163,184,.25)',background:'rgba(148,163,184,.06)',color:'#f1f5f9',fontSize:14,outline:'none',boxSizing:'border-box',marginBottom:10}}/>
        {!item.fora&&<label style={{display:'flex',alignItems:'center',gap:8,fontSize:14,color:'#e8edf5',marginBottom:12,cursor:'pointer'}}>
          <input type="checkbox" checked={inteira} onChange={e=>setInteira(e.target.checked)} style={{width:18,height:18}}/>
          Concluí a atividade inteira (marca como feita no plano)
        </label>}
        <div style={{display:'flex',gap:8}}>
          <button onClick={onClose} style={{flex:1,padding:'12px',borderRadius:9,border:'1px solid rgba(255,255,255,.12)',background:'transparent',color:'#b4c0d1',fontSize:14,cursor:'pointer'}}>Cancelar</button>
          <button disabled={!ok} onClick={()=>onSave(item,{tempo:nt,questoes:nq,acertei:a===''?0:na,temQ:nq>0,dif,obs:obs.trim(),inteira:item.fora?true:inteira})} style={{flex:2,padding:'12px',borderRadius:9,border:'none',background:ok?'#34d399':'rgba(148,163,184,.22)',color:ok?'#050a14':'#aab6c8',fontSize:15,fontWeight:900,cursor:ok?'pointer':'default'}}>💾 Salvar e registrar</button>
        </div>
      </div>
    </div>
  );
}

function TabEstudo({feitos,cicloNum,horas,onConcluir,onIrPara,onDesmarcar,onAddHoras,onSyncHistorico,mit,planoSemana,onSavePlano,onSetTab,onRapido}){
  const[aba,setAba]=useState('foco');
  const feitosSet=useMemo(()=>new Set(feitos),[feitos]);
  const pendentes=useMemo(()=>CICLO.filter(s=>!feitosSet.has(s.id)),[feitosSet]);
  // Ciclo Extras — precisa ser declarado ANTES de ativo
  const[cicloExtras,setCicloExtras]=useState(()=>lsGet('ciclo_extras',[]));
  const extrasAtivos=useMemo(()=>cicloExtras.filter(e=>!e.feito),[cicloExtras]);
  // Extras ativos entram na frente da fila — ativo é sempre extra primeiro
  const ativoIsExtra=extrasAtivos.length>0;
  const ativo=ativoIsExtra?extrasAtivos[0]:(pendentes[0]||null);
  const cor=ativoIsExtra?'#fb923c':(ativo?.tag?.includes('TRIÂNGULO')?'#fbbf24':ativo?.cor||'#fbbf24');
  const todayStart=useMemo(()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();},[]);
  const semStart=todayStart-6*86400000;
  const minHoje=horas.filter(e=>e.dt>=todayStart).reduce((s,e)=>s+e.min,0);
  const minSem=horas.filter(e=>e.dt>=semStart).reduce((s,e)=>s+e.min,0);
  const META=35*60;

  // Registro
  const hoje=getDK();
  const[historico,setHistorico]=useState(()=>lsGet('historico_diario',[]));
  const regHoje=historico.filter(r=>r.dia===hoje||r.id===hoje).slice(-1)[0]||null;
  // Último bloco concluído — pré-preenche o Registro automaticamente
  const[ultimoBlocoMat,setUltimoBlocoMat]=useState(null);
  const[rForm,setRForm]=useState({materia:ativo?.mat||'',assunto:'',tempo:'',questoes:'',acertei:'',dificuldade:0,obs:'',pendente:''});
  const[rSalvo,setRSalvo]=useState(false);
  const[obsExpandida,setObsExpandida]=useState(false);
  const[modalPct,setModalPct]=useState(null);
  const[pctSel,setPctSel]=useState(100);
  const[pendenteTxt,setPendenteTxt]=useState('');

  const criarExtra=(bloco,pct,pendente)=>{
    if(pct>=100||!pendente?.trim())return;
    const novo={
      id:'extra_'+Date.now(),
      mat:bloco.mat,ic:bloco.ic||'📌',cor:bloco.cor||'#fb923c',
      tag:'⏸ CONTINUA',conteudo:pendente.trim(),
      pctAnterior:pct,h:1.5,tipo:'Continuação',
      criadoEm:getDK(),feito:false
    };
    const n=[...lsGet('ciclo_extras',[]),novo];
    lsSet('ciclo_extras',n);setCicloExtras(n);
  };

  const concluirExtra=(id)=>{
    const n=cicloExtras.map(e=>e.id===id?{...e,feito:true}:e);
    lsSet('ciclo_extras',n);setCicloExtras(n);
  };

  // Revisão
  const[gurujaTxt,setGurujaTxt]=useState('');
  const[gurujaLoad,setGurujaLoad]=useState(false);
  const[confJaFiz,setConfJaFiz]=useState(null);
  const[confIr,setConfIr]=useState(null);
  const[cicloAbertos,setCicloAbertos]=useState(()=>new Set());

  // Planejamento semanal
  const[metaHoras,setMetaHoras]=useState(()=>lsGet('meta_horas_sem',35));
  const[contextSem,setContextSem]=useState('');
  const[planoProposto,setPlanoProposto]=useState(null);
  const[planEdit,setPlanEdit]=useState([]);
  const[planSalvo,setPlanSalvo]=useState(false);

  const dw=new Date().getDay();
  const DIAS_REV=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
  const MODOS_REV=['Questões','Áudio NLM','Leitura','Anki','Misto','Flashcards'];
  const TIPOS_AUDIO=['Pegadinhas','Conceitos','Resumo geral','Questões comentadas','Mapa mental'];

  const analisarGurujaSemana=async()=>{
    if(!gurujaTxt.trim()||gurujaLoad)return;
    setGurujaLoad(true);
    try{
      const r=await chamarClaude(
        `Coach de concursos no planejamento Consolidar a base do Guruja (pré-edital, FCC). Analise os dados do Guruja e monte plano inteligente. Sem edital: todas as matérias têm o mesmo peso (Adm, Const, Civil, Empresarial, Penal, Tributário, LTE, Contabilidade, Auditoria, Português, RL, TI).
Relevâncias (peso×incidência estimada): Previdenciário=5, Civil=5, Penal=5, Const=5, AFO=4, Adm=4, Português=3, Ciência de Dados=3, Ética=2, Regionais SC=2, RL/Mat.Fin/Estatística=2.
Ciclo atual: bloco ${ativo?.mat||'indefinido'}. Meta: ${metaHoras}h/semana. Contexto: ${contextSem||'semana normal'}.
APENAS JSON sem markdown: {"diagnostico":"2 frases","plano":[{"mat":"nome","horasSugeridas":2.5,"prioridade":1,"motivo":"por que","taxa":82.0,"status":"critica|atencao|ok"}],"alerta":"materia mais urgente"}`,
        [{role:'user',content:`Dados Guruja:\n${gurujaTxt.slice(0,6000)}`}],1500
      );
      const parsed=JSON.parse(r.replace(/\`\`\`json|\`\`\`/g,'').trim());
      setPlanoProposto(parsed);
      setPlanEdit(parsed.plano?.map(p=>({...p,horasEditadas:p.horasSugeridas,ativa:true}))||[]);
    }catch(e){alert(`❌ ${e.message}`);}
    setGurujaLoad(false);
  };
  const salvarPlano=()=>{
    const plano={...planoProposto,plano:planEdit,metaFinal:metaHoras,dt:Date.now(),semana:getDK()};
    if(onSavePlano)onSavePlano(plano);lsSet('plano_semanal',plano);
    setPlanSalvo(true);setTimeout(()=>setPlanSalvo(false),2500);
  };
  const MATS=CICLO.map(c=>c.mat).filter((v,i,a)=>a.indexOf(v)===i);

  // Motor tempo morto
  const tempoMorto=useMemo(()=>{
    if(historico.length<2)return null;
    const ultimos7=historico.slice(-7);
    const porMat={};
    MATS.forEach(m=>{
      const regs=ultimos7.filter(r=>r.materia===m);
      if(!regs.length)return;
      const difMedia=regs.reduce((s,r)=>s+(r.dificuldade||0),0)/regs.length;
      const ultimoAudio=[...regs].filter(r=>r.audioFeito).sort((a,b)=>b.id.localeCompare(a.id))[0];
      const diasSemAudio=ultimoAudio?Math.floor((Date.now()-new Date(ultimoAudio.id).getTime())/86400000):99;
      if(diasSemAudio>=3)porMat[m]={difMedia,diasSemAudio,score:difMedia*diasSemAudio};
    });
    const sorted=Object.entries(porMat).sort((a,b)=>b[1].score-a[1].score);
    if(!sorted.length)return null;
    const[mat,info]=sorted[0];
    return{mat,difMedia:info.difMedia.toFixed(1),diasSemAudio:info.diasSemAudio};
  },[historico]);

  // Motor revisão 1h30
  const motor1h30=useMemo(()=>{
    const n=historico.length;
    if(n<5)return{ativa:false,faltam:5-n};
    const multiplo=n%5===0;
    const ultimos5=historico.slice(-5);
    const porMat={};
    ultimos5.forEach(r=>{if(!r.materia)return;(porMat[r.materia]||(porMat[r.materia]=[])).push(r.dificuldade||0);});
    const ranking=Object.entries(porMat).map(([mat,difs])=>({mat,difMedia:difs.reduce((s,d)=>s+d,0)/difs.length})).sort((a,b)=>b.difMedia-a.difMedia);
    return{ativa:multiplo,faltam:5-(n%5)||5,ranking,total:n};
  },[historico]);

  // Ações
  const salvarRegistro=()=>{
    if(!rForm.materia||!rForm.dificuldade)return;
    const agora=Date.now();
    // Usa timestamp como id único — permite múltiplos registros por dia
    const novo={...rForm,id:hoje+'_'+agora,dia:hoje,dt:agora};
    const n=[...historico,novo].sort((a,b)=>(a.dt||0)-(b.dt||0));
    setHistorico(n);lsSet('historico_diario',n);
    if(rForm.tempo){onAddHoras({mat:rForm.materia,min:parseInt(rForm.tempo)||0,dt:agora});}
    // Se preencheu "ficou pendente", cria extra
    if(rForm.pendente?.trim()){
      criarExtra({mat:rForm.materia,ic:'📌',cor:'#fb923c',conteudo:rForm.pendente.trim()},50,rForm.pendente.trim());
    }
    // Limpa formulário após salvar (exceto matéria)
    setRForm(f=>({...f,assunto:'',tempo:'',questoes:'',acertei:'',obs:'',pendente:'',dificuldade:0}));
    setUltimoBlocoMat(null);
    setRSalvo(true);setTimeout(()=>setRSalvo(false),2500);if(onSyncHistorico)onSyncHistorico();
  };




  const analisarGuruja=async()=>{
    if(!gurujaTxt.trim()||gurujaLoad)return;
    setGurujaLoad(true);
    try{
      const r=await chamarClaude(
        `Coach de concursos no planejamento Consolidar a base do Guruja (pré-edital, FCC). Analise desempenho da Ritchely e cruze taxa de acerto com relevância; todas as matérias têm o mesmo peso (sem edital).

              <input type="number" value={rForm.acertei||''} onChange={e=>setRForm(f=>({...f,acertei:e.target.value}))} placeholder="ex: 18" style={{width:'100%',padding:'12px',borderRadius:8,border:'1px solid rgba(52,211,153,.3)',background:'rgba(52,211,153,.06)',color:'#34d399',fontSize:20,fontWeight:900,fontFamily:"'DM Mono',monospace",textAlign:'center',outline:'none',boxSizing:'border-box'}}/>
            </div>
            <div>
              <div style={{fontSize:13,color:'#c2ccd8',marginBottom:4}}>📊 APROVEITAMENTO</div>
              {(()=>{
                const q=parseInt(rForm.questoes)||0;const a=parseInt(rForm.acertei)||0;
                if(!q||!a)return(<div style={{width:'100%',padding:'12px',borderRadius:8,border:'1px solid rgba(148,163,184,.15)',background:'rgba(148,163,184,.04)',color:'#aab6c6',fontSize:20,fontWeight:900,fontFamily:"'DM Mono',monospace",textAlign:'center'}}>—%</div>);
                const pct=Math.round(a/q*100);
                const cor=pct>=80?'#34d399':pct>=60?'#fbbf24':'#f87171';
                return(<div style={{width:'100%',padding:'12px',borderRadius:8,border:`2px solid ${cor}50`,background:`${cor}12`,color:cor,fontSize:20,fontWeight:900,fontFamily:"'DM Mono',monospace",textAlign:'center',transition:'all .2s'}}>{pct}%</div>);
              })()}
            </div>
          </div>

          {/* Dificuldade */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:13,color:'#c2ccd8',marginBottom:6}}>DIFICULDADE DO CONTEÚDO</div>
            <div style={{display:'flex',gap:5}}>
              {[1,2,3,4,5].map(s=>{const cors=['#34d399','#a3e635','#fbbf24','#fb923c','#f87171'];return(
                <button key={s} onClick={()=>setRForm(f=>({...f,dificuldade:s}))} style={{flex:1,padding:'12px 4px',borderRadius:8,border:`2px solid ${rForm.dificuldade>=s?cors[s-1]:'rgba(148,163,184,.28)'}`,background:rForm.dificuldade>=s?`${cors[s-1]}22`:'rgba(255,255,255,.02)',fontSize:20,cursor:'pointer'}}>⭐</button>
              );})}
            </div>
            {rForm.dificuldade>0&&<div style={{textAlign:'center',fontSize:13,color:['#34d399','#a3e635','#fbbf24','#fb923c','#f87171'][rForm.dificuldade-1],marginTop:4,fontFamily:"'DM Mono',monospace",fontWeight:700}}>{['FÁCIL','TRANQUILO','MÉDIO','DIFÍCIL','MUITO DIFÍCIL'][rForm.dificuldade-1]}</div>}
          </div>

          {/* Ficou pendente — cria extra automaticamente ao salvar */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:13,color:'#fb923c',fontFamily:"'DM Mono',monospace",fontWeight:700,marginBottom:6}}>📌 FICOU PENDENTE? (opcional)</div>
            <input value={rForm.pendente||''} onChange={e=>setRForm(f=>({...f,pendente:e.target.value}))} placeholder="ex: Impostos Municipais — faltou ~30%" style={{width:'100%',padding:'9px 11px',borderRadius:8,border:'1px solid rgba(251,146,60,.25)',background:'rgba(251,146,60,.04)',color:'#f1f5f9',fontSize:15,outline:'none',boxSizing:'border-box'}}/>
            <div style={{fontSize:13,color:'#aab6c6',marginTop:4}}>Se preencher, vira bloco ativo no Foco amanhã com tag ⏸ CONTINUA.</div>
          </div>

          {/* Informações complementares — colapsável */}
          <div style={{marginBottom:12}}>
            <button onClick={()=>setObsExpandida(v=>!v)} style={{width:'100%',padding:'8px 11px',borderRadius:8,border:'1px solid rgba(148,163,184,.2)',background:'rgba(148,163,184,.04)',color:'var(--text4)',fontSize:14,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',fontFamily:"'DM Mono',monospace"}}>
              <span>📎 Informações complementares</span>
              <span style={{fontSize:13}}>{obsExpandida?'▲ ocultar':'▼ adicionar'}</span>
            </button>
            {obsExpandida&&(
              <div style={{marginTop:8,padding:'12px',borderRadius:9,border:'1px solid rgba(148,163,184,.18)',background:'rgba(148,163,184,.04)'}}>
                <div style={{fontSize:13,color:'#c2ccd8',marginBottom:6}}>O que mais quer registrar desta sessão?</div>
                <textarea value={rForm.obs||''} onChange={e=>setRForm(f=>({...f,obs:e.target.value}))} rows={3} placeholder="ex: Travei em NBC TA 700 item 12, confundi com art. 37, preciso rever os prazos da LRF..." style={{width:'100%',padding:'9px 11px',borderRadius:8,border:'1px solid rgba(148,163,184,.2)',background:'rgba(148,163,184,.05)',color:'#f1f5f9',fontSize:15,outline:'none',resize:'vertical',boxSizing:'border-box',lineHeight:1.6}}/>
                <div style={{fontSize:13,color:'#aab6c6',marginTop:5}}>Este campo alimenta o motor de Tempo Morto e fica visível no histórico.</div>
              </div>
            )}
          </div>

          <button onClick={salvarRegistro} disabled={!rForm.materia||!rForm.dificuldade} style={{width:'100%',padding:'14px',borderRadius:11,border:'none',background:rForm.materia&&rForm.dificuldade?'linear-gradient(135deg,#60a5fa,#60a5fa)':'rgba(148,163,184,.22)',color:rForm.materia&&rForm.dificuldade?'#050a14':'#aab6c8',fontSize:16,fontWeight:900,letterSpacing:'2px',cursor:'pointer',fontFamily:"'DM Mono',monospace"}}>
            {rSalvo?'✅ DIA REGISTRADO!':'💾 SALVAR DIA'}
          </button>
        </div>
        {/* Histórico recente */}
        <div style={{fontSize:13,letterSpacing:'2px',color:'#aab6c6',fontFamily:"'DM Mono',monospace",marginBottom:8}}>HISTÓRICO RECENTE</div>
        {[...historico].sort((a,b)=>(b.dt||0)-(a.dt||0)).slice(0,8).map(r=>{
          const cors=['#34d399','#a3e635','#fbbf24','#fb923c','#f87171'];
          const c=cors[(r.dificuldade||1)-1];
          const dtStr=r.dt?new Date(r.dt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):(r.dia||r.id||'');
          const q=parseInt(r.questoes)||0; const ac=parseInt(r.acertei)||0;
          const pct=q&&ac?Math.round(ac/q*100):null;
          return(
            <div key={r.id} style={{padding:'9px 12px',borderRadius:10,background:`${c}06`,border:`1px solid ${c}20`,marginBottom:5}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:15,color:'#f1f5f9',fontWeight:700}}>{r.materia}</div>
                  <div style={{fontSize:13,color:'#c2ccd8',marginTop:2,lineHeight:1.5}}>
                    {r.tempo?<span style={{color:'#60a5fa',marginRight:4}}>{r.tempo}min</span>:null}
                    {r.assunto?<span style={{color:'#b4c0d1',marginRight:4}}>· {r.assunto.slice(0,35)}</span>:null}
                    {q>0?<span style={{marginRight:4}}>Q:{q}{pct!==null?<span style={{color:pct>=80?'#34d399':pct>=60?'#fbbf24':'#f87171'}}> ✅{ac}({pct}%)</span>:null}</span>:null}
                  </div>
                </div>
                <div style={{textAlign:'right',flexShrink:0,marginLeft:8}}>
                  <div style={{fontSize:13,color:c,fontFamily:"'DM Mono',monospace",fontWeight:700}}>{'⭐'.repeat(r.dificuldade||0)}</div>
                  <div style={{fontSize:13,color:'#9fabbc',marginTop:2}}>{dtStr}</div>
                </div>
              </div>
            </div>
          );
        })}
        {historico.length===0&&<div style={{textAlign:'center',padding:'20px',color:'#aab6c6',fontSize:15}}>Primeiro registro vai aparecer aqui.</div>}
      </div>}

      {/* ── REVISÃO ──────────────────────────────────────────── */}
      {/* CICLO COMPLETO */}
      {aba==='ciclo'&&<div>
        {/* Barra de progresso */}
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
          <BarProg done={feitos.length} total={N} cor={ativo?.tag?.includes('TRIÂNGULO')?'#fbbf24':ativo?.cor||'#fbbf24'} h={5}/>
          <span style={{fontSize:14,color:'#fbbf24',fontFamily:"'DM Mono',monospace",fontWeight:700,flexShrink:0}}>{feitos.length}/{N}</span>
        </div>
        <div style={{display:'flex',gap:6,marginBottom:14}}>
          {[[N,'atividades'],[fmtMinG(CICLO_MIN),'total do plano'],[`#${cicloNum}`,'meta atual']].map(([v,l],i)=>(
            <div key={i} style={{flex:1,padding:'8px 4px',borderRadius:9,textAlign:'center',background:'rgba(251,191,36,.04)',border:'1px solid rgba(251,191,36,.1)'}}>
              <div style={{fontSize:15,fontWeight:900,color:'#fbbf24',fontFamily:"'DM Mono',monospace",lineHeight:1}}>{v}</div>
              <div style={{fontSize:13,color:'#aab6c6',marginTop:2}}>{l}</div>
            </div>
          ))}
        </div>
        {/* Dias de trabalho — a fila da Meta redistribui (4 atividades em dia de trabalho, 5 em dia livre) */}
        {(()=>{
          const dias=getDiasTrabalho();
          const nomes=[[1,'Seg'],[2,'Ter'],[3,'Qua'],[4,'Qui'],[5,'Sex'],[6,'Sáb'],[0,'Dom']];
          const tog=d=>{const n=dias.includes(d)?dias.filter(x=>x!==d):[...dias,d];lsSet('dias_trabalho',n.length?n:[d]);window.location.reload();};
          return(
            <div style={{padding:'10px 12px',borderRadius:11,background:'rgba(96,165,250,.06)',border:'1px solid rgba(96,165,250,.25)',marginBottom:12}}>
              <div style={{fontSize:13,color:'#60a5fa',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px',marginBottom:6}}>💼 DIAS DE TRABALHO DESTA SEMANA (toque para marcar)</div>
              <div style={{display:'flex',gap:6}}>
                {nomes.map(([d,l])=>{
                  const on=dias.includes(d);
                  return(<button key={d} onClick={()=>tog(d)} style={{flex:1,padding:'8px 0',borderRadius:8,cursor:'pointer',fontSize:14,fontWeight:800,border:`1px solid ${on?'#60a5fa':'rgba(148,163,184,.3)'}`,background:on?'rgba(96,165,250,.2)':'transparent',color:on?'#60a5fa':'var(--text4)'}}>{l}</button>);
                })}
              </div>
              <div style={{fontSize:13,color:'var(--text4)',marginTop:6}}>Só marca o rótulo do dia (trabalho/livre). O tempo de cada dia é o de "Horas por dia" logo abaixo.</div>
            </div>
          );
        })()}
        {/* Regras do plano — registradas para os próximos ciclos */}
        {(()=>{
          const novasPend=pendentes.filter(ehTINova);
          return(
            <div style={{padding:'10px 12px',borderRadius:11,background:'rgba(96,165,250,.06)',border:'1px solid rgba(96,165,250,.3)',marginBottom:12}}>
              <div style={{fontSize:13,color:'#60a5fa',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px',marginBottom:6}}>📌 REGRAS DO PLANO (valem para os próximos ciclos)</div>
              {REGRAS_PLANO.map((r,i)=>(
                <div key={i} style={{marginBottom:i<REGRAS_PLANO.length-1?8:0}}>
                  <div style={{fontSize:14,fontWeight:800,color:'var(--text)'}}>{r.ic} {r.t}</div>
                  <div style={{fontSize:13,color:'var(--text4)',lineHeight:1.5,marginTop:2}}>{r.d}</div>
                </div>
              ))}
              {novasPend.length>REGRA_TI_MAX_NOVAS_SEMANA&&(
                <div style={{marginTop:8,padding:'7px 9px',borderRadius:8,background:'rgba(251,146,60,.12)',border:'1px solid rgba(251,146,60,.4)',fontSize:13,color:'#fb923c',lineHeight:1.5}}>
                  ⚠️ O plano atual ainda tem {novasPend.length} metas novas de TI pendentes (regra: no máximo {REGRA_TI_MAX_NOVAS_SEMANA} por semana).
                </div>
              )}
            </div>
          );
        })()}
        {/* Horas por dia — a fila é montada em minutos */}
        {(()=>{
                    const ciclar=d=>{const cur=getCapDia(d);const nx=cur>=360?120:cur+30;let o={};try{o=JSON.parse(localStorage.getItem('horas_dia')||'{}')||{};}catch(e){}o[d]=nx;lsSet('horas_dia',o);window.location.reload();};
          return(
            <div style={{padding:'10px 12px',borderRadius:11,background:'rgba(251,191,36,.05)',border:'1px solid rgba(251,191,36,.25)',marginBottom:12}}>
              <div style={{fontSize:13,color:'#fbbf24',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px',marginBottom:6}}>⏱ HORAS POR DIA (toque para mudar de 2h a 6h)</div>
              <div style={{display:'flex',gap:6}}>
                {[1,2,3,4,5,6,7].map(d=>(
                  <button key={d} onClick={()=>ciclar(d)} style={{flex:1,padding:'6px 0',borderRadius:8,cursor:'pointer',border:'1px solid rgba(251,191,36,.4)',background:'rgba(251,191,36,.08)',color:'#fbbf24',textAlign:'center'}}>
                    <div style={{fontSize:13,fontWeight:800}}>{diaCicloLabel(d).split(' ')[0]}</div>
                    <div style={{fontSize:13,fontFamily:"'DM Mono',monospace"}}>{fmtMinG(getCapDia(d))}</div>
                  </button>
                ))}
              </div>
              <div style={{fontSize:13,color:'var(--text4)',marginTop:6}}>A fila monta cada dia por minutos (±15 min). Se não couber tudo, o que sobra aparece como "✂️ estouro", na ordem de corte.</div>
            </div>
          );
        })()}
        {/* Fora do plano → Decisão › Dispensadas */}
        <div onClick={()=>onSetTab&&onSetTab('discursiva')} style={{padding:'10px 12px',borderRadius:11,background:'rgba(248,113,113,.06)',border:'1px solid rgba(248,113,113,.3)',marginBottom:12,cursor:'pointer',display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:16}}>🚫</span>
          <div style={{flex:1,fontSize:14,color:'var(--text)'}}>Fora do plano: <b>{CICLO_FORA.length} atividades</b> ({fmtMinG(CICLO_FORA.reduce((a,c)=>a+c.min,0))}) — motivo, alternativa e como trazer de volta</div>
          <span style={{fontSize:14,color:'#f87171',fontWeight:800}}>Decisão ›</span>
        </div>
        {/* Blocos agrupados por dia */}
        {(()=>{
          const diasTrabalhoCiclo=getDiasTrabalho();
          const DIAS_CICLO11={};
          [...new Set(CICLO.map(s=>s.dia))].forEach(dd=>{
            DIAS_CICLO11[dd]=`${diaCicloLabel(dd)} · ${fmtMinG(CICLO.filter(x=>x.dia===dd).reduce((a,x)=>a+x.min,0))} · ${diasTrabalhoCiclo.includes(dd%7)?'trabalho':'livre'}`;
          });
          const diasUnicos=[...new Set(CICLO.map(s=>s.dia))].sort((a,b)=>a-b);
          return diasUnicos.map(dia=>{
          const blocosDia=CICLO.filter(s=>s.dia===dia);
          if(!blocosDia.length)return null;
          const todoDone=blocosDia.every(s=>feitosSet.has(s.id));
          const temAtivo=blocosDia.some(s=>s===ativo);
          const feitos_dia=blocosDia.filter(s=>feitosSet.has(s.id)).length;
          return(
            <div key={dia} style={{marginBottom:8,borderRadius:12,overflow:'hidden',border:`1px solid ${temAtivo?'rgba(251,191,36,.3)':todoDone?'rgba(52,211,153,.2)':'rgba(148,163,184,.25)'}`}}>
              {/* Header do dia */}
              <div style={{padding:'7px 12px',background:temAtivo?'rgba(251,191,36,.07)':todoDone?'rgba(52,211,153,.05)':'rgba(255,255,255,.02)',display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:13,fontWeight:800,fontFamily:"'DM Mono',monospace",color:temAtivo?'#fbbf24':todoDone?'#34d399':'#aab6c8'}}>
                  {todoDone?'✓ ':temAtivo?'▶ ':''}{DIAS_CICLO11[dia]||`DIA ${dia}`}
                </span>
                <span style={{fontSize:13,color:'#aab6c6',marginLeft:'auto',fontFamily:"'DM Mono',monospace"}}>{feitos_dia}/{blocosDia.length} ativ.</span>
              </div>
              {/* Blocos do dia */}
              {blocosDia.map((s,si)=>{
                const done=feitosSet.has(s.id);
                const isAtivo=!done&&s===ativo;
                const tri=s.tag?.includes('TRIÂNGULO')||s.tag?.includes('URGENTE');
                const c=tri?'#fbbf24':s.cor;
                const aberto=cicloAbertos.has(s.id)||(isAtivo&&!cicloAbertos.has(-s.id));
                const toggleAberto=()=>setCicloAbertos(prev=>{
                  const n=new Set(prev);
                  if(aberto){n.delete(s.id);if(isAtivo)n.add(-s.id);}
                  else{n.add(s.id);n.delete(-s.id);}
                  return n;
                });
                return(
                  <div key={s.id} style={{borderTop:si>0?'1px solid rgba(255,255,255,.04)':'none'}}>
                    {/* Linha do bloco */}
                    <div onClick={toggleAberto} style={{padding:'9px 12px',cursor:'pointer',opacity:!done&&!isAtivo?.85:1,background:done?'rgba(52,211,153,.03)':isAtivo?`${c}08`:'transparent',display:'flex',alignItems:'center',gap:9}}>
                      {/* Badge número */}
                      <div style={{width:22,height:22,borderRadius:'50%',flexShrink:0,border:`2px solid ${done?'#34d399':isAtivo?c:'rgba(148,163,184,.22)'}`,background:done?'#34d399':isAtivo?`${c}25`:'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:done?'#050a14':isAtivo?c:'#aab6c8',fontWeight:900}}>
                        {done?'✓':isAtivo?'▶':si+1}
                      </div>
                      <span style={{fontSize:16,flexShrink:0}}>{s.ic}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:15,fontWeight:700,color:done?'#1e3a2a':isAtivo?'#e8edf5':'#cbd5e1',textDecoration:done?'line-through':'none',lineHeight:1.3}}>{s.mat}</div>
                        <div style={{fontSize:13,color:'#c2ccd8',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.conteudo}</div>
                        {s.gl&&<div style={{fontSize:12,color:'#7dd3fc',fontFamily:"'DM Mono',monospace",marginTop:1}}>📍 {s.gl}</div>}
                      </div>
                      <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:3,flexShrink:0}}>
                        <span style={{fontSize:13,color:s.estouro?'#f87171':'#c2ccd8',fontFamily:"'DM Mono',monospace",fontWeight:700}}>⏱ {fmtMinG(s.min)}{s.estouro?' · ✂️ estouro':''}</span>
                        <Chip label={done?'✓ feito':tri?'🔺':s.tag.split(' ')[0]} cor={done?'#1e3a2a':tri?'#fbbf24':s.cor} sm/>
                        <span style={{fontSize:13,color:'#c2ccd8',fontFamily:"'DM Mono',monospace"}}>{aberto?'▲':'▼'}</span>
                      </div>
                    </div>
                    {/* Expandido */}
                    {aberto&&<div style={{padding:'10px 12px 12px 43px',background:'rgba(0,0,0,.15)',borderTop:'1px solid rgba(255,255,255,.04)'}}>
                      <div style={{fontSize:14,color:'#b4c0d1',lineHeight:1.6,marginBottom:6}}>{s.conteudo}</div>
                      <div style={{display:'flex',gap:6,marginBottom:4}}>
                        {s.tipo&&<span style={{fontSize:13,padding:'2px 7px',borderRadius:5,background:'rgba(148,163,184,.1)',color:'#b4c0d1'}}>{s.tipo}</span>}
                        {s.ferramenta&&<span style={{fontSize:13,padding:'2px 7px',borderRadius:5,background:'rgba(148,163,184,.1)',color:'#b4c0d1'}}>{s.ferramenta}</span>}
                      </div>
                      {(s.dica||'').split('\n').map((l,j)=>(
                        <div key={j} style={{fontSize:14,color:'#b4c0d1',lineHeight:1.8,marginBottom:j<(s.dica||'').split('\n').length-1?0:0}}>{l}</div>
                      ))}
                      {/* Botões de ação */}
                      {done?(
                        <div style={{marginTop:10}}>
                          <button onClick={e=>{e.stopPropagation();const n=feitos.filter(fid=>fid!==s.id);onDesmarcar(n);setCicloAbertos(prev=>{const nx=new Set(prev);nx.add(s.id);return nx;});}} style={{width:'100%',padding:'8px',borderRadius:8,border:'1px solid rgba(248,113,113,.3)',background:'rgba(248,113,113,.06)',color:'#f87171',fontSize:13,fontWeight:700,cursor:'pointer'}}>↩ Desmarcar — não fiz este</button>
                        </div>
                      ):(
                        <div style={{display:'flex',gap:7,marginTop:10}}>
                          {isAtivo?(
                            <button onClick={e=>{e.stopPropagation();setConfJaFiz(s.id);}} style={{flex:1,padding:'9px',borderRadius:9,border:'none',background:`linear-gradient(135deg,${c},${c})`,color:'#050a14',fontSize:14,fontWeight:800,cursor:'pointer',fontFamily:"'DM Mono',monospace"}}>✓ JÁ FIZ</button>
                          ):(
                            <>
                              <button onClick={e=>{e.stopPropagation();setConfIr(s.id);}} style={{flex:1,padding:'9px',borderRadius:9,border:`1px solid ${c}44`,background:`${c}12`,color:c,fontSize:14,fontWeight:700,cursor:'pointer'}}>→ Ir para este</button>
                              <button onClick={e=>{e.stopPropagation();setConfJaFiz(s.id);}} style={{flex:1,padding:'9px',borderRadius:9,border:'1px solid rgba(52,211,153,.3)',background:'rgba(52,211,153,.08)',color:'#34d399',fontSize:14,fontWeight:700,cursor:'pointer'}}>✓ Já fiz</button>
                            </>
                          )}
                        </div>
                      )}
                      {!done&&onRapido&&<button onClick={e=>{e.stopPropagation();onRapido(s);}} style={{width:'100%',marginTop:7,padding:'9px',borderRadius:9,border:'1px solid rgba(96,165,250,.45)',background:'rgba(96,165,250,.1)',color:'#60a5fa',fontSize:14,fontWeight:800,cursor:'pointer'}}>⚡ Fiz agora — registrar tempo, questões e acertos</button>}
                    </div>}
                  </div>
                );
              })}
            </div>
          );
        });
        })()}
      </div>}

      {aba==='stats'&&<div>
        <div style={{display:'flex',gap:8,marginBottom:14}}>
          {[['Hoje',fmtMin(minHoje),'#60a5fa'],['Semana',fmtMin(minSem),'#fbbf24'],['Meta ciclo',fmtMinG(CICLO_MIN),'#34d399']].map(([l,v,c])=>(
            <div key={l} style={{flex:1,padding:'14px 8px',borderRadius:12,background:`${c}08`,border:`1px solid ${c}20`,textAlign:'center'}}>
              <div style={{fontSize:18,fontWeight:900,color:c,fontFamily:"'DM Mono',monospace"}}>{v}</div>
              <div style={{fontSize:13,color:'#c2ccd8',marginTop:4}}>{l}</div>
            </div>
          ))}
        </div>
        <div style={{marginBottom:14}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
            <span style={{fontSize:13,color:'#b4c0d1'}}>Progresso semanal</span>
            <span style={{fontSize:13,color:'#fbbf24',fontFamily:"'DM Mono',monospace"}}>{Math.round(minSem/META*100)}%</span>
          </div>
          <BarProg done={minSem} total={META} cor='#fbbf24' h={7}/>
        </div>
        {/* Adicionar tempo manual */}
        <div style={{background:'rgba(251,191,36,.04)',border:'1px solid rgba(251,191,36,.18)',borderRadius:11,padding:'12px',marginBottom:12}}>
          <div style={{fontSize:13,color:'#fbbf24',fontFamily:"'DM Mono',monospace",marginBottom:8}}>➕ ADICIONAR TEMPO MANUAL</div>
          <AddTempoManual onAdd={onAddHoras}/>
        </div>
        {/* Breakdown por matéria */}
        <div style={{fontSize:13,letterSpacing:'2px',color:'#aab6c6',fontFamily:"'DM Mono',monospace",marginBottom:8,marginTop:6}}>📊 POR MATÉRIA — SEMANA</div>
        {(()=>{
          const por={};
          horas.filter(e=>e.dt>=semStart).forEach(e=>{const m=e.mat||'Geral';por[m]=(por[m]||0)+e.min;});
          const maxMin=Math.max(...Object.values(por),1);
          return Object.entries(por).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([mat,min])=>(
            <div key={mat} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',borderRadius:8,background:'rgba(255,255,255,.03)',border:'1px solid rgba(255,255,255,.08)',marginBottom:4}}>
              <span style={{flex:1,fontSize:14,color:'#f1f5f9'}}>{mat}</span>
              <BarProg done={min} total={maxMin} cor='#60a5fa' h={4}/>
              <span style={{fontSize:13,color:'#60a5fa',fontFamily:"'DM Mono',monospace",flexShrink:0,width:42,textAlign:'right'}}>{fmtMin(min)}</span>
            </div>
          ));
        })()}
        {/* RANKING POR MATÉRIA */}
        {/* ── GRÁFICO DE EVOLUÇÃO TEMPORAL ─────────── */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:15,letterSpacing:'2px',color:'var(--text4)',fontFamily:"'DM Mono',monospace",marginBottom:10,marginTop:14}}>📈 EVOLUÇÃO POR MATÉRIA — semana a semana</div>
          {(()=>{
            const hist=lsGet('historico_diario',[]);
            if(!hist.length)return <div style={{textAlign:'center',padding:'16px',color:'var(--text4)',fontSize:15}}>Registre questões para ver a evolução.</div>;

            // Agrupa por semana ISO
            const porSemMat={};
            hist.forEach(r=>{
              if(!r.materia||!parseInt(r.questoes)||!parseInt(r.acertei))return;
              const dt=new Date(r.dt||Date.now());
              const jan1=new Date(dt.getFullYear(),0,1);
              const semNum=Math.ceil(((dt-jan1)/86400000+jan1.getDay()+1)/7);
              const semKey=`S${String(semNum).padStart(2,'0')}`;
              if(!porSemMat[semKey])porSemMat[semKey]={};
              const mat=r.materia;
              if(!porSemMat[semKey][mat])porSemMat[semKey][mat]={q:0,a:0};
              porSemMat[semKey][mat].q+=parseInt(r.questoes)||0;
              porSemMat[semKey][mat].a+=parseInt(r.acertei)||0;
            });

            const semanas=Object.keys(porSemMat).sort().slice(-6);
            if(semanas.length<1)return <div style={{textAlign:'center',padding:'16px',color:'var(--text4)',fontSize:15}}>Ainda sem dados suficientes. Continue registrando!</div>;

            // Pega matérias com mais dados
            const matCount={};
            hist.filter(r=>parseInt(r.questoes)>0&&parseInt(r.acertei)>0).forEach(r=>{if(r.materia)matCount[r.materia]=(matCount[r.materia]||0)+1;});
            const mats=Object.entries(matCount).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([m])=>m);

            if(!mats.length)return null;

            const CORES=['#60a5fa','#f87171','#34d399','#fbbf24','#a78bfa','#fb923c'];
            const CHART_H=120;
            const CHART_W=280;
            const padL=30,padB=20,padR=10,padT=10;
            const innerW=CHART_W-padL-padR;
            const innerH=CHART_H-padB-padT;

            // Linhas de referência
            const refLines=[70,85];

            return(
              <div style={{overflowX:'auto',paddingBottom:4}}>
                {/* Legenda */}
                <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:10}}>
                  {mats.map((mat,i)=>(
                    <div key={mat} style={{display:'flex',alignItems:'center',gap:4}}>
                      <div style={{width:12,height:3,borderRadius:2,background:CORES[i],flexShrink:0}}/>
                      <span style={{fontSize:13,color:'var(--text3)'}}>{mat.length>18?mat.slice(0,16)+'…':mat}</span>
                    </div>
                  ))}
                </div>
                {/* SVG Chart */}
                <svg width={CHART_W} height={CHART_H} style={{overflow:'visible',display:'block',margin:'0 auto'}}>
                  {/* Grid horizontal */}
                  {[0,25,50,75,100].map(pct=>{
                    const y=padT+innerH-(pct/100)*innerH;
                    return(
                      <g key={pct}>
                        <line x1={padL} y1={y} x2={CHART_W-padR} y2={y} stroke="var(--border)" strokeWidth="1" strokeDasharray={pct===0?'none':'3,3'}/>
                        <text x={padL-4} y={y+4} textAnchor="end" fontSize="8" fill="var(--text4)">{pct}%</text>
                      </g>
                    );
                  })}
                  {/* Linhas de referência coloridas */}
                  {refLines.map(pct=>{
                    const y=padT+innerH-(pct/100)*innerH;
                    const cor=pct>=85?'#34d399':'#fbbf24';
                    return <line key={pct} x1={padL} y1={y} x2={CHART_W-padR} y2={y} stroke={cor} strokeWidth="1" strokeDasharray="4,2" opacity="0.5"/>;
                  })}
                  {/* Eixo X — semanas */}
                  {semanas.map((sem,i)=>{
                    const x=padL+(i/(semanas.length-1||1))*innerW;
                    return(
                      <g key={sem}>
                        <line x1={x} y1={padT} x2={x} y2={padT+innerH} stroke="var(--border)" strokeWidth="1" strokeDasharray="2,4"/>
                        <text x={x} y={CHART_H-4} textAnchor="middle" fontSize="8" fill="var(--text4)">{sem}</text>
                      </g>
                    );
                  })}
                  {/* Linhas por matéria */}
                  {mats.map((mat,mi)=>{
                    const cor=CORES[mi];
                    const pontos=semanas.map((sem,i)=>{
                      const d=porSemMat[sem]?.[mat];
                      if(!d||!d.q)return null;
                      const pct=Math.round(d.a/d.q*100);
                      const x=padL+(i/(semanas.length-1||1))*innerW;
                      const y=padT+innerH-(pct/100)*innerH;
                      return{x,y,pct};
                    });
                    // Draw line segments between non-null points
                    const segments=[];
                    let prev=null;
                    pontos.forEach((p,i)=>{
                      if(p&&prev){segments.push(<line key={`l${mi}-${i}`} x1={prev.x} y1={prev.y} x2={p.x} y2={p.y} stroke={cor} strokeWidth="2" opacity="0.8"/>);}
                      if(p)prev=p;
                    });
                    const dots=pontos.map((p,i)=>{
                      if(!p)return null;
                      const isLast=pontos.slice(i+1).every(x=>!x);
                      return(
                        <g key={`d${mi}-${i}`}>
                          <circle cx={p.x} cy={p.y} r={isLast?5:3.5} fill={cor} opacity="0.9"/>
                          {isLast&&<text x={p.x} y={p.y-8} textAnchor="middle" fontSize="9" fill={cor} fontWeight="bold">{p.pct}%</text>}
                        </g>
                      );
                    });
                    return <g key={mat}>{segments}{dots}</g>;
                  })}
                </svg>
                {/* Indicador semana atual */}
                <div style={{display:'flex',gap:12,marginTop:8,justifyContent:'center'}}>
                  <div style={{display:'flex',alignItems:'center',gap:4,fontSize:13,color:'var(--text4)'}}>
                    <div style={{width:16,height:1,borderTop:'2px dashed #34d399'}}/> ≥85% sólido
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:4,fontSize:13,color:'var(--text4)'}}>
                    <div style={{width:16,height:1,borderTop:'2px dashed #fbbf24'}}/> ≥70% atenção
                  </div>
                </div>
              </div>
            );
          })()}
        </div>

        {/* MODO C — RANKING POR PONTOS EM RISCO */}
        <div style={{fontSize:13,letterSpacing:'2px',color:'#f87171',fontFamily:"'DM Mono',monospace",marginBottom:8,marginTop:14}}>🎯 RADAR DO EDITAL — PONTOS EM RISCO (peso × déficit)</div>
        <div style={{padding:'8px 12px',borderRadius:9,background:'rgba(248,113,113,.05)',border:'1px solid rgba(248,113,113,.18)',marginBottom:10}}>
          <div style={{fontSize:13,color:'var(--text4)',lineHeight:1.6}}>Ordena por impacto real na nota: matéria que cai muito + você acerta pouco = mais pontos em risco. Foque nos vermelhos.</div>
        </div>
        {(()=>{
          const ranking=calcPontosEmRisco();
          if(!ranking.filter(r=>r.temDado).length)return(
            <div style={{textAlign:'center',padding:'16px',color:'var(--text4)',fontSize:14}}>Registre questões com assunto para ver os pontos em risco.</div>
          );
          return ranking.map((item,i)=>{
            const cor=item.pontosRisco>=30?'#f87171':item.pontosRisco>=15?'#fbbf24':'#34d399';
            const acertoCor=item.acerto===null?'#aab6c8':item.acerto>=85?'#34d399':item.acerto>=70?'#fbbf24':'#f87171';
            return(
              <div key={item.mat} style={{padding:'10px 12px',borderRadius:10,background:`${cor}07`,border:`1px solid ${cor}22`,marginBottom:5}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:14,fontWeight:900,color:cor,width:20,flexShrink:0}}>{i+1}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:15,color:'var(--text)',fontWeight:700,marginBottom:3}}>{item.mat}</div>
                    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                      <span style={{fontSize:13,padding:'1px 6px',borderRadius:4,background:`${cor}15`,color:cor,fontFamily:"'DM Mono',monospace",fontWeight:800}}>
                        ⚠️ {item.pontosRisco}pts em risco
                      </span>
                      {item.pontosGarantidos!==null&&(
                        <span style={{fontSize:13,padding:'1px 6px',borderRadius:4,background:'rgba(52,211,153,.12)',color:'#34d399',fontFamily:"'DM Mono',monospace"}}>
                          ✅ {item.pontosGarantidos}pts garantidos
                        </span>
                      )}
                      {item.acerto!==null
                        ?<span style={{fontSize:13,color:acertoCor,fontFamily:"'DM Mono',monospace"}}>🎯 {item.acerto}% acerto</span>
                        :<span style={{fontSize:13,color:'var(--text4)'}}>sem questões</span>
                      }
                    </div>
                  </div>
                  <div style={{textAlign:'right',flexShrink:0}}>
                    <div style={{fontSize:18,fontWeight:900,color:cor,fontFamily:"'DM Mono',monospace",lineHeight:1}}>{item.pontosRisco}</div>
                    <div style={{fontSize:13,color:'var(--text4)'}}>pts risco</div>
                  </div>
                </div>
              </div>
            );
          });
        })()}

        <div style={{fontSize:13,letterSpacing:'2px',color:'#aab6c6',fontFamily:"'DM Mono',monospace",marginBottom:8,marginTop:14}}>🏆 RANKING — APROVEITAMENTO (com dados + dif base)</div>
        {(()=>{
          const{comDado,semDado}=calcRankingAproveitamento();
          const todos=[
            ...comDado.map(r=>({...r,tipo:'real'})),
            ...semDado.map(r=>({...r,tipo:'base'}))
          ].sort((a,b)=>a.pct-b.pct);
          if(!todos.length)return <div style={{textAlign:'center',padding:'12px',color:'#9fabbc',fontSize:14}}>Registre questões ou defina dif base para ver o ranking.</div>;
          return todos.map((item,i)=>{
            const cor=item.pct>=85?'#34d399':item.pct>=70?'#fbbf24':'#f87171';
            return(
              <div key={item.mat} style={{display:'flex',alignItems:'center',gap:8,padding:'9px 11px',borderRadius:10,background:`${cor}07`,border:`1px solid ${cor}25`,marginBottom:5}}>
                <span style={{fontSize:13,fontWeight:900,color:cor,width:18,flexShrink:0}}>{i+1}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,color:'#f1f5f9',fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.mat}</div>
                  {item.tipo==='real'?<BarProg done={item.a} total={item.q} cor={cor} h={4}/>:<div style={{fontSize:13,color:'#c2ccd8',marginTop:2}}>base: dif{item.difBase}⭐ — sem questões ainda</div>}
                  {item.pct<70&&EDITAL[item.mat]&&(
                    <div style={{fontSize:13,color:'#f87171',marginTop:3,padding:'2px 6px',borderRadius:4,background:'rgba(248,113,113,.12)',border:'1px solid rgba(248,113,113,.25)',display:'inline-block'}}>
                      ⚠️ {EDITAL[item.mat].top[0].t.slice(0,35)} vale {EDITAL[item.mat].top[0].p}% das questões
                    </div>
                  )}
                </div>
                <div style={{textAlign:'right',flexShrink:0}}>
                  <div style={{fontSize:15,fontWeight:900,color:cor,fontFamily:"'DM Mono',monospace"}}>{item.tipo==='real'?`${item.pct}%`:`≈${item.pct}%`}</div>
                  <div style={{fontSize:13,color:'#aab6c6',fontFamily:"'DM Mono',monospace"}}>{item.tipo==='real'?`${item.a}/${item.q}Q`:'dif base'}</div>
                </div>
              </div>
            );
          });
        })()}
        {/* RANKING POR ASSUNTO */}
        <div style={{fontSize:13,letterSpacing:'2px',color:'#aab6c6',fontFamily:"'DM Mono',monospace",marginBottom:8,marginTop:12}}>🔍 RANKING — APROVEITAMENTO POR ASSUNTO</div>
        {(()=>{
          const hist=lsGet('historico_diario',[]);
          const porAss={};
          hist.forEach(r=>{
            if(!r.assunto||!r.materia)return;
            const q=parseInt(r.questoes)||0;const a=parseInt(r.acertei)||0;
            if(!q)return;
            const key=`${r.materia} — ${r.assunto}`;
            if(!porAss[key])porAss[key]={q:0,a:0,mat:r.materia};
            porAss[key].q+=q;porAss[key].a+=a;
          });
          const ranking=Object.entries(porAss).map(([ass,v])=>({ass,pct:Math.round(v.a/v.q*100),q:v.q,a:v.a,mat:v.mat})).sort((a,b)=>b.pct-a.pct);
          if(!ranking.length)return <div style={{textAlign:'center',padding:'12px',color:'#9fabbc',fontSize:14}}>Registre assunto + questões para ver o ranking.</div>;
          return ranking.map((item,i)=>{
            const cor=item.pct>=80?'#34d399':item.pct>=60?'#fbbf24':'#f87171';
            return(
              <div key={item.ass} style={{display:'flex',alignItems:'center',gap:8,padding:'9px 11px',borderRadius:10,background:`${cor}07`,border:`1px solid ${cor}25`,marginBottom:5}}>
                <span style={{fontSize:13,fontWeight:900,color:cor,width:18,flexShrink:0}}>{i+1}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,color:'#f1f5f9',fontWeight:700,lineHeight:1.3}}>{item.ass}</div>
                  <BarProg done={item.a} total={item.q} cor={cor} h={3}/>
                </div>
                <div style={{textAlign:'right',flexShrink:0}}>
                  <div style={{fontSize:15,fontWeight:900,color:cor,fontFamily:"'DM Mono',monospace"}}>{item.pct}%</div>
                  <div style={{fontSize:13,color:'#aab6c6',fontFamily:"'DM Mono',monospace"}}>{item.a}/{item.q}Q</div>
                </div>
              </div>
            );
          });
        })()}
        <div style={{fontSize:13,letterSpacing:'2px',color:'#aab6c6',fontFamily:"'DM Mono',monospace",marginBottom:8,marginTop:10}}>ÚLTIMAS SESSÕES</div>
        {horas.slice().reverse().slice(0,12).map((e,i)=>(
          <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'8px 12px',borderRadius:9,background:'rgba(148,163,184,.22)',border:'1px solid rgba(255,255,255,.05)',marginBottom:4}}>
            <span style={{fontSize:15,color:'#b4c0d1'}}>{e.mat||'Estudo'}</span>
            <span style={{fontSize:15,color:'#fbbf24',fontFamily:"'DM Mono',monospace"}}>{fmtMin(e.min)}</span>
          </div>
        ))}
        {horas.length===0&&<div style={{textAlign:'center',padding:'30px',color:'#aab6c6',fontSize:15}}>Nenhuma hora registrada ainda.</div>}
        {/* Blocos do ciclo */}
        <div style={{marginTop:14}}>
          <div style={{fontSize:13,letterSpacing:'2px',color:'#aab6c6',fontFamily:"'DM Mono',monospace",marginBottom:8}}>PROGRESSO DO CICLO</div>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}><BarProg done={feitos.length} total={N} h={5}/><span style={{fontSize:13,color:'#fbbf24',fontFamily:"'DM Mono',monospace",flexShrink:0}}>{feitos.length}/{N}</span></div>
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
            {CICLO.map(s=>{const done=feitosSet.has(s.id);const c=s.tag?.includes('TRIÂNGULO')?'#fbbf24':s.cor;return(
              <div key={s.id} title={s.mat} style={{width:28,height:28,borderRadius:6,background:done?`${c}30`:'rgba(255,255,255,.03)',border:`1px solid ${done?c:'rgba(148,163,184,.25)'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:done?c:'#aab6c8',fontFamily:"'DM Mono',monospace",fontWeight:700}}>{done?'✓':CICLO.indexOf(s)+1}</div>
            );})}
          </div>
        </div>
      </div>}

      {/* PLANEJAMENTO SEMANAL */}
      {aba==='plano'&&<div>
        <div style={{background:'linear-gradient(135deg,rgba(96,165,250,.08),rgba(5,10,20,.98))',border:'1px solid rgba(96,165,250,.25)',borderRadius:14,padding:'14px',marginBottom:14}}>
          <div style={{fontSize:13,letterSpacing:'3px',color:'#60a5fa',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:10}}>📅 PLANEJAMENTO SEMANAL — GURUJA</div>
          <div style={{fontSize:14,color:'#b4c0d1',marginBottom:10}}>Todo domingo: cole os dados do Guruja, ajuste o plano e aprove. A IA Assessora vai considerar esse plano nos check-ins.</div>
          <div style={{display:'flex',gap:8,marginBottom:10}}>
            <div style={{flex:1}}>
              <div style={{fontSize:13,color:'#c2ccd8',marginBottom:4}}>META DA SEMANA (h)</div>
              <input type="number" value={metaHoras} onChange={e=>{const v=Number(e.target.value);setMetaHoras(v);lsSet('meta_horas_sem',v);}} style={{width:'100%',padding:'10px',borderRadius:8,border:'1px solid rgba(96,165,250,.25)',background:'rgba(96,165,250,.06)',color:'#60a5fa',fontSize:20,fontWeight:900,fontFamily:"'DM Mono',monospace",textAlign:'center',outline:'none',boxSizing:'border-box'}}/>
            </div>
            <div style={{flex:2}}>
              <div style={{fontSize:13,color:'#c2ccd8',marginBottom:4}}>CONTEXTO DA SEMANA</div>
              <input value={contextSem} onChange={e=>setContextSem(e.target.value)} placeholder="ex: semana corrida, prova próxima..." style={{width:'100%',padding:'10px',borderRadius:8,border:'1px solid rgba(96,165,250,.18)',background:'rgba(96,165,250,.03)',color:'#f1f5f9',fontSize:15,outline:'none',boxSizing:'border-box'}}/>
            </div>
          </div>
          <textarea value={gurujaTxt} onChange={e=>setGurujaTxt(e.target.value)} rows={5} placeholder="Cole os dados da tabela Análise Geral do Guruja aqui..." style={{width:'100%',padding:'9px',borderRadius:8,border:'1px solid rgba(96,165,250,.25)',background:'rgba(96,165,250,.04)',color:'#f1f5f9',fontSize:14,outline:'none',resize:'vertical',boxSizing:'border-box',marginBottom:10}}/>
          <button onClick={analisarGurujaSemana} disabled={gurujaLoad||!gurujaTxt.trim()} style={{width:'100%',padding:'12px',borderRadius:9,border:'none',background:gurujaTxt.trim()?'linear-gradient(135deg,#60a5fa,#60a5fa)':'rgba(148,163,184,.22)',color:gurujaTxt.trim()?'#050a14':'#aab6c8',fontSize:15,fontWeight:800,cursor:'pointer'}}>
            {gurujaLoad?'⏳ Analisando...':'🤖 Analisar e sugerir plano'}
          </button>
        </div>
        {planoProposto&&<div>
          <div style={{padding:'11px 13px',borderRadius:11,background:'rgba(251,191,36,.06)',border:'1px solid rgba(251,191,36,.2)',marginBottom:12}}>
            <div style={{fontSize:13,color:'#fbbf24',fontFamily:"'DM Mono',monospace",marginBottom:4}}>🎯 DIAGNÓSTICO</div>
            <div style={{fontSize:15,color:'#f1f5f9',lineHeight:1.7}}>{planoProposto.diagnostico}</div>
            {planoProposto.alerta&&<div style={{fontSize:15,color:'#f87171',fontWeight:700,marginTop:6}}>🚨 {planoProposto.alerta}</div>}
          </div>
          <div style={{fontSize:13,color:'#60a5fa',fontFamily:"'DM Mono',monospace",letterSpacing:'2px',marginBottom:8}}>✏️ AJUSTE O PLANO — VOCÊ DECIDE</div>
          {planEdit.map((p,i)=>{
            const cor=p.status==='critica'?'#f87171':p.status==='atencao'?'#fbbf24':'#34d399';
            return(
              <div key={i} style={{padding:'11px 12px',borderRadius:11,background:`${cor}06`,border:`1px solid ${cor}25`,marginBottom:8}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <div style={{width:22,height:22,borderRadius:'50%',background:`${cor}20`,border:`1px solid ${cor}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:900,color:cor}}>{i+1}</div>

        <CardGurujaImport/>

    </div>
  );
}

// Componente auxiliar para adicionar tempo manual (sem hooks problemáticos)
function AddTempoManual({onAdd}){
  const[mat,setMat]=useState('');
  const[min,setMin]=useState('');
  const[salvo,setSalvo]=useState(false);
  const add=()=>{
    const m=parseInt(min);
    if(!mat.trim()||!m||m<=0)return;
    onAdd({mat:mat.trim(),min:m,dt:Date.now()});
    setMat('');setMin('');
    setSalvo(true);setTimeout(()=>setSalvo(false),2000);
  };
  return(
    <div style={{display:'flex',gap:8}}>
      <input value={mat} onChange={e=>setMat(e.target.value)} placeholder="Matéria..." style={{flex:1,padding:'8px 10px',borderRadius:8,border:'1px solid rgba(251,191,36,.2)',background:'rgba(251,191,36,.04)',color:'#f1f5f9',fontSize:15,outline:'none'}}/>
      <input type="number" value={min} onChange={e=>setMin(e.target.value)} placeholder="min" style={{width:65,padding:'8px',borderRadius:8,border:'1px solid rgba(251,191,36,.2)',background:'rgba(251,191,36,.04)',color:'#fbbf24',fontSize:15,fontWeight:900,fontFamily:"'DM Mono',monospace",textAlign:'center',outline:'none'}}/>
      <button onClick={add} disabled={!mat.trim()||!min} style={{padding:'8px 14px',borderRadius:8,border:'none',background:mat.trim()&&min?'#fbbf24':'rgba(148,163,184,.22)',color:mat.trim()&&min?'#050a14':'#aab6c8',fontSize:15,fontWeight:800,cursor:'pointer'}}>{salvo?'✅':'+'}  </button>

}
