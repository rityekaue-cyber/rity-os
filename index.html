            <div style={{fontSize:12,color:'rgba(251,191,36,.55)',letterSpacing:'3px',fontFamily:mono,fontWeight:700}}>MENTORA · CONSOLIDAR A BASE</div>
            <div style={{fontFamily:"'DM Serif Display',serif",color:'#f0e6d0',fontSize:19,marginTop:2}}>{rotuloDk(E.dk)} · {T.ic} {T.nome}</div>
            <div style={{fontSize:13,color:'#aab6c8',marginTop:3,fontFamily:mono}}>{E.diasProva==null?'pré-edital · sem data de prova':E.diasProva>0?`faltam ${E.diasProva} dias para a prova`:'dia da prova'}{!PLANO_GURUJA?' · aguardando a Meta 1':E.noPlano?` · plano dia ${E.diaIdx}/7`:' · plano encerrado'}</div>
          </div>
          <button onClick={abrirSemana} style={{background:'rgba(148,163,184,.18)',border:'1px solid rgba(255,255,255,.12)',borderRadius:9,padding:'7px 10px',fontFamily:mono,fontSize:13,fontWeight:800,color:'#c2ccd8',cursor:'pointer',flexShrink:0}}>⚙️ Semana</button>
        </div>
        <div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:9}}>
          <span style={{fontSize:12,color:'#aab6c8',alignSelf:'center',fontFamily:mono}}>HOJE É:</span>
          {Object.entries(TIPOS_DIA).map(([k,v])=><IAChip key={k} sm on={E.tipo===k} onClick={()=>escolherTipo(k)}>{v.ic} {v.nome}</IAChip>)}
        </div>
      </div>

      {/* Modo A — a mentora fala primeiro */}
      <div style={{...IA_CARD,border:'1px solid rgba(251,191,36,.28)',background:'rgba(251,191,36,.05)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={IA_LAB}>✦ BOM DIA, RITCHELY</div>
          <button onClick={()=>gerarBriefing(true)} disabled={briCarregando} style={{background:'transparent',border:'none',color:'#aab6c8',fontSize:13,cursor:'pointer',fontFamily:mono}}>{briCarregando?'…':'↻ reescrever'}</button>
        </div>
        {(lsGet('ia_combinados',{})||{})[E.dk]&&(lsGet('ia_combinados',{})||{})[E.dk].texto&&<div style={{fontSize:13,color:'#aab6c8',borderLeft:'3px solid rgba(251,191,36,.45)',paddingLeft:9,marginBottom:8,lineHeight:1.55}}>📌 Combinado ontem à noite: {(lsGet('ia_combinados',{})||{})[E.dk].texto}</div>}
        {briCarregando&&!bri?<div style={{display:'flex',gap:5,padding:'8px 0'}}>{[0,1,2].map(i=><div key={i} style={{width:7,height:7,borderRadius:'50%',background:'#fbbf24',animation:'pulse 1.2s ease-in-out infinite',animationDelay:`${i*.2}s`}}/>)}</div>
        :<div style={{fontSize:15,color:'#e2e8f0',lineHeight:1.7}}>{bri?bri.texto:textoBriefingAuto(E)}</div>}
        {bri&&bri.origem==='auto'&&bri.motivo&&<div style={{fontSize:12,color:'#aab6c8',marginTop:6}}>Resumo automático ({bri.motivo}).</div>}
        {E.tipo!=='prova'&&<div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:10}}>
          <IAChip on={resposta==='ok'} cor="#34d399" onClick={mantem}>✅ Mantém</IAChip>
          <IAChip cor="#fbbf24" onClick={()=>abrirAjuste('apertado')}>⚠️ Dia apertado</IAChip>
          <IAChip cor="#f87171" onClick={()=>abrirAjuste('travada')}>🔴 Travada</IAChip>
          <IAChip cor="#60a5fa" onClick={onAbrirChat}>✏️ Conversar</IAChip>
        </div>}
        {resposta==='ok'&&<div style={{fontSize:13,color:'#34d399',marginTop:7}}>Combinado fechado: bora.</div>}
        {propAuto&&<IAProposta p={propAuto} rotuloAplicar="✅ Aplicar proposta" onAplicar={()=>aplicarProposta(propAuto)} onCancelar={()=>{setPropDispensada(true);salvarCombinado({ignorou:true});}}/>}
      </div>

      {/* Modo B e C: acesso rápido */}
      {E.tipo!=='prova'&&<div style={{display:'flex',gap:7,marginBottom:9}}>
        <button onClick={()=>abrirAjuste('imprevisto')} style={{flex:1,padding:'11px',borderRadius:11,border:'1px solid rgba(248,113,113,.4)',background:'rgba(248,113,113,.1)',color:'#f87171',fontSize:15,fontWeight:800,cursor:'pointer',fontFamily:mono}}>🆘 Imprevisto</button>
        <button onClick={()=>{setFech({como:null,travou:[],amanha:null});setSheet('fechar');}} style={{flex:1,padding:'11px',borderRadius:11,border:`1px solid ${fechaDestaque?'rgba(251,191,36,.7)':'rgba(251,191,36,.3)'}`,background:fechaDestaque?'rgba(251,191,36,.2)':'rgba(251,191,36,.08)',color:'#fbbf24',fontSize:15,fontWeight:800,cursor:'pointer',fontFamily:mono}}>🌙 Fechar o dia{fechaDestaque?' ·':''}</button>
      </div>}
      {ultAj&&ultAj.dk===E.dk&&<div style={{fontSize:13,color:'#aab6c8',marginBottom:9,display:'flex',gap:8,alignItems:'center'}}>
        <span>Último ajuste: {ultAj.tipo==='hoje'?'hoje':'amanhã'} → {fmtMinG(ultAj.para)} ({ultAj.motivo||'ajuste'}).</span>
        <button onClick={desfazerAjuste} style={{background:'transparent',border:'1px solid rgba(255,255,255,.2)',borderRadius:8,color:'#c2ccd8',fontSize:13,padding:'3px 9px',cursor:'pointer'}}>↩ desfazer</button>
      </div>}

      {/* 1 — Missão de hoje */}
      <div style={IA_CARD}>
        <div style={IA_LAB}>🎯 MISSÃO DE HOJE{E.noPlano?` · ${fmtMinG(E.minFeito)} de ${fmtMinG(E.minPlano)}`:''}{atrasoTxt?` · ${atrasoTxt}`:''}</div>
        {E.noPlano&&E.minPlano>0&&<div style={{display:'flex',alignItems:'center',gap:8,marginBottom:9}}><BarProg done={E.minFeito} total={E.minPlano} cor={prog>=100?'#34d399':'#fbbf24'} h={5}/><span style={{fontSize:13,color:'#c2ccd8',fontFamily:mono}}>{prog}%</span></div>}
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'6px 0',borderBottom:'1px solid rgba(255,255,255,.06)'}}>
          <span style={{fontSize:16}}>{E.anki?'✅':'⬜'}</span>
          <div style={{flex:1,fontSize:14,color:E.anki?'#aab6c8':'#e2e8f0'}}>Anki profundo · 05h00 · 30 min <span style={{color:'#aab6c8'}}>(fora do plano)</span></div>
        </div>
        {!E.noPlano&&<div style={{fontSize:14,color:'#fbbf24',lineHeight:1.6,padding:'8px 0'}}>{PLANO_GURUJA?'A janela de 7 dias da meta acabou. Abra a próxima meta no Guruja: a rotina atualiza o guruja.json e o app remonta o plano. Até lá, o que ficou pendente aparece abaixo.':PLANO_VAZIO_MSG+'. Até lá, Anki, registro de questões e revisão funcionam normalmente.'}</div>}
        {E.lista.map(i=>{
          const f=E.feitoSet.has(i.id);const atr=i.diaPlano<E.diaIdx;
          return(
            <div key={i.id} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 0',borderBottom:'1px solid rgba(255,255,255,.06)'}}>
              <span style={{fontSize:16}}>{f?'✅':'⬜'}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,color:f?'#aab6c8':'#f1f5f9',fontWeight:700,textDecoration:f?'line-through':'none'}}>{i.ic} {matCurto(i.mat)} <span style={{color:'#aab6c8',fontWeight:500}}>· {fmtMinG(i.min)} · {i.tipo}{atr?' · atrasada':''}</span></div>
                <div style={{fontSize:13,color:'#aab6c8',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{i.conteudo}</div>
              </div>
              {!f&&<CadernoBtn id={i.id} curto/>}
              {!f&&onRapido&&<button onClick={()=>onRapido(i)} style={{padding:'6px 9px',borderRadius:8,border:'1px solid rgba(52,211,153,.45)',background:'rgba(52,211,153,.12)',color:'#34d399',fontSize:13,fontWeight:800,cursor:'pointer',flexShrink:0}}>⚡ Fiz</button>}
            </div>
          );
        })}
        {E.lista.some(i=>i.mat===MAT_TI&&i.min>=90)&&<div style={{fontSize:13,color:'#aab6c8',padding:'8px 0 0',lineHeight:1.5}}>📊 Tempo morto: +30 min de questões de TI (fecha 2h de TI no dia).</div>}
        {E.atras.filter(a=>!E.lista.some(i=>i.id===a.id)).length>0&&<div style={{fontSize:13,color:'#f87171',paddingTop:8}}>Atrasadas fora de hoje: {E.atras.filter(a=>!E.lista.some(i=>i.id===a.id)).slice(0,6).map(i=>matCurto(i.mat)).join(', ')}{E.atras.filter(a=>!E.lista.some(i=>i.id===a.id)).length>6?` e mais ${E.atras.filter(a=>!E.lista.some(i=>i.id===a.id)).length-6}`:''}</div>}
        <div style={{display:'flex',gap:6,marginTop:9,flexWrap:'wrap'}}>
          <button onClick={()=>onSetTab&&onSetTab('hoje')} style={{padding:'6px 10px',borderRadius:8,border:'1px solid rgba(255,255,255,.14)',background:'transparent',color:'#c2ccd8',fontSize:13,cursor:'pointer'}}>Abrir aba Hoje</button>
          <button onClick={()=>onSetTab&&onSetTab('estudo')} style={{padding:'6px 10px',borderRadius:8,border:'1px solid rgba(255,255,255,.14)',background:'transparent',color:'#c2ccd8',fontSize:13,cursor:'pointer'}}>Ver ciclo da semana</button>
        </div>
      </div>

      {/* 2 — Distância até o corte (só com edital/prova) */}
      {TEM_PROVA&&<div style={IA_CARD}>
        <div style={IA_LAB}>📏 DISTÂNCIA ATÉ O CORTE</div>
        <div style={{fontSize:15,color:'#f1f5f9',lineHeight:1.6}}>Hoje você acerta ~<strong style={{color:'#fbbf24'}}>{D.pct.toFixed(0)}%</strong> do que treina (≈ {D.pts.toFixed(0)} de 280 pontos). Na prova, o ambiente costuma custar 3 a 16 pontos percentuais.</div>
        <div style={{position:'relative',height:26,margin:'14px 0 6px',background:'rgba(148,163,184,.2)',borderRadius:6}}>
          <div style={{position:'absolute',left:0,top:0,bottom:0,width:`${pctDe(real.pts)}%`,background:`linear-gradient(90deg,${corPts(real.pts)}66,${corPts(real.pts)})`,borderRadius:6}}/>
          <div style={{position:'absolute',left:`${pctDe(150)}%`,top:-4,bottom:-4,width:2,background:'#f87171'}}/>
          <div style={{position:'absolute',left:`${pctDe(D.alvo)}%`,top:-4,bottom:-4,width:2,background:'#34d399'}}/>
          <div style={{position:'absolute',left:`${pctDe(150)}%`,top:28,transform:'translateX(-50%)',fontSize:11,color:'#f87171',fontFamily:mono,whiteSpace:'nowrap'}}>mín. 150</div>
          <div style={{position:'absolute',left:`${pctDe(D.alvo)}%`,top:28,transform:'translateX(-50%)',fontSize:11,color:'#34d399',fontFamily:mono,whiteSpace:'nowrap'}}>alvo {D.alvo}</div>
        </div>
        <div style={{display:'flex',gap:6,marginTop:30}}>
          {D.cen.map(c=>(
            <div key={c.n} style={{flex:1,background:'rgba(148,163,184,.12)',borderRadius:9,padding:'7px 6px',textAlign:'center',border:c.n==='realista'?'1px solid rgba(251,191,36,.45)':'1px solid transparent'}}>
              <div style={{fontSize:11,color:'#aab6c8',fontFamily:mono}}>{c.n.toUpperCase()}</div>
              <div style={{fontSize:17,fontWeight:800,color:corPts(c.pts),fontFamily:mono}}>{c.pts.toFixed(0)}</div>
              <div style={{fontSize:11,color:'#aab6c8'}}>{c.pct.toFixed(0)}% · −{c.dd}pp</div>
            </div>
          ))}
        </div>
        <div style={{fontSize:14,color:'#d5dde8',marginTop:9,lineHeight:1.6}}>
          Cenário realista: <strong style={{color:corPts(real.pts)}}>{real.pts.toFixed(0)} pts</strong>, {dif>=0?`${dif.toFixed(0)} pts acima do seu alvo`:`${Math.abs(dif).toFixed(0)} pts abaixo do seu alvo`} e {(real.pts-150).toFixed(0)} acima do mínimo. {dif<0?'O que fecha essa diferença está nos 3 riscos abaixo.':'Margem boa: o trabalho agora é não perder pontos nos 3 riscos abaixo.'}
        </div>
        <div style={{fontSize:12,color:'#aab6c8',marginTop:6,lineHeight:1.5}}>Pontos brutos estimados (80 gerais ×1 + 100 específicas ×2). O corte oficial é por nota padronizada e depende da turma; o alvo é seu e se edita em ⚙️ Semana. Desconto de prova (3/9/16 pp) é estimativa.</div>
      </div>}

      {/* 3 — Os 3 maiores riscos */}
      <div style={IA_CARD}>
        <div style={IA_LAB}>⚠️ OS 3 MAIORES RISCOS</div>
        {R.map((r,i)=>(
          <div key={r.nome} style={{padding:'9px 0',borderBottom:i<R.length-1?'1px solid rgba(255,255,255,.07)':'none'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:8}}>
              <div style={{fontSize:15,fontWeight:800,color:'#f1f5f9'}}>{i+1}. {matCurto(r.nome)}</div>
              <div style={{fontSize:13,color:'#f87171',fontFamily:mono,fontWeight:800,flexShrink:0}}>{TEM_PROVA?`~${r.emJogo.toFixed(1).replace('.',',')} pts em jogo`:'maior déficit'}</div>
            </div>
            <div style={{fontSize:13,color:'#aab6c8',marginTop:2}}>{r.nivel!=null?`você ${r.nivel.toFixed(0)}% · peso ${String(r.peso).replace('.',',')}%`:`peso somado ${r.peso.toFixed(1).replace('.',',')}%`}{r.mot.length?` · ${r.mot.join(' · ')}`:''}</div>
            <div style={{fontSize:14,color:'#d5dde8',marginTop:4,lineHeight:1.55}}>{r.acao}{r.link&&<> <a href={r.link} target="_blank" rel="noreferrer" style={{color:'#60a5fa',fontWeight:700}}>abrir no TEC ↗</a></>}</div>
          </div>
        ))}
        <div style={{fontSize:12,color:'#aab6c8',marginTop:8,lineHeight:1.5}}>Pontos em jogo = peso na prova × o que falta para 100%, ajustado por tendência, média geral e matéria sem dado. Dados do Guruja de {GURUJA_SYNC.em}; para atualizar, peça “atualiza” no Claude.</div>
      </div>

      {/* Sheet: ajuste (apertado / travada / imprevisto) */}
      {sheet==='ajuste'&&(
        <IASheet titulo={aj.modo==='imprevisto'?'🆘 IMPREVISTO':aj.modo==='travada'?'🔴 DIA MÍNIMO VIÁVEL':'⚠️ DIA APERTADO'} onClose={()=>setSheet(null)}>
          {!E.noPlano&&<div style={{fontSize:14,color:'#fbbf24',lineHeight:1.6}}>{PLANO_GURUJA?'A janela da meta acabou, então não há o que reorganizar. Abra a próxima meta no Guruja.':PLANO_VAZIO_MSG+': não há o que reorganizar.'}</div>}
          {E.noPlano&&<>
            {aj.modo==='travada'&&<div style={{fontSize:14,color:'#d5dde8',lineHeight:1.65,marginBottom:10}}>Travar acontece. Hoje o mínimo que vale é: <strong>Anki + o reforço + a coisa mais leve da lista</strong>. O resto desliza para os próximos dias, sem culpa. Comece pela tarefa mais fácil, 25 minutos, e depois decida de novo.</div>}
            {aj.modo==='imprevisto'&&<>
              <div style={{fontSize:13,color:'#aab6c8',marginBottom:6}}>O que aconteceu?</div>
              <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
                {[['acordei tarde',180],['chamada no trabalho',120],['Kauê precisou',120],['energia baixa',120],['outro',null]].map(([l,r])=>(
                  <IAChip key={l} sm on={aj.motivo===l} onClick={()=>setAj(a=>({...a,motivo:l,restante:r!=null?r:a.restante}))}>{l}</IAChip>
                ))}
              </div>
              {aj.motivo==='Kauê precisou'&&<div style={{fontSize:14,color:'#d5dde8',marginBottom:8,lineHeight:1.55}}>Kauê vem primeiro. O mínimo do dia é Anki + reforço.</div>}
              {aj.motivo==='energia baixa'&&<div style={{fontSize:14,color:'#d5dde8',marginBottom:8,lineHeight:1.55}}>Comece pela atividade mais leve; a pesada só entra se a energia voltar.</div>}
            </>}
            <div style={{fontSize:13,color:'#aab6c8',marginBottom:6}}>Quanto tempo ainda tenho hoje?</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              {[[30,'30 min'],[60,'1h'],[90,'1h30'],[120,'2h'],[180,'3h'],[240,'4h']].map(([m,l])=><IAChip key={m} sm on={aj.restante===m} onClick={()=>setAj(a=>({...a,restante:m}))}>{l}</IAChip>)}
            </div>
            {aj.restante==null&&<div style={{fontSize:13,color:'#aab6c8',marginTop:10}}>Escolha o tempo e eu mostro o que fica e o que sai, antes de mexer em qualquer coisa.</div>}
            {propAj&&<IAProposta p={propAj} rotuloAplicar="✅ Aplicar" onAplicar={()=>aplicarProposta(propAj)} onCancelar={()=>setSheet(null)}/>}
            {aj.restante!=null&&!propAj&&<div style={{fontSize:14,color:'#34d399',marginTop:10}}>Hoje já está tudo feito. Nada a ajustar.</div>}
          </>}
        </IASheet>
      )}

      {/* Sheet: fechamento (modo C) */}
      {sheet==='fechar'&&(
        <IASheet titulo="🌙 FECHAR O DIA" onClose={()=>setSheet(null)}>
          <div style={{fontSize:14,color:'#d5dde8',marginBottom:10,lineHeight:1.6}}>Hoje: <strong>{fmtMinG(E.minFeito)}</strong> feitos de {fmtMinG(E.minPlano)} planejados{E.pend.length?`; ficaram ${E.pend.length} atividade(s)`:''}{E.atrasoMin>0?`; atraso acumulado ${fmtMinG(E.atrasoMin)}`:''}. Três toques e pronto.</div>
          <div style={{fontSize:13,color:'#aab6c8',marginBottom:6}}>1. Como foi o dia?</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
            {[['bom','😀 Bom','#34d399'],['médio','😐 Médio','#fbbf24'],['ruim','😞 Ruim','#f87171']].map(([k,l,c])=><IAChip key={k} cor={c} on={fech.como===k} onClick={()=>setFech(f=>({...f,como:k}))}>{l}</IAChip>)}
          </div>
          <div style={{fontSize:13,color:'#aab6c8',marginBottom:6}}>2. O que travou? (pode marcar mais de uma)</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
            {[...E.pend.slice(0,6).map(i=>`${matCurto(i.mat)} ${i.conteudo.length>22?i.conteudo.slice(0,22)+'…':i.conteudo}`),'não consegui começar','nada travou'].map(l=>{
              const on=fech.travou.includes(l);
              return <IAChip key={l} sm on={on} onClick={()=>setFech(f=>({...f,travou:l==='nada travou'?(f.travou.includes(l)?[]:[l]):(f.travou.includes(l)?f.travou.filter(x=>x!==l):[...f.travou.filter(x=>x!=='nada travou'),l])}))}>{l}</IAChip>;
            })}
          </div>
          <div style={{fontSize:13,color:'#aab6c8',marginBottom:6}}>3. Amanhã ({rotuloDk(amanhaDk)} · {TIPOS_DIA[tipoAmanha].ic} {TIPOS_DIA[tipoAmanha].nome}): a carga…</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:6}}>
            {[['sobe','⬆️ Sobe 1h'],['mantém','➡️ Mantém'],['desce','⬇️ Desce 1h']].map(([k,l])=><IAChip key={k} on={fech.amanha===k} onClick={()=>setFech(f=>({...f,amanha:k}))}>{l}</IAChip>)}
          </div>
          {(fech.como==='ruim'||E.pend.length>=3)&&!fech.amanha&&<div style={{fontSize:13,color:'#fbbf24',marginBottom:6}}>Sugestão: dia ruim ou com muita coisa sobrando, descer 1h costuma render mais do que insistir na mesma carga.</div>}
          {!E.noPlano&&<div style={{fontSize:13,color:'#fbbf24',marginTop:8}}>{PLANO_GURUJA?'A janela da meta acabou':PLANO_VAZIO_MSG}: registro o fechamento, mas não há carga para ajustar.</div>}
          {propFech&&<IAProposta p={propFech} rotuloAplicar={fechando?'Salvando…':'✅ Aplicar e fechar o dia'} onAplicar={()=>concluirFechamento(true)} onCancelar={null}/>}
          {fech.como&&fech.travou.length>0&&fech.amanha&&(
            <button disabled={fechando} onClick={()=>concluirFechamento(false)} style={{width:'100%',marginTop:12,padding:'12px',borderRadius:11,border:'1px solid rgba(251,191,36,.5)',background:'rgba(251,191,36,.12)',color:'#fbbf24',fontSize:15,fontWeight:900,cursor:'pointer',fontFamily:mono}}>{fechando?'Escrevendo o combinado…':propFech?'Fechar sem mudar a carga':'🌙 Fechar o dia e escrever o combinado de amanhã'}</button>
          )}
        </IASheet>
      )}

      {/* Sheet: semana (configurar uma vez) */}
      {sheet==='semana'&&cfgEdit&&(
        <IASheet titulo="⚙️ MINHA SEMANA" onClose={()=>setSheet(null)}>
          <div style={{fontSize:13,color:'#aab6c8',marginBottom:6}}>Férias (o app trata esses dias como dia livre de trabalho)</div>
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12,flexWrap:'wrap'}}>
            <input type="date" value={cfgEdit.ferias?cfgEdit.ferias.de:''} onChange={e=>setCfgEdit({...cfgEdit,ferias:{de:e.target.value,ate:cfgEdit.ferias?cfgEdit.ferias.ate:e.target.value}})} style={{padding:'7px 9px',borderRadius:8,border:'1px solid rgba(255,255,255,.2)',background:'rgba(0,0,0,.25)',color:'#f1f5f9',fontSize:14}}/>
            <span style={{color:'#aab6c8'}}>até</span>
            <input type="date" value={cfgEdit.ferias?cfgEdit.ferias.ate:''} onChange={e=>setCfgEdit({...cfgEdit,ferias:{de:cfgEdit.ferias?cfgEdit.ferias.de:e.target.value,ate:e.target.value}})} style={{padding:'7px 9px',borderRadius:8,border:'1px solid rgba(255,255,255,.2)',background:'rgba(0,0,0,.25)',color:'#f1f5f9',fontSize:14}}/>
            <button onClick={()=>setCfgEdit({...cfgEdit,ferias:null})} style={{padding:'6px 10px',borderRadius:8,border:'1px solid rgba(255,255,255,.2)',background:'transparent',color:'#c2ccd8',fontSize:13,cursor:'pointer'}}>sem férias</button>

  async function enviar(texto){
    if(carregando||!texto.trim())return;
    setCarregando(true);
    const nova=[...hist,{role:'user',content:texto}];
    setHist(nova);lsSet('ia_hist',nova);
    try{
      const resposta=await chamarClaude(buildSystem(),nova.slice(-18));
      const mitMatch=resposta.match(/MIT:\["([^"]+)","([^"]+)","([^"]+)"\]/);
      if(mitMatch){
        const itens=[mitMatch[1],mitMatch[2],mitMatch[3]];
        onMIT(itens);
        // Memória de decisões — persiste entre dias, diferente do MIT que só mostra o de hoje
        const log=lsGet('ia_decisoes_historico',[]);
        const dk2=getDK();
        const semHoje=log.filter(l=>l.data!==dk2);
        const novoLog=[...semHoje,{data:dk2,itens}].slice(-14);
        lsSet('ia_decisoes_historico',novoLog);
      }
      const limpo=resposta.replace(/MIT:\[.*?\]/g,'').trim();
      const nova2=[...nova,{role:'assistant',content:limpo}];
      setHist(nova2);lsSet('ia_hist',nova2);
    }catch(e){
      const nova2=[...nova,{role:'assistant',content:`❌ ${e.message}`}];
      setHist(nova2);lsSet('ia_hist',nova2);
    }
    setCarregando(false);
    setTimeout(()=>inputRef.current?.focus(),100);

    // Horas por matéria

      const label=r.pct>=85?'🟢 SÓLIDO':r.pct>=70?'🟡 ATENÇÃO':'🔴 CRÍTICO';
      txt+=`${label} ${r.mat}: ${r.pct}% (${r.a}/${r.q}Q)
`;
      // Assuntos
      const assRank=Object.entries(r.assuntos)
        .map(([ass,v])=>({ass,pct:Math.round(v.a/v.q*100),q:v.q}))
        .sort((a,b)=>a.pct-b.pct);
      assRank.forEach(a=>{
        const al=a.pct>=85?'✅':a.pct>=70?'⚠️':'❌';
        txt+=`   ${al} ${a.ass}: ${a.pct}% (${a.q}Q)
`;
      });
      // O que travou
      if(r.travou.length>0){
        const uniq=[...new Set(r.travou)];
        txt+=`   🔴 Travou: ${uniq.slice(0,3).join('; ')}
`;
      }
    });

    // Matérias sem questões com dif base
    const semQuestoes=Object.entries(difBase).filter(([mat])=>!porMat[mat]||!porMat[mat].q);
    if(semQuestoes.length>0){
      txt+=`
📌 SEM QUESTÕES — DIFICULDADE BASE
───────────────────────────────────────
`;
      semQuestoes.forEach(([mat,dif])=>{
        const label=dif>=4?'🔴 CRÍTICO':dif>=3?'🟡 ATENÇÃO':'🟢 OK';
        txt+=`${label} ${mat}: dif base ${dif}⭐
`;
      });
    }

    // Horas por matéria
    txt+=`
⏱ HORAS POR MATÉRIA (total)
───────────────────────────────────────
`;
    Object.entries(porHoras)
      .sort((a,b)=>b[1]-a[1])
      .slice(0,12)
      .forEach(([mat,min])=>{
        const h=Math.floor(min/60);const m2=min%60;
        txt+=`${mat}: ${h>0?h+'h':''}${m2>0?m2+'min':''}
`;
      });

    // Status do edital
    const matsEdital=EDITAL_MATS;
    txt+=`
📋 STATUS DO EDITAL
───────────────────────────────────────
`;
    matsEdital.forEach(mat=>{
      const tops=EDITAL[mat].top;
      const dom=tops.filter(t=>editalSt[mat+':'+t.t]==='domino').length;
      const est=tops.filter(t=>editalSt[mat+':'+t.t]==='estudei').length;
      if(dom>0||est>0){
        txt+=`${mat}: ✅${dom} domino · 🟡${est} estudei · ⬜${tops.length-dom-est} pendente
`;
        tops.filter(t=>editalSt[mat+':'+t.t]==='estudei').forEach(t=>{
          txt+=`   🟡 ${t.t} (${t.p}%)
`;
        });
      }
    });

    // Pontos críticos manuais
    if(criticos.length>0){
      txt+=`
🎯 PONTOS CRÍTICOS MANUAIS
───────────────────────────────────────
`;
      criticos.forEach(c2=>{
        txt+=`${c2.prioridade==='alta'?'🔴':c2.prioridade==='media'?'🟡':'🟢'} ${c2.mat}`;
        if(c2.motivo)txt+=`: ${c2.motivo}`;
        txt+='\n';
      });
    }

    // Ciclo atual
    txt+=`
🔄 CICLO ATUAL — BLOCOS PENDENTES
───────────────────────────────────────
`;
    const feitos=lsGet('feitos',[]);
    const feitosSet=new Set(feitos);
    CICLO.filter(s=>!feitosSet.has(s.id)).forEach(s=>{
      txt+=`B${s.id} ${s.mat} — ${s.conteudo||s.tag||''}
`;
    });

    // Guruja
    if(gurujaData?.alerta){
      txt+=`
📊 GURUJA
───────────────────────────────────────
`;
      txt+=`Alerta: ${gurujaData.alerta}
`;
    }

    // Anki
    const ankiRegs=lsGet('rev_anki',[]);
    if(ankiRegs.length>0){
      txt+=`
🃏 ANKI — ${ankiRegs.length} sessões
───────────────────────────────────────
`;
      const porAnki={};
      ankiRegs.forEach(r=>{
        if(!r.mat)return;
        if(!porAnki[r.mat])porAnki[r.mat]={s:0,cards:0,q:0,difs:[],last:''};
        porAnki[r.mat].s++;porAnki[r.mat].cards+=parseInt(r.cards)||0;
        porAnki[r.mat].q+=parseInt(r.questoes)||0;
        if(r.dif)porAnki[r.mat].difs.push(r.dif);
        if(r.dia>porAnki[r.mat].last)porAnki[r.mat].last=r.dia;
      });
      Object.entries(porAnki).sort((a,b)=>(b[1].difs.reduce((s,d)=>s+d,0)/(b[1].difs.length||1))-(a[1].difs.reduce((s,d)=>s+d,0)/(a[1].difs.length||1)))
        .forEach(([mat,v])=>{
          const dm=v.difs.length?(v.difs.reduce((s,d)=>s+d,0)/v.difs.length).toFixed(1):'-';
          const lbl=parseFloat(dm)>=4?'🔴':parseFloat(dm)>=3?'🟡':'🟢';
          txt+=`${lbl} ${mat}: ${v.s} sessões · ${v.cards} cards · ${v.q}Q · dif ${dm}★ · último: ${v.last}
`;
        });
    }

    // NLM
    const nlmRegs=lsGet('rev_nlm',[]);
    if(nlmRegs.length>0){
      txt+=`
🎧 NOTEBOOKLM — ${nlmRegs.length} sessões
───────────────────────────────────────
`;
      const porNlm={};
      nlmRegs.forEach(r=>{
        if(!r.mat)return;
        if(!porNlm[r.mat])porNlm[r.mat]={s:0,min:0,difs:[],oque:[],last:''};
        porNlm[r.mat].s++;porNlm[r.mat].min+=parseInt(r.tempo)||0;
        if(r.dif)porNlm[r.mat].difs.push(r.dif);
        if(r.oque&&!porNlm[r.mat].oque.includes(r.oque))porNlm[r.mat].oque.push(r.oque);
        if(r.dia>porNlm[r.mat].last)porNlm[r.mat].last=r.dia;
      });
      Object.entries(porNlm).sort((a,b)=>(b[1].difs.reduce((s,d)=>s+d,0)/(b[1].difs.length||1))-(a[1].difs.reduce((s,d)=>s+d,0)/(a[1].difs.length||1)))
        .forEach(([mat,v])=>{
          const dm=v.difs.length?(v.difs.reduce((s,d)=>s+d,0)/v.difs.length).toFixed(1):'-';
          const lbl=parseFloat(dm)>=4?'🔴':parseFloat(dm)>=3?'🟡':'🟢';
          const h=Math.floor(v.min/60);const m2=v.min%60;
          txt+=`${lbl} ${mat}: ${v.s} sessões · ${h>0?h+'h':''}${m2>0?m2+'min':''} · dif ${dm}★ · último: ${v.last}
`;
          if(v.oque.length)txt+=`   Conteúdo: ${v.oque.slice(0,2).join('; ')}
`;
        });
    }

    // Caderno de Erros
    const cadRegs=lsGet('rev_caderno',[]);
    if(cadRegs.length>0){
      txt+=`
📕 CADERNO DE ERROS — ${cadRegs.length} sessões
───────────────────────────────────────
`;
      const porCad={};
      cadRegs.forEach(r=>{
        if(!r.mat)return;
        if(!porCad[r.mat])porCad[r.mat]={q:0,anki:0,nlm:0,s:0};
        porCad[r.mat].s++;porCad[r.mat].q+=parseInt(r.questoes)||0;
        porCad[r.mat].anki+=parseInt(r.anki)||0;porCad[r.mat].nlm+=parseInt(r.nlm)||0;
      });
      Object.entries(porCad).sort((a,b)=>b[1].q-a[1].q).forEach(([mat,v])=>{
        txt+=`${mat}: ${v.q}Q vistas · ${v.anki} pro Anki · ${v.nlm} pro NLM (${v.s} sessões)
`;
      });
    }

    // Revisão 1h30
    const rev1h30=lsGet('rev_1h30',[]);
    if(rev1h30.length>0){
      txt+=`
🔄 REVISÃO 1H30 — ${rev1h30.length} revisões
───────────────────────────────────────
`;
      rev1h30.slice(-4).reverse().forEach(r=>{
        txt+=`${r.dia} (bloco ${r.blocoRef}):
`;
        (r.slots||[]).filter(s=>s.mat).forEach(s=>{
          const oq=(s.oque||[]).join(', ')||'-';
          txt+=`  • ${s.mat}: ${oq}${s.questoes?' · '+s.questoes+'Q':''}${s.dif?' · dif '+s.dif+'★':''}
`;
        });
      });
    }

    // Tópicos para revisitar
    const topicos=lsGet('rev_topicos',[]);
    const topPend=topicos.filter(t=>!t.feito);
    if(topPend.length>0){
      txt+=`
📌 TÓPICOS PARA REVISITAR — ${topPend.length} pendentes
───────────────────────────────────────
`;
      topPend.forEach(t=>{txt+=`• ${t.txt}
`;});
    }

    txt+=`
═══════════════════════════════════════
Cole este texto no Claude.ai para análise completa.
═══════════════════════════════════════`;

    setExportTxt(txt);
    setExportModal(true);
  };

  const copiarExporte=()=>{
    navigator.clipboard.writeText(exportTxt).then(()=>{
      setExportCopiado(true);
      setTimeout(()=>setExportCopiado(false),2500);
    });

  const ATALHOS=[
    ['⚡ Tempo morto','O que devo ouvir no tempo morto agora? Cruzamento com Guruja e histórico.'],

    ['📊 Semana','Como está minha semana? Vou bater 35h?'],
    ['🔄 Revisão 1h30','É hora da revisão grande? O que priorizo?'],
    ['⚓ Kauê','Dica rápida para apoiar o Kauê hoje.'],
  ];

  return(
    <div style={{display:'flex',flexDirection:'column',height:embed?'min(640px,calc(100dvh - 160px))':'calc(100dvh - 155px)'}}>
      <div style={{background:'linear-gradient(135deg,rgba(30,20,10,.95),rgba(10,7,3,.98))',border:'1px solid rgba(251,191,36,.15)',borderRadius:13,padding:'11px 13px',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
        <div>
          <div style={{fontSize:13,color:'rgba(251,191,36,.5)',letterSpacing:'3px',fontFamily:"'DM Mono',monospace",fontWeight:700}}>{embed?'CONVERSA LIVRE':'ASSESSORA IA · CONSOLIDAR A BASE'}</div>
          <div style={{fontFamily:"'DM Serif Display',serif",color:'#f0e6d0',fontSize:17,marginTop:2}}>{embed?'Pergunte o que quiser':'Perguntas · Plano · Suporte'}</div>
        </div>
        <div style={{display:'flex',gap:6}}>
          <button onClick={gerarExporte} style={{background:'rgba(96,165,250,.15)',border:'1px solid rgba(96,165,250,.35)',borderRadius:9,padding:'8px 11px',fontFamily:"'DM Mono',monospace",fontSize:13,fontWeight:800,color:'#60a5fa',cursor:'pointer'}}>
            📤 Exportar
          </button>
          <button onClick={iniciarDia} style={{background:'linear-gradient(135deg,#c8850a,#fbbf24)',border:'none',borderRadius:9,padding:'8px 13px',fontFamily:"'DM Mono',monospace",fontSize:14,fontWeight:800,color:'#050a14',cursor:'pointer'}}>
            {embed?'📝 Ritual completo':(hist.length>0?'🔄 Novo dia':'☀️ Começar dia')}
          </button>
        </div>
      </div>
      <div style={{overflowX:'auto',scrollbarWidth:'none',marginBottom:8,flexShrink:0}}>
        <div style={{display:'flex',gap:5,width:'max-content',padding:'1px 0'}}>
          {ATALHOS.map(([l,p])=>(
            <button key={l} onClick={()=>enviar(p)} style={{background:'rgba(148,163,184,.25)',border:'1px solid rgba(255,255,255,.08)',borderRadius:18,padding:'6px 11px',whiteSpace:'nowrap',fontSize:14,color:'#b4c0d1',cursor:'pointer',fontFamily:"'DM Mono',monospace"}}>{l}</button>
          ))}
        </div>
      </div>
      {/* Matérias Urgentes */}
      <div style={{marginBottom:8,flexShrink:0}}>
        <button onClick={()=>setMostrarUrg(v=>!v)} style={{width:'100%',padding:'7px 12px',borderRadius:9,border:`1px solid ${urgIA.length>0?'rgba(248,113,113,.4)':'rgba(148,163,184,.2)'}`,background:urgIA.length>0?'rgba(248,113,113,.08)':'rgba(255,255,255,.03)',display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}}>
          <span style={{fontSize:13,fontWeight:700,color:urgIA.length>0?'#f87171':'#aab6c8',fontFamily:"'DM Mono',monospace"}}>🚨 MATÉRIAS URGENTES {urgIA.length>0?`(${urgIA.length})`:''}</span>
          <span style={{fontSize:13,color:'#b4c0d1'}}>{mostrarUrg?'▲':'▼'}</span>
        </button>
        {mostrarUrg&&<div style={{padding:'10px',borderRadius:'0 0 9px 9px',border:'1px solid rgba(248,113,113,.3)',borderTop:'none',background:'rgba(248,113,113,.05)'}}>
          {urgIA.map((u,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 8px',borderRadius:7,background:'rgba(248,113,113,.08)',border:'1px solid rgba(248,113,113,.2)',marginBottom:5}}>
              <div style={{flex:1}}>
                <div style={{fontSize:15,fontWeight:700,color:'#f87171'}}>{u.mat}</div>
                {u.contexto&&<div style={{fontSize:13,color:'#b4c0d1'}}>{u.contexto}</div>}
              </div>
              <button onClick={()=>{const n=urgIA.filter((_,j)=>j!==i);setUrgIA(n);lsSet('urgentes_ia',n);}} style={{padding:'3px 8px',borderRadius:5,border:'1px solid rgba(248,113,113,.3)',background:'transparent',color:'#f87171',fontSize:13,cursor:'pointer'}}>✓ ok</button>
            </div>
          ))}
          <div style={{display:'flex',gap:6,marginTop:6}}>
            <input value={urgForm} onChange={e=>setUrgForm(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&urgForm.trim()){const n=[...urgIA,{mat:urgForm.trim(),dt:Date.now()}];setUrgIA(n);lsSet('urgentes_ia',n);setUrgForm('');setUrgSalvo(true);setTimeout(()=>setUrgSalvo(false),1500);}}} placeholder="ex: Equivalências lógicas, LRF art.15..." style={{flex:1,padding:'7px 10px',borderRadius:7,border:'1px solid rgba(248,113,113,.25)',background:'rgba(248,113,113,.06)',color:'#e0e8f8',fontSize:15,outline:'none'}}/>
            <button onClick={()=>{if(!urgForm.trim())return;const n=[...urgIA,{mat:urgForm.trim(),dt:Date.now()}];setUrgIA(n);lsSet('urgentes_ia',n);setUrgForm('');setUrgSalvo(true);setTimeout(()=>setUrgSalvo(false),1500);}} style={{padding:'7px 12px',borderRadius:7,border:'none',background:'#f87171',color:'#050a14',fontSize:14,fontWeight:800,cursor:'pointer'}}>{urgSalvo?'✅':'+'}</button>
          </div>
          <div style={{fontSize:13,color:'#b4c0d1',marginTop:5,fontStyle:'italic'}}>💡 A IA lembra dessas matérias todo dia no check-in</div>
        </div>}
      </div>
      <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:9,paddingBottom:6}}>
        {hist.length===0&&(
          <div style={{textAlign:'center',padding:'40px 20px'}}>
            <div style={{fontSize:34,marginBottom:10}}>💬</div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:19,color:'#f1f5f9',marginBottom:8}}>Pergunte o que quiser</div>
            <div style={{fontSize:15,color:'#c2ccd8',lineHeight:1.7}}>A mentora já abriu o dia no painel acima.<br/>Aqui você conversa livre — ou toque em um atalho. O <strong style={{color:'#fbbf24'}}>ritual completo</strong> de 5 perguntas continua disponível, só que agora é opcional.</div>
          </div>
        )}
        {hist.map((m,i)=>{

          return(
            <div key={i} style={{display:'flex',justifyContent:user?'flex-end':'flex-start'}}>
              <div style={{background:user?'linear-gradient(135deg,#1a2540,#1e2d50)':'rgba(148,163,184,.2)',border:user?'none':'1px solid rgba(255,255,255,.08)',borderRadius:user?'14px 14px 4px 14px':'14px 14px 14px 4px',padding:'10px 13px',maxWidth:'90%',fontSize:15,lineHeight:1.7,color:user?'#c8d8f8':'#b8c0d0'}}>
                {!user&&<div style={{fontSize:13,color:'rgba(251,191,36,.6)',letterSpacing:'2px',fontFamily:"'DM Mono',monospace",fontWeight:700,marginBottom:5}}>✦ ASSESSORA</div>}
                <span dangerouslySetInnerHTML={{__html:m.content.replace(/\n/g,'<br/>').replace(/\*\*(.*?)\*\*/g,'<strong style="color:#fbbf24">$1</strong>').replace(/─+/g,'<hr style="border:none;border-top:1px solid rgba(255,255,255,.08);margin:6px 0"/>')}}/>
              </div>
            </div>
          );
        })}
        {carregando&&(
          <div style={{display:'flex'}}>
            <div style={{background:'rgba(148,163,184,.28)',border:'1px solid rgba(255,255,255,.08)',borderRadius:'14px 14px 14px 4px',padding:'14px 16px',display:'flex',gap:5,alignItems:'center'}}>
              {[0,1,2].map(i=><div key={i} style={{width:7,height:7,borderRadius:'50%',background:'#fbbf24',animation:'pulse 1.2s ease-in-out infinite',animationDelay:`${i*.2}s`}}/>)}
            </div>
          </div>
        )}
        <div ref={finalRef}/>
      </div>

      {/* Modal de exportação */}
      {exportModal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.88)',zIndex:200,display:'flex',alignItems:'flex-end'}}>
          <div style={{width:'100%',background:'#3a4556',border:'1px solid rgba(96,165,250,.3)',borderRadius:'18px 18px 0 0',padding:'20px 16px',maxHeight:'85dvh',display:'flex',flexDirection:'column'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexShrink:0}}>
              <div>
                <div style={{fontSize:13,color:'#60a5fa',fontFamily:"'DM Mono',monospace",letterSpacing:'2px',marginBottom:2}}>📤 EXPORTAR PARA IA</div>
                <div style={{fontSize:14,color:'#b4c0d1'}}>Copie e cole no Claude.ai para análise completa</div>
              </div>
              <button onClick={()=>setExportModal(false)} style={{padding:'6px 12px',borderRadius:8,border:'1px solid rgba(255,255,255,.1)',background:'transparent',color:'#c2ccd8',fontSize:15,cursor:'pointer'}}>✕</button>
            </div>
            <textarea readOnly value={exportTxt} style={{flex:1,width:'100%',padding:'12px',borderRadius:10,border:'1px solid rgba(96,165,250,.2)',background:'rgba(96,165,250,.04)',color:'#b4c0d1',fontSize:13,fontFamily:"'DM Mono',monospace",lineHeight:1.6,resize:'none',outline:'none',boxSizing:'border-box',overflowY:'auto',marginBottom:12,minHeight:200}}/>
            <div style={{display:'flex',gap:8,flexShrink:0}}>
              <button onClick={copiarExporte} style={{flex:1,padding:'13px',borderRadius:10,border:'none',background:exportCopiado?'#34d399':'#60a5fa',color:'#0f172a',fontSize:15,fontWeight:900,cursor:'pointer',fontFamily:"'DM Mono',monospace"}}>
                {exportCopiado?'✅ COPIADO!':'📋 COPIAR TUDO'}
              </button>
              <button onClick={()=>setExportModal(false)} style={{padding:'13px 18px',borderRadius:10,border:'1px solid rgba(255,255,255,.1)',background:'transparent',color:'#aab6c6',fontSize:15,cursor:'pointer'}}>Fechar</button>
            </div>
          </div>
        </div>
      )}

      <div style={{display:'flex',gap:8,paddingTop:8,borderTop:'1px solid rgba(255,255,255,.06)',flexShrink:0}}>
        <textarea ref={inputRef}
          value={inputVal}
          onChange={e=>setInputVal(e.target.value)}
          placeholder="Responda o que quiser, como quiser..."
          rows={1}
          onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(inputVal.trim()){enviar(inputVal);setInputVal('');}}}}
          onInput={e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,100)+'px';}}
          style={{flex:1,border:'1px solid rgba(255,255,255,.1)',borderRadius:20,padding:'10px 13px',fontFamily:"'DM Sans',sans-serif",fontSize:15,color:'#f1f5f9',background:'rgba(148,163,184,.28)',resize:'none',outline:'none',lineHeight:1.5}}/>
        <button onClick={()=>{if(inputVal.trim()){enviar(inputVal);setInputVal('');}}}
          style={{width:42,height:42,borderRadius:'50%',background:'linear-gradient(135deg,#c8850a,#fbbf24)',border:'none',fontSize:20,cursor:'pointer',flexShrink:0,color:'#050a14',fontWeight:900,alignSelf:'flex-end'}}>↑</button>
      </div>
    </div>
  );
}

// MatBtn — seletor de matéria reutilizável (global para não recriar em cada render)
const MATS_GLOBAL=()=>CICLO.map(s=>s.mat).filter((v,i,a)=>a.indexOf(v)===i);
function MatBtn({value,onChange,placeholder}){
  // Todas as matérias do edital + qualquer extra que esteja no ciclo da semana
  const mats=[...new Set([...EDITAL_MATS,...MATS_GLOBAL()])];
  const isPreset=mats.includes(value);
  return(
    <div>
      <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:5}}>
        {mats.map(m=>(
          <button key={m} onClick={()=>onChange(m)} style={{padding:'4px 8px',borderRadius:6,border:`1px solid ${value===m?'#60a5fa':'rgba(148,163,184,.2)'}`,background:value===m?'rgba(96,165,250,.18)':'transparent',color:value===m?'#60a5fa':'#aab6c8',fontSize:13,cursor:'pointer'}}>{m}</button>
        ))}
      </div>
      <input
        value={isPreset?'':value}
        onChange={e=>onChange(e.target.value)}
        placeholder={placeholder||'Ou digitar matéria...'}
        style={{width:'100%',padding:'7px 10px',borderRadius:7,border:'1px solid rgba(96,165,250,.15)',background:'rgba(96,165,250,.03)',color:'#f1f5f9',fontSize:14,outline:'none',boxSizing:'border-box'}}
      />
    </div>
  );
}

// ── GURUJA: dados por assunto (atualizado mensalmente) ────────

const GURUJA_SEED=Object.fromEntries(MATERIAS.map(m=>[m.app,{importadoEm:null,jornada:0,nivel:'—',ferramenta:'TecConcursos',desempenhoHistorico:{acertos:0,questoes:0,pctAcerto:null,tempoMedio:null,reforcoPendente:''},assuntos:[]}]));   // sem dados antigos: o desempenho vem do guruja.json

// Retorna dados do Guruja: seed + dados importados pelo usuário (usuário vence)
function getGurujaAssuntos(){
  const importados=lsGet('guruja_assuntos',{});
  return{...GURUJA_SEED,...importados};
}

// Score de urgência por assunto: acerto baixo + abaixo da média + relevância alta
function calcScoreAssunto(a){
  const deficitAcerto=(1-a.acerto/100)*3;
  const penalMedia=a.diffMedia<0?Math.abs(a.diffMedia)*0.2:0; // negativo = urgente
  const bonusRel=a.relevancia*0.3;
  return deficitAcerto+penalMedia+bonusRel;
}

// Retorna assuntos críticos de uma matéria (acerto <80% ou diffMedia negativa)
function getAssuntosCriticos(mat,n=5){
  const dados=getGurujaAssuntos();
  const assuntos=dados[mat]?.assuntos||[];
  return assuntos
    .map(a=>({...a,score:calcScoreAssunto(a)}))
    .sort((a,b)=>b.score-a.score)
    .filter(a=>a.acerto<80||a.diffMedia<0)
    .slice(0,n);
}

// Retorna assuntos de manutenção de uma matéria (acerto ≥80% + diffMedia positiva ou neutra)
function getAssuntosManutencao(mat,n=5){
  const dados=getGurujaAssuntos();
  const assuntos=dados[mat]?.assuntos||[];
  return assuntos
    .filter(a=>a.acerto>=80)
    .sort((a,b)=>a.acerto-b.acerto) // menor acerto primeiro entre os bons
    .slice(0,n);
}

// ── MOTOR UNIFICADO: Forma 1 (roteamento por canal) + Forma 4 (penalidade de ausência) ──
// Cada canal tem lógica própria e memória de quando cada matéria apareceu nele.
// Penalidade: quanto mais dias sem aparecer naquele canal, maior o score naquele canal.

function _buildBaseMat(historico){
  // Constrói mapa base por matéria com todos os dados necessários
  const todayMs=new Date().setHours(0,0,0,0);
  const semStart=todayMs-7*86400000;
  const porMat={};
  const allMats=CICLO.map(s=>s.mat).filter((v,i,a)=>a.indexOf(v)===i);
  allMats.forEach(m=>{porMat[m]={q:0,a:0,difs:[],travou:0,lastDt:0,lastAnki:0,lastNlm:0,lastRev1h:0};});
  historico.slice(-60).forEach(r=>{
    if(!r.materia)return;
    if(!porMat[r.materia])porMat[r.materia]={q:0,a:0,difs:[],travou:0,lastDt:0,lastAnki:0,lastNlm:0,lastRev1h:0};
    const v=porMat[r.materia];
    if(parseInt(r.questoes)>0){v.q+=parseInt(r.questoes)||0;v.a+=parseInt(r.acertei)||0;}
    if(r.dificuldade)v.difs.push(r.dificuldade);
    if((r.dt||0)>v.lastDt)v.lastDt=r.dt||0;
    if(r.travou&&(r.dt||0)>=semStart)v.travou++;
  });
  const ankiRegs=lsGet('rev_anki',[]);
  ankiRegs.forEach(r=>{if(r.mat&&porMat[r.mat]&&(r.dt||0)>porMat[r.mat].lastAnki)porMat[r.mat].lastAnki=r.dt||0;});
  const nlmRegs=lsGet('rev_nlm',[]);
  nlmRegs.forEach(r=>{if(r.mat&&porMat[r.mat]&&(r.dt||0)>porMat[r.mat].lastNlm)porMat[r.mat].lastNlm=r.dt||0;});
  const rev1h30=lsGet('rev_1h30',[]);
  rev1h30.forEach(reg=>{(reg.slots||[]).forEach(s=>{if(s.mat&&porMat[s.mat]&&(reg.dt||0)>porMat[s.mat].lastRev1h)porMat[s.mat].lastRev1h=reg.dt||0;});});
  return{porMat,todayMs};
}

function calcMotorCanais(feitos,horas,historico){
  const{porMat,todayMs}=_buildBaseMat(historico);

  const diasSem=(lastDt)=>{
    if(!lastDt)return null; // sem dado — nunca registrado neste canal
    return Math.min(Math.floor((todayMs-lastDt)/86400000),60);
  };
  // Para score: usa 30 dias como padrão quando sem dado (incentiva rotação sem distorcer)
  const diasSemScore=(lastDt)=>diasSem(lastDt)??30;
  const deficit=(v)=>v.q>0?(1-v.a/v.q):0.5; // sem dado = assume 50% déficit
  const difMedia=(v)=>v.difs.length?v.difs.reduce((s,d)=>s+d,0)/v.difs.length:2.5;
  const pesoEdital=(mat)=>{
    const tops=EDITAL[mat]?.top||[];
    return tops.reduce((s,t)=>s+t.p,0)/100; // normalizado 0-1
  };

  // ── CANAL ANKI — Forma 3: baseado exclusivamente no historico_diario ──
  // Slot 1: menor % de acerto, não apareceu no historico nos últimos 7 dias — 35 cards
  // Slot 2: dos 3 últimos registros, o de maior dificuldade declarada — 20 cards
  // Slot 3: matéria há mais tempo sem aparecer no historico (ou nunca) — 20 cards
  // Regra: as 3 devem ser obrigatoriamente diferentes

  const set7dias=todayMs-7*86400000;
  const set3dias=todayMs-3*86400000;
  const todasMats=CICLO.map(s=>s.mat).filter((v,i,a)=>a.indexOf(v)===i);

  // Acumulado por matéria (últimos 60 dias)
  const acumMat={};
  historico.slice(-120).forEach(r=>{
    if(!r.materia)return;
    if(!acumMat[r.materia])acumMat[r.materia]={q:0,a:0,dif:[],lastDt:0,ultRegs:[]};
    const q=parseInt(r.questoes)||0;
    const a=parseInt(r.acertei)||0;
    if(q>0){acumMat[r.materia].q+=q;acumMat[r.materia].a+=a;}
    if(r.dificuldade)acumMat[r.materia].dif.push(r.dificuldade);
    if((r.dt||0)>acumMat[r.materia].lastDt)acumMat[r.materia].lastDt=r.dt||0;
    acumMat[r.materia].ultRegs.push(r);
  });

  // Mapa de última vez que cada matéria apareceu no canal Anki (rev_anki)
  const lastAnkiMat={};
  lsGet('rev_anki',[]).forEach(r=>{
    if(r.mat&&(r.dt||0)>(lastAnkiMat[r.mat]||0))lastAnkiMat[r.mat]=r.dt||0;
  });

  // SLOT 1: pior acerto, priorizando matérias que não foram Anki nos últimos 3 dias
  // Janela: começa em 3d no canal Anki, relaxa para 0 se não encontrar
  let slot1=null;
  for(const janela of[set3dias,0]){
    const candidatas=todasMats
      .map(mat=>{
        const v=acumMat[mat]||{q:0,a:0,lastDt:0};
        const pct=v.q>0?Math.round(v.a/v.q*100):null;
        const fezAnkiRecente=(lastAnkiMat[mat]||0)>=(janela);
        return{mat,pct,lastDt:v.lastDt,fezAnkiRecente};
      })
      .filter(r=>!r.fezAnkiRecente&&r.pct!==null)
      .sort((a,b)=>a.pct-b.pct);
    if(candidatas.length){slot1=candidatas[0];break;}
  }
  // Fallback slot1: matéria com pior acerto sem restrição
  if(!slot1){
    const fb=todasMats
      .map(mat=>{const v=acumMat[mat]||{q:0,a:0};const pct=v.q>0?Math.round(v.a/v.q*100):null;return{mat,pct,lastDt:v.lastDt||0};})
      .filter(r=>r.pct!==null)
      .sort((a,b)=>a.pct-b.pct)[0];
    slot1=fb||{mat:todasMats[0],pct:null,lastDt:0};
  }

  // SLOT 2: matéria com maior dificuldade média E que não foi Anki nos últimos 2 dias, diferente do slot1
  const set2dias=todayMs-2*86400000;
  let slot2=null;
  {
    const cands=todasMats
      .filter(m=>m!==slot1?.mat)
      .map(mat=>{
        const regs=historico.filter(r=>r.materia===mat&&r.dificuldade);
        const difMedia=regs.length?regs.reduce((s,r)=>s+r.dificuldade,0)/regs.length:0;
        const v=acumMat[mat]||{q:0,a:0};
        const pct=v.q>0?Math.round(v.a/v.q*100):50;
        const score=difMedia>0?difMedia:(1-pct/100)*5;
        const fezAnkiRecente=(lastAnkiMat[mat]||0)>=set2dias;
        return{mat,difMedia,score,pct,fezAnkiRecente};
      })
      .sort((a,b)=>{
        // Prefere quem não fez Anki recente; desempate por score
        if(a.fezAnkiRecente!==b.fezAnkiRecente)return a.fezAnkiRecente?1:-1;
        return b.score-a.score;
      });
    slot2=cands[0]||null;
  }
  // Fallback slot2: segunda matéria com pior acerto (diferente do slot1)
  if(!slot2){
    const fb=todasMats
      .filter(m=>m!==slot1?.mat)
      .map(mat=>{const v=acumMat[mat]||{q:0,a:0};const pct=v.q>0?Math.round(v.a/v.q*100):null;return{mat,pct};})
      .filter(r=>r.pct!==null)
      .sort((a,b)=>a.pct-b.pct)[0];
    slot2=fb?{mat:fb.mat,difMedia:0,score:0,pct:fb.pct}:{mat:todasMats.find(m=>m!==slot1?.mat)||todasMats[1],difMedia:0,score:0,pct:null};
  }

  // SLOT 3: há mais tempo sem aparecer no canal Anki (lastAnkiMat), diferente dos anteriores
  const excluir=new Set([slot1?.mat,slot2?.mat].filter(Boolean));
  const slot3cands=todasMats
    .filter(m=>!excluir.has(m))
    .map(mat=>({mat,lastAnki:lastAnkiMat[mat]||0}))
    .sort((a,b)=>a.lastAnki-b.lastAnki); // nunca feito Anki ou mais antigo primeiro
  const slot3=slot3cands[0]||null;

  // Monta motivos
  const s1pct=slot1?.pct!==null?`${slot1.pct}% acerto`:'pior acerto';
  const s2dif=slot2?.difMedia>0?`dif ${slot2.difMedia.toFixed(1)}★`:'maior dificuldade';
  const s3dias=slot3&&lastAnkiMat[slot3.mat]
    ?`${Math.floor((todayMs-lastAnkiMat[slot3.mat])/86400000)}d sem Anki`
    :'nunca fez Anki';

  const rankAnki=[slot1,slot2,slot3].filter(Boolean);
  // Para compatibilidade com código legado que usa rankAnki
  rankAnki.forEach((r,i)=>{if(r&&!r.motivo)r.motivo='';});

  const ankiMaterias=[
    slot1?{mat:slot1.mat,cards:35,motivo:`${s1pct} · pior acerto`}:null,
    slot2?{mat:slot2.mat,cards:20,motivo:`${s2dif} · estudou recentemente`}:null,
    slot3?{mat:slot3.mat,cards:20,motivo:s3dias}:null,
  ].filter(Boolean);
  if(!ankiMaterias.length)ankiMaterias.push({mat:'Qualquer matéria',cards:75,motivo:'meta do dia'});

  // ── CANAL NLM ÁUDIO (tempo morto): score = diasSemNlm × 0.7 + acerto × 0.3 ──
  // Filtro: só matérias/assuntos com acerto ≥80% (manutenção, atenção parcial)
  // Quando há dados Guruja: sugere assunto específico, não só matéria
  const rankNlmBase=Object.entries(porMat).map(([mat,v])=>{
    const pct=v.q>0?Math.round(v.a/v.q*100):null;
    // Usa acerto do Guruja se disponível
    const gurujaData=getGurujaAssuntos();
    const gurujaAcerto=gurujaData[mat]
      ?Math.round(gurujaData[mat].assuntos.reduce((s,a)=>s+a.acerto,0)/gurujaData[mat].assuntos.length)
      :null;
    const acertoFinal=gurujaAcerto||pct;
    const score=diasSemScore(v.lastNlm)*0.7+(acertoFinal!==null?acertoFinal/100*0.3:0.15);
    const assuntosManut=getAssuntosManutencao(mat,3);
    return{mat,score,pct:acertoFinal,diasNlm:diasSem(v.lastNlm),assuntosManut};
  }).sort((a,b)=>b.score-a.score);

  let rankNlm=rankNlmBase.filter(r=>r.pct!==null&&r.pct>=80);
  if(rankNlm.length<2){
    const semDado=rankNlmBase.filter(r=>r.pct===null);
    rankNlm=[...rankNlm,...semDado].slice(0,5);
  }
  if(!rankNlm.length) rankNlm=rankNlmBase.slice(0,3);
  const nlmTop=rankNlm[0]||null;

  // ── CANAL REVISÃO 1h: score = pesoEdital × 2 + diasSemRev × 0.5 + déficit × 1 ──
  // Forma 1: prioriza impacto na nota (peso no edital)
  // Forma 4: penaliza ausência no canal Revisão 1h especificamente
  const rankRev1h=Object.entries(porMat).map(([mat,v])=>{
    const score=pesoEdital(mat)*2 + diasSemScore(v.lastRev1h)*0.5 + deficit(v)*1 + v.travou*0.5;
    return{mat,score,pct:v.q>0?Math.round(v.a/v.q*100):null,diasSemRev:diasSem(v.lastRev1h)};
  }).sort((a,b)=>b.score-a.score);
  const rev1hTop=rankRev1h.slice(0,3);

  // ── Ranking geral para tempo morto / contexto IA ──
  const rankGeral=Object.entries(porMat).map(([mat,v])=>{
    const score=deficit(v)*2+difMedia(v)*1+diasSem(v.lastDt)*0.3+v.travou*1.2+pesoEdital(mat)*0.5;
    return{mat,score,difMedia:difMedia(v),diasSem:diasSem(v.lastDt)};
  }).sort((a,b)=>b.score-a.score);

  const travouRecente=historico.slice(-5).filter(r=>r.travou).map(r=>`${r.materia}: ${r.travou}`);

  return{
    anki:{materias:ankiMaterias,ranking:rankAnki.slice(0,5)},
    nlm:{top:nlmTop,ranking:rankNlm.slice(0,5)},
    rev1h:{top:rev1hTop,ranking:rankRev1h.slice(0,5)},
    geral:rankGeral.slice(0,5),
    travouRecente,
    ts:Date.now(),
  };
}

// Mantém compatibilidade com código legado que usa calcTempoMorto
function calcTempoMorto(feitos,horas,historico){
  const motor=calcMotorCanais(feitos,horas,historico);
  const fallback={mat:'Dir. Financeiro / AFO',difMedia:0,diasSem:0};
  return{
    anki:motor.geral[0]||fallback,
    nlm:motor.nlm.top?{mat:motor.nlm.top.mat,difMedia:0,diasSem:motor.nlm.top.diasNlm}:motor.geral[1]||fallback,
    ranking:motor.geral,
    travouRecente:motor.travouRecente,
    ts:motor.ts,
  };
}


// ── Motor Revisão de Hoje (Modo 2 — esqueleto) ─────────────────
function calcRevisaoHoje(feitos){
  const hoje=getDK();
  const dw=new Date().getDay();
  const trabalha=ehDiaTrabalho(dw);
  const historico=lsGet('historico_diario',[]);
  const caderno=lsGet('rev_caderno',[]);
  const todayMs=new Date().setHours(0,0,0,0);
  const ontemMs=todayMs-86400000;
  const ontemKey=new Date(ontemMs).toISOString().split('T')[0];
  const naoFeitoOntem=lsGet(`nao_fiz_${ontemKey}`,null);
  const ankiMeta=lsGet('anki_meta',{meta:75,backlog:0});
  const metaHoje=ankiMeta.meta||75;
  const ankiHoje=lsGet(`anki_feito_${hoje}`,null);

  // Usa o novo motor de canais
  const motor=calcMotorCanais(feitos,lsGet('horas',[]),historico);

  // TEC — usa rev_caderno unificado — Forma 1: por dificuldade, sem datas
  const tecHoje=caderno.filter(t=>!t.dominado&&(t.dificuldade||3)>=4);
  const tecProximo=caderno.filter(t=>!t.dominado&&(t.dificuldade||3)===3);
  const tecCronico=caderno.filter(t=>!t.dominado&&(t.tentativas||1)>=3);

  const nlmFeito=lsGet(`nlm_feito_${hoje}`,false);
  const blocoAtual=feitos?feitos.length:0;
  const janelaMeio=blocoAtual>=12&&blocoAtual<=14;
  const janelaFinal=blocoAtual>=20&&blocoAtual<=22;
  const janelaAtiva=janelaMeio||janelaFinal;

  // Alertas
  const alertas=[];
  if(tecCronico.length>0)alertas.push({tipo:'cronico',msg:`${tecCronico[0].mat} errado ${tecCronico[0].tentativas}x — considere NLM`});
  if((ankiMeta.backlog||0)>150)alertas.push({tipo:'backlog',msg:`Backlog Anki: ${ankiMeta.backlog} — não adicionar novos por 2 dias`});
  if(janelaAtiva)alertas.push({tipo:'janela',msg:`Bloco ${blocoAtual}/25 — janela NLM ativa`});

  return{
    anki:{meta:metaHoje,materias:motor.anki.materias,feito:ankiHoje,backlog:ankiMeta.backlog||0},
    tec:{hoje:tecHoje,proximo:tecProximo,cronico:tecCronico},
    nlm:{
      candidato:motor.nlm.top?{mat:motor.nlm.top.mat,pct:motor.nlm.top.pct,diasNlm:motor.nlm.top.diasNlm,travou:0,emJanela:janelaAtiva,score:motor.nlm.top.score}:null,
      todos:motor.nlm.ranking.slice(0,3).map(r=>({mat:r.mat,pct:r.pct,diasNlm:r.diasNlm,score:r.score,emJanela:janelaAtiva})),
      janelaAtiva,feito:nlmFeito,blocoAtual
    },
    rev1h:motor.rev1h,
    alertas,trabalha,hojeKey:hoje,naoFeitoOntem,
    motor, // expõe o motor completo para uso na UI
  };
}

// ── URGÊNCIA DO CADERNO — Modo 5 ─────────────────────────────
// score = (tentativas × 3) + (diasAtraso × 2) + (pesoEdital/10) + bônus de fase
// nivel: urgente(≥15) | atencao(≥7) | normal(<7)
// reincidente: ≥3 tentativas = tópico travado
function calcUrgencia(item){
  const todayStr=new Date().toISOString().split('T')[0];
  const tentativas=item.tentativas||1;
  const diasAtraso=item.prazo?Math.max(0,Math.round((new Date(todayStr)-new Date(item.prazo))/86400000)):0;
  const pesoEdital=(()=>{const tops=EDITAL[item.mat]?.top||[];return tops.reduce((s,t)=>s+t.p,0);})();
  const bonusFase=(item.fase||1)===1?4:(item.fase||1)===2?1:0; // D+3 mais urgente
  const score=(tentativas*3)+(diasAtraso*2)+(pesoEdital/10)+bonusFase;
  const nivel=score>=15?'urgente':score>=7?'atencao':'normal';
  return{score:Math.round(score),nivel,reincidente:tentativas>=3,diasAtraso};
}

function TabHoje({feitos,onAddHoras,onSetTab,onRapido,rapidoVer}){

  const[despacho,setDespacho]=useState(()=>lsGet(`despacho_ia_${hoje}`,null));
  const[despachoLoad,setDespachoLoad]=useState(false);
  const[naoFiz,setNaoFiz]=useState(()=>lsGet(`nao_fiz_${hoje}`,{}));
  const[naoFizModal,setNaoFizModal]=useState(null); // 'anki'|'tec'|'nlm'
  const[naoFizMotivo,setNaoFizMotivo]=useState('');
  const[ankiCards,setAnkiCards]=useState({});
  const[ankiExpandMats,setAnkiExpandMats]=useState(false);
  const[ankiFeitosMat,setAnkiFeitosMat]=useState(()=>lsGet(`anki_mats_${hoje}`,{}));
  const[nlmFilaIdx,setNlmFilaIdx]=useState(0);

  // ── Motor: calcula tudo ───────────────────────────────────────
  const rev=useMemo(()=>calcRevisaoHoje(feitos),[feitos,hoje]);

  // ── Alerta de Oxidação: matérias ≥85% sem aparecer há 15+ dias ──
  const alertaOxidacao=useMemo(()=>{
    const hist=lsGet('historico_diario',[]);
    const todayMs=new Date().setHours(0,0,0,0);
    const porMat={};
    hist.forEach(r=>{
      if(!r.materia||!parseInt(r.questoes))return;
      if(!porMat[r.materia])porMat[r.materia]={q:0,a:0,lastDt:0};
      porMat[r.materia].q+=parseInt(r.questoes)||0;
      porMat[r.materia].a+=parseInt(r.acertei)||0;
      if((r.dt||0)>porMat[r.materia].lastDt)porMat[r.materia].lastDt=r.dt||0;
    });
    return Object.entries(porMat)
      .filter(([,v])=>{
        const pct=v.q>0?Math.round(v.a/v.q*100):0;
        const diasSem=Math.floor((todayMs-(v.lastDt||0))/86400000);
        return pct>=85&&diasSem>=15;
      })
      .map(([mat,v])=>{
        const pct=Math.round(v.a/v.q*100);
        const diasSem=Math.floor((todayMs-(v.lastDt||0))/86400000);
        return{mat,pct,diasSem};
      })
      .sort((a,b)=>b.diasSem-a.diasSem);
  },[hoje]);

  // ── Motor ANKI — Forma 3: baseado exclusivamente no historico_diario ──
  const ankiMaterias=useMemo(()=>{
    const hist=lsGet('historico_diario',[]);
    const todayMs=new Date().setHours(0,0,0,0);
    const set7dias=todayMs-7*86400000;
    const set3dias=todayMs-3*86400000;
    const todasMats=CICLO.map(s=>s.mat).filter((v,i,a)=>a.indexOf(v)===i);

    // Acumulado por matéria
    const acum={};
    hist.slice(-120).forEach(r=>{
      if(!r.materia)return;
      if(!acum[r.materia])acum[r.materia]={q:0,a:0,dif:[],lastDt:0};
      const q=parseInt(r.questoes)||0;const a=parseInt(r.acertei)||0;
      if(q>0){acum[r.materia].q+=q;acum[r.materia].a+=a;}
      if(r.dificuldade)acum[r.materia].dif.push(r.dificuldade);
      if((r.dt||0)>acum[r.materia].lastDt)acum[r.materia].lastDt=r.dt||0;
    });

    // Mapa de última vez no canal Anki
    const lastAnkiMat2={};
    lsGet('rev_anki',[]).forEach(r=>{if(r.mat&&(r.dt||0)>(lastAnkiMat2[r.mat]||0))lastAnkiMat2[r.mat]=r.dt||0;});
    const set2d=todayMs-2*86400000;

    // SLOT 1: pior acerto, priorizando quem não fez Anki nos últimos 3 dias
    let s1=null;
    for(const janela of[set3dias,0]){
      const cands=todasMats
        .map(mat=>{const v=acum[mat]||{q:0,a:0,lastDt:0};const pct=v.q>0?Math.round(v.a/v.q*100):null;return{mat,pct,lastDt:v.lastDt,fezAnkiRecente:(lastAnkiMat2[mat]||0)>=janela};})
        .filter(r=>r.pct!==null&&!r.fezAnkiRecente)
        .sort((a,b)=>a.pct-b.pct);
      if(cands.length){s1=cands[0];break;}
    }
    if(!s1){
      const fb=todasMats.map(mat=>{const v=acum[mat]||{q:0,a:0};const pct=v.q>0?Math.round(v.a/v.q*100):null;return{mat,pct,lastDt:v.lastDt||0};}).filter(r=>r.pct!==null).sort((a,b)=>a.pct-b.pct)[0];
      s1=fb||{mat:todasMats[0],pct:null,lastDt:0};
    }

    // SLOT 2: maior dificuldade média, priorizando quem não fez Anki nos últimos 2 dias, diferente do slot1
    let s2=null;
    {
      const cands=todasMats.filter(m=>m!==s1?.mat).map(mat=>{
        const regs=hist.filter(r=>r.materia===mat&&r.dificuldade);
        const difMedia=regs.length?regs.reduce((s,r)=>s+r.dificuldade,0)/regs.length:0;
        const v=acum[mat]||{q:0,a:0};
        const pct=v.q>0?Math.round(v.a/v.q*100):50;
        return{mat,difMedia,score:difMedia>0?difMedia:(1-pct/100)*5,pct,fezAnkiRecente:(lastAnkiMat2[mat]||0)>=set2d};
      }).sort((a,b)=>{if(a.fezAnkiRecente!==b.fezAnkiRecente)return a.fezAnkiRecente?1:-1;return b.score-a.score;});
      s2=cands[0]||null;
    }
    if(!s2){
      const fb=todasMats.filter(m=>m!==s1?.mat).map(mat=>{const v=acum[mat]||{q:0,a:0};const pct=v.q>0?Math.round(v.a/v.q*100):null;return{mat,pct};}).filter(r=>r.pct!==null).sort((a,b)=>a.pct-b.pct)[0];
      s2=fb?{mat:fb.mat,difMedia:0,pct:fb.pct}:{mat:todasMats.find(m=>m!==s1?.mat)||todasMats[1],difMedia:0,pct:null};
    }

    // SLOT 3: mais tempo sem aparecer no canal Anki, diferente dos anteriores
    const excluir=new Set([s1?.mat,s2?.mat].filter(Boolean));
    const s3=todasMats.filter(m=>!excluir.has(m)).map(mat=>({mat,lastAnki:lastAnkiMat2[mat]||0})).sort((a,b)=>a.lastAnki-b.lastAnki)[0]||null;

    const s1pct=s1?.pct!==null&&s1?.pct!=null?`${s1.pct}% acerto`:'pior acerto';
    const s2dif=s2?.difMedia>0?`dif ${s2.difMedia.toFixed(1)}★`:'maior dificuldade';
    const s3d=s3&&lastAnkiMat2[s3.mat]?`${Math.floor((todayMs-lastAnkiMat2[s3.mat])/86400000)}d sem Anki`:'nunca fez Anki';

    return[
      s1?{mat:s1.mat,cards:35,motivo:`${s1pct} · pior acerto`}:null,
      s2?{mat:s2.mat,cards:20,motivo:`${s2dif} · estudou recentemente`}:null,
      s3?{mat:s3.mat,cards:20,motivo:s3d}:null,
    ].filter(Boolean);
  },[feitos,hoje]);

  // ── Motor TEC: usa rev_caderno unificado ──────────────────────
  const tecHoje=useMemo(()=>{
    const caderno=lsGet('rev_caderno',[]);
    // Forma 1: sem datas — d3=difíceis(4-5⭐), d15=médio(3⭐), d30=leve(1-2⭐)
    const ativos=caderno.filter(t=>!t.dominado);
    const d3=ativos.filter(t=>(t.dificuldade||3)>=4);
    const d15=ativos.filter(t=>(t.dificuldade||3)===3);
    const d30=ativos.filter(t=>(t.dificuldade||3)<=2);
    return{d3,d15,d30,total:ativos.length};
  },[hoje]);

  // ── Motor NLM: ≥80% acerto, mais dias sem aparecer ─────────
  const nlmSugerido=useMemo(()=>{
    const hist=lsGet('historico_diario',[]);
    const motor=calcMotorCanais(feitos,lsGet('horas',[]),hist);
    const blocoAtual=feitos?.length||0;
    const emJanela=(blocoAtual>=12&&blocoAtual<=14)||(blocoAtual>=20&&blocoAtual<=22);
    const top=motor.nlm.top;
    if(!top)return null;
    // Fila completa para botão "Trocar"
    const fila=motor.nlm.ranking.slice(0,5);
    return{mat:top.mat,pct:top.pct,diasNlm:top.diasNlm,travou:0,emJanela,score:top.score,fila};
  },[feitos,hoje]);

  // ── Ações ─────────────────────────────────────────────────────
  const marcarAnkiMat=(mat)=>{
    const novos={...ankiFeitosMat,[mat]:{feito:true,cards:parseInt(ankiCards[mat])||0,dt:Date.now()}};
    setAnkiFeitosMat(novos);
    lsSet(`anki_mats_${hoje}`,novos);
    // Se todas as matérias foram feitas, marca o Anki geral
    if(ankiMaterias.every(m=>novos[m.mat]?.feito)){
      const totalCards=Object.values(novos).reduce((s,v)=>s+(v.cards||0),0)||75;
      const registro={feito:true,cards:totalCards,porMat:Object.fromEntries(Object.entries(novos).map(([k,v])=>[k,v.cards])),mats:ankiMaterias,dt:Date.now()};
      lsSet(`anki_feito_${hoje}`,registro);
      setAnkiFeito(registro);
      if(onAddHoras)onAddHoras({mat:'Anki',min:30,dt:Date.now()});
    }
  };

  const marcarAnki=()=>{
    const total=Object.values(ankiCards).reduce((s,v)=>s+(parseInt(v)||0),0)||75;
    const registro={feito:true,cards:total,porMat:ankiCards,mats:ankiMaterias,dt:Date.now()};
    lsSet(`anki_feito_${hoje}`,registro);
    setAnkiFeito(registro);
    if(onAddHoras)onAddHoras({mat:'Anki',min:30,dt:Date.now()});
  };

  const marcarNaoFiz=()=>{
    const novo={...naoFiz,[naoFizModal]:{motivo:naoFizMotivo,dt:Date.now()}};
    lsSet(`nao_fiz_${hoje}`,novo);
    setNaoFiz(novo);
    setNaoFizModal(null);setNaoFizMotivo('');
  };

  const salvarTec=()=>{
    if(!tecForm.mat)return;
    const pct=tecForm.feitas&&tecForm.acertei?Math.round(parseInt(tecForm.acertei)/parseInt(tecForm.feitas)*100):null;
    const dif=tecForm.dificuldade||3;
    const novo={id:Date.now(),mat:tecForm.mat,assunto:tecForm.assunto,feitas:parseInt(tecForm.feitas)||0,acertei:parseInt(tecForm.acertei)||0,pct,dificuldade:dif,tentativas:1,dominado:false,dia:hoje,obs:tecForm.obs,origem:'hoje',historico:[{data:hoje,questoes:parseInt(tecForm.feitas)||0,acertos:parseInt(tecForm.acertei)||0,dificuldade:dif}]};
    const caderno=[...lsGet('rev_caderno',[]),novo];
    lsSet('rev_caderno',caderno);
    setTecForm({mat:'',assunto:'',feitas:'',acertei:'',dificuldade:3,obs:''});
    setTecSalvo(true);setTimeout(()=>{setTecSalvo(false);setTecModal(false);},1500);
  };

  // ── NOVA LÓGICA TEC — Forma 1: só dificuldade, sem datas ──
  // Registra uma sessão de revisão: quantas questões, quantos acertos, dificuldade sentida
  const registrarRevisaoTec=(id,novasQuestoes,novosAcertos,difSentida)=>{
    const caderno=lsGet('rev_caderno',[]).map(t=>{
      if(t.id!==id)return t;
      const totalFeitas=(t.feitas||0)+novasQuestoes;
      const totalAcertos=(t.acertei||0)+novosAcertos;
      const entrada={data:getDK(),questoes:novasQuestoes,acertos:novosAcertos,dificuldade:difSentida};
      return{
        ...t,
        feitas:totalFeitas,
        acertei:totalAcertos,
        pct:totalFeitas>0?Math.round(totalAcertos/totalFeitas*100):null,
        dificuldade:difSentida, // sempre atualiza para a percepção mais recente
        tentativas:(t.tentativas||0)+1,
        historico:[...(t.historico||[]),entrada],
      };
    });
    lsSet('rev_caderno',caderno);
  };
  // Marca item como dominado — sai da lista ativa
  const marcarDominado=(id)=>{
    const caderno=lsGet('rev_caderno',[]).map(t=>{
      if(t.id!==id)return t;
      const entrada={data:getDK(),acao:'dominado'};
      return{...t,dominado:true,historico:[...(t.historico||[]),entrada]};
    });
    lsSet('rev_caderno',caderno);
  };
  // Mantido por compatibilidade com chamadas antigas — redireciona para a nova lógica
  const marcarTecItem=(id,acertou)=>{
    registrarRevisaoTec(id,1,acertou?1:0,3);
  };

  const gerarDespacho=async()=>{
    if(despachoLoad)return;
    const k=getAK();if(!k?.startsWith('sk-ant'))return;
    setDespachoLoad(true);
    try{
      const ontem=lsGet(`nao_fiz_${(()=>{const d=new Date();d.setDate(d.getDate()-1);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;})()}`,{});
      const cobrar=Object.entries(ontem).map(([m,v])=>`${m}: "${v.motivo||'sem motivo'}"`).join(', ');
      const ctx=`Hoje: ${NOMES_DW[dw]}, ${trabalha?'dia de trabalho':'dia livre'}, bloco ${feitos?.length||0}/25.
Anki: ${ankiMaterias.map(m=>`${m.mat}(${m.cards}cards)`).join(', ')}.
TEC hoje: ${tecHoje.d3.length} itens vencendo, ${tecHoje.d15.length} próximos.
NLM urgente: ${nlmSugerido?.mat||'-'} (${nlmSugerido?.pct||'?'}%, ${nlmSugerido?.diasNlm||0}d sem NLM).
${cobrar?`Não fez ontem: ${cobrar}.`:''}`;
      const res=await chamarClaude(`Você é assessora de estudos da Ritchely no planejamento Consolidar a base do Guruja (pré-edital, FCC, sem data de prova). Todas as matérias têm o mesmo peso: priorize a de maior déficit de acerto. TEC=caderno sem datas, só dificuldade. ANKI=75 cards/dia em 3 matérias. Rev.1h30=Obsidian+TEC+Anki. Responda em 3 linhas diretas. ${cobrar?'Cobre o que não foi feito ontem.':''}` ,
        [{role:'user',content:ctx}],120);
      lsSet(`despacho_ia_${hoje}`,res);setDespacho(res);
    }catch(e){console.log(e);}
    setDespachoLoad(false);
  };

  useEffect(()=>{if(!despacho&&getAK()?.startsWith('sk-ant'))gerarDespacho();},[]);

  // ── Helpers visuais ───────────────────────────────────────────
  const pctLive=tecForm.feitas&&tecForm.acertei?Math.round(parseInt(tecForm.acertei)/parseInt(tecForm.feitas)*100):null;
  const pctCor=pctLive===null?'var(--text4)':pctLive>=85?'#34d399':pctLive>=70?'#fbbf24':'#f87171';
  const totalAnkiInput=Object.values(ankiCards).reduce((s,v)=>s+(parseInt(v)||0),0);

  const CardHeader=({emoji,titulo,resumo,key_:k,cor,feito,nfz})=>(
    <button onClick={()=>toggle(k)} style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'11px 14px',background:'transparent',border:'none',cursor:'pointer',textAlign:'left'}}>
      <span style={{fontSize:20}}>{emoji}</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:15,fontWeight:700,color:feito?'#34d399':nfz?'var(--text4)':'var(--text)',textDecoration:nfz?'line-through':'none'}}>{titulo}</div>
        <div style={{fontSize:14,color:'var(--text4)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{resumo}</div>
      </div>
      {feito&&<span style={{fontSize:14,color:'#34d399',fontWeight:700,flexShrink:0}}>✅</span>}
      {nfz&&!feito&&<span style={{fontSize:14,color:'var(--text4)',flexShrink:0}}>❌</span>}
      {!feito&&!nfz&&<span style={{fontSize:14,color:'var(--text4)',flexShrink:0}}>{abertos[k]?'▲':'▼'}</span>}
    </button>
  );

  const BtnNaoFiz=({tipo})=>(
    <button onClick={()=>{setNaoFizModal(tipo);setNaoFizMotivo('');}} style={{padding:'7px 12px',borderRadius:8,border:'1px solid rgba(248,113,113,.3)',background:'transparent',color:'#f87171',fontSize:14,cursor:'pointer'}}>
      ❌ Não fiz
    </button>
  );

  // ── Sub-aba estado ────────────────────────────────────────────
  const[subAba,setSubAba]=useState('hoje');
  // ── Hoje sem pensar: feitos locais ───────────────────────────
  const[hspFeito,setHspFeito]=useState(()=>lsGet(`hsp_${hoje}`,{b1:false,b2:false,min:false,planob:false}));
  const marcarHsp=k=>{const n={...hspFeito,[k]:true};setHspFeito(n);lsSet(`hsp_${hoje}`,n);};
  const hspTodos=Object.values(hspFeito).every(Boolean);
  // ── Críticos revisados hoje (Modo 3) ─────────────────────────
  const[criticosRevisadosHoje,setCriticosRevisadosHoje]=useState(()=>lsGet(`criticos_rev_${hoje}`,[]))
  const marcarCriticoRevisado=(id)=>{
    const hist=lsGet('historico_diario',[]);
    const item=lsGet('criticos_manuais',[]).find(c=>c.id===id);
    if(item){
      const reg={id:hoje+'_crit_'+id,materia:item.mat,assunto:'Revisão Crítica Manual',questoes:'',acertei:'',dificuldade:item.prioridade==='alta'?4:item.prioridade==='media'?3:2,tempo:'',obs:item.motivo||'',dt:Date.now()};
      lsSet('historico_diario',[...hist,reg]);
    }
    const novos=[...criticosRevisadosHoje,id];
    setCriticosRevisadosHoje(novos);lsSet(`criticos_rev_${hoje}`,novos);
  };

  // ── Calcular blocos do "Hoje sem pensar" ─────────────────────
  const hspPlan=useMemo(()=>{
    const feitosSet=new Set(feitos);
    const pendentes=CICLO.filter(s=>!feitosSet.has(s.id));
    // Prioridade 1: crítico manual de alta prioridade
    const criticosManuais=lsGet('criticos_manuais',[]);
    const criticoAlta=criticosManuais.filter(c=>c.prioridade==='alta').sort((a,b)=>a.dt-b.dt)[0]||null;
    let b1=null;
    let b1IsCritico=false;
    if(criticoAlta){
      b1={_critico:true,id:'crit_'+criticoAlta.id,mat:criticoAlta.mat,ic:'🎯',cor:'#f87171',tag:'🔴 CRÍTICO MANUAL',h:1.5,tipo:'Revisão',conteudo:criticoAlta.motivo||'Revisar este tópico hoje',_criticoId:criticoAlta.id};
      b1IsCritico=true;
    }
    // Prioridade 2: bloco do CICLO com tag URGENTE (vem da Matriz Meirelles)
    if(!b1){
      const urgente=pendentes.find(s=>s.tag?.includes('URGENTE'));
      const critico=pendentes.find(s=>s.tag?.includes('CRÍTICO'));
      const atrasada=pendentes.find(s=>s.tag?.includes('ATRASADA'));
      b1=urgente||critico||atrasada||pendentes[0]||null;
    }
    // B2: TEC vencendo ou próximo bloco de prioridade alta
    const tecVencendo=tecHoje.d3.length>0;
    let b2;
    if(b1IsCritico){
      const proxCiclo=pendentes.find(s=>s.tag?.includes('URGENTE')||s.tag?.includes('CRÍTICO'));
      b2=tecVencendo
        ?{label:`TEC — ${tecHoje.d3.length} revisão(ões) vencendo`,mat:'TEC',h:0.5,ic:'🔴',motivo:'não pode atrasar — afeta fixação'}
        :(proxCiclo||pendentes[0]||null);
    } else {
      b2=tecVencendo
        ?{label:`TEC — ${tecHoje.d3.length} revisão(ões) vencendo`,mat:'TEC',h:0.5,ic:'🔴',motivo:'não pode atrasar — afeta fixação'}
        :(pendentes.find(s=>s.id!==(b1?.id)&&(s.tag?.includes('ALTA')||s.tag?.includes('URGENTE')))||pendentes.find(s=>s.id!==(b1?.id))||null);
    }
    const mat1=ankiMaterias[0]?.mat||'matéria prioritária';
    // Badge Meirelles para o B1
    const meirellesB1=b1?.mat?getPrioridadeMeirelles(b1.mat):null;
    return{b1,b2,mat1,b1IsCritico,meirellesB1};
  },[feitos,tecHoje,ankiMaterias]);

  return(
    <div style={{maxWidth:680,margin:'0 auto'}}>

      <FaixaGuruja/>

      {/* HEADER — compacto */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div>
          <div style={{fontSize:20,fontWeight:900,color:'var(--text)',fontFamily:"'DM Serif Display',serif"}}>{NOMES_DW[dw]}</div>
          <div style={{fontSize:14,color:'var(--text4)'}}>{totalH}h disponíveis · bloco {feitos?.length||0}/{N}{trabalha?' · 💼 trabalho':''}</div>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          {/* Saúde colapsada — chip */}
          {(()=>{
            const s=calcSaude();
            return(
              <div style={{padding:'5px 10px',borderRadius:8,background:`${s.cor}12`,border:`1px solid ${s.cor}30`,fontSize:13,color:s.cor,fontWeight:700}}>
                {s.emoji} {s.score}/10
              </div>
            );
          })()}
          <button onClick={gerarDespacho} disabled={despachoLoad} style={{padding:'7px 12px',borderRadius:9,border:'1px solid rgba(251,191,36,.3)',background:'rgba(251,191,36,.08)',color:'#fbbf24',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:"'DM Mono',monospace"}}>
            {despachoLoad?'⏳':'🤖'}
          </button>
        </div>
      </div>

      {/* ── PRIORIDADE — revisões que EU escrevi na aba Revisão › Profunda ── */}
      {(()=>{
        const pend=revManual.filter(x=>!x.feito);
        if(pend.length===0)return null;
        const marcar=id=>{const n=revManual.map(x=>x.id===id?{...x,feito:true,feitoEm:Date.now()}:x);lsSet('rev_manual',n);setRevManual(n);};
        return(
          <div style={{padding:'12px 14px',borderRadius:13,background:'rgba(248,113,113,.08)',border:'2px solid rgba(248,113,113,.45)',marginBottom:12}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <div style={{fontSize:13,color:'#f87171',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px'}}>🔴 PRIORIDADE — REVISAR ({pend.length})</div>

                        <div style={{textAlign:'right',flexShrink:0}}>

                            style={{width:60,padding:'4px 6px',borderRadius:6,border:'1px solid rgba(167,139,250,.3)',background:'rgba(167,139,250,.05)',color:'#a78bfa',fontSize:15,fontWeight:700,textAlign:'center',outline:'none',fontFamily:"'DM Mono',monospace",marginTop:3}}/>}

                      {/* Foco por assunto do Guruja */}

                            {criticos.map((a,j)=>(
                              <div key={j} style={{display:'flex',alignItems:'center',gap:6,marginBottom:j<criticos.length-1?3:0}}>
                                <span style={{fontSize:13,color:'var(--text)',flex:1,lineHeight:1.3}}>{a.titulo.length>40?a.titulo.slice(0,38)+'…':a.titulo}</span>
                                <span style={{fontSize:13,color:a.acerto<70?'#f87171':'#fbbf24',fontFamily:"'DM Mono',monospace",fontWeight:700,flexShrink:0}}>{a.acerto}%</span>
                                {a.diffMedia<0&&<span style={{fontSize:13,color:'#f87171',flexShrink:0}}>⬇️{Math.abs(a.diffMedia).toFixed(1)}%</span>}
