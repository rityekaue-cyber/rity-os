<script type="text/babel">
const{useState,useEffect,useRef,useMemo,useCallback}=React;

// ─── CONSTANTES ───────────────────────────────────────────────
// ═══ PLANEJAMENTO ATIVO NO GURUJA ═════════════════════════════════════════════════════════════════
// Desde 12/11/2026 o app acompanha o planejamento "Consolidar a base" (pré-edital, banca FCC, sem data de prova).
// Tudo que é plano (metas, atividades, reforços) vem do guruja.json, montado a cada abertura; nada é escrito à mão.
// Para trocar de planejamento de novo: mude PLANEJAMENTO.id (o app ignora snapshots de outro planejamento).
const PLANEJAMENTO={id:105325,nome:'Consolidar a base',fase:'pré-edital',banca:'FCC',desde:new Date(2026,10,11).setHours(0,0,0,0)};
// Matérias = disciplinas do planejamento no Guruja (sigla = prefixo do código da atividade). `app` é o nome usado em todo o app e no histórico.
const MATERIAS=[
  {sigla:'DADM', app:'Dir. Administrativo',              curta:'Adm',         ic:'🏛️', disc:'Direito Administrativo'},
  {sigla:'DCON', app:'Dir. Constitucional',              curta:'Const',       ic:'📜', disc:'Direito Constitucional'},
  {sigla:'DCIV', app:'Dir. Civil',                       curta:'Civil',       ic:'📘', disc:'Direito Civil'},
  {sigla:'DEMP', app:'Direito Empresarial (Comercial)',  curta:'Empresarial', ic:'🏢', disc:'Direito Empresarial (Comercial)'},
  {sigla:'DPEN', app:'Dir. Penal',                       curta:'Penal',       ic:'⚖️', disc:'Direito Penal'},
  {sigla:'DTRIB',app:'Dir. Tributário',                  curta:'Tribut.',     ic:'🧾', disc:'Direito Tributário'},
  {sigla:'LTE',  app:'Legislação Tributária Estadual',   curta:'LTE',         ic:'📑', disc:'Legislação Tributária Estadual'},
  {sigla:'CTBGA',app:'Contabilidade Geral e Avançada',   curta:'Contab.',     ic:'🧮', disc:'Contabilidade Geral e Avançada'},
  {sigla:'AUD',  app:'Auditoria Privada',                curta:'Auditoria',   ic:'🔍', disc:'Auditoria Privada'},
  {sigla:'PORT', app:'Português',                        curta:'Port',        ic:'📝', disc:'Português'},
  {sigla:'RLOG', app:'Raciocínio Lógico',                curta:'RL',          ic:'🧩', disc:'Raciocínio Lógico'},
  {sigla:'TINFO',app:'Tecnologia da Informação',         curta:'TI',          ic:'📊', disc:'Tecnologia da Informação'},
];
const GURUJA_SIGLA_APP=Object.fromEntries(MATERIAS.map(m=>[m.sigla,m.app]));
const GURUJA_SIGLA_CURTA=Object.fromEntries(MATERIAS.map(m=>[m.sigla,m.curta]));
const MAT_INFO=Object.fromEntries(MATERIAS.map(m=>[m.app,{ic:m.ic}]));
const MAT_TI='Tecnologia da Informação';
const REGRA_TI_MAX_NOVAS_SEMANA=99;   // regra antiga (2 metas novas de TI por semana) aposentada com o planejamento SEFAZ-SC
const ehTINova=i=>i.mat===MAT_TI&&!/teste|favoritas|revis/i.test(i.conteudo||'');

// ── Leitura do guruja.json logo na abertura (síncrona de propósito: o plano é montado a partir dele) ──
// Se o arquivo não vier (sem rede), usa a última cópia guardada no aparelho. Snapshot de OUTRO planejamento é ignorado.
const SNAP_BOOT=(()=>{
  const ok=x=>!!(x&&x.versao===1&&x.gerado_em&&!isNaN(Date.parse(x.gerado_em))&&Array.isArray(x.metas)&&x.meta_atual&&x.planejamento_id===PLANEJAMENTO.id);
  let cache=null;try{cache=JSON.parse(localStorage.getItem('guruja_snap')||'null');}catch(e){}
  if(!ok(cache))cache=null;
  let novo=null;
  try{const rq=new XMLHttpRequest();rq.open('GET','guruja.json?t='+Date.now(),false);rq.send();
    if(rq.status===200||(rq.status===0&&rq.responseText)){const j=JSON.parse(rq.responseText);if(ok(j))novo=j;}}catch(e){}
  const s=(novo&&(!cache||Date.parse(novo.gerado_em)>=Date.parse(cache.gerado_em)))?novo:cache;
  if(s&&s===novo){try{localStorage.setItem('guruja_snap',JSON.stringify(s));}catch(e){}}
  return s;
})();
// Meta em andamento do planejamento ativo (null = ainda não há Meta 1 lida: o app mostra "aguardando").
const PLANO_GURUJA=(()=>{
  const s=SNAP_BOOT;if(!s)return null;
  const ma=s.meta_atual||{};const cur=(s.metas||[]).find(m=>m.ordem===ma.ordem);
  if(!cur||!Array.isArray(cur.atividades)||!cur.atividades.length)return null;
  return{s,ma,cur};
})();
const PLANO_VAZIO_MSG=`Aguardando a Meta 1 do planejamento ${PLANEJAMENTO.nome}`;
const _hoje0=new Date().setHours(0,0,0,0);
// Dia 1 do ciclo = dia em que a meta começou. Se a meta já passou de 7 dias, a janela recomeça hoje.
const CICLO_INI_MS=(()=>{
  let ini=_hoje0;
  if(PLANO_GURUJA){const t=Date.parse(PLANO_GURUJA.ma.data_inicio||PLANO_GURUJA.cur.data_inicio);if(!isNaN(t))ini=new Date(t).setHours(0,0,0,0);}
  if(_hoje0-ini>=6*86400000)ini=_hoje0;
  return ini;
})();
const NIVEL_INI_MS=PLANEJAMENTO.desde; // registros de questões contam desde o início do planejamento novo
const fmtMinG=m=>m<=0?'0min':m>=60?`${Math.floor(m/60)}h${m%60?String(m%60).padStart(2,'0'):''}`:`${m}min`;
const faixaMin=m=>m>=90?{cor:'#f87171',tag:'🔴 PESADA'}:m>=60?{cor:'#fbbf24',tag:'🟡 MÉDIA'}:{cor:'#34d399',tag:'🟢 LEVE'};
const CAP_DIA_PADRAO=270, TOL_DIA=15;
const PRIO_PESO={'Indispensável':3,'Desejável':2,'Dispensável':1};
const PRIO_LETRA={'Indispensável':'I','Desejável':'D','Dispensável':'X'};
// O Guruja só informa o tempo depois que a atividade é concluída; antes disso o app estima pelo tipo.
const EST_MIN={'Questões':60,'Teste':45,'Teoria':45,'Lei Seca':30,'Revisão':30,'Mapeamento':30};
const estimarMin=a=>{if(a.min>0)return a.min;const b=EST_MIN[a.tipo]||45;return(a.tipo==='Questões'&&(a.rel||0)>=4)?90:b;};
const IDREF_BASE=600; // reforço nº n da meta atual → id 600+n (atividades usam o próprio activity_id do Guruja, sempre > 1000)
const siglaDe=a=>String(a.codigo||'').split('.')[0];
const matDe=a=>GURUJA_SIGLA_APP[siglaDe(a)]||a.disciplina||'Outras';
const icDe=mat=>(MAT_INFO[mat]||{}).ic||'📚';

// Monta atividades e reforços da meta atual (o que está ignorado no Guruja vai para "fora do ciclo").
const REFORCOS_GURUJA=[];   // {n,mat,t,est,cod,aid,id,feito}
const _planoAtiv=[],_planoDisp=[];
(function montarPlano(){
  if(!PLANO_GURUJA)return;
  const {ma,cur}=PLANO_GURUJA;const ordem=cur.ordem;
  const itens=[];
  (cur.atividades||[]).forEach((a,idx)=>{
    const mat=matDe(a);const min=estimarMin(a);const rel=a.rel||1;
    itens.push({id:a.aid,mat,tipo:a.tipo||'Questões',conteudo:a.titulo||'(sem título)',min,est:rel,prio:a.prio,ign:!!a.ignorada,
      origem:`Meta ${ordem} · nº ${idx+1}`,gl:`Meta ${ordem} · nº ${idx+1}`,glLongo:`Meta ${ordem} · atividade nº ${idx+1}`,seq:idx,cod:a.codigo});
  });
  (cur.reforcos||[]).forEach((r,idx)=>{
    const n=idx+1;const mat=GURUJA_SIGLA_APP[siglaDeReforco(r)]||r.disciplina||'Outras';
    REFORCOS_GURUJA.push({n,mat,t:r.titulo||'',est:(r.tipo_reforco==='Hard'?5:r.tipo_reforco==='Medium'?4:3),cod:'',aid:r.aid,id:IDREF_BASE+n,feito:!!r.concluido});
    itens.push({id:IDREF_BASE+n,mat,tipo:'Reforço',conteudo:`Reforço — ${r.titulo||''}`,min:30,est:(r.tipo_reforco==='Hard'?5:4),prio:null,ign:!!r.ignorado,
      origem:`Reforço · R#${n}`,gl:`Reforço nº ${n}`,glLongo:`Reforços do Guruja · nº ${n}`,seq:1000+idx,cod:''});
  });
  // Ordem do plano: reforços e Indispensáveis primeiro, depois maior relevância; dentro disso, a ordem do Guruja.
  const pesoOrd=i=>i.tipo==='Reforço'?4:(PRIO_PESO[i.prio]||2);
  const ativos=itens.filter(i=>!i.ign).sort((a,b)=>pesoOrd(b)-pesoOrd(a)||(b.est-a.est)||(a.seq-b.seq));
  // dia planejado: empacota em ordem, dia a dia, na capacidade (domingo = 0)
  const capD=d=>{const dt=new Date(CICLO_INI_MS);dt.setDate(dt.getDate()+d-1);return dt.getDay()===0?0:CAP_DIA_PADRAO;};
  let d=1,usado=0;
  const diaDe=new Map();
  ativos.forEach(i=>{
    let cap=capD(d);
    while(d<7&&(cap===0||(usado>0&&usado+i.min>cap+TOL_DIA))){d++;usado=0;cap=capD(d);}
    diaDe.set(i.id,d);usado+=i.min;
  });
  // corte (se apertar): menor prioridade e relevância cortam primeiro; Indispensável e reforço nunca cortam
  const cortaveis=ativos.filter(i=>i.tipo!=='Reforço'&&i.prio!=='Indispensável').sort((a,b)=>(PRIO_PESO[a.prio]||2)-(PRIO_PESO[b.prio]||2)||a.est-b.est||b.seq-a.seq);
  const corteDe=new Map();cortaveis.forEach((i,k)=>corteDe.set(i.id,k+1));
  const montar=(i,extra)=>{
    const f=faixaMin(i.min);
    const por=i.tipo==='Reforço'?'🔁 Reforço do Guruja: 30 min, questões do tema + o que errar vira Anki.':`Prioridade no Guruja: ${i.prio||'—'} · relevância ★${i.est}${i.cod?` · ${i.cod}`:''}`;
    const base={id:i.id,mat:i.mat,ic:icDe(i.mat),cor:f.cor,tag:f.tag,min:i.min,h:i.min/60,tipo:i.tipo,ferramenta:'Guruja',est:i.est,conteudo:i.conteudo,origem:i.origem,por,gl:i.gl,glLongo:i.glLongo,prio:i.prio};
    return{...base,...extra(i,por)};
  };
  ativos.forEach((i,idx)=>{
    _planoAtiv.push(montar(i,(x,por)=>{
      const corte=corteDe.get(x.id)||99;
      return{diaPlano:diaDe.get(x.id)||1,corte,ord:idx,dica:`📍 Guruja: ${x.glLongo}\n⏱ ${fmtMinG(x.min)} · ${x.tipo}\n${por}\n${corte<99?`✂️ Se apertar, esta é a nº ${corte} a cortar.`:'🔒 Não corta: Indispensável ou reforço.'}`};
    }));
  });
  itens.filter(i=>i.ign).sort((a,b)=>(PRIO_PESO[b.prio]||2)-(PRIO_PESO[a.prio]||2)||b.est-a.est||a.seq-b.seq).forEach((i,k)=>{
    _planoDisp.push(montar(i,(x,por)=>({diaPlano:7,corte:0,motivo:'Ignorada no Guruja: reabilite no portal antes de fazer.',alternativa:'Reabilite no portal do Guruja se quiser fazer.',ordem:k+1,por:'Ignorada no Guruja',dica:`📍 Guruja: ${x.glLongo}\n↩ Fila "se sobrar tempo": está ignorada no portal.`})));
  });
})();
function siglaDeReforco(r){
  const m=MATERIAS.find(x=>x.disc===r.disciplina);return m?m.sigla:'';
}

// Marca no app o que já está concluído no Guruja (só marca, nunca desmarca) e registra reforços concluídos no histórico.
// Usada na abertura (snapshot lido agora) e quando o app volta ao foco e lê um guruja.json novo. Devolve true se mudou algo.
function reconciliarSnap(s){
  try{
    const ma=s.meta_atual||{};const cur=(s.metas||[]).find(m=>m.ordem===ma.ordem);
    if(!cur||!Array.isArray(cur.atividades))return false;
    const lj=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}};
    const feitos=lj('feitos',[]),fd=lj('feitos_dt',{}),hist=lj('historico_diario',[]);
    const snapTs=Date.parse(s.gerado_em);const dia=new Date(snapTs).setHours(0,0,0,0);
    let mudou=false,histMudou=false;
    cur.atividades.forEach(a=>{
      if(!a.concluida||!IDS_CICLO_VALIDOS.has(a.aid))return;
      if(!feitos.includes(a.aid)){feitos.push(a.aid);mudou=true;}
      if(!fd[a.aid]){fd[a.aid]=dia;mudou=true;}
    });
    (cur.reforcos||[]).forEach((rf,idx)=>{
      if(!rf.concluido)return;
      const n=idx+1,id=IDREF_BASE+n;
      if(!IDS_CICLO_VALIDOS.has(id))return;
      if(!feitos.includes(id)){feitos.push(id);mudou=true;}
      if(!fd[id]){fd[id]=dia;mudou=true;}
      if(!hist.some(h=>h&&h.reforcoN===n&&h.metaOrdem===cur.ordem&&!h.parcial)){
        const d=new Date(dia),p2=x=>String(x).padStart(2,'0'),dk=`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
        const mat=GURUJA_SIGLA_APP[siglaDeReforco(rf)]||rf.disciplina||'Outras';
        hist.push({id:`${dk}_guruja_m${cur.ordem}_ref${n}`,materia:mat,assunto:`Reforço nº ${n} — ${rf.titulo||''}`,tempo:String(rf.min||30),questoes:String(rf.q||0),acertei:String(rf.a||0),dificuldade:0,obs:'Lido do Guruja · já contado na base do snapshot',pendente:'',dia:dk,dt:Math.min(dia+12*3600000,snapTs-60000),origem:'guruja',itemId:id,reforcoN:n,metaOrdem:cur.ordem,parcial:false});
        histMudou=true;mudou=true;
      }
    });
    if(mudou){localStorage.setItem('feitos',JSON.stringify(feitos));localStorage.setItem('feitos_dt',JSON.stringify(fd));
      if(histMudou)localStorage.setItem('historico_diario',JSON.stringify(hist.sort((a,b)=>(a.dt||0)-(b.dt||0))));}
    return mudou;
  }catch(e){return false;}
}

// Distribui as atividades pelos dias (1..7 = seg..dom, a partir de CICLO_INI_MS), em MINUTOS.
// Concluídas ficam no dia em que foram feitas. As pendentes mantêm a ordem do plano e são empacotadas nos dias
// que restam (capacidade do dia, com tolerância de 15 min). Se não couber tudo, as de menor `corte` viram "estouro".
function distribuirCiclo(base,feitos,feitosDt,diasTrab,hojeMs,capFn,fixosHoje){
  const done=new Set(feitos);
  const diaHoje=Math.min(7,Math.max(1,Math.round((hojeMs-CICLO_INI_MS)/86400000)+1));
  const cap=capFn||(()=>CAP_DIA_PADRAO);
  const dia=new Map();const estouro=new Set();
  let minHoje=0;
  base.forEach(i=>{
    if(!done.has(i.id))return;
    const t=feitosDt&&feitosDt[i.id];
    let d=t?Math.round((t-CICLO_INI_MS)/86400000)+1:diaHoje;
    d=Math.min(7,Math.max(1,d));
    dia.set(i.id,d);
    if(d===diaHoje)minHoje+=i.min;
  });
  let pend=base.filter(i=>!done.has(i.id));
  // fixosHoje (aba IA): atividades que a Ritchely confirmou para hoje; o resto das pendentes desliza para os dias seguintes
  const fx=new Set(Array.isArray(fixosHoje)?fixosHoje:[]);
  const usaFx=fx.size>0&&pend.some(i=>fx.has(i.id));
  if(usaFx){pend.filter(i=>fx.has(i.id)).forEach(i=>dia.set(i.id,diaHoje));pend=pend.filter(i=>!fx.has(i.id));}
  const dias=[];for(let d=(usaFx&&diaHoje<7?diaHoje+1:diaHoje);d<=7;d++)dias.push(d);
  const caps=dias.map(d=>Math.max(0,cap(d)-(d===diaHoje?minHoje:0)));
  const totCap=caps.reduce((s,v)=>s+v,0);
  let totPend=pend.reduce((s,i)=>s+i.min,0);
  if(totPend>totCap){
    const cand=pend.filter(i=>i.corte<99).sort((a,b)=>a.corte-b.corte||b.ord-a.ord);
    for(const i of cand){if(totPend<=totCap)break;estouro.add(i.id);totPend-=i.min;}
  }
  let k=0,used=0;
  pend.filter(i=>!estouro.has(i.id)).forEach(i=>{
    while(k<dias.length-1&&used+i.min>caps[k]+TOL_DIA){k++;used=0;}
    dia.set(i.id,dias[k]);used+=i.min;
  });
  pend.filter(i=>estouro.has(i.id)).forEach(i=>dia.set(i.id,dias[dias.length-1]));
  return base.map(i=>({...i,dia:dia.get(i.id)||diaHoje,estouro:estouro.has(i.id)}))
    .sort((a,b)=>a.dia-b.dia||(a.estouro?1:0)-(b.estouro?1:0)||a.ord-b.ord);
}

const CICLO_VOLTA=(()=>{try{const v=JSON.parse(localStorage.getItem('ciclo_volta')||'[]');return Array.isArray(v)?v.filter(id=>CICLO_DISP.some(d=>d.id===id)):[];}catch(e){return [];}})();

// Dentro de cada dia do plano, TI e reforço vêm primeiro: são o que não se negocia quando o dia aperta.
// (Com o dia cheio isto não muda nada: só a ordem em que as atividades de um mesmo dia entram na conta.)
function ordemPinada(b){
  const pin=i=>i.tipo==='Reforço'||i.mat===MAT_TI;
  const gk=i=>i.diaPlano+(i.corte===0?'v':'');
  const out=[];let i=0;
  while(i<b.length){let j=i;while(j<b.length&&gk(b[j])===gk(b[i]))j++;const g=b.slice(i,j);out.push(...g.filter(pin),...g.filter(x=>!pin(x)));i=j;}
  return out;
}

// Retorna o estado atual da fila (posição + histórico de revisões)
// Fonte dinâmica: calcProfunda80() agrupado por matéria — só as 12 matérias reais do
// edital TCE-SP entram aqui (EDITAL_MATS nunca incluiu as hibernação/suspensas).
function getFilaRevProfunda(){
  const hist=lsGet('rev_profunda_hist',[]);
  const abaixo80=calcProfunda80();
  const porMat={};
  abaixo80.forEach(it=>{
    if(!porMat[it.mat])porMat[it.mat]={itens:[],maxScore:0,temCritico:false};
    porMat[it.mat].maxScore=Math.max(porMat[it.mat].maxScore,it.score);
    if(it.critico)porMat[it.mat].temCritico=true;
    porMat[it.mat].itens.push(it);
  });
  const CORES_MAT=['#f472b6','#a78bfa','#fb923c','#fbbf24','#94a3b8','#60a5fa','#f87171','#34d399'];
  let base=Object.entries(porMat).map(([mat,v],i)=>({
    mat,ic:v.temCritico?'🚨':'📉',cor:v.temCritico?'#f87171':CORES_MAT[i%CORES_MAT.length],
    motivo:v.itens.sort((a,b)=>b.score-a.score).slice(0,2).map(it=>`${it.titulo} ${it.acerto}%`).join(' · '),
    jornada:null,ferramenta:'TecConcursos',maxScore:v.maxScore,
  })).sort((a,b)=>b.maxScore-a.maxScore);
  if(base.length===0){
    // nada com dado real abaixo de 80% no momento — fallback neutro com as matérias reais do edital
    base=EDITAL_MATS.filter(m=>m!=='Discursivas').map((mat,i)=>({mat,ic:'📚',cor:CORES_MAT[i%CORES_MAT.length],motivo:'Manutenção — sem ponto crítico registrado agora',jornada:null,ferramenta:'TecConcursos',maxScore:0}));
  }
  const posicoes=base.map((m,i)=>{
    const ultRev=hist.filter(h=>h.mat===m.mat).sort((a,b)=>b.cicloRef-a.cicloRef)[0]||null;
    return{...m,posOriginal:i,ultRevCiclo:ultRev?.cicloRef||0,ultRevData:ultRev?.data||null,totalRevisoes:hist.filter(h=>h.mat===m.mat).length};
  });
  // Ordena: quem foi revisada há mais ciclos fica na frente; empate desfeito por urgência
  posicoes.sort((a,b)=>a.ultRevCiclo-b.ultRevCiclo||b.maxScore-a.maxScore);
  return posicoes;
}

// Verifica se é hora de fazer revisão profunda (a cada 7 ciclos do Foco)
function deveRevisaoProfunda(totalBlocosFoco){
  const hist=lsGet('rev_profunda_hist',[]);
  const ultimaRev=hist.length>0?hist.sort((a,b)=>b.cicloRef-a.cicloRef)[0]:null;
  const ultimoCicloRev=ultimaRev?.cicloRef||0;
  return totalBlocosFoco>0&&(totalBlocosFoco-ultimoCicloRev)>=7;
}

// ── Tags dinâmicas — calculadas em runtime com base no historico real ──
function calcTagDinamica(mat){
  const hist=lsGet('historico_diario',[]);
  const difBase=lsGet('dif_base_materias',{});
  const regs=hist.filter(r=>r.materia===mat&&parseInt(r.questoes)>0);
  if(!regs.length){
    // Sem questões: usa dif base se definida
    const dif=difBase[mat]||0;
    if(dif>=4)return'🔴 CRÍTICO (base)';
    if(dif>=3)return'🟡 ATENÇÃO (base)';
    if(dif>0)return'🟢 OK (base)';
    return'⬜ NÃO INICIADO';
  }
  const tq=regs.reduce((s,r)=>s+(parseInt(r.questoes)||0),0);
  const ta=regs.reduce((s,r)=>s+(parseInt(r.acertei)||0),0);
  const pct=tq>0?Math.round(ta/tq*100):0;
  const lastDt=Math.max(...regs.map(r=>r.dt||0));
  const diasSem=Math.floor((Date.now()-lastDt)/86400000);
  if(pct>=LIMIAR_DOMINIO){
    if(diasSem>15)return'🟡 OXIDANDO ('+pct+'%)';
    return'🟢 SÓLIDO ('+pct+'%)';
  }
  if(pct>=LIMIAR_ATENCAO)return'🟡 ATENÇÃO ('+pct+'%)';
  return'🔴 CRÍTICO ('+pct+'%)';
}

// ─── CLOUD DB (localStorage + Supabase sync) ─────────────────
const SUPA_URL_LS='__supa_url__';
const SUPA_KEY_LS='__supa_key__';
let _sc=null; // supabase client
let _syncCBs=[];
let _syncSt='idle';

// ── Sincronismo: comparação canônica (o jsonb do Postgres não preserva a ordem das chaves) + base da última sincronização ──
const canon=v=>{if(Array.isArray(v))return '['+v.map(canon).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';return JSON.stringify(v);};
const canonRaw=raw=>{try{return canon(JSON.parse(raw));}catch(e){return String(raw);}};
const hsh=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h+':'+s.length;};
const SYNC_KEYS=['feitos','feitos_dt','fora_feitos','ciclo_volta','cicloNum','horas','horas_dia','dias_trabalho','historico_diario','rev_anki','rev_nlm','rev_caderno','rev_1h30','rev_topicos','anki_meta','dif_base_materias','criticos_manuais','edital_status','guruja_data','plano_semanal','urgentes_ia','ia_hist','theme_mode','ciclo_versao','ciclo_extras','rev_profunda_hist','decisao_cfg','mit','semana_cfg','ia_ajustes','ia_combinados','ia_briefing','ia_fechamentos','ia_dia','alvo_nota'];
const SYNC_VOLATEIS=new Set(['ultimo_acesso']);   // por aparelho: nunca sincroniza
const SYNC_LAYOUT=new Set(['feitos','feitos_dt','ciclo_volta','horas_dia','dias_trabalho']);
const _mkClient=()=>{const{url,key}=Sync.getCfg();return window.supabase.createClient(url,key);};
const _setBase=(k,c)=>{try{localStorage.setItem('__base_'+k,hsh(c));}catch(e){}};

const Sync={
  onStatus(fn){_syncCBs.push(fn);},
  _emit(s){_syncSt=s;_syncCBs.forEach(fn=>fn(s));},
  _changed:[],
  isOk(){return _sc!==null;},
  isConfigured(){return !!(localStorage.getItem(SUPA_URL_LS)&&localStorage.getItem(SUPA_KEY_LS));},
  getCfg(){return{url:localStorage.getItem(SUPA_URL_LS)||'',key:localStorage.getItem(SUPA_KEY_LS)||''};},
  saveCfg(url,key){localStorage.setItem(SUPA_URL_LS,url.trim());localStorage.setItem(SUPA_KEY_LS,key.trim());},
  async init(){
    if(!this.isConfigured())return false;
    if(typeof window.supabase==='undefined'){this._emit('offline');return false;}
    try{
      _sc=_mkClient();
      this._emit('syncing');
      const{data,error}=await _sc.from('rity_os').select('key,value,updated_at');
      if(error)throw error;
      const cloudMap={};
      (data||[]).forEach(r=>{cloudMap[r.key]=r;});
      // Versão do plano: se ESTE aparelho já migrou (ex.: v46) e a nuvem ainda está numa versão antiga, a nuvem não pode
      // sobrescrever a migração. Nesse caso este aparelho manda o estado novo para a nuvem.
      const vn=x=>{const m=String(x==null?'':x).match(/v(\d+)/);return m?+m[1]:0;};
      const cloudVer=cloudMap['ciclo_versao']?vn(cloudMap['ciclo_versao'].value):0;
      const localVer=vn(localStorage.getItem('ciclo_versao'));
      const PROT=new Set(localVer>cloudVer?['ciclo_versao','feitos','feitos_dt','cicloNum','ciclo_volta','horas_dia']:[]);
      this._layoutChanged=false;this._changed=[];
      const setL=(k,v)=>{
        const cur=localStorage.getItem(k);
        if(cur!==null&&canonRaw(cur)===canon(v))return;      // mesmo conteúdo (só a ordem das chaves muda): não mexe
        localStorage.setItem(k,JSON.stringify(v));this._changed.push(k);
        if(SYNC_LAYOUT.has(k))this._layoutChanged=true;
      };
      // Mescla por chave, em 3 vias: compara com a base da última sincronização deste aparelho.
      //  · só a nuvem mudou → traz · só este aparelho mudou → sobe · os dois mudaram → vale o mais recente
      const aEnviar=[];
      (data||[]).forEach(r=>{
        if(PROT.has(r.key)||SYNC_VOLATEIS.has(r.key))return;
        try{
          const cl=canon(r.value);
          const localRaw=localStorage.getItem(r.key);
          if(localRaw===null){setL(r.key,r.value);_setBase(r.key,cl);return;}
          const lo=canonRaw(localRaw);
          if(lo===cl){_setBase(r.key,cl);return;}
          const b=localStorage.getItem('__base_'+r.key);
          const cloudTs=r.updated_at?new Date(r.updated_at).getTime():0;
          const localTs=parseInt(localStorage.getItem('__ts_'+r.key)||'0');
          let usaNuvem;
          if(b===null)usaNuvem=true;               // este aparelho nunca sincronizou essa chave: a nuvem vence (como sempre foi)
          else if(hsh(lo)===b)usaNuvem=true;       // aqui não mudou desde a última sincronização
          else if(hsh(cl)===b)usaNuvem=false;      // só aqui mudou (ex.: edição offline): sobe
          else usaNuvem=cloudTs>=localTs;          // mudou nos dois lados: vale o mais recente
          if(usaNuvem){setL(r.key,r.value);_setBase(r.key,cl);}else aEnviar.push(r.key);
        }catch(e){}
      });
      for(const k of PROT){
        try{
          const raw=localStorage.getItem(k);
          const val=raw!==null?JSON.parse(raw):(k==='horas_dia'?{}:k==='ciclo_volta'?[]:undefined);
          if(val!==undefined){await _sc.from('rity_os').upsert({key:k,value:val,updated_at:new Date().toISOString()},{onConflict:'key'});_setBase(k,canon(val));}
        }catch(e){}
      }
      // Empurra o que a nuvem não tem e o que só este aparelho mudou
      const cloudKeys=new Set((data||[]).map(r=>r.key));
      for(const k of [...SYNC_KEYS.filter(k=>!cloudKeys.has(k)),...aEnviar]){
        const v=localStorage.getItem(k);
        if(v!==null){try{const val=JSON.parse(v);await _sc.from('rity_os').upsert({key:k,value:val,updated_at:new Date().toISOString()},{onConflict:'key'});_setBase(k,canon(val));}catch(e){}}
      }
      this._emit('ok');
      return true;
    }catch(e){console.warn('Sync:',e.message);_sc=null;this._emit('error');return false;}
  },
  push(k,v){
    if(!_sc||SYNC_VOLATEIS.has(k))return;
    _sc.from('rity_os').upsert({key:k,value:v,updated_at:new Date().toISOString()},{onConflict:'key'})
      .then(({error})=>{if(!error){_setBase(k,canon(v));this._emit('ok');}else this._emit('error');})
      .catch(()=>this._emit('error'));
    this._emit('syncing');
  },
  // ── Diagnóstico e ferramentas manuais (aba ⚙️ → ☁️ Nuvem) ──
  async compare(){
    if(typeof window.supabase==='undefined')throw new Error('biblioteca do Supabase não carregou (sem internet?)');
    const cli=_sc||_mkClient();
    const{data,error}=await cli.from('rity_os').select('key,value,updated_at');
    if(error)throw error;
    const cm={};(data||[]).forEach(r=>{cm[r.key]=r;});
    const keys=[...new Set([...Object.keys(cm),...SYNC_KEYS.filter(k=>localStorage.getItem(k)!==null)])].filter(k=>!SYNC_VOLATEIS.has(k)).sort();
    return keys.map(k=>{
      const lr=localStorage.getItem(k);const c=cm[k];
      const st=lr===null?'só na nuvem':!c?'só aqui':(canonRaw(lr)===canon(c.value)?'igual':'diferente');
      return{key:k,st,tam:lr?lr.length:0,tamNuvem:c?JSON.stringify(c.value).length:0,em:c&&c.updated_at};
    });
  },
  async forcarEnvio(){
    const cli=_sc||_mkClient();let n=0;
    const{data}=await cli.from('rity_os').select('key');
    const ks=new Set([...SYNC_KEYS,...(data||[]).map(r=>r.key)]);
    for(const k of ks){
      if(SYNC_VOLATEIS.has(k))continue;const v=localStorage.getItem(k);if(v===null)continue;
      try{const val=JSON.parse(v);const{error}=await cli.from('rity_os').upsert({key:k,value:val,updated_at:new Date().toISOString()},{onConflict:'key'});if(!error){_setBase(k,canon(val));n++;}}catch(e){}
    }
    return n;
  },
  async forcarTrazer(){
    const cli=_sc||_mkClient();
    const{data,error}=await cli.from('rity_os').select('key,value');
    if(error)throw error;let n=0;
    (data||[]).forEach(r=>{if(SYNC_VOLATEIS.has(r.key))return;try{localStorage.setItem(r.key,JSON.stringify(r.value));_setBase(r.key,canon(r.value));n++;}catch(e){}});
    return n;
  }
};

const lsGet=(k,def=null)=>{try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):def;}catch{return def;}};
const lsSet=(k,v)=>{
  try{localStorage.setItem(k,JSON.stringify(v));localStorage.setItem('__ts_'+k,String(Date.now()));}catch{}
  Sync.push(k,v); // sync em background, não bloqueia
};

const ANTHR_KEY_LS='__anthr_key__';
const getAK=()=>localStorage.getItem(ANTHR_KEY_LS)||'';
const setAK=v=>localStorage.setItem(ANTHR_KEY_LS,v.trim());

async function chamarClaude(systemPrompt,msgs,maxTokens=800){
  const k=getAK();
  if(!k)throw new Error('Chave da IA não configurada. Vá em ⚙️ → IA para configurar.');
  const headers={'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  if(k.startsWith('sk-ant'))headers['x-api-key']=k;
  else headers['Authorization']=`Bearer ${k}`;
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers,
    body:JSON.stringify({model:'claude-sonnet-5',max_tokens:maxTokens,system:systemPrompt,messages:msgs})
  });
  if(!res.ok){const err=await res.text();throw new Error(`API ${res.status}: ${err.slice(0,200)}`);}
  const data=await res.json();
  if(data.error)throw new Error(data.error.message||'Erro da API');
  return data.content?.filter(b=>b.type==='text').map(b=>b.text).join('\n')||'';
}

// ─── POMODORO ────────────────────────────────────────────────
function beep(tipo){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const notas=tipo==='pausa'?[[660,0,.2],[660,.25,.2]]:[[880,0,.15],[1108,.18,.15],[1320,.36,.25]];
    notas.forEach(([f,d,dur])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.frequency.value=f;
      g.gain.setValueAtTime(0,ctx.currentTime+d);
      g.gain.linearRampToValueAtTime(.3,ctx.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+dur);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+dur+.05);
    });
  }catch(e){}
}

// Fases do pomodoro conforme o tempo da atividade: ≤30 min = 1 bloco só; senão estuda (min−5), pausa de 5 e estuda o resto.
// 60 → 30·5·25 · 90 → 45·5·40 · 45 → 20·5·20
function fasesPomo(min){
  if(!min||min<=0)min=60;
  if(min<=30)return[{l:'FOCO',d:min*60,e:'📖',m:min}];
  const est=min-5;const a=Math.round(est*0.55/5)*5;const b=est-a;
  return[{l:'1ª METADE',d:a*60,e:'📖',m:a},{l:'PAUSA',d:5*60,e:'🚶',m:5},{l:'2ª METADE',d:b*60,e:'✏️',m:b}];
}
function Pomodoro({cor,onFase,min}){
  const c=cor||'#fbbf24';
  const FASES=useMemo(()=>fasesPomo(min),[min]);
  const[fase,setFase]=useState(0);
  const[secs,setSecs]=useState(FASES[0].d);
  const[rodando,setRodando]=useState(false);
  const[feito,setFeito]=useState(false);
  const endRef=useRef(null);
  const timerRef=useRef(null);
  const disparouRef=useRef(false);
  const cur=FASES[fase];

  const limparTimer=()=>{clearInterval(timerRef.current);timerRef.current=null;};

  useEffect(()=>{
    if(!rodando){limparTimer();return;}
    disparouRef.current=false;
    timerRef.current=setInterval(()=>{
      const r=Math.max(0,Math.round((endRef.current-Date.now())/1000));
      setSecs(r);
      if(r===0&&!disparouRef.current){
        disparouRef.current=true;
        limparTimer();
        setRodando(false);
        setFeito(true);
        beep(cur.l==='PAUSA'?'pausa':'done');
        if(cur.l!=='PAUSA'&&onFase)onFase(cur.m);
      }
    },400);
    return limparTimer;
  },[rodando,fase]);

  const iniciar=()=>{endRef.current=Date.now()+secs*1000;setRodando(true);setFeito(false);disparouRef.current=false;};
  const pausar=()=>{limparTimer();setSecs(Math.max(0,Math.round((endRef.current-Date.now())/1000)));endRef.current=null;setRodando(false);};
  const proxFase=()=>{limparTimer();const n=(fase+1)%FASES.length;setFase(n);setSecs(FASES[n].d);setRodando(false);setFeito(false);disparouRef.current=false;};
  const irFase=i=>{limparTimer();setFase(i);setSecs(FASES[i].d);setRodando(false);setFeito(false);};
  const reiniciar=()=>{limparTimer();setSecs(cur.d);setRodando(false);setFeito(false);};

  const mm=Math.floor(secs/60);const ss_=secs%60;
  const pct=Math.max(0,Math.min(1,1-secs/cur.d));
  const r=40;const circ=2*Math.PI*r;
  return(
    <div style={{padding:'13px',borderRadius:13,background:`${c}08`,border:`1px solid ${c}22`,marginBottom:12}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,flexWrap:'wrap',gap:4}}>
        <span style={{fontSize:13,letterSpacing:'2px',color:c,fontFamily:"'DM Mono',monospace",fontWeight:800}}>⏱ POMODORO {FASES.length===1?`${FASES[0].m}min`:FASES.map(f=>f.m).join('·')} ({fmtMinG(min||60)})</span>
        <div style={{display:'flex',gap:4}}>
          {FASES.map((f,i)=>(
            <button key={i} onClick={()=>irFase(i)} style={{padding:'2px 7px',borderRadius:4,cursor:'pointer',fontSize:13,fontFamily:"'DM Mono',monospace",fontWeight:700,background:fase===i?`${c}22`:'transparent',color:fase===i?c:'#aab6c8',border:`1px solid ${fase===i?c+'44':'rgba(148,163,184,.25)'}`,transition:'all .15s'}}>
              {f.e} {f.l}
            </button>
          ))}
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:16}}>
        <div style={{position:'relative',width:88,height:88,flexShrink:0}}>
          <svg width="88" height="88" style={{transform:'rotate(-90deg)'}}>
            <circle cx="44" cy="44" r={r} fill="none" stroke="rgba(255,255,255,.06)" strokeWidth="5"/>
            <circle cx="44" cy="44" r={r} fill="none" stroke={feito?'#34d399':c} strokeWidth="5"
              strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round"
              style={{transition:'stroke-dashoffset .4s linear'}}/>
          </svg>
          <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>

const FORM_REC={};   // 'parada há tempo' sem dado: 0,5; passa a ser medida com os registros do app

const FORM_PRIO={I:1,D:.6,X:.2};

function formulaDisc(disc){
  const peso=FORM_PESO[disc]!=null?FORM_PESO[disc]:5.7;
  const cfg=getDecisaoCfg();
  let nivel;
  if(cfg.nivel&&cfg.nivel[disc]!=null&&!isNaN(cfg.nivel[disc]))nivel=+cfg.nivel[disc];
  else if(FORM_NIVEL_FIXO[disc]!=null)nivel=FORM_NIVEL_FIXO[disc];
  else nivel=nivelRealMat(FORM_APP[disc]||disc).pct;
  let rec=FORM_REC[disc]!=null?FORM_REC[disc]:.5;
  const app=FORM_APP[disc]||disc;
  // se você registrou estudo dessa matéria depois da leitura de 07/11, a "parada há tempo" passa a ser medida de verdade (10 dias parada = 1)
  const ult=lsGet('historico_diario',[]).filter(r=>r.materia===app&&r.dt&&r.dt>=GURUJA_REF_MS&&r.origem!=='guruja_simulado').reduce((m,r)=>Math.max(m,r.dt),0);
  if(ult)rec=Math.min(1,(Date.now()-ult)/86400000/10);
  return{peso,nivel,rec,W:Math.min(1,peso*(1-nivel/100)/2.5),R:rec*Math.min(1,peso/5.7)};
}
function notaFormula(id){
  const g=GURUJA_ITEM[id];if(!g)return null;
  const d=formulaDisc(g[0]);const P=FORM_PRIO[g[1]];const Rl=g[2]/5;
  return{id,disc:g[0],p:g[1],est:g[2],...d,P,Rl,nota:.4*d.W+.4*P+.1*d.R+.1*Rl};
}

// Núcleo puro (testável): recebe linhas já com nível/estrelas e devolve ranking com veredito e porquê.
function calcDecisaoCore(rows){
  const out=rows.map(r=>{
    const peso=r.bloco==='especificos'?2:1;
    const nivel=r.nivel;
    const gap=Math.max(0,r.teto-nivel);
    const fRel=r.estrelas!=null?Math.min(1.6,Math.max(0.7,r.estrelas/3)):1;
    const pts=r.q*(gap/100)*peso*fRel;
    const horas=gap>0?Math.max(0.5,gap*r.hpp*(nivel<40?1.3:1)):0;
    const cb=horas>0?pts/horas:0;
    return{...r,peso,gap,fRel,pts,horas,cb};
  });
  const ptsMax=Math.max(1,...out.map(o=>o.pts));
  out.forEach(o=>{
    const grande=o.pts>=ptsMax*0.45;           // muito volume de pontos em jogo
    const esp=o.bloco==='especificos';
    let v,cor;
    if(esp&&(grande||(o.nivel<70&&o.q>=8))){v='NUNCA CORTAR';cor='#34d399';}
    else if(o.cb>=0.9||(esp&&o.cb>=0.5)){v='FAZER';cor='#60a5fa';}
    else if(o.cb>=0.35){v='SE SOBRAR TEMPO';cor='#fbbf24';}
    else{v='CORTAR PRIMEIRO';cor='#f87171';}
    o.veredito=v;o.corV=cor;
  });
  out.forEach(o=>{
    const blocoTxt=o.bloco==='especificos'?'Específicos (peso 2×)':'Gerais (peso 1×)';
    const tail=o.veredito==='NUNCA CORTAR'?(o.nivel<70?'nível abaixo de 70% num bloco de peso 2 — cada ponto vale dobrado':'muitos pontos em jogo num bloco de peso 2')
      :o.veredito==='FAZER'?'retorno bom por hora gasta'
      :o.veredito==='SE SOBRAR TEMPO'?'retorno médio — faça depois das matérias de cima'
      :(o.bloco==='gerais'?'peso 1× e retorno baixo por hora — é onde cortar sai mais barato':'retorno baixo por hora');
    o.porque=`${blocoTxt} · ~${o.q}q (hipótese) · nível ${Math.round(o.nivel)}% → meta ${o.teto}% (${Math.round(o.gap)}pp) · ~${o.horas.toFixed(1)}h (${o.tipo}) → ${o.cb.toFixed(2)} pts/h · ${tail}`;
  });
  return out.sort((a,b)=>b.cb-a.cb);
}

// ── Config editável da aba Decisão (questões estimadas e nível manual) ──
let _dcRaw=null,_dcVal={q:{},nivel:{}};
function getDecisaoCfg(){
  try{
    const raw=localStorage.getItem('decisao_cfg');
    if(raw!==_dcRaw){_dcRaw=raw;_dcVal=raw?(JSON.parse(raw)||{q:{},nivel:{}}):{q:{},nivel:{}};}
  }catch(e){}
  return _dcVal;
}
function decisaoQ(mat){
  const c=getDecisaoCfg();
  if(c.q&&c.q[mat]!=null&&!isNaN(c.q[mat]))return +c.q[mat];
  return DECISAO_PADRAO[mat]?DECISAO_PADRAO[mat].q:16;
}
// Nível atual de uma matéria: manual > (Guruja/histórico + registros desde 12/10) > estimativa
function nivelRealMat(mat){
  const cfg=getDecisaoCfg();
  if(cfg.nivel&&cfg.nivel[mat]!=null&&!isNaN(cfg.nivel[mat]))return{pct:+cfg.nivel[mat],origem:'manual'};
  const gs=GURUJA_SEMANA[mat];
  if(gs){
    const histS=lsGet('historico_diario',[]).filter(r=>r.materia===mat&&(r.dt||0)>=GURUJA_REF_MS);
    const qS=histS.reduce((s,r)=>s+(parseInt(r.questoes)||0),0);
    const aS=histS.reduce((s,r)=>s+(parseInt(r.acertei)||0),0);
    // junta o que o Guruja já contou (q questões) com o que você registrou depois da leitura de 07/11 ~07h30, ponderado por nº de questões
    if(qS>0&&gs.q)return{pct:(gs.pct/100*gs.q+aS)/(gs.q+qS)*100,origem:`Guruja + ${qS}q novas`};
    return{pct:gs.pct,origem:'Guruja'};
  }
  const guruja=getGurujaAssuntos();
  let base=null,orig=null;
  if(guruja[mat]){
    const cd=(guruja[mat].assuntos||[]).filter(a=>a.acerto!=null);
    if(cd.length){base=cd.reduce((s,a)=>s+a.acerto,0)/cd.length;orig='Guruja';}
  }
  if(base==null){
    const tops=(EDITAL[mat]?.top||[]).filter(t=>t.acerto!=null);
    if(tops.length){base=tops.reduce((s,t)=>s+t.acerto,0)/tops.length;orig='histórico';}
  }
  const hist=lsGet('historico_diario',[]).filter(r=>r.materia===mat&&(r.dt||0)>=NIVEL_INI_MS);
  const q=hist.reduce((s,r)=>s+(parseInt(r.questoes)||0),0);
  const a=hist.reduce((s,r)=>s+(parseInt(r.acertei)||0),0);
  const rec=q>=10?a/q*100:null;
  if(rec!=null)return base!=null?{pct:(base+rec)/2,origem:`${orig} + ${q}q desta meta`}:{pct:rec,origem:`${q}q desta meta`};
  if(base!=null)return{pct:base,origem:orig};
  const n0=DECISAO_PADRAO[mat]?.nivel0;
  return{pct:n0!=null?n0:50,origem:'estimado'};
}
function calcDecisaoMaterias(){
  const rows=EDITAL_MATS.map(mat=>{
    const d=DECISAO_PADRAO[mat]||{q:10,teto:90,hpp:0.4,nivel0:null,tipo:'—'};
    const nv=nivelRealMat(mat);
    const itens=CICLO.filter(c=>c.mat===mat&&c.est!=null);
    const estrelas=itens.length?itens.reduce((s,c)=>s+c.est,0)/itens.length:null;
    return{mat,bloco:EDITAL[mat].bloco,q:decisaoQ(mat),qPadrao:d.q,teto:d.teto,hpp:d.hpp,tipo:d.tipo,
      nivel:nv.pct,nivelOrigem:nv.origem,estrelas,nAtividades:itens.length};
  });
  return calcDecisaoCore(rows);
}
// Ordem de corte das atividades PENDENTES da meta: o 1º da lista é o primeiro a sacrificar.
function calcOrdemCorte(){
  const dec=calcDecisaoMaterias();
  const por={};dec.forEach(d=>{por[d.mat]=d;});
  const feitos=new Set(lsGet('feitos',[]));
  const rank={'CORTAR PRIMEIRO':0,'SE SOBRAR TEMPO':1,'FAZER':2,'NUNCA CORTAR':3};
  return CICLO.filter(c=>!feitos.has(c.id)&&por[c.mat]).map(c=>({...c,dec:por[c.mat]}))
    .sort((a,b)=>((a.corte==null?99:a.corte)-(b.corte==null?99:b.corte))||(rank[a.dec.veredito]-rank[b.dec.veredito])||(a.dec.cb-b.dec.cb)||((a.est||3)-(b.est||3))||(b.id-a.id));
}

function pesoGate(mat){
  const g=EDITAL[mat];
  if(!g)return 1;
  const base=g.bloco==='especificos'?2:1;
  return base*Math.min(1.2,Math.max(0.5,decisaoQ(mat)/16));
}

// ═══ MOTOR DE DESTAQUE — "já vista" + "urgência", reaproveitado em Hoje e Revisão ═══
// Verifica se um assunto (ou a matéria inteira) foi marcado como "descartar" manualmente.
// Usado pra tirar de verdade da fila de Questões/Passiva/Profunda/Mapa — não é só cosmético.
function isDescartado(mat,assunto){
  const criticos=lsGet('criticos_manuais',[]);
  return criticos.some(c=>c.prioridade==='descartar'&&c.mat===mat&&(!c.assunto||c.assunto===assunto));
}
// "Já vista": a matéria tem pelo menos 1 tópico com dado real (Guruja importado ou EDITAL)
function jaVista(mat){
  const guruja=getGurujaAssuntos();
  if(guruja[mat]&&(guruja[mat].assuntos||[]).some(a=>a.acerto!=null))return true;
  const tops=EDITAL[mat]?.top||[];
  return tops.some(t=>t.acerto!=null);
}
// Urgência agregada por matéria — mesma régua (peso do gate × distância) usada em
// Questões/Profunda/Passiva, só que aqui devolve um nível pronto pra badge visual.
function calcUrgenciaMateria(mat){
  const guruja=getGurujaAssuntos();
  let assuntos=[];
  if(guruja[mat])assuntos=(guruja[mat].assuntos||[]).map(a=>a.acerto).filter(v=>v!=null);
  if(!assuntos.length){
    const tops=(EDITAL[mat]?.top||[]).filter(t=>t.acerto!=null);
    assuntos=tops.map(t=>t.acerto);
  }
  if(!assuntos.length)return{nivel:'alta',score:50,pior:null,pct:null};
  const pior=Math.min(...assuntos);
  const peso=pesoGate(mat);
  const distancia=Math.max(0,90-pior);
  const severidade=pior<50?1.8:pior<65?1.4:pior<75?1.15:1;
  const score=Math.round(distancia*peso*severidade);
  const nivel=score>=45?'alta':score>=22?'media':'baixa';
  return{nivel,score,pior,pct:pior};
}
// Últimos toques por matéria, cruzando todas as fontes — usado pro alerta de oxidação
function ultimoToqueMateria(mat){
  let ultimo=0;
  lsGet('historico_diario',[]).forEach(r=>{if(r.materia===mat&&(r.dt||0)>ultimo)ultimo=r.dt;});
  lsGet('rev_anki',[]).forEach(r=>{if(r.mat===mat&&(r.dt||0)>ultimo)ultimo=r.dt;});
  lsGet('rev_nlm',[]).forEach(r=>{if(r.mat===mat&&(r.dt||0)>ultimo)ultimo=r.dt;});
  lsGet('rev_caderno',[]).forEach(r=>{if(r.mat===mat&&(r.dt||0)>ultimo)ultimo=r.dt;});
  return ultimo;
}
// Top matérias oxidando: nota histórica boa (≥80%) mas há muito tempo sem tocar.
// Risco = quanto pior fica a surpresa se cair na prova sem você saber que já esfriou.
function calcTopOxidacao(n=3){
  const guruja=getGurujaAssuntos();
  const hoje=Date.now();
  const itens=EDITAL_MATS.map(mat=>{
    let pct=null;
    if(guruja[mat]){
      const comDado=(guruja[mat].assuntos||[]).filter(a=>a.acerto!=null);
      if(comDado.length)pct=Math.round(comDado.reduce((s,a)=>s+a.acerto,0)/comDado.length);
    }
    if(pct===null){
      const tops=(EDITAL[mat]?.top||[]).filter(t=>t.acerto!=null);
      if(tops.length)pct=Math.round(tops.reduce((s,t)=>s+t.acerto,0)/tops.length);
    }
    const ultimo=ultimoToqueMateria(mat);
    const diasSem=ultimo>0?Math.floor((hoje-ultimo)/86400000):null;
    return{mat,pct,diasSem};
  }).filter(i=>i.pct!=null&&i.pct>=80&&i.diasSem!=null&&i.diasSem>14);
  return itens.sort((a,b)=>(b.pct*b.diasSem)-(a.pct*a.diasSem)).slice(0,n);
}
// Badge visual reutilizável: 👁️ = já tem dado real · bolinha colorida = urgência
function BadgeMateria({mat,tamanho=9}){
  const vista=jaVista(mat);

const MATS_JURIDICAS=EDITAL_MATS.filter(m=>m.startsWith('Dir.')||m==='Direito Empresarial (Comercial)'||m==='Legislação TCE-SP'||m==='Ética Pública');

// ── 1. QUESTÕES — pior desempenho ponderado dos últimos 7 dias (ontem pesa 3x) ──
function calcQuestoesPrioridade(historico){
  const todayMs=new Date().setHours(0,0,0,0);
  const janela=[];
  for(let i=0;i<=7;i++){const diaMs=todayMs-i*86400000;const peso=i<=1?3:i<=3?2:1;janela.push({diaMs,peso});}
  const porMat={};
  historico.forEach(r=>{
    if(!r.materia||!r.dt||!EDITAL_MATS.includes(r.materia))return;
    const diaMs=new Date(r.dt).setHours(0,0,0,0);
    const j=janela.find(jj=>jj.diaMs===diaMs);
    if(!j)return;
    const q=parseInt(r.questoes)||0,a=parseInt(r.acertei)||0;
    if(q<=0)return;
    if(!porMat[r.materia])porMat[r.materia]={qp:0,ap:0,q:0};
    porMat[r.materia].qp+=q*j.peso;porMat[r.materia].ap+=a*j.peso;porMat[r.materia].q+=q;
  });
  const ranking=Object.entries(porMat)
    .filter(([,v])=>v.q>=10)
    .map(([mat,v])=>({mat,pct:Math.round(v.ap/v.qp*100),questoes:v.q,peso:pesoGate(mat)}))
    .sort((a,b)=>(a.pct/a.peso)-(b.pct/b.peso));
  return{top:ranking[0]||null,ranking};
}

// ── 2. MEMORIZAÇÃO — fila fixa de todas as matérias do edital por dificuldade pessoal ──
// Matéria sem dado real (null) = tratada como DIFÍCIL (sobe na fila), não como fácil.
function calcFilaMemorizacao(){
  const guruja=getGurujaAssuntos();
  const lastAnkiMat={};
  lsGet('rev_anki',[]).forEach(r=>{if(r.mat&&(r.dt||0)>(lastAnkiMat[r.mat]||0))lastAnkiMat[r.mat]=r.dt||0;});
  const hojeMs=new Date().setHours(0,0,0,0);
  const fila=EDITAL_MATS.map(mat=>{
    let pct=null;
    if(guruja[mat]){
      const comDado=(guruja[mat].assuntos||[]).filter(a=>a.acerto!=null);
      if(comDado.length)pct=Math.round(comDado.reduce((s,a)=>s+a.acerto,0)/comDado.length);
    }
    if(pct===null){
      const tops=(EDITAL[mat]?.top||[]).filter(t=>t.acerto!=null);
      if(tops.length)pct=Math.round(tops.reduce((s,t)=>s+t.acerto,0)/tops.length);
    }
    // sem dado = incerteza alta = prioridade alta (dificuldade fictícia 40, abaixo da maioria medida)
    const dificuldade=pct===null?40:pct;
    const jaHoje=(lastAnkiMat[mat]||0)>=hojeMs;
    return{mat,pct,dificuldade,semDado:pct===null,lastAnki:lastAnkiMat[mat]||0,jaHoje};
  }).sort((a,b)=>a.dificuldade-b.dificuldade||pesoGate(b.mat)-pesoGate(a.mat));
  const candidatos=fila.filter(f=>!f.jaHoje).sort((a,b)=>a.lastAnki-b.lastAnki);
  return{filaCompleta:fila,hoje:candidatos[0]||fila[0]};
}

// ── 3. PASSIVA — decoreba + dificuldade das matérias jurídicas, ponderado pelo peso do gate ──
// Prioriza os tópicos REAIS que você importou do Guruja (mais granular, muda quando você
// alimenta) e só cai pro EDITAL fixo quando ainda não há nada seu importado pra essa matéria.
function calcPassivaJuridica(){
  const guruja=getGurujaAssuntos();
  const itens=[];
  MATS_JURIDICAS.forEach(mat=>{
    const gurujaTopicos=guruja[mat]?.assuntos;
    const usaGuruja=gurujaTopicos&&gurujaTopicos.length>0;
    const fonte=usaGuruja
      ?gurujaTopicos.map(a=>({titulo:a.titulo,acerto:a.acerto}))
      :(EDITAL[mat]?.top||[]).map(t=>({titulo:t.t,acerto:t.acerto}));
    fonte.forEach(t=>{
      if(isDescartado(mat,t.titulo))return; // marcado como "não vale meu tempo" — some da fila
      const decoreba=isDecorebaHeuristico(t.titulo);
      const semDado=t.acerto==null;
      const acerto=semDado?55:t.acerto;
      const risco=Math.round((100-acerto)*pesoGate(mat)*(decoreba?1.3:1));
      itens.push({mat,titulo:t.titulo,decoreba,acerto:t.acerto,semDado,risco,critico:t.acerto!=null&&t.acerto<50,origem:usaGuruja?'Guruja':'EDITAL'});
    });
  });
  return itens.sort((a,b)=>b.risco-a.risco);
}

// ── 4. PROFUNDA — tópicos <80%, ranqueados por URGÊNCIA real p/ nota final ──
// Score = distância do teto (80-acerto) × peso do gate × severidade (buraco fundo sangra mais)
function calcProfunda80(){
  const guruja=getGurujaAssuntos();
  const abaixo=[];
  const push=(mat,titulo,acerto,fonte)=>{
    if(isDescartado(mat,titulo))return; // marcado como "não vale meu tempo" — some da fila
    const distancia=80-acerto;
    const buracoFundo=acerto<50?1.8:acerto<60?1.3:1;
    const score=Math.round(distancia*pesoGate(mat)*buracoFundo);
    abaixo.push({mat,titulo,acerto,fonte,score,critico:acerto<50});
  };
  Object.entries(guruja).forEach(([mat,dados])=>{
    (dados.assuntos||[]).forEach(a=>{if(a.acerto!=null&&a.acerto<80)push(mat,a.titulo,a.acerto,'Guruja');});
  });
  EDITAL_MATS.forEach(mat=>{
    (EDITAL[mat]?.top||[]).forEach(t=>{
      if(t.acerto!=null&&t.acerto<80&&!abaixo.some(x=>x.mat===mat&&x.titulo===t.t))push(mat,t.t,t.acerto,'EDITAL');
    });
  });
  return abaixo.sort((a,b)=>b.score-a.score);
}

// ── PROJEÇÃO DE NOTA FINAL — se a prova fosse hoje, quantos pontos você faria ──
function calcProjecaoNotaFinal(){
  // Soma, por matéria, (questões estimadas × nível atual). Matérias sem dado real entram com a estimativa
  // (marcada como 'estimado' na aba Decisão) — ignorá-las inflaria a nota.
  const dec=calcDecisaoMaterias();
  const soma=b=>dec.filter(d=>d.bloco===b).reduce((s,d)=>s+d.q*d.nivel/100,0);
  const totalQ=b=>dec.filter(d=>d.bloco===b).reduce((s,d)=>s+d.q,0);
  const reais=b=>dec.filter(d=>d.bloco===b&&d.nivelOrigem!=='estimado').length;
  const tot=b=>dec.filter(d=>d.bloco===b).length;
  const pontosGerais=Math.round(soma('gerais')/Math.max(1,totalQ('gerais'))*80);
  const pontosEspec=Math.round(soma('especificos')/Math.max(1,totalQ('especificos'))*100);
  return{
    pontosGerais,pontosEspec,pontosObjetiva:pontosGerais+pontosEspec,pontosDiscursiva:null,
    notaFinal:pontosGerais+pontosEspec*2, // acertos ponderados (máx. 280) — não é a nota padronizada
    passaGerais:pontosGerais>=56,passaEspec:pontosEspec>=85,passaDiscursiva:null,
    cobGerais:reais('gerais'),totalGerais:tot('gerais'),cobEspec:reais('especificos'),totalEspec:tot('especificos'),
    correcoesRegistradas:0,
  };
}

// ── 5. ESTRATÉGIA — painel semanal: delta, cobertura do edital, decisão sugerida ──
function calcEstrategiaSemanal(){
  const hist=lsGet('historico_diario',[]);
  const now=new Date();
  const diaSemana=now.getDay();
  const inicioSemAtual=new Date(now);inicioSemAtual.setHours(0,0,0,0);inicioSemAtual.setDate(now.getDate()-diaSemana);
  const inicioSemAnt=new Date(inicioSemAtual);inicioSemAnt.setDate(inicioSemAtual.getDate()-7);
  const porSemana=(ini,fim)=>{
    const porMat={};
    hist.forEach(r=>{
      if(!r.materia||!r.dt||r.dt<ini||r.dt>=fim||!EDITAL_MATS.includes(r.materia))return;
      const q=parseInt(r.questoes)||0,a=parseInt(r.acertei)||0;
      if(q<=0)return;
      if(!porMat[r.materia])porMat[r.materia]={q:0,a:0};
      porMat[r.materia].q+=q;porMat[r.materia].a+=a;
    });
    return porMat;
  };
  const semAtual=porSemana(inicioSemAtual.getTime(),now.getTime()+1);
  const semAnt=porSemana(inicioSemAnt.getTime(),inicioSemAtual.getTime());
  const delta=Object.keys({...semAtual,...semAnt}).map(mat=>{
    const pctA=semAtual[mat]&&semAtual[mat].q>0?Math.round(semAtual[mat].a/semAtual[mat].q*100):null;
    const pctB=semAnt[mat]&&semAnt[mat].q>0?Math.round(semAnt[mat].a/semAnt[mat].q*100):null;
    return{mat,pctAtual:pctA,pctAnterior:pctB,delta:(pctA!=null&&pctB!=null)?pctA-pctB:null};
  }).filter(d=>d.delta!==null).sort((a,b)=>a.delta-b.delta);

  const guruja=getGurujaAssuntos();
  const cobertura=EDITAL_MATS.filter(m=>m!=='Discursivas').map(mat=>{
    const gurujaTopicos=guruja[mat]?.assuntos;
    const usaGuruja=gurujaTopicos&&gurujaTopicos.length>0;
    const fonte=usaGuruja
      ?gurujaTopicos.map(a=>({titulo:a.titulo,acerto:a.acerto}))
      :(EDITAL[mat]?.top||[]).map(t=>({titulo:t.t,acerto:t.acerto}));
    if(!fonte.length)return{mat,pct:100,total:0,tocados:0};
    const tocados=fonte.filter(t=>t.acerto!=null||hist.some(r=>r.materia===mat&&r.assunto===t.titulo&&parseInt(r.questoes)>0)).length;
    return{mat,pct:Math.round(tocados/fonte.length*100),total:fonte.length,tocados};
  }).sort((a,b)=>a.pct-b.pct);

  const candidatos=cobertura.filter(c=>c.total>0&&c.pct<70).map(c=>({...c,urgencia:(100-c.pct)*pesoGate(c.mat)})).sort((a,b)=>b.urgencia-a.urgencia);
  const decisao=candidatos[0]?{mat:candidatos[0].mat,texto:candidatos[0].pct===0
    ?`${candidatos[0].mat} — 0% do edital tocado ainda. Entra essa semana?`
    :`${candidatos[0].mat} — só ${candidatos[0].pct}% do edital tocado (${candidatos[0].tocados}/${candidatos[0].total}). Prioriza essa semana?`}:null;
  return{delta,cobertura,decisao};
}

// Retorna mapa { "Mat — Tópico": { q, a, pct } } do histórico real
function calcAcertoPorAssunto(){
  const hist=lsGet('historico_diario',[]);
  const por={};
  hist.forEach(r=>{
    if(!r.materia||!r.assunto)return;
    const q=parseInt(r.questoes)||0;
    const a=parseInt(r.acertei)||0;
    if(!q)return;
    const k=r.materia+'|||'+r.assunto;
    if(!por[k])por[k]={q:0,a:0,mat:r.materia,assunto:r.assunto,lastDt:0};
    por[k].q+=q; por[k].a+=a;
    if((r.dt||0)>por[k].lastDt)por[k].lastDt=r.dt||0;
  });
  return por;
}

// Calcula score de perigo: peso_topico × (1 - acerto) × fator_tempo
// score alto = tópico que cai muito + você está indo mal + faz tempo que não toca
function calcScorePerigo(pesoTopico, acertoPct, lastDtMs){
  const deficit = 1 - (acertoPct !== null ? acertoPct/100 : 0.7); // sem dado = assume 30% acerto
  const diasSem = Math.min(Math.floor((Date.now()-(lastDtMs||0))/86400000), 60);
  const fatorTempo = 1 + diasSem*0.02; // cada dia parado aumenta 2% o perigo
  return pesoTopico * deficit * fatorTempo;
}

// Retorna top N tópicos mais perigosos cruzando EDITAL × histórico real
function calcTop5Perigos(n=5){
  const porAssunto=calcAcertoPorAssunto();
  const todayMs=new Date().setHours(0,0,0,0);
  const perigos=[];
  EDITAL_MATS.forEach(mat=>{
    const dados=EDITAL[mat];
    dados.top.forEach(topico=>{
      const k=mat+'|||'+topico.t;
      const reg=porAssunto[k]||null;
      const acerto=reg?Math.round(reg.a/reg.q*100):null;
      const lastDt=reg?.lastDt||0;
      const score=calcScorePerigo(topico.p, acerto, lastDt);
      const diasSem=Math.floor((todayMs-(lastDt||0))/86400000);
      perigos.push({mat,topico:topico.t,pesoEdital:topico.p,acerto,score,diasSem,temDado:!!reg});
    });
  });
  return perigos.sort((a,b)=>b.score-a.score).slice(0,n);
}

// Retorna ranking de matérias com pontos em risco
function calcPontosEmRisco(){
  const hist=lsGet('historico_diario',[]);
  const porMat={};
  hist.forEach(r=>{
    if(!r.materia||!parseInt(r.questoes))return;
    if(!porMat[r.materia])porMat[r.materia]={q:0,a:0};
    porMat[r.materia].q+=parseInt(r.questoes)||0;
    porMat[r.materia].a+=parseInt(r.acertei)||0;
  });
  return EDITAL_MATS.map(mat=>{
    const reg=porMat[mat]||null;
    const acerto=reg&&reg.q>0?Math.round(reg.a/reg.q*100):null;
    const topPeso=EDITAL[mat].top.reduce((s,t)=>s+t.p,0); // soma dos tops
    const deficit=acerto!==null?(100-acerto)/100:0.5;
    const pontosRisco=Math.round(topPeso*deficit*10)/10;
    const pontosGarantidos=acerto!==null?Math.round(topPeso*(acerto/100)*10)/10:null;
    return{mat,acerto,pontosRisco,pontosGarantidos,topPeso,temDado:!!reg};
  }).sort((a,b)=>b.pontosRisco-a.pontosRisco);
}

// ── SAÚDE DA SEMANA — score composto 0-10 ────────────────────
function calcSaude(){
  const hoje=getDK();
  const todayMs=new Date().setHours(0,0,0,0);
  const semStart=todayMs-6*86400000;

  // Fator 1: Meta de horas (peso 2)
  const horas=lsGet('horas',[]);
  const minSem=horas.filter(e=>e.dt>=semStart).reduce((s,e)=>s+e.min,0);
  const metaH=lsGet('meta_horas_sem',35)*60;
  const pctMeta=metaH>0?minSem/metaH:0;
  const f1=pctMeta>=0.8?2:pctMeta>=0.5?1:0;
  const f1label=pctMeta>=0.8?'✅':pctMeta>=0.5?'⚠️':'🔴';

  // Fator 2: Revisão TEC em dia (itens difíceis acumulados sem resolver)
  const caderno=lsGet('rev_caderno',[]);
  const todayStr=new Date().toISOString().split('T')[0];
  const atrasados=caderno.filter(t=>!t.dominado&&(t.dificuldade||3)>=4).length;
  const f2=atrasados===0?2:atrasados<=2?1:0;
  const f2label=atrasados===0?'✅':atrasados<=2?'⚠️':'🔴';

  // Fator 3: Sequência de Anki (dias seguidos)
  let sequenciaAnki=0;
  for(let i=0;i<7;i++){
    const d=new Date(todayMs-i*86400000);
    const dk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(lsGet(`anki_feito_${dk}`,null))sequenciaAnki++;
    else break;
  }
  const f3=sequenciaAnki>=3?2:sequenciaAnki>=1?1:0;
  const f3label=sequenciaAnki>=3?'✅':sequenciaAnki>=1?'⚠️':'🔴';

  // Fator 4: Matérias críticas sem contato há 7+ dias
  const hist=lsGet('historico_diario',[]);
  const sete=todayMs-7*86400000;
  const porMat={};
  hist.forEach(r=>{
    if(!r.materia||!parseInt(r.questoes)||!EDITAL_MATS.includes(r.materia))return;
    if(!porMat[r.materia])porMat[r.materia]={q:0,a:0,lastDt:0};
    porMat[r.materia].q+=parseInt(r.questoes)||0;
    porMat[r.materia].a+=parseInt(r.acertei)||0;
    if((r.dt||0)>porMat[r.materia].lastDt)porMat[r.materia].lastDt=r.dt||0;
  });
  const criticasSemContato=Object.entries(porMat).filter(([,v])=>{
    const pct=v.q>0?Math.round(v.a/v.q*100):100;
    return pct<70&&v.lastDt<sete;
  }).length;
  const f4=criticasSemContato===0?2:criticasSemContato<=2?1:0;
  const f4label=criticasSemContato===0?'✅':criticasSemContato<=2?'⚠️':'🔴';

  // Fator 5: Travamentos na semana
  const travamentos=hist.filter(r=>r.travou&&(r.dt||0)>=semStart).length;
  const f5=travamentos<=1?2:travamentos<=3?1:0;
  const f5label=travamentos<=1?'✅':travamentos<=3?'⚠️':'🔴';

  const score=f1+f2+f3+f4+f5;
  const nivel=score>=8?'ÓTIMA':score>=6?'BOA':score>=4?'ATENÇÃO':'RISCO';
  const cor=score>=8?'#34d399':score>=6?'#a3e635':score>=4?'#fbbf24':'#f87171';
  const emoji=score>=8?'💚':score>=6?'🟢':score>=4?'🟡':'🔴';

  return{
    score,nivel,cor,emoji,
    fatores:[
      {k:'Meta',label:f1label,detalhe:`${Math.round(pctMeta*100)}% da meta (${Math.floor(minSem/60)}h/${lsGet('meta_horas_sem',35)}h)`,val:f1},
      {k:'TEC',label:f2label,detalhe:`${atrasados} revisão(ões) atrasada(s)`,val:f2},
      {k:'Anki',label:f3label,detalhe:`${sequenciaAnki} dia(s) seguidos`,val:f3},
      {k:'Críticas',label:f4label,detalhe:`${criticasSemContato} matéria(s) crítica(s) sem contato`,val:f4},
      {k:'Travou',label:f5label,detalhe:`${travamentos} travamento(s) esta semana`,val:f5},
    ]
  };
}

// ── Helpers de aproveitamento ──────────────────────────────────
function calcRankingAproveitamento(){
  const historico=lsGet('historico_diario',[]);
  const difBase=lsGet('dif_base_materias',{});
  const porMat={};

  // Grupo 1: matérias com questões reais
  historico.forEach(r=>{
    if(!r.materia)return;
    const q=parseInt(r.questoes)||0;
    const a=parseInt(r.acertei)||0;
    if(!q)return;
    if(!porMat[r.materia])porMat[r.materia]={q:0,a:0,temDado:true};
    porMat[r.materia].q+=q;
    porMat[r.materia].a+=a;
  });

  // Grupo 2: matérias sem questões mas com dificuldade base definida
  Object.entries(difBase).forEach(([mat,dif])=>{
    if(porMat[mat])return; // já tem dado real, ignora
    if(!dif)return;
    // Converte dif 1-5 em % equivalente: 5⭐=0%, 4⭐=30%, 3⭐=55%, 2⭐=75%, 1⭐=90%
    const pctEquiv=[90,75,55,30,0][dif-1];
    porMat[mat]={q:null,a:null,pct:pctEquiv,temDado:false,difBase:dif};
  });

  // Monta ranking
  const comDado=Object.entries(porMat)
    .filter(([,v])=>v.temDado)
    .map(([mat,v])=>{
      const pct=Math.round(v.a/v.q*100);
      const label=pct>=85?'🟢 SÓLIDO':pct>=70?'🟡 ATENÇÃO':'🔴 CRÍTICO';
      return{mat,pct,q:v.q,label,temDado:true};
    })
    .sort((a,b)=>a.pct-b.pct);

  const semDado=Object.entries(porMat)
    .filter(([,v])=>!v.temDado)
    .map(([mat,v])=>{
      const label=v.pct<=30?'🔴 CRÍTICO (base)':v.pct<=55?'🟡 ATENÇÃO (base)':'🟢 OK (base)';
      return{mat,pct:v.pct,difBase:v.difBase,label,temDado:false};
    })
    .sort((a,b)=>a.pct-b.pct);

  return{comDado,semDado};
}

function fmtRanking(){
  const{comDado,semDado}=calcRankingAproveitamento();
  const escala='ESCALA: ≥85%=SÓLIDO · 70-84%=ATENÇÃO · <70%=CRÍTICO';
  const parteComDado=comDado.length
    ? 'COM QUESTÕES (pior→melhor): '+comDado.map(r=>`${r.label} ${r.mat} ${r.pct}%(${r.q}Q)`).join(' | ')
    : 'Sem questões registradas ainda';
  const parteSemDado=semDado.length
    ? 'SEM QUESTÕES (dif base): '+semDado.map(r=>`${r.label} ${r.mat} dif${r.difBase}⭐`).join(' | ')
    : '';
  return [escala,parteComDado,parteSemDado].filter(Boolean).join(' || ');
}

// ── Simulação e proposta (o motor decide; a IA não mexe) ──
function simularCiclo(capMap,fixosHoje){
  const volta=CICLO_DISP.filter(d=>CICLO_VOLTA.includes(d.id));
  const base=ordemPinada([...CICLO_BASE,...volta]);
  const hojeMs=dataDeDk(getDK()).getTime();
  return distribuirCiclo(base,lerFeitosValidos(),lsGet('feitos_dt',{})||{},[],hojeMs,d=>capMap&&capMap[d]!=null?capMap[d]:getCapDia(d),fixosHoje);
}
function diffCiclo(antes,depois,feitoSet){
  const mA=new Map(antes.map(i=>[i.id,i]));const moveu=[],cortou=[],voltou=[];
  depois.forEach(i=>{
    if(feitoSet.has(i.id))return;
    const a=mA.get(i.id);if(!a)return;
    if(i.estouro&&!a.estouro)cortou.push({...i,de:a.dia});
    else if(!i.estouro&&a.estouro)voltou.push({...i,de:a.dia});
    else if(i.dia!==a.dia)moveu.push({...i,de:a.dia});
  });
  return{moveu,cortou,voltou};
}
const iaPin=i=>i.tipo==='Reforço'||i.mat===MAT_TI;
// o que fica hoje com X minutos: TI do dia e reforço primeiro (não negociam), depois a ordem do plano, o que couber
function escolherParaHoje(E,restante){
  const cand=E.pend;
  const ordem=[...cand.filter(iaPin),...cand.filter(i=>!iaPin(i))];
  let usado=0;const ficam=[];
  ordem.forEach(i=>{if(usado+i.min<=restante+TOL_DIA){ficam.push(i);usado+=i.min;}});
  if(!ficam.length&&ordem.length)ficam.push([...ordem].sort((a,b)=>a.min-b.min)[0]);
  return ficam;
}
function propostaHoje(E,restante,motivo){
  if(!E.noPlano||!E.pend.length)return null;
  const rest=Math.max(0,Math.round(restante/15)*15);
  const ficam=escolherParaHoje(E,rest);
  const ids=ficam.map(i=>i.id);
  const sai=E.pend.filter(i=>!ids.includes(i.id));
  const capNovo=Math.max(30,Math.ceil((E.minFeito+ficam.reduce((s,i)=>s+i.min,0))/15)*15);
  const antes=simularCiclo({},lerIaDia());
  const depois=simularCiclo({},ids);
  return{tipo:'hoje',dia:E.diaIdx,capAntes:E.capHoje,capNovo,ids,ficam,sai,diff:diffCiclo(antes,depois,E.feitoSet),motivo:motivo||'',restante:rest};
}
function propostaAmanha(E,delta,motivo){
  const d=E.diaIdx+1;if(!E.noPlano||d>7||d<1)return null;
  const atual=getCapDia(d);const novo=Math.max(120,Math.min(480,atual+delta));
  if(novo===atual)return null;
  const antes=simularCiclo({},lerIaDia());
  const depois=simularCiclo({[d]:novo},lerIaDia());
  return{tipo:'amanha',dia:d,capAntes:atual,capNovo:novo,ids:null,ficam:[],sai:[],diff:diffCiclo(antes,depois,E.feitoSet),motivo:motivo||''};
}

// ── Distância até o corte e maiores riscos (determinístico, com os números do Guruja já embutidos no app) ──
function calcDistancia(){
  const rows=Object.keys(FORM_PESO).map(d=>{const f=formulaDisc(d);return{disc:d,peso:f.peso,nivel:f.nivel};});
  const sp=rows.reduce((s,r)=>s+r.peso,0);
  const pct=rows.reduce((s,r)=>s+r.peso*r.nivel,0)/sp;
  const cen=[['otimista',3],['realista',9],['pessimista',16]].map(([n,dd])=>({n,dd,pct:pct-dd,pts:(pct-dd)/100*280}));
  const alvo=+lsGet('alvo_nota',ALVO_NOTA_PADRAO)||ALVO_NOTA_PADRAO;
  return{pct,pts:pct/100*280,cen,alvo};
}
function calcRiscos(){
  const S=GURUJA_SYNC;const trio=[];const cortadasRisco=[];
  const linhas=S.disc.map(r=>{
    const [nome,,q,,pctG,media,,,tend]=r;
    const key=RISCO_FIXO_NOME[nome]||nome;
    const f=formulaDisc(key);
    const emJogo=280*f.peso/100*(100-f.nivel)/100;
    let mult=1;const mot=[];
    if(!q){mult*=1.3;mot.push('0 questões feitas (nível do app é estimativa)');}
    if(tend==='piorando'){mult*=1.25;mot.push('tendência piorando');}
    else if(tend==='melhorando'){mult*=0.9;}
    if(media!=null&&pctG!=null&&pctG<media){mult*=1.15;mot.push(`abaixo da média geral (${fmN(pctG)}% × ${fmN(media)}%)`);}
    return{nome,peso:f.peso,nivel:f.nivel,emJogo,score:emJogo*mult,mot,q};
  });
  const grupo=[];
  const resto=linhas.filter(l=>!cortadasRisco.includes(l.nome));
  const itens=resto.map(l=>({nome:l.nome,emJogo:l.emJogo,score:l.score,mot:l.mot,peso:l.peso,nivel:l.nivel,trio:false}));
  if(grupo.length)itens.push({nome:'MatFin + Estatística + RL',emJogo:grupo.reduce((s,l)=>s+l.emJogo,0),score:grupo.reduce((s,l)=>s+l.score,0),mot:['0 questões feitas no Guruja (nível do app é estimativa)'],peso:grupo.reduce((s,l)=>s+l.peso,0),nivel:null,trio:true});
  itens.sort((a,b)=>b.score-a.score);
  return itens.slice(0,3).map(r=>{
    let acao='',link=null;
    {
      const f=S.fracos.filter(x=>FRACO_AREA[x[1]]===r.nome)[0];
      if(f){acao=`Ponto mais fraco: “${f[0]}” — ${fmN(f[4])}% (média geral ${fmN(f[5])}%). Refaça as questões erradas dele (3C).`;link=f[6];}
      else acao='Sem ponto fraco abaixo da média nesta matéria: mantenha com reforço e questões do TEC, sem tempo extra.';
    }
    return{...r,acao,link};
  });
}

function textoBriefingAuto(E){

    p.push(PLANO_GURUJA?'A janela de 7 dias da meta acabou. Abra a próxima meta no Guruja; a rotina atualiza o guruja.json e o app remonta o plano. Enquanto isso: Anki profundo e questões das matérias de risco (abaixo).':`${PLANO_VAZIO_MSG}. Enquanto isso: Anki profundo e questões das matérias mais fracas (abaixo).`);

  }
  if(E.lista.length)p.push(`Combinado de hoje: ${E.lista.length} atividades (${fmtMinG(E.minPlano)}): ${E.lista.map(i=>`${matCurto(i.mat)} ${fmtMinG(i.min)}`).join(', ')}.`);
  if(E.minFeito>0)p.push(`Já feito: ${fmtMinG(E.minFeito)}.`);
  if(E.ontem)p.push(`Ontem: ${E.ontem.feitas} de ${E.ontem.total} do plano.`);
  if(E.atrasoMin>0)p.push(`Atrasado: ${fmtMinG(E.atrasoMin)}.`);
  const mx=minDoTipo(E.tipo,E.cfg);
  if(E.capHoje>mx+14)p.push(`Atenção: hoje é ${T.nome.toLowerCase()} (cabem ~${fmtMinG(mx)}) e o plano tem ${fmtMinG(E.capHoje)} — veja a proposta abaixo.`);
  try{const r=calcRiscos()[0];if(r)p.push(`Maior risco na base: ${r.nome}.`);}catch(e){}
  p.push('Mantém, aperta ou travou?');
  return p.join(' ');
}
function blocoMentora(){
  try{
    const E=lerEstadoDia();const T=TIPOS_DIA[E.tipo];const S=GURUJA_SYNC;
    const cb=lsGet('ia_combinados',{})||{};const fe=lsGet('ia_fechamentos',{})||{};
    const L=[];
    L.push(`HOJE: ${rotuloDk(E.dk)} · tipo do dia: ${T.nome} (cabem ~${fmtMinG(minDoTipo(E.tipo,E.cfg))}) · ${E.noPlano?`plano dia ${E.diaIdx}/7`:(PLANO_GURUJA?'janela da meta encerrada (abrir a próxima meta no Guruja)':PLANO_VAZIO_MSG)}${E.diasProva!=null?` · prova em ${E.diasProva} dias`:' · sem data de prova (pré-edital)'}`);
    if(E.noPlano)L.push(`MISSÃO DE HOJE (${fmtMinG(E.minPlano)}; feito ${fmtMinG(E.minFeito)}): ${E.lista.map(i=>`[${E.feitoSet.has(i.id)?'feito':'pendente'}] ${matCurto(i.mat)} — ${i.conteudo} (${i.min}min)`).join(' | ')||'nada planejado'}`);
    L.push(`ANKI PROFUNDO 05h: ${E.anki?'feito':'pendente'}`);
    if(E.atras.length)L.push(`ATRASADO: ${fmtMinG(E.atrasoMin)} — ${E.atras.map(i=>`${matCurto(i.mat)} ${i.min}min`).join(', ')}`);
    if(E.ontem)L.push(`ONTEM: ${E.ontem.feitas}/${E.ontem.total} do plano feitos`);
    const f1=fe[somaDias(E.dk,-1)];
    if(f1)L.push(`FECHAMENTO DE ONTEM: dia ${f1.como}${f1.travou&&f1.travou.length?` · travou em: ${f1.travou.join(', ')}`:''} · para hoje pediu carga: ${f1.amanha}`);
    if(cb[E.dk])L.push(`COMBINADO PARA HOJE (escrito ontem à noite): ${cb[E.dk].texto}`);
    const aj=(lsGet('ia_ajustes',[])||[]).filter(a=>a.dk===E.dk).slice(-2);
    if(aj.length)L.push(`AJUSTES APLICADOS HOJE: ${aj.map(a=>`${a.tipo==='hoje'?'hoje':'amanhã'} → ${fmtMinG(a.para)} (${a.motivo})`).join('; ')}`);
    L.push(`GURUJA (lido por mim em ${S.em}): Meta ${S.metaAtual.n} com ${S.metaAtual.feitas}/${S.metaAtual.total} atividades feitas · ritmo ${S.ritmo.status} · reforços ${S.reforcos.feitos}/${S.reforcos.total}`);
    L.push('ACERTO POR MATÉRIA (você × média geral × tendência): '+S.disc.filter(r=>r[4]!=null).map(r=>`${matCurto(r[0])} ${fmN(r[4])}% × ${fmN(r[5])}%${r[8]?' '+r[8]:''}`).join(' | '));
    {const sem=S.disc.filter(r=>!r[2]).map(r=>matCurto(r[0]));if(sem.length)L.push('SEM NENHUMA QUESTÃO NO GURUJA AINDA: '+sem.join(', ')+' (o app usa nível neutro para elas).');}
    L.push('PONTOS FRACOS (abaixo da média): '+S.fracos.slice(0,4).map(f=>`${f[0]} ${fmN(f[4])}% (média ${fmN(f[5])}%)`).join(' | '));
    const R=calcRiscos();
    if(R.length)L.push('3 MAIORES RISCOS: '+R.map((r,i)=>`${i+1}) ${r.nome}${TEM_PROVA?` ~${r.emJogo.toFixed(1)} pts em jogo`:''} (${r.mot.join('; ')||'maior déficit'})`).join(' · '));
    if(TEM_PROVA){const D=calcDistancia();
    L.push(`DISTÂNCIA DO CORTE: treino ~${D.pct.toFixed(0)}% (~${D.pts.toFixed(0)}/280) · prova realista ~${D.cen[1].pts.toFixed(0)} · mínimo 150 · alvo dela ${D.alvo} (alvo é dela, não o corte oficial)`);}
    return L.join('\n');
  }catch(e){return '';}
}
