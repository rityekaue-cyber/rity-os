    const n=[...banco,{...bancoForm,link:bancoForm.link||'',id:Date.now(),dt:Date.now()}];
    setBanco(n);lsSet('banco_tarefas',n);
    setBancoForm({txt:'',cat:'estudo',prazo:'',status:'pendente',link:''});
    setBancoSalvo(true);setTimeout(()=>setBancoSalvo(false),1500);
  };
  const togBanco=id=>{const n=banco.map(t=>t.id===id?{...t,status:t.status==='feito'?'pendente':'feito'}:t);setBanco(n);lsSet('banco_tarefas',n);};
  const delBanco=id=>{const n=banco.filter(t=>t.id!==id);setBanco(n);lsSet('banco_tarefas',n);};

  // Foco drag-and-drop
  const savFoco=f=>{setFoco(f);lsSet(`foco_${dk}`,f);};
  const onDragStart=i=>setDragIdx(i);
  const onDragOver=(e,i)=>{e.preventDefault();setDragOver(i);};
  const onDrop=(e,i)=>{
    e.preventDefault();
    if(dragIdx===null||dragIdx===i){setDragIdx(null);setDragOver(null);return;}
    const n=[...foco];
    const tmp=n[dragIdx];n[dragIdx]=n[i];n[i]=tmp;
    savFoco(n);setDragIdx(null);setDragOver(null);
  };

  // Inicializa foco com MITs se vazio
  useEffect(()=>{
    if(mit.length>0&&foco.every(f=>!f)){
      const f=[mit[0]||'',mit[1]||'',mit[2]||''];
      savFoco(f);
    }
  },[]);

  const PCOR={urgente:'#f87171',importante:'#fbbf24',normal:'#60a5fa'};
  const CATS_BANCO=['estudo','revisao','casa','kaue','trabalho','outro'];
  const CAT_COR={estudo:'#60a5fa',revisao:'#a78bfa',casa:'#fcd34d',kaue:'#f87171',trabalho:'#fb923c',outro:'#94a3b8'};
  const CAT_IC={estudo:'📚',revisao:'🧠',casa:'🏡',kaue:'⚓',trabalho:'💼',outro:'📌'};

  const BlocoHeader=({titulo,k,cor,badge})=>(
    <button onClick={()=>toggle(k)} style={{width:'100%',padding:'11px 13px',borderRadius:aberto[k]?'11px 11px 0 0':'11px',border:`1px solid ${cor}30`,background:aberto[k]?`${cor}12`:`${cor}08`,display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer',marginBottom:aberto[k]?0:8}}>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <span style={{fontSize:15,fontWeight:800,color:cor}}>{titulo}</span>
        {badge&&<span style={{fontSize:13,padding:'2px 7px',borderRadius:4,background:`${cor}25`,color:cor,fontFamily:"'DM Mono',monospace",fontWeight:700}}>{badge}</span>}
      </div>
      <span style={{fontSize:15,color:cor,transform:aberto[k]?'rotate(180deg)':'none',transition:'transform .2s'}}>▼</span>
    </button>
  );

  // ── ATALHOS RÁPIDOS ──────────────────────────────────────
  const ATALHOS=[
    {l:'🎯 Foco',desc:'Bloco ativo',tab:'estudo',sub:'foco',cor:'#fbbf24'},
    {l:'🧠 Revisão',desc:'Tempo morto + Anki',tab:'revisao',sub:null,cor:'#a78bfa'},
    {l:'📊 Guruja',desc:'Análise semanal',tab:'estudo',sub:'plano',cor:'#fb923c'},
    {l:'📕 Erros',desc:'Caderno de erros',tab:'erros',sub:null,cor:'#f87171'},
    {l:'📅 Plano',desc:'Planejamento',tab:'estudo',sub:'plano',cor:'#60a5fa'},
  ];

  return(
    <div>
      {/* ── ATALHOS RÁPIDOS ── */}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:13,letterSpacing:'2px',color:'#c2ccd8',fontFamily:"'DM Mono',monospace",marginBottom:6}}>⚡ ATALHOS RÁPIDOS</div>
        <div style={{display:'flex',gap:6,overflowX:'auto',scrollbarWidth:'none',paddingBottom:2}}>
          {ATALHOS.map(a=>(
            <button key={a.l} onClick={()=>onSetTab(a.tab)} style={{flexShrink:0,padding:'8px 12px',borderRadius:10,border:`1px solid ${a.cor}35`,background:`${a.cor}10`,cursor:'pointer',textAlign:'left',minWidth:90}}>
              <div style={{fontSize:14,fontWeight:800,color:a.cor}}>{a.l}</div>
              <div style={{fontSize:13,color:'#c2ccd8',marginTop:1}}>{a.desc}</div>
            </button>
          ))}
        </div>
      </div>

      {/* ── FOCO DE HOJE ── */}
      <div style={{background:'linear-gradient(135deg,rgba(251,191,36,.1),rgba(10,15,30,.98))',border:'1px solid rgba(251,191,36,.3)',borderRadius:13,padding:'13px',marginBottom:14}}>
        <div style={{fontSize:13,letterSpacing:'3px',color:'#fbbf24',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:10}}>🎯 FOCO DE HOJE — ARRASTE PARA REORDENAR</div>
        {foco.map((f,i)=>(
          <div key={i}
            draggable
            onDragStart={()=>onDragStart(i)}
            onDragOver={e=>onDragOver(e,i)}
            onDrop={e=>onDrop(e,i)}
            onDragEnd={()=>{setDragIdx(null);setDragOver(null);}}
            style={{display:'flex',alignItems:'center',gap:8,padding:'9px 11px',borderRadius:9,marginBottom:6,background:dragOver===i?'rgba(251,191,36,.15)':'rgba(30,41,59,.9)',border:`1px solid ${dragOver===i?'rgba(251,191,36,.5)':'rgba(251,191,36,.2)'}`,cursor:'grab',transition:'background .15s'}}>
            <span style={{fontSize:13,color:'#aab6c6',cursor:'grab',flexShrink:0}}>⠿</span>
            <span style={{fontSize:14,fontWeight:800,color:'#fbbf24',fontFamily:"'DM Mono',monospace",flexShrink:0,width:14}}>{i+1}.</span>
            <input value={f} onChange={e=>{const n=[...foco];n[i]=e.target.value;savFoco(n);}} placeholder={`MIT ${i+1}...`} style={{flex:1,background:'transparent',border:'none',outline:'none',fontSize:15,color:'#f1f5f9',fontFamily:"'DM Sans',sans-serif"}}/>
            {f&&<button onClick={()=>{const n=[...foco];n[i]='';savFoco(n);}} style={{padding:'1px 6px',borderRadius:4,border:'none',background:'transparent',color:'#c2ccd8',fontSize:14,cursor:'pointer',flexShrink:0}}>×</button>}
          </div>
        ))}
        <div style={{fontSize:13,color:'#aab6c6',marginTop:4,fontStyle:'italic'}}>💡 Preenche automaticamente com os MITs da IA</div>
        {(()=>{const f2=lsGet('feitos',[]);const prox=CICLO.filter(s=>!f2.includes(s.id)).slice(0,3);if(!prox.length)return null;return(<div style={{marginTop:8}}><div style={{fontSize:13,color:'#aab6c6',fontFamily:"'DM Mono',monospace",marginBottom:4}}>PRÓXIMOS DO CICLO — toque para preencher</div><div style={{display:'flex',gap:5,flexWrap:'wrap'}}>{prox.map(s=>(<button key={s.id} onClick={()=>{const n=[...foco];const idx=n.findIndex(f=>!f);if(idx>=0){const nn=[...n];nn[idx]=s.mat;savFoco(nn);}}} style={{padding:'4px 9px',borderRadius:7,border:`1px solid ${s.cor}35`,background:`${s.cor}10`,color:s.cor,fontSize:13,cursor:'pointer'}}>{s.ic} B{s.id} {s.mat}</button>))}</div></div>);})()}
      </div>

      {/* ── TOGGLE VISÃO ── */}
      <div style={{display:'flex',gap:6,marginBottom:14}}>
        {[['hoje','📅 Hoje'],['semana','🗓️ Semana'],['banco','📋 Tarefas']].map(([v,l])=>{const a=view===v;return(
          <button key={v} onClick={()=>setView(v)} style={{flex:1,padding:'9px',borderRadius:10,border:`1px solid ${a?'#fbbf24':'rgba(148,163,184,.25)'}`,background:a?'rgba(251,191,36,.12)':'transparent',color:a?'#fbbf24':'#aab6c8',fontSize:14,fontWeight:700,cursor:'pointer'}}>{l}</button>
        );})}
      </div>

      {/* ── VISÃO HOJE ── */}
      {view==='hoje'&&<div>
        {/* Resumo */}
        <div style={{background:'rgba(251,191,36,.06)',border:'1px solid rgba(251,191,36,.18)',borderRadius:12,padding:'11px 13px',marginBottom:12}}>
          <div style={{fontSize:13,color:'#fbbf24',fontFamily:"'DM Mono',monospace",marginBottom:6}}>📍 {DIAS_FULL[dw].toUpperCase()}</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {[
              [`💧 ${(mlAtual/1000).toFixed(1)}L`,mlAtual>=META_AGUA?'#34d399':'#60a5fa'],
              [`🏃 ${treino.fez===true?'feito':treino.fez===false?'não fez':'pendente'}`,treino.fez===true?'#34d399':treino.fez===false?'#f87171':'#aab6c8'],
              [`🏡 ${tarefas.filter(t=>!t.done).length} taref.`,tarefas.filter(t=>t.prior==='urgente'&&!t.done).length>0?'#f87171':'#60a5fa'],
              [`⚓ ${naval.filter(Boolean).length}/${NAVAL_ITEMS.length}`,naval.every(Boolean)?'#34d399':'#60a5fa'],
              urgIA.length>0?[`🚨 ${urgIA.length} urgente${urgIA.length>1?'s':''}`, '#f87171']:null,
            ].filter(Boolean).map(([l,col])=>(
              <div key={l} style={{padding:'4px 9px',borderRadius:7,background:`${col}15`,border:`1px solid ${col}30`}}>
                <span style={{fontSize:13,color:col,fontWeight:700}}>{l}</span>
              </div>
            ))}
          </div>
        </div>

        {/* AGENDA DE HOJE (férias) */}
        {(()=>{
          const diaHoje=Math.min(7,Math.max(1,Math.round((new Date().setHours(0,0,0,0)-CICLO_INI_MS)/86400000)+1));
          const lista=CICLO.filter(c=>c.dia===diaHoje);
          const fs=new Set(lsGet('feitos',[]));
          return <AgendaDia lista={lista} feitosSet={fs} dw={dw} onIr={()=>onSetTab('estudo')} onRapido={onRapido}/>;
        })()}
        {/* KAUÊ */}
        <BlocoHeader titulo="⚓ Kauê" k="kaue" cor="#f87171" badge={kagenda.escola?'escola hoje':null}/>
        {aberto.kaue&&<div style={{padding:'12px 13px',borderRadius:'0 0 11px 11px',border:'1px solid rgba(248,113,113,.25)',borderTop:'none',background:'rgba(248,113,113,.05)',marginBottom:8}}>
          <div style={{display:'flex',gap:6,marginBottom:8,flexWrap:'wrap'}}>
            {['Escola','Naval','Basquete','Médico'].map(ct=>(
              <button key={ct} onClick={()=>togKagenda(ct.toLowerCase(),!kagenda[ct.toLowerCase()])} style={{padding:'6px 11px',borderRadius:8,border:`1px solid ${kagenda[ct.toLowerCase()]?'#f87171':'rgba(148,163,184,.28)'}`,background:kagenda[ct.toLowerCase()]?'rgba(248,113,113,.2)':'rgba(30,41,59,.8)',color:kagenda[ct.toLowerCase()]?'#f87171':'#94a3b8',fontSize:14,cursor:'pointer'}}>{ct==='Escola'?'🏫':ct==='Naval'?'⚓':ct==='Basquete'?'🏀':'💊'} {ct}</button>
            ))}
          </div>
          <input value={kagenda.compromisso||''} onChange={e=>togKagenda('compromisso',e.target.value)} placeholder="Compromisso específico..." style={{width:'100%',padding:'7px 10px',borderRadius:8,border:'1px solid rgba(248,113,113,.2)',background:'rgba(248,113,113,.06)',color:'#f1f5f9',fontSize:15,outline:'none',boxSizing:'border-box',marginBottom:8}}/>
          <div style={{fontSize:13,color:'#c2ccd8',fontFamily:"'DM Mono',monospace",marginBottom:6}}>CHECKLIST NAVAL</div>
          {NAVAL_ITEMS.map((it,i)=>(
            <div key={i} onClick={()=>toggleNaval(i)} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 9px',borderRadius:8,marginBottom:3,cursor:'pointer',background:naval[i]?'rgba(52,211,153,.08)':'rgba(30,41,59,.6)',border:`1px solid ${naval[i]?'rgba(52,211,153,.25)':'rgba(148,163,184,.2)'}`}}>
              <div style={{width:15,height:15,borderRadius:'50%',flexShrink:0,border:`2px solid ${naval[i]?'#34d399':'rgba(255,255,255,.2)'}`,background:naval[i]?'#34d399':'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:'#0f172a',fontWeight:900}}>{naval[i]?'✓':''}</div>
              <span style={{fontSize:14,color:naval[i]?'#34d399':'#94a3b8',textDecoration:naval[i]?'line-through':'none'}}>{it}</span>
            </div>
          ))}
        </div>}

        {/* CASA */}
        <BlocoHeader titulo="🏡 Casa" k="casa" cor="#60a5fa" badge={tarefas.filter(t=>t.prior==='urgente'&&!t.done).length>0?`${tarefas.filter(t=>t.prior==='urgente'&&!t.done).length} urgente`:null}/>
        {aberto.casa&&<div style={{padding:'12px 13px',borderRadius:'0 0 11px 11px',border:'1px solid rgba(96,165,250,.2)',borderTop:'none',background:'rgba(96,165,250,.04)',marginBottom:8}}>
          {tarefas.map(t=>(
            <div key={t.id} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 9px',borderRadius:8,marginBottom:4,background:t.done?'rgba(52,211,153,.06)':'rgba(30,41,59,.6)',border:`1px solid ${t.done?'rgba(52,211,153,.2)':'rgba(148,163,184,.2)'}`}}>
              <div onClick={()=>togTarefa(t.id)} style={{width:15,height:15,borderRadius:'50%',flexShrink:0,border:`2px solid ${t.done?'#34d399':PCOR[t.prior]}`,background:t.done?'#34d399':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:'#0f172a',fontWeight:900}}>{t.done?'✓':''}</div>
              <span onClick={()=>togTarefa(t.id)} style={{flex:1,fontSize:14,color:t.done?'#aab6c8':'#f1f5f9',textDecoration:t.done?'line-through':'none',cursor:'pointer'}}>{t.txt}</span>
              <button onClick={()=>delTarefa(t.id)} style={{padding:'1px 6px',borderRadius:4,border:'none',background:'transparent',color:'#c2ccd8',fontSize:13,cursor:'pointer'}}>×</button>
            </div>
          ))}
          <div style={{display:'flex',gap:5,marginTop:6}}>
            <input value={novoT} onChange={e=>setNovoT(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTarefa()} placeholder="Nova tarefa..." style={{flex:1,padding:'7px 10px',borderRadius:8,border:'1px solid rgba(96,165,250,.2)',background:'rgba(96,165,250,.05)',color:'#f1f5f9',fontSize:14,outline:'none'}}/>
            <select value={novoTPrior} onChange={e=>setNovoTPrior(e.target.value)} style={{padding:'7px',borderRadius:8,border:'1px solid rgba(255,255,255,.14)',background:'#454f61',color:'#f1f5f9',fontSize:13,outline:'none',cursor:'pointer'}}>
              <option value="normal">Normal</option><option value="importante">Import.</option><option value="urgente">Urgente</option>
            </select>
            <button onClick={addTarefa} style={{padding:'7px 12px',borderRadius:8,border:'none',background:'#60a5fa',color:'#0f172a',fontSize:16,fontWeight:900,cursor:'pointer'}}>+</button>
          </div>
          <div style={{display:'flex',gap:8,marginTop:8}}>
            <input value={mercado} onChange={e=>{setMercado(e.target.value);lsSet(`casa_m_${dk}`,e.target.value);}} placeholder="🛒 Mercado..." style={{flex:1,padding:'7px 10px',borderRadius:8,border:'1px solid rgba(255,255,255,.12)',background:'rgba(30,41,59,.8)',color:'#f1f5f9',fontSize:14,outline:'none'}}/>
            <input value={cozinhar} onChange={e=>{setCozinhar(e.target.value);lsSet(`casa_c_${dk}`,e.target.value);}} placeholder="🍳 Cozinhar..." style={{flex:1,padding:'7px 10px',borderRadius:8,border:'1px solid rgba(255,255,255,.12)',background:'rgba(30,41,59,.8)',color:'#f1f5f9',fontSize:14,outline:'none'}}/>
          </div>
        </div>}

        {/* DIETA */}
        <BlocoHeader titulo="🥗 Dieta" k="dieta" cor="#34d399" badge={mlAtual>=META_AGUA?'meta água ✓':null}/>
        {aberto.dieta&&<div style={{padding:'12px 13px',borderRadius:'0 0 11px 11px',border:'1px solid rgba(52,211,153,.2)',borderTop:'none',background:'rgba(52,211,153,.04)',marginBottom:8}}>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:13,color:'#c2ccd8',marginBottom:5}}>⏳ JEJUM</div>
            <div style={{display:'flex',gap:6,marginBottom:jejum.fez?6:0}}>
              <button onClick={()=>savJejum('fez',true)} style={{flex:1,padding:'8px',borderRadius:8,border:`2px solid ${jejum.fez===true?'#34d399':'rgba(148,163,184,.28)'}`,background:jejum.fez===true?'rgba(52,211,153,.18)':'rgba(30,41,59,.8)',color:jejum.fez===true?'#34d399':'#94a3b8',fontSize:14,fontWeight:700,cursor:'pointer'}}>✅ Fiz</button>
              <button onClick={()=>savJejum('fez',false)} style={{flex:1,padding:'8px',borderRadius:8,border:`2px solid ${jejum.fez===false?'#f87171':'rgba(148,163,184,.28)'}`,background:'rgba(30,41,59,.8)',color:'#b4c0d1',fontSize:14,fontWeight:700,cursor:'pointer'}}>❌ Não</button>
            </div>
            {jejum.fez===true&&<div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:6}}>
              {['12','14','16','18','20','24'].map(h=><button key={h} onClick={()=>savJejum('horas',h)} style={{padding:'4px 9px',borderRadius:6,border:`1px solid ${jejum.horas===h?'#34d399':'rgba(148,163,184,.25)'}`,background:jejum.horas===h?'rgba(52,211,153,.2)':'transparent',color:jejum.horas===h?'#34d399':'#94a3b8',fontSize:13,cursor:'pointer'}}>{h}h</button>)}
            </div>}
          </div>
          <div>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
              <div style={{fontSize:13,color:'#c2ccd8'}}>💧 ÁGUA</div>
              <span style={{fontSize:13,color:mlAtual>=META_AGUA?'#34d399':'#60a5fa',fontFamily:"'DM Mono',monospace",fontWeight:700}}>{(mlAtual/1000).toFixed(2).replace('.',',')}L / 3L</span>
            </div>
            <BarProg done={mlAtual} total={META_AGUA} cor={mlAtual>=META_AGUA?'#34d399':'#60a5fa'} h={5}/>
            <div style={{display:'flex',gap:6,marginTop:8}}>
              <button onClick={()=>savHidra(Math.max(0,hidra-1))} style={{flex:1,padding:'8px',borderRadius:8,border:'1px solid rgba(96,165,250,.2)',background:'transparent',color:'#60a5fa',fontSize:18,cursor:'pointer'}}>−</button>
              <button onClick={()=>savHidra(Math.min(16,hidra+1))} style={{flex:2,padding:'8px',borderRadius:8,border:'none',background:mlAtual>=META_AGUA?'rgba(52,211,153,.2)':'rgba(96,165,250,.8)',color:mlAtual>=META_AGUA?'#34d399':'#0f172a',fontSize:14,fontWeight:800,cursor:'pointer'}}>{mlAtual>=META_AGUA?`✅ ${(mlAtual/1000).toFixed(1)}L`:'+ 250ml'}</button>
            </div>
          </div>
          <div style={{marginTop:10}}>
            <div style={{fontSize:13,color:'#c2ccd8',marginBottom:5}}>SEGUIU O PLANO?</div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>{setSeguiu(true);lsSet(`seguiu_${dk}`,true);}} style={{flex:1,padding:'8px',borderRadius:8,border:`2px solid ${seguiu===true?'#34d399':'rgba(148,163,184,.28)'}`,background:seguiu===true?'rgba(52,211,153,.18)':'rgba(30,41,59,.8)',color:seguiu===true?'#34d399':'#94a3b8',fontSize:14,fontWeight:700,cursor:'pointer'}}>✅ Sim!</button>
              <button onClick={()=>{setSeguiu(false);lsSet(`seguiu_${dk}`,false);}} style={{flex:1,padding:'8px',borderRadius:8,border:`2px solid ${seguiu===false?'#f87171':'rgba(148,163,184,.28)'}`,background:'rgba(30,41,59,.8)',color:'#b4c0d1',fontSize:14,fontWeight:700,cursor:'pointer'}}>❌ Não</button>
            </div>
          </div>
        </div>}

        {/* TREINO */}
        <BlocoHeader titulo="🏃 Treino" k="treino" cor="#a78bfa" badge={treino.fez===true?'feito ✓':treino.fez===false?'não fez':null}/>
        {aberto.treino&&<div style={{padding:'12px 13px',borderRadius:'0 0 11px 11px',border:'1px solid rgba(167,139,250,.2)',borderTop:'none',background:'rgba(167,139,250,.04)',marginBottom:8}}>
          <input value={treino.tipo} onChange={e=>savTreino('tipo',e.target.value)} placeholder="ex: Corrida leve 35min, Musculação..." style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1px solid rgba(167,139,250,.2)',background:'rgba(167,139,250,.05)',color:'#f1f5f9',fontSize:15,outline:'none',boxSizing:'border-box',marginBottom:8}}/>
          <div style={{display:'flex',gap:8}}>
            <div style={{flex:1}}>
              <div style={{fontSize:13,color:'#c2ccd8',marginBottom:3}}>DURAÇÃO (min)</div>
              <input type="number" value={treino.dur} onChange={e=>savTreino('dur',e.target.value)} placeholder="45" style={{width:'100%',padding:'8px',borderRadius:8,border:'1px solid rgba(167,139,250,.2)',background:'rgba(167,139,250,.05)',color:'#a78bfa',fontSize:16,fontWeight:900,fontFamily:"'DM Mono',monospace",textAlign:'center',outline:'none',boxSizing:'border-box'}}/>
            </div>
            <div style={{flex:2}}>
              <div style={{fontSize:13,color:'#c2ccd8',marginBottom:5}}>FEZ?</div>
              <div style={{display:'flex',gap:6}}>
                <button onClick={()=>savTreino('fez',true)} style={{flex:1,padding:'8px',borderRadius:8,border:`2px solid ${treino.fez===true?'#34d399':'rgba(148,163,184,.28)'}`,background:treino.fez===true?'rgba(52,211,153,.18)':'rgba(30,41,59,.8)',color:treino.fez===true?'#34d399':'#94a3b8',fontSize:14,fontWeight:700,cursor:'pointer'}}>✅ Fiz!</button>
                <button onClick={()=>savTreino('fez',false)} style={{flex:1,padding:'8px',borderRadius:8,border:`2px solid ${treino.fez===false?'#f87171':'rgba(148,163,184,.28)'}`,background:'rgba(30,41,59,.8)',color:'#b4c0d1',fontSize:14,fontWeight:700,cursor:'pointer'}}>❌ Não</button>
              </div>
            </div>
          </div>
        </div>}

        {/* PERGUNTAS */}
        <BlocoHeader titulo="💭 Perguntas Essenciais" k="perguntas" cor="#fbbf24"/>

function ModalConfig({fechar}){
  const[aba,setAba]=useState('ia');
  const[msg,setMsg]=useState('');
  const[akVal,setAkVal]=useState(getAK);
  const[importTxt,setImportTxt]=useState('');
  const[confirmarDel,setConfirmarDel]=useState(false);

  const ABAS=[{id:'ia',l:'🤖 IA'},{id:'cloud',l:'☁️ Nuvem'},{id:'backup',l:'📦 Backup'},{id:'import',l:'📥 Restaurar'},{id:'info',l:'ℹ️ Info'}];
  const[cfgUrl,setCfgUrl]=useState(()=>Sync.getCfg().url);
  const[cfgKey,setCfgKey]=useState(()=>Sync.getCfg().key);
  const[cfgLoad,setCfgLoad]=useState(false);
  const[cmp,setCmp]=useState(null);
  const[cmpLoad,setCmpLoad]=useState(false);
  const[confF,setConfF]=useState('');

  function salvarChave(){setAK(akVal);setMsg('✅ Chave salva!');setTimeout(()=>setMsg(''),3000);}
  function exportar(){
    try{
      const d={};
      for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);try{d[k]=JSON.parse(localStorage.getItem(k));}catch{d[k]=localStorage.getItem(k);}}
      const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      const dt=new Date();
      a.href=url;a.download=`rity-backup-${dt.getDate()}-${dt.getMonth()+1}-${dt.getFullYear()}.json`;
      a.click();URL.revokeObjectURL(url);
      setMsg('✅ Backup exportado!');
    }catch(e){setMsg('❌ Erro ao exportar.');}
  }
  function importar(){
    try{
      const d=JSON.parse(importTxt);
      Object.entries(d).forEach(([k,v])=>localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v)));
      setMsg('✅ Restaurado! Recarregando...');
      setTimeout(()=>window.location.reload(),1500);
    }catch(e){setMsg('❌ JSON inválido.');}
  }
  function importFile(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>setImportTxt(ev.target.result);r.readAsText(f);
  }
  function apagarTudo(){
    if(!confirmarDel){setConfirmarDel(true);return;}
    localStorage.clear();
    setMsg('🗑️ Apagado. Recarregando...');
    setTimeout(()=>window.location.reload(),1500);
  }

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.9)',zIndex:300,display:'flex',alignItems:'flex-end',justifyContent:'center'}} onClick={e=>{if(e.target===e.currentTarget)fechar();}}>
      <div style={{background:'#454f61',borderRadius:'20px 20px 0 0',border:'1px solid rgba(255,255,255,.1)',padding:'20px 18px 40px',width:'100%',maxWidth:520,maxHeight:'90dvh',overflowY:'auto'}}>
        <div style={{width:40,height:4,borderRadius:2,background:'rgba(148,163,184,.28)',margin:'0 auto 16px'}}/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <div>
            <div style={{fontSize:13,letterSpacing:'3px',color:'rgba(251,191,36,.5)',fontFamily:"'DM Mono',monospace"}}>RITY OS · v4.0</div>

// Uma rotina automática lê o Guruja e grava guruja.json na raiz do site. O app lê esse arquivo ao abrir:

// O Guruja guarda, em cada atividade e reforço, o link do caderno do TEC. O app só abre esse link (nunca o guarda sozinho).
const CadernoLink={
  _raw:null,_map:{},
  get(id){
    let raw=null;try{raw=localStorage.getItem('guruja_snap');}catch(e){}
    if(!raw)return null;
    if(raw!==this._raw){
      this._raw=raw;this._map={};
      try{
        const sn=JSON.parse(raw);
        if(GurujaLink.valido(sn)){
          const iA=new Map(),iR=new Map();
          (sn.metas||[]).forEach(m=>{
            (m.atividades||[]).forEach(a=>{if(a.link||!iA.has(a.aid))iA.set(a.aid,a);});
            (m.reforcos||[]).forEach(r=>{if(r.link||!iR.has(r.aid))iR.set(r.aid,r);});
          });
          const okL=it=>it&&typeof it.link==='string'&&/^https:\/\/(www\.)?tecconcursos\.com\.br\//.test(it.link);
          iA.forEach((a,aid)=>{if(okL(a))this._map[aid]=a.link;});
          const cur=(sn.metas||[]).find(m=>m.ordem===(sn.meta_atual||{}).ordem);
          ((cur&&cur.reforcos)||[]).forEach((r,idx)=>{if(okL(r))this._map[IDREF_BASE+idx+1]=r.link;});
        }
      }catch(e){}
    }
    return this._map[id]||null;
  }
};

const GurujaLink={
  KEY:'guruja_snap',ST:'guruja_snap_st',
  lerCache(){try{const v=localStorage.getItem('guruja_snap');return v?JSON.parse(v):null;}catch(e){return null;}},
  status(){try{return JSON.parse(localStorage.getItem('guruja_snap_st')||'null');}catch(e){return null;}},
  formato(s){return !!(s&&s.versao===1&&s.gerado_em&&!isNaN(Date.parse(s.gerado_em))&&Array.isArray(s.metas)&&Array.isArray(s.desempenho)&&s.meta_atual);},
  valido(s){return this.formato(s)&&s.planejamento_id===PLANEJAMENTO.id;},
  aplicarCache(){const s=this.lerCache();if(!this.valido(s))return false;try{this.aplicarNumeros(s);return true;}catch(e){return false;}},
  // Números do snapshot → as estruturas que o app já usa (nível por matéria e painel Dados › Guruja)

    S.metaAtual={n:ma.ordem,feitas:ma.atividades_concluidas,total:ma.atividades_totais,q:ma.questoes||0,a:ma.acertos||0,min:ma.minutos||0};

    const pt=(s.tempo&&s.tempo.por_tipo)||{};
    S.tempo=['Questões','Teoria','Teste','Lei Seca','Revisão'].map(k=>[k,pt[k]||0]).concat([['Reforços',(s.tempo&&s.tempo.reforcos_min)||0]]);
    const minDisc={};((s.tempo&&s.tempo.disciplinas)||[]).forEach(x=>{minDisc[x.sigla]=x.min;});
    const tend={estavel:'estável',melhorando:'melhorando',piorando:'piorando'};
    const pesoN=+(100/MATERIAS.length).toFixed(2);
    const rows=s.desempenho.filter(d=>GURUJA_SIGLA_APP[d.sigla]&&d.q!=null).map(d=>[GURUJA_SIGLA_APP[d.sigla],d.peso!=null?d.peso:pesoN,d.q,d.a,d.pct,d.media,d.mediana,d.decil,tend[d.tendencia]||null,minDisc[d.sigla]||0]);
    S.disc=rows.concat(MATERIAS.filter(m=>!rows.some(r=>r[0]===m.app)).map(m=>[m.app,pesoN,0,0,null,null,null,null,null,minDisc[m.sigla]||0]));
    if(Array.isArray(s.fracos)&&s.fracos.length)S.fracos=s.fracos.slice(0,10).map(f=>[f.titulo,GURUJA_SIGLA_CURTA[f.sigla]||f.sigla,f.q,f.a,f.pct,f.media,f.link]);
    const cur=(s.metas||[]).find(m=>m.ordem===ma.ordem);

  },
  async buscar(){
    const st={tent:Date.now(),ok:false};
    try{
      const r=await fetch('guruja.json?t='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const s=await r.json();
      if(!this.formato(s))throw new Error('formato inesperado');
      if(s.planejamento_id!==PLANEJAMENTO.id)throw new Error(`guruja.json ainda é de outro planejamento — aguardando a Meta 1 de "${PLANEJAMENTO.nome}"`);
      const prev=this.lerCache();
      if(prev&&Date.parse(s.gerado_em)<Date.parse(prev.gerado_em))throw new Error('arquivo mais antigo que o já lido');
      if(!prev||prev.gerado_em!==s.gerado_em)localStorage.setItem('guruja_snap',JSON.stringify(s));
      // o plano muda quando a meta, as atividades ou os reforços mudam: recarrega uma vez para remontar (trava por sessão)
      if(assinaturaPlano(s)!==PLANO_ASSINATURA){
        let jaRecarregou=false;try{jaRecarregou=sessionStorage.getItem('plano_recarga')===assinaturaPlano(s);}catch(e){}
        if(!jaRecarregou){try{sessionStorage.setItem('plano_recarga',assinaturaPlano(s));}catch(e){}window.location.reload();return st;}
      }
      st.mudou=this.reconciliar(s,prev);
      this.aplicarNumeros(s);
      st.ok=true;st.em=s.gerado_em;
    }catch(e){st.erro=String(e&&e.message||e).slice(0,120);}
    try{localStorage.setItem('guruja_snap_st',JSON.stringify(st));}catch(e){}
    try{window.dispatchEvent(new Event('guruja-atualizado'));}catch(e){}
    return st;
  }
};

      {S.fracos.length>0&&<div style={{fontSize:13,color:'var(--text4)',fontFamily:mono,letterSpacing:'1px',margin:'14px 0 6px'}}>PONTOS FRACOS (ABAIXO DA MÉDIA GERAL) · CADERNO NO TEC</div>}
      {S.fracos.map((f,i)=>(
        <a key={i} href={f[6]||undefined} target="_blank" rel="noopener noreferrer" style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',borderRadius:10,background:'rgba(255,255,255,.03)',border:'1px solid rgba(148,163,184,.15)',marginBottom:6,textDecoration:'none'}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>{f[0]}</div>
            <div style={{fontSize:13,color:'var(--text4)'}}>{f[1]} · {f[3]}/{f[2]} · média geral {fm(f[5])}%</div>
          </div>
          <div style={{fontSize:15,fontWeight:900,fontFamily:mono,color:cor(f[4])}}>{fm(f[4])}%</div>
        </a>
      ))}

      <div style={{fontSize:13,color:'var(--text4)',fontFamily:mono,letterSpacing:'1px',margin:'14px 0 6px'}}>ONDE FOI O SEU TEMPO</div>
      {S.tempo.map(t=>(
        <div key={t[0]} style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
          <div style={{width:70,fontSize:13,color:'var(--text3)'}}>{t[0]}</div>
          <div style={{flex:1,height:9,borderRadius:5,background:'rgba(148,163,184,.15)',overflow:'hidden'}}><div style={{height:'100%',width:`${t[1]/maxT*100}%`,background:t[1]===0?'#f87171':'#60a5fa'}}/></div>
          <div style={{width:56,textAlign:'right',fontSize:13,fontFamily:mono,color:t[1]===0?'#f87171':'var(--text3)'}}>{hm(t[1])}</div>
        </div>
      ))}

      {S.feitoMeta4.length>0&&<div style={{fontSize:13,color:'var(--text4)',fontFamily:mono,letterSpacing:'1px',margin:'14px 0 6px'}}>META {S.metaAtual.n} · CONCLUÍDAS NO GURUJA</div>}
      {S.feitoMeta4.map((f,i)=>(
        <div key={i} style={{display:'flex',gap:8,fontSize:14,color:'var(--text3)',padding:'4px 2px'}}>
          <span style={{flex:1}}>✅ {f[0]}</span><span style={{fontFamily:mono}}>{f[3]}/{f[2]} · {fm(f[2]>0?f[3]/f[2]*100:null,0)}% · {hm(f[4])}</span>
        </div>
      ))}
    </div>
  );
}
function TabDados({horas}){
  const[sub,setSub]=useState('guruja');
  const[semOffset,setSemOffset]=useState(0);
  const[matIdx,setMatIdx]=useState(0);
  const[insightTexto,setInsightTexto]=useState({diario:'',materia:'',geral:''});
  const[insightLoad,setInsightLoad]=useState('');

  const hist=useMemo(()=>lsGet('historico_diario',[]),[]);
  const feitos=useMemo(()=>lsGet('feitos',[]),[]);

  // ── helpers ──────────────────────────────────────────────────
  const corAc=p=>p===null?'#aab6c8':p>=85?'#34d399':p>=70?'#fbbf24':p>=60?'#fb923c':'#f87171';
  const fmtMin=m=>{if(!m)return'0min';const h=Math.floor(m/60);const mn=m%60;return h>0?(mn>0?`${h}h${mn}min`:`${h}h`):`${mn}min`;};

  // ── semana ISO ───────────────────────────────────────────────
  const getSemana=(offset=0)=>{
    const d=new Date(); d.setHours(0,0,0,0);
    const dow=(d.getDay()+6)%7;
    const seg=new Date(d); seg.setDate(d.getDate()-dow+offset*7);
    const dom=new Date(seg); dom.setDate(seg.getDate()+6);
    return{ini:seg,fim:dom,iniMs:seg.getTime(),fimMs:dom.getTime()+86399999};
  };
  const sem=useMemo(()=>getSemana(semOffset),[semOffset]);
  const fmtData=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;

  // ── dados da semana ──────────────────────────────────────────
  const histSem=useMemo(()=>hist.filter(r=>{const dt=r.dt||0;return dt>=sem.iniMs&&dt<=sem.fimMs;}),[hist,sem]);
  const horasSem=useMemo(()=>horas.filter(e=>e.dt>=sem.iniMs&&e.dt<=sem.fimMs),[horas,sem]);
  const minSem=horasSem.reduce((s,e)=>s+e.min,0);
  const totalQ=histSem.reduce((s,r)=>s+(parseInt(r.questoes)||0),0);
  const totalAc=histSem.reduce((s,r)=>s+(parseInt(r.acertei)||0),0);
  const pctSem=totalQ>0?Math.round(totalAc/totalQ*100):null;
  const diasSem=new Set(histSem.map(r=>r.dia||r.id?.split('_')[0]||'')).size;

  // streak
  const streak=useMemo(()=>{
    const dias=[...new Set(hist.map(r=>r.dia||r.id?.split('_')[0]||'').filter(Boolean))].sort().reverse();
    let s=0; const hoje=new Date().toISOString().split('T')[0];
    for(let i=0;i<dias.length;i++){
      const exp=new Date(hoje); exp.setDate(exp.getDate()-i);
      if(dias[i]===exp.toISOString().split('T')[0]) s++;
      else break;
    }
    return s;
  },[hist]);

  // top/pior matéria da semana
  const porMatSem=useMemo(()=>{
    const m={};
    histSem.forEach(r=>{
      if(!r.materia)return;
      if(!m[r.materia])m[r.materia]={q:0,ac:0,min:0};
      m[r.materia].q+=parseInt(r.questoes)||0;
      m[r.materia].ac+=parseInt(r.acertei)||0;
    });
    horasSem.forEach(e=>{if(e.mat&&m[e.mat])m[e.mat].min+=e.min;});
    return Object.entries(m).map(([mat,v])=>({mat,q:v.q,ac:v.ac,min:v.min,pct:v.q>0?Math.round(v.ac/v.q*100):null}));
  },[histSem,horasSem]);

  const comDados=porMatSem.filter(x=>x.q>=5);
  const melhor=comDados.sort((a,b)=>(b.pct||0)-(a.pct||0))[0]||null;
  const pior=comDados.sort((a,b)=>(a.pct||0)-(b.pct||0))[0]||null;
  const top3=[...porMatSem].sort((a,b)=>b.min-a.min).slice(0,3);

  // negligenciadas (sem registro há 7 dias)
  const negligentes=useMemo(()=>{
    const limite=Date.now()-7*86400000;
    return Object.keys(GURUJA_SEED).filter(mat=>{
      const ult=hist.filter(r=>r.materia===mat).sort((a,b)=>(b.dt||0)-(a.dt||0))[0];
      return!ult||(ult.dt||0)<limite;
    });
  },[hist]);

  // horário de pico
  const picoPorFaixa=useMemo(()=>{
    const faixas={madrugada:{q:0,ac:0,l:'🌙 Madrugada',h:'0–5h'},manha:{q:0,ac:0,l:'🌅 Manhã',h:'5–12h'},tarde:{q:0,ac:0,l:'☀️ Tarde',h:'12–18h'},noite:{q:0,ac:0,l:'🌆 Noite',h:'18–24h'}};
    hist.forEach(r=>{
      if(!r.dt)return;
      const h=new Date(r.dt).getHours();
      const f=h<5?'madrugada':h<12?'manha':h<18?'tarde':'noite';
      faixas[f].q+=parseInt(r.questoes)||0;
      faixas[f].ac+=parseInt(r.acertei)||0;
    });
    const total=Object.values(faixas).reduce((s,f)=>s+f.q,0);
    if(total<10)return null;
    const melhorFaixa=Object.values(faixas).filter(f=>f.q>=5).sort((a,b)=>(b.ac/Math.max(b.q,1))-(a.ac/Math.max(a.q,1)))[0];
    return melhorFaixa?{...melhorFaixa,pct:Math.round(melhorFaixa.ac/melhorFaixa.q*100)}:null;
  },[hist]);

  // ── matérias ordenadas por prioridade Meirelles para sub-aba Por Matéria ─
  const matsOrdenadas=useMemo(()=>{
    const ordem={urgente:0,alta:1,media:2,leve:3,cortar:4};
    return Object.keys(GURUJA_SEED).sort((a,b)=>(ordem[getPrioridadeMeirelles(a).prioridade]||5)-(ordem[getPrioridadeMeirelles(b).prioridade]||5));
  },[]);
  const matAtual=matsOrdenadas[matIdx]||matsOrdenadas[0]||'';
  const gseedAtual=GURUJA_SEED[matAtual]||{};
  const meir=getPrioridadeMeirelles(matAtual);

  // dados históricos da matéria atual
  const histMat=useMemo(()=>hist.filter(r=>r.materia===matAtual),[hist,matAtual]);
  const horasMat=useMemo(()=>horas.filter(e=>e.mat===matAtual),[horas,matAtual]);
  const minMatTotal=horasMat.reduce((s,e)=>s+e.min,0);
  const qMatTotal=histMat.reduce((s,r)=>s+(parseInt(r.questoes)||0),0);
  const acMatTotal=histMat.reduce((s,r)=>s+(parseInt(r.acertei)||0),0);
  const pctMat=qMatTotal>0?Math.round(acMatTotal/qMatTotal*100):null;

  // evolução semanal da matéria (6 semanas)
  const evolMat=useMemo(()=>Array.from({length:6},(_,i)=>{
    const s=getSemana(-5+i);
    const ss=histMat.filter(r=>(r.dt||0)>=s.iniMs&&(r.dt||0)<=s.fimMs);
    const q=ss.reduce((s,r)=>s+(parseInt(r.questoes)||0),0);
    const ac=ss.reduce((s,r)=>s+(parseInt(r.acertei)||0),0);
    return{label:`S${i+1}`,pct:q>0?Math.round(ac/q*100):null,q};
  }),[histMat]);

  // comparativo períodos (Forma 3) — janela rolante de 14 dias, nunca fica desatualizado
  const cicloAtualData={ini:new Date(Date.now()-14*86400000),label:'Últimos 14 dias'};
  const ciclsComp=useMemo(()=>{
    const mats=Object.keys(GURUJA_SEED);
    return mats.map(mat=>{
      const ant=hist.filter(r=>r.materia===mat&&new Date(r.dia||r.id?.split('_')[0]||'2000-01-01')<cicloAtualData.ini);
      const atu=hist.filter(r=>r.materia===mat&&new Date(r.dia||r.id?.split('_')[0]||'2000-01-01')>=cicloAtualData.ini);
      const calc=arr=>{const q=arr.reduce((s,r)=>s+(parseInt(r.questoes)||0),0);const ac=arr.reduce((s,r)=>s+(parseInt(r.acertei)||0),0);return q>0?Math.round(ac/q*100):null;};
      const pAnt=calc(ant); const pAtu=calc(atu);
      const minAtu=horas.filter(e=>e.mat===mat&&new Date(e.dt||0)>=cicloAtualData.ini).reduce((s,e)=>s+e.min,0);
      return{mat,pAnt,pAtu,delta:pAnt!==null&&pAtu!==null?pAtu-pAnt:null,minAtu};
    });
  },[hist,horas]);

  // ── gerar insight IA ─────────────────────────────────────────
  const gerarInsight=async(tipo)=>{
    setInsightLoad(tipo);
    const ctx=tipo==='diario'
      ?`Semana ${fmtData(sem.ini)}-${fmtData(sem.fim)}: ${fmtMin(minSem)} estudados, ${totalQ} questões, ${pctSem}% acerto, ${diasSem} dias. Top matérias: ${top3.map(t=>`${t.mat} ${t.pct}%`).join(', ')}. Negligenciadas: ${negligentes.slice(0,3).join(', ')||'nenhuma'}.`
      :tipo==='materia'
      ?`Matéria: ${matAtual}. Acerto total: ${pctMat}%. Horas: ${fmtMin(minMatTotal)}. Prioridade: ${meir.prioridade}. Jornada Guruja: ${gseedAtual.jornada}%. Evolução: ${evolMat.map(e=>e.pct!==null?e.pct+'%':'—').join('→')}.`
      :`Comparativo ciclos: ${ciclsComp.filter(c=>c.pAtu!==null).map(c=>`${c.mat}: ant ${c.pAnt}% → atu ${c.pAtu}% (${c.delta!==null?(c.delta>=0?'+':'')+c.delta+'pts':'novo'})`).join('; ')}.`;
    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-5',max_tokens:200,system:'Você é analista de estudos para concursos. Responda em português, máximo 100 palavras, identifique o padrão mais importante e dê UMA ação concreta. Seja direto.',messages:[{role:'user',content:`Analise: ${ctx} Ciclo: ${feitos.length}/48 blocos feitos.`}]})});
      const d=await resp.json();
      const txt=d.content?.[0]?.text||'Sem resposta.';
      setInsightTexto(prev=>({...prev,[tipo]:txt}));
    }catch(e){setInsightTexto(prev=>({...prev,[tipo]:'Erro ao gerar insight.'}));}
    setInsightLoad('');
  };

  // ── Painel de negligência + pico (Forma 4) ───────────────────
  const PainelNegligencia=()=>(
    <div style={{marginBottom:14}}>
      <div style={{padding:'10px 13px',borderRadius:11,background:'rgba(248,113,113,.06)',border:'1px solid rgba(248,113,113,.18)',marginBottom:8}}>
        <div style={{fontSize:13,color:'#f87171',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:6}}>⚠️ SEM REGISTRO HÁ +7 DIAS</div>
        {negligentes.length===0
          ?<div style={{fontSize:13,color:'#34d399'}}>✅ Todas as matérias ativas esta semana</div>
          :<div style={{display:'flex',flexWrap:'wrap',gap:5}}>
            {negligentes.slice(0,6).map(m=>{
              const ult=hist.filter(r=>r.materia===m).sort((a,b)=>(b.dt||0)-(a.dt||0))[0];
              const dias=ult?Math.floor((Date.now()-(ult.dt||0))/86400000):null;
              return<span key={m} style={{fontSize:13,padding:'2px 8px',borderRadius:5,background:'rgba(248,113,113,.12)',color:'#f87171',fontFamily:"'DM Mono',monospace"}}>{m.replace('Dir. ','').slice(0,14)}{dias?` · ${dias}d`:''}</span>;
            })}
          </div>
        }
      </div>
      {picoPorFaixa&&(
        <div style={{padding:'9px 13px',borderRadius:11,background:'rgba(96,165,250,.06)',border:'1px solid rgba(96,165,250,.18)'}}>
          <div style={{fontSize:13,color:'#60a5fa',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:3}}>⚡ SEU HORÁRIO DE PICO</div>
          <div style={{fontSize:15,color:'#60a5fa',fontWeight:700}}>{picoPorFaixa.l} · {picoPorFaixa.h} · <span style={{color:'#34d399'}}>{picoPorFaixa.pct}% acerto</span></div>
        </div>
      )}
    </div>
  );

  // ── Botão insight (Forma 5) ───────────────────────────────────
  const BotaoInsight=({tipo})=>(
    <div style={{marginTop:16}}>
      {!insightTexto[tipo]
        ?<button onClick={()=>gerarInsight(tipo)} disabled={insightLoad===tipo}
          style={{width:'100%',padding:'12px',borderRadius:11,border:'1px solid rgba(99,102,241,.4)',background:'rgba(99,102,241,.08)',color:'#a5b4fc',fontSize:15,fontWeight:700,cursor:'pointer'}}>
          {insightLoad===tipo?'⏳ Gerando insight...':'💡 Gerar insight desta análise'}
        </button>
        :<div style={{padding:'13px',borderRadius:11,background:'rgba(99,102,241,.1)',border:'1px solid rgba(99,102,241,.3)'}}>
          <div style={{fontSize:13,color:'#a5b4fc',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:6}}>💡 INSIGHT IA</div>
          <div style={{fontSize:14,color:'#e8edf5',lineHeight:1.6}}>{insightTexto[tipo]}</div>
        </div>
      }
    </div>
  );

  // ── SUB-ABA DIÁRIO — Relatório Semanal (Forma 1) ─────────────
  function SubDiario(){
    return(
      <div>
        {/* Navegação de semanas */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',borderRadius:12,background:'rgba(99,102,241,.06)',border:'1px solid rgba(99,102,241,.2)',marginBottom:14}}>
          <button onClick={()=>setSemOffset(v=>v-1)} style={{padding:'6px 14px',borderRadius:8,border:'1px solid rgba(99,102,241,.3)',background:'rgba(99,102,241,.1)',color:'#a5b4fc',fontSize:18,cursor:'pointer'}}>←</button>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:15,fontWeight:900,color:'#e8edf5'}}>Semana de {fmtData(sem.ini)} a {fmtData(sem.fim)}</div>
            <div style={{fontSize:13,color:'#c2ccd8',fontFamily:"'DM Mono',monospace"}}>{semOffset===0?'SEMANA ATUAL':semOffset===-1?'SEMANA PASSADA':`há ${Math.abs(semOffset)} semanas`}</div>
          </div>
          <button onClick={()=>setSemOffset(v=>Math.min(v+1,0))} disabled={semOffset===0} style={{padding:'6px 14px',borderRadius:8,border:'1px solid rgba(99,102,241,.3)',background:semOffset===0?'rgba(148,163,184,.08)':'rgba(99,102,241,.1)',color:semOffset===0?'#aab6c8':'#a5b4fc',fontSize:18,cursor:semOffset===0?'default':'pointer'}}>→</button>
        </div>

        {/* Cards de métricas */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:8,marginBottom:14}}>
          {[
            ['⏱',fmtMin(minSem),'Horas estudadas',`${Math.round(minSem/36/60*100)}% da meta 36h`,'#a5b4fc'],
            ['📅',diasSem,'Dias estudados',`${streak} dia(s) consecutivos`,'#60a5fa'],
            ['📝',totalQ||'—','Questões','nesta semana','#fbbf24'],
            ['🎯',pctSem!==null?pctSem+'%':'—','Acerto médio',pctSem!==null?(pctSem>=80?'✅ acima da meta':'⚠️ abaixo de 80%'):'sem dados','#34d399'],
          ].map(([ic,v,l,sub,c])=>(
            <div key={l} style={{padding:'14px',borderRadius:12,background:`${c}08`,border:`1px solid ${c}25`}}>
              <div style={{fontSize:14,marginBottom:4}}>{ic}</div>
              <div style={{fontSize:23,fontWeight:900,color:c,fontFamily:"'DM Mono',monospace",lineHeight:1}}>{v}</div>
              <div style={{fontSize:13,color:'var(--text3)',marginTop:4}}>{l}</div>
              <div style={{fontSize:13,color:'#aab6c6',marginTop:2}}>{sub}</div>
            </div>
          ))}
        </div>

        {/* Barra de progresso da meta */}
        <div style={{marginBottom:14,padding:'12px',borderRadius:11,background:'rgba(99,102,241,.06)',border:'1px solid rgba(99,102,241,.18)'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
            <span style={{fontSize:13,color:'#a5b4fc',fontWeight:700}}>Meta semanal: 36h</span>
            <span style={{fontSize:13,color:'#a5b4fc',fontFamily:"'DM Mono',monospace",fontWeight:900}}>{Math.min(100,Math.round(minSem/36/60*100))}%</span>
          </div>
          <div style={{height:8,borderRadius:4,background:'rgba(255,255,255,.06)',overflow:'hidden'}}>
            <div style={{width:`${Math.min(100,Math.round(minSem/36/60*100))}%`,height:'100%',background:'#a5b4fc',borderRadius:4,transition:'width .5s'}}/>
          </div>
        </div>

        {/* Melhor e pior matéria */}
        {(melhor||pior)&&(
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
            {melhor&&<div style={{padding:'12px',borderRadius:11,background:'rgba(52,211,153,.06)',border:'1px solid rgba(52,211,153,.2)'}}>
              <div style={{fontSize:13,color:'#34d399',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:4}}>🏆 MELHOR SEMANA</div>
              <div style={{fontSize:15,fontWeight:800,color:'var(--text)'}}>{melhor.mat.replace('Dir. ','').slice(0,16)}</div>
              <div style={{fontSize:20,fontWeight:900,color:'#34d399',fontFamily:"'DM Mono',monospace"}}>{melhor.pct}%</div>
            </div>}
            {pior&&pior.mat!==melhor?.mat&&<div style={{padding:'12px',borderRadius:11,background:'rgba(248,113,113,.06)',border:'1px solid rgba(248,113,113,.2)'}}>
              <div style={{fontSize:13,color:'#f87171',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:4}}>⚠️ ATENÇÃO</div>
              <div style={{fontSize:15,fontWeight:800,color:'var(--text)'}}>{pior.mat.replace('Dir. ','').slice(0,16)}</div>
              <div style={{fontSize:20,fontWeight:900,color:'#f87171',fontFamily:"'DM Mono',monospace"}}>{pior.pct}%</div>
            </div>}
          </div>
        )}

        {/* Top 3 matérias */}
        {top3.length>0&&(
          <div style={{marginBottom:14}}>
            <div style={{fontSize:13,color:'#c2ccd8',fontFamily:"'DM Mono',monospace",letterSpacing:'1px',marginBottom:8}}>📊 TOP MATÉRIAS DA SEMANA</div>
            {top3.map((t,i)=>{
              const c=corAc(t.pct);
              return(
                <div key={t.mat} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,background:'rgba(255,255,255,.02)',border:'1px solid rgba(255,255,255,.06)',marginBottom:5}}>
                  <span style={{fontSize:16,fontWeight:900,color:'#9fabbc',fontFamily:"'DM Mono',monospace",width:20}}>{i+1}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:15,fontWeight:700,color:'var(--text)'}}>{t.mat}</div>
                    <div style={{fontSize:13,color:'#aab6c6'}}>{fmtMin(t.min)} · {t.q} questões</div>
                  </div>
                  <div style={{fontSize:18,fontWeight:900,color:c,fontFamily:"'DM Mono',monospace"}}>{t.pct!==null?t.pct+'%':'—'}</div>
                </div>
              );
            })}
          </div>
        )}

        {histSem.length===0&&<div style={{textAlign:'center',padding:'24px',color:'#9fabbc',fontSize:15,border:'1px dashed rgba(148,163,184,.15)',borderRadius:12,marginBottom:14}}>Nenhuma sessão registrada nesta semana.</div>}

        <BotaoInsight tipo="diario"/>
      </div>
    );
  }

  // ── SUB-ABA POR MATÉRIA (Forma 2) ────────────────────────────
  function SubPorMateria(){
    const corM=corMeirelles(meir.prioridade);
    const maxEvolPct=Math.max(...evolMat.map(e=>e.pct||0),100);
    return(
      <div>
        {/* Navegação de matérias */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>

  },[]);

  const feitosSet=useMemo(()=>new Set(feitos),[feitos]);
  const pendentes=useMemo(()=>CICLO.filter(s=>!feitosSet.has(s.id)),[feitosSet]);
  // Carimba o dia em que cada atividade foi concluída (usado pela fila dinâmica da Meta)
  useEffect(()=>{
    try{
      const dt={...lsGet('feitos_dt',{})};let ch=false;const hojeMs=new Date().setHours(0,0,0,0);
      feitos.forEach(id=>{if(!dt[id]){dt[id]=hojeMs;ch=true;}});
      Object.keys(dt).forEach(k=>{if(!feitos.includes(+k)){delete dt[k];ch=true;}});
      if(ch)lsSet('feitos_dt',dt);
    }catch(e){}
  },[feitos]);
  const todayStart=useMemo(()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();},[clock.toDateString()]);
  const semStart=todayStart-6*86400000;
  const tmSugestao=useMemo(()=>calcTempoMorto(feitos,horas,historico),[feitos,horas,historico,clock.toDateString()]);
  const minHoje=useMemo(()=>horas.filter(e=>e.dt>=todayStart).reduce((s,e)=>s+e.min,0),[horas,todayStart]);
  const minSemana=useMemo(()=>horas.filter(e=>e.dt>=semStart).reduce((s,e)=>s+e.min,0),[horas,semStart]);
  const metaHoras=lsGet('meta_horas_sem',35);
  const appCtx={cicloNum,feitosN:feitos.length,N,pendentes,minHoje,minSemana};

  const registrarVolta=(motivo)=>{
    // Camada 3 — salva histórico de ausências para padrão IA
    const hist=lsGet('historico_ausencias',[]);
    if(diasAusente>=2){
      hist.push({
        dias:diasAusente,
        motivo,
        blocos:feitos.length,
        dt:Date.now(),
        semana:getDK(),
      });
      lsSet('historico_ausencias',hist.slice(-20)); // guarda últimas 20
    }
    setTelaVolta(false);
  };

  const concluir=id=>{if(feitos.includes(id))return;const n=[...feitos,id];if(n.length>=N){lsSet('feitos',[]);lsSet('cicloNum',cicloNum+1);setFeitos([]);setCicloNum(c=>c+1);setTrofeu(true);setTimeout(()=>setTrofeu(false),4000);}else{lsSet('feitos',n);setFeitos(n);}};
  const desmarcar=n=>{lsSet('feitos',n);setFeitos(n);};
  const irPara=id=>{
    const targetIdx=CICLO.findIndex(s=>s.id===id);
    // IDs de todos os blocos ANTES do destino
    const anteriores=CICLO.slice(0,targetIdx).map(s=>s.id);
    // Une os já feitos com os anteriores — sem apagar o que foi feito fora de ordem
    const merged=[...new Set([...feitos,...anteriores])];
    // Remove o bloco destino da lista (para ele ficar como próximo)
    const final=merged.filter(fid=>fid!==id);
    lsSet('feitos',final);setFeitos(final);
  };
  const addHoras=e=>{const n=[...horas,e];lsSet('horas',n);setHoras(n);};
  // Registro rápido: grava no histórico (alimenta o nível da matéria), nas horas e marca a atividade como feita
  const salvarRapido=(item,d)=>{
    try{
      const agora=Date.now();
      const rid=getDK()+'_r'+item.id+'_'+agora;
      const reg={id:rid,materia:item.mat,assunto:item.conteudo||'',tempo:String(d.tempo),questoes:d.temQ?String(d.questoes):'',acertei:d.temQ?String(d.acertei):'',dificuldade:d.dif||0,obs:(d.obs||'')+(d.inteira?'':(d.obs?' · ':'')+'feita só em parte'),pendente:'',dia:getDK(),dt:agora,origem:'rapido',itemId:item.id,...((item.reforcoN||(item.id>=601&&item.id<=699))?{reforcoN:item.reforcoN||(item.id-600),metaOrdem:PLANO_GURUJA?PLANO_GURUJA.cur.ordem:null}:{}),parcial:!d.inteira};
      lsSet('historico_diario',[...lsGet('historico_diario',[]),reg].sort((a,b)=>(a.dt||0)-(b.dt||0)));
      addHoras({mat:item.mat,min:d.tempo,dt:agora,rid});
      if(item.fora){const ff=lsGet('fora_feitos',{});ff[item.id]={dt:agora,min:d.tempo,q:d.temQ?d.questoes:0,a:d.temQ?d.acertei:0};lsSet('fora_feitos',ff);}
      else if(d.inteira)concluir(item.id);
      syncHistorico();
      setRapido(null);setRapidoVer(v=>v+1);
      setRapidoMsg(`✅ ${item.mat}: ${d.tempo} min${d.temQ?` · ${d.acertei}/${d.questoes} (${Math.round(d.acertei/d.questoes*100)}%)`:''} registrado${item.fora||!d.inteira?'':' e marcada como feita'}`);
      setTimeout(()=>setRapidoMsg(''),4500);
    }catch(e){alert('❌ Não consegui salvar: '+e.message);}
  };
  const syncHistorico=()=>setHistorico(lsGet('historico_diario',[]));
  const saveMIT=itens=>{lsSet('mit',itens);setMit(itens);};
  const savePlano=p=>{setPlanoSemana(p);lsSet('plano_semanal',p);};

  const pct=N>0?Math.round(feitos.length/N*100):0;
  const prox=pendentes[0];
  const corPrx=prox?.tag?.includes('TRIÂNGULO')?'#fbbf24':prox?.cor||'#fbbf24';
  const urgentes=lsGet('rev_urgentes',[]);

  const chaveOK=getAK().startsWith('sk-ant');

  const TABS=[
    {id:'ia',e:'🤖',l:'IA'},
    {id:'estudo',e:'📚',l:'Estudo'},
    {id:'hoje',e:'📅',l:'Hoje'},
    {id:'discursiva',e:'⚖️',l:'Decisão'},
    {id:'revisao',e:'🧠',l:'Revisão'},
    {id:'dados',e:'📓',l:'Dados'},
    {id:'mapa',e:'📊',l:'Mapa'},
  ];

  return(
    <div style={{minHeight:'100dvh',background:'var(--bg)',display:'flex',flexDirection:'column'}}>

      {/* ── TELA DE VOLTA — aparece quando ficou 2+ dias fora ── */}
      {telaVolta&&(
        <div style={{position:'fixed',inset:0,background:'var(--bg)',zIndex:500,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24}}>
          <div style={{maxWidth:360,width:'100%'}}>
            {/* Ícone e saudação */}
            <div style={{textAlign:'center',marginBottom:28}}>
              <div style={{fontSize:48,marginBottom:12}}>
                {diasAusente>=7?'🌱':diasAusente>=3?'☕':'👋'}
              </div>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:23,color:'var(--text)',marginBottom:8}}>
                {diasAusente>=7
                  ?'Você voltou.'
                  :diasAusente>=3
                  ?'Bem-vinda de volta.'
                  :'Olá, Ritchely.'
                }
              </div>
              <div style={{fontSize:15,color:'var(--text4)',lineHeight:1.7}}>
                {diasAusente>=7
                  ?`Ficou ${diasAusente} dias fora. Tudo bem. O importante é que você voltou.`
                  :diasAusente>=3
                  ?`${diasAusente} dias fora. Não precisa recuperar tudo hoje.`
                  :`${diasAusente} dias fora. Vamos retomar.`
                }
              </div>
            </div>

            {/* O que aconteceu */}
            <div style={{marginBottom:20}}>
              <div style={{fontSize:14,color:'var(--text4)',fontFamily:"'DM Mono',monospace",marginBottom:10,textAlign:'center'}}>O QUE ACONTECEU?</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                {[
                  {v:'sobrecarregada',l:'Estava sobrecarregada'},
                  {v:'imprevisto',l:'Tive um imprevisto'},
                  {v:'desmotivada',l:'Perdi a motivação'},
                  {v:'pausa',l:'Precisava de uma pausa'},
                ].map(({v,l})=>(
                  <button key={v} onClick={()=>setVoltaMotivo(v)}
                    style={{padding:'12px 8px',borderRadius:10,border:`2px solid ${voltaMotivo===v?'#fbbf24':'var(--border)'}`,background:voltaMotivo===v?'rgba(251,191,36,.1)':'transparent',color:voltaMotivo===v?'#fbbf24':'var(--text4)',fontSize:15,cursor:'pointer',lineHeight:1.4,transition:'all .15s'}}>
                    {l}
                  </button>
                ))}
              </div>
            </div>

            {/* Modo mínimo — destaque */}
            <div style={{padding:'16px',borderRadius:14,background:'rgba(167,139,250,.08)',border:'2px solid rgba(167,139,250,.3)',marginBottom:16}}>
              <div style={{fontSize:13,color:'#a78bfa',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:6,letterSpacing:'1px'}}>🃏 MODO MÍNIMO — começo mais fácil</div>
              <div style={{fontSize:15,color:'var(--text)',fontWeight:700,marginBottom:4}}>Só Anki — 25 cards</div>
              <div style={{fontSize:14,color:'var(--text4)',lineHeight:1.6,marginBottom:12}}>
                Isso já conta. Isso já é suficiente para hoje. O volume acumulado não precisa ser recuperado agora.
              </div>
              <button onClick={()=>{registrarVolta(voltaMotivo||'pausa');setTab('hoje');}}
                style={{width:'100%',padding:'13px',borderRadius:10,border:'none',background:'#a78bfa',color:'#0f172a',fontSize:15,fontWeight:900,cursor:'pointer',letterSpacing:'1px'}}>
                🃏 Só Anki hoje — vamos lá
              </button>
            </div>

            {/* Ver tudo — secundário */}
            <button onClick={()=>registrarVolta(voltaMotivo||'pausa')}
              style={{width:'100%',padding:'11px',borderRadius:10,border:'1px solid var(--border)',background:'transparent',color:'var(--text4)',fontSize:15,cursor:'pointer'}}>
              Ver tudo normalmente →
            </button>

            {/* Padrão identificado — só aparece se tiver histórico */}
            {(()=>{
              const hist=lsGet('historico_ausencias',[]);
              if(hist.length<3)return null;
              const mediaD=Math.round(hist.reduce((s,h)=>s+h.dias,0)/hist.length);
              const motivoFreq=hist.reduce((acc,h)=>{acc[h.motivo]=(acc[h.motivo]||0)+1;return acc;},{});
              const motivoPrincipal=Object.entries(motivoFreq).sort((a,b)=>b[1]-a[1])[0]?.[0];
              const labels={sobrecarregada:'sobrecarga',imprevisto:'imprevistos',desmotivada:'desmotivação',pausa:'pausas necessárias'};
              return(
                <div style={{marginTop:14,padding:'10px 12px',borderRadius:10,background:'rgba(96,165,250,.06)',border:'1px solid rgba(96,165,250,.2)'}}>
                  <div style={{fontSize:13,color:'#60a5fa',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:4}}>📊 SEU PADRÃO — {hist.length} episódios registrados</div>
                  <div style={{fontSize:14,color:'var(--text4)',lineHeight:1.6}}>
                    Você costuma ficar em média <strong style={{color:'var(--text)'}}>{mediaD} dias</strong> fora, geralmente por <strong style={{color:'var(--text)'}}>{labels[motivoPrincipal]||motivoPrincipal}</strong>. Isso é informação, não julgamento.
                  </div>
                </div>
              );
            })()}
          </div>
        </div>
      )}
      <div style={{padding:'10px 14px 8px',background:'var(--header-bg)',borderBottom:'1px solid var(--header-border)',flexShrink:0}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
          <div style={{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap'}}>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:19,color:'#fbbf24',letterSpacing:'1px',fontWeight:700}}>RITY OS</div>
            <span style={{fontSize:13,fontWeight:800,letterSpacing:'2px',padding:'2px 6px',borderRadius:3,background:'rgba(251,191,36,.1)',color:'rgba(251,191,36,.6)',border:'1px solid rgba(251,191,36,.2)',fontFamily:"'DM Mono',monospace"}}>CONSOLIDAR A BASE</span>
            <div style={{width:7,height:7,borderRadius:'50%',background:syncSt==='ok'?'#34d399':syncSt==='syncing'?'#fbbf24':syncSt==='error'?'#f87171':'#aab6c8',transition:'background .4s'}}/>
            {!chaveOK&&<span onClick={()=>setShowCfg(true)} style={{fontSize:13,padding:'2px 6px',borderRadius:3,background:'rgba(248,113,113,.12)',color:'#f87171',border:'1px solid rgba(248,113,113,.3)',cursor:'pointer',fontFamily:"'DM Mono',monospace"}}>⚠️ SEM CHAVE IA</span>}
            {urgentes.length>0&&<span onClick={()=>setTab('revisao')} style={{fontSize:13,padding:'2px 6px',borderRadius:3,background:'rgba(248,113,113,.1)',color:'#f87171',border:'1px solid rgba(248,113,113,.25)',cursor:'pointer',fontFamily:"'DM Mono',monospace"}}>🚨 {urgentes.length} urgente{urgentes.length>1?'s':''}</span>}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:18,fontWeight:900,fontFamily:"'DM Mono',monospace",color:'var(--text)',lineHeight:1}}>{fH(clock)}</div>
              <div style={{fontSize:13,color:'var(--text4)',lineHeight:1,marginTop:2}}>{fmtMin(minHoje)} hoje · {fmtMin(minSemana)}/{metaHoras}h</div>
            </div>
            <button onClick={()=>setDarkMode(v=>!v)} title={darkMode?'Modo claro':'Modo escuro'} style={{width:32,height:32,borderRadius:'50%',border:'1px solid var(--border2)',background:'var(--card2)',color:'var(--text3)',fontSize:17,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>{darkMode?'☀️':'🌙'}</button>
            <button onClick={()=>setShowCfg(true)} style={{width:32,height:32,borderRadius:'50%',border:'1px solid var(--border2)',background:'var(--card2)',color:'var(--text3)',fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>⚙️</button>
          </div>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
          <div style={{display:'flex',gap:5}}>
            <span style={{fontSize:13,fontWeight:700,padding:'2px 6px',borderRadius:3,background:'rgba(96,165,250,.1)',color:'#60a5fa',fontFamily:"'DM Mono',monospace"}}>⏱ {fmtMin(minSemana)}</span>
            <span style={{fontSize:13,fontWeight:700,padding:'2px 6px',borderRadius:3,background:'rgba(251,191,36,.1)',color:'#fbbf24',fontFamily:"'DM Mono',monospace"}}>B{feitos.length}/{N}</span>
            <span style={{fontSize:13,fontWeight:700,padding:'2px 6px',borderRadius:3,background:'rgba(251,191,36,.08)',color:Math.round(minSemana/(metaHoras*60)*100)>=100?'#34d399':'#fbbf24',fontFamily:"'DM Mono',monospace"}}>{Math.round(minSemana/(metaHoras*60)*100)}% meta</span>
          </div>
          <span style={{fontSize:13,color:'#c2ccd8',fontFamily:"'DM Mono',monospace"}}>{pct}% · meta {cicloNum}</span>
        </div>
        <BarProg done={feitos.length} total={N} cor={corPrx} h={3}/>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'16px 16px 0',background:'var(--bg)'}}>
        {!PLANO_GURUJA&&<div style={{padding:'11px 13px',borderRadius:11,background:'rgba(96,165,250,.08)',border:'1px solid rgba(96,165,250,.35)',marginBottom:12}}>
          <div style={{fontSize:13,color:'#60a5fa',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px'}}>📡 {PLANO_VAZIO_MSG.toUpperCase()}</div>
          <div style={{fontSize:13,color:'var(--text3)',marginTop:4,lineHeight:1.5}}>O plano do dia e a lista de atividades vêm da meta do Guruja. Assim que a Meta 1 estiver aberta e o guruja.json for atualizado, o app monta tudo sozinho. Até lá, Anki, registro de questões e revisão funcionam normalmente.</div>
        </div>}
        {tab==='ia'     &&<TabIA     appCtx={appCtx} onMIT={saveMIT} onRapido={setRapido} onSetTab={setTab} rapidoVer={rapidoVer}/>}
        {tab==='estudo' &&<TabEstudo feitos={feitos} cicloNum={cicloNum} horas={horas} onConcluir={concluir} onIrPara={irPara} onDesmarcar={desmarcar} onAddHoras={addHoras} onSyncHistorico={syncHistorico} mit={mit} planoSemana={planoSemana} onSavePlano={savePlano} onSetTab={setTab} onRapido={setRapido}/>}
        {tab==='hoje'   &&<TabHoje feitos={feitos} onAddHoras={addHoras} onSetTab={setTab} onRapido={setRapido} rapidoVer={rapidoVer}/>}
        {tab==='revisao'&&<TabRevisao onRapido={setRapido} rapidoVer={rapidoVer} totalBlocos={feitos.length} tmSugestao={tmSugestao} tmIA={tmIA} onSyncHistorico={syncHistorico} onAddHoras={addHoras} ankiSugestoes={calcMotorCanais(feitos,horas,historico).anki.materias||[]} nlmSugestao={calcMotorCanais(feitos,horas,historico).nlm.top||null}/>}
        {tab==='dados'  &&<TabDados horas={horas}/>}
        {tab==='discursiva'&&<TabDiscursiva onRapido={setRapido} rapidoVer={rapidoVer}/>}
        {tab==='mapa'   &&<TabMapa/>}
        {tab==='agenda' &&<TabAgenda planoSemana={planoSemana} onSetTab={setTab} onRapido={setRapido} rapidoVer={rapidoVer}/>}
        <div style={{height:80}}/>
      </div>

      <div style={{position:'fixed',bottom:0,left:0,right:0,background:'var(--header-bg)',borderTop:'1px solid var(--header-border)',display:'flex',zIndex:50}}>
        {TABS.map(t=>{const a=tab===t.id;return(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'9px 2px 7px',border:'none',background:'transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,position:'relative'}}>
            {t.badge>0&&<div style={{position:'absolute',top:4,right:'8%',width:14,height:14,borderRadius:'50%',background:'#f87171',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:'#050a14',fontWeight:900}}>{t.badge}</div>}
            <span style={{fontSize:a?20:17,transition:'font-size .15s'}}>{t.e}</span>
            <span style={{fontSize:13,fontFamily:"'DM Mono',monospace",fontWeight:a?800:400,color:a?'#fbbf24':'#aab6c8'}}>{t.l}</span>
            {a&&<div style={{position:'absolute',top:0,left:'10%',right:'10%',height:2,borderRadius:1,background:'#fbbf24'}}/>}
          </button>
        );})}
      </div>

      {trofeu&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.92)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,flexDirection:'column',gap:16}} onClick={()=>setTrofeu(false)}>
          <div style={{fontSize:64}}>🏆</div>
          <div style={{fontFamily:"'DM Serif Display',serif",color:'#fbbf24',fontSize:27}}>Ciclo {cicloNum-1} completo!</div>
        </div>
      )}
      {showCfg&&<ModalConfig fechar={()=>setShowCfg(false)}/>}
      {rapido&&<RegistroRapido item={rapido} onClose={()=>setRapido(null)} onSave={salvarRapido}/>}
      {rapidoMsg&&<div style={{position:'fixed',left:12,right:12,bottom:76,zIndex:160,padding:'12px 14px',borderRadius:11,background:'#064e3b',border:'1px solid #34d399',color:'#d1fae5',fontSize:14,fontWeight:700,textAlign:'center'}}>{rapidoMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>

<script>
// Service Worker removido — o registro anterior usava URL.createObjectURL(blob),
// que gera uma URL nova e efêmera a cada carregamento de página. O navegador não
// consegue comparar/atualizar um Service Worker registrado assim (a checagem de
// atualização depende de re-buscar a MESMA URL), então uma versão antiga podia
// ficar presa servindo conteúdo desatualizado — provavelmente a causa do ciclo
// errado aparecendo mesmo com o arquivo novo já publicado.
// Limpeza ativa: remove qualquer Service Worker e cache antigos de sessões passadas.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>r.unregister());
  }).catch(()=>{});
}
if('caches' in window){
  caches.keys().then(keys=>{
    keys.forEach(k=>caches.delete(k));
  }).catch(()=>{});
}
</script>
</body>
</html>
