              <div style={{marginBottom:8}}>
                <div style={{fontSize:13,color:'#c2ccd8',marginBottom:4}}>MATÉRIA</div>
                <MatBtn value={ankiForm.mat} onChange={v=>setAnkiForm(f=>({...f,mat:v}))} placeholder="Ou digitar matéria..."/>
              </div>
              <div style={{display:'flex',gap:8,marginBottom:10}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,color:'#c2ccd8',marginBottom:4}}>CARDS</div>
                  <input type="number" value={ankiForm.cards||''} onChange={e=>setAnkiForm(f=>({...f,cards:e.target.value}))} placeholder="25" style={{width:'100%',padding:'9px 10px',borderRadius:7,border:'1px solid rgba(167,139,250,.2)',background:'rgba(167,139,250,.04)',color:'#f1f5f9',fontSize:16,fontWeight:700,textAlign:'center',outline:'none',boxSizing:'border-box'}}/>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,color:'#c2ccd8',marginBottom:4}}>TEMPO (min)</div>
                  <input type="number" value={ankiForm.tempo||''} onChange={e=>setAnkiForm(f=>({...f,tempo:e.target.value}))} placeholder="15" style={{width:'100%',padding:'9px 10px',borderRadius:7,border:'1px solid rgba(167,139,250,.2)',background:'rgba(167,139,250,.04)',color:'#f1f5f9',fontSize:16,fontWeight:700,textAlign:'center',outline:'none',boxSizing:'border-box'}}/>
                </div>
              </div>
              <div style={{marginBottom:10}}>
                <div style={{fontSize:13,color:'#c2ccd8',marginBottom:6}}>DIFICULDADE MÉDIA DA SESSÃO</div>
                <Estrelas val={ankiForm.dif} onChange={v=>setAnkiForm(f=>({...f,dif:v}))}/>
              </div>
              <button onClick={salvarAnki} disabled={!ankiForm.mat||!ankiForm.dif} style={{width:'100%',padding:'12px',borderRadius:9,border:'none',background:(ankiForm.mat&&ankiForm.dif)?'#a78bfa':'rgba(148,163,184,.2)',color:(ankiForm.mat&&ankiForm.dif)?'#0f172a':'#aab6c8',fontSize:15,fontWeight:800,cursor:(ankiForm.mat&&ankiForm.dif)?'pointer':'default'}}>
                {ankiSalvo?'✅ SALVO!':'💾 REGISTRAR'}
              </button>
            </div>
          </div>
        );
      })()}

      {/* PASSIVA — motor novo: decoreba + dificuldade jurídica, ponderado pelo peso do gate */}
      {aba==='passiva'&&(()=>{
        const passivaLista=calcPassivaJuridica().slice(0,8);
        return(
          <div style={{padding:'11px 14px',borderRadius:12,background:'rgba(52,211,153,.06)',border:'1px solid rgba(52,211,153,.25)',marginBottom:12}}>
            <div style={{fontSize:13,color:'#34d399',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px',marginBottom:2}}>🎧 O QUE OUVIR — decoreba + dificuldade jurídica, por prioridade de prova</div>
            <div style={{fontSize:13,color:'var(--text4)',marginBottom:8}}>🔴 decoreba (memorização pura) · sem cor = raciocínio. Peso maior = gate mais apertado (Gerais/Discursiva).</div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              {passivaLista.map((it,i)=>(
                <div key={it.mat+it.titulo} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 8px',borderRadius:7,background:i===0?'rgba(52,211,153,.1)':'transparent'}}>
                  <span style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace",width:16}}>{i+1}º</span>
                  {it.decoreba&&<span style={{fontSize:13}}>🔴</span>}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>{it.mat}</div>
                    <div style={{fontSize:13,color:'var(--text4)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.titulo}</div>
                  </div>
                  <span style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace",flexShrink:0}}>{it.acerto!=null?`${it.acerto}%`:'sem dado'}</span>
                </div>
              ))}
            </div>
          </div>
        );
      })()}

      {aba==='passiva'&&(
        <div style={{display:'flex',gap:6,marginBottom:14}}>
          {[{id:'nlm',l:'✏️ Registrar o que estudei'},{id:'motor',l:'⏳ Sugestão do dia'}].map(s=>(
            <button key={s.id} onClick={()=>setSubPassiva(s.id)} style={{flex:1,padding:'9px',borderRadius:9,border:`1px solid ${subPassiva===s.id?'rgba(52,211,153,.45)':'var(--border)'}`,background:subPassiva===s.id?'rgba(52,211,153,.12)':'transparent',color:subPassiva===s.id?'#34d399':'var(--text4)',fontSize:14,fontWeight:700,cursor:'pointer'}}>{s.l}</button>
          ))}
        </div>
      )}

      {/* Sub-nav: ESTRATÉGIA (Semanal + Críticos + Revisitar) — Radar do Edital fica só na aba Mapa */}
      {aba==='estrategia'&&(
        <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
          {[{id:'semanal',l:'🗓️ Semanal'},{id:'criticos',l:'🎯 Críticos'},{id:'revisitar',l:'📌 Revisitar'}].map(s=>(
            <button key={s.id} onClick={()=>setSubEstrategia(s.id)} style={{flex:1,minWidth:70,padding:'9px 6px',borderRadius:9,border:`1px solid ${subEstrategia===s.id?'rgba(167,139,250,.45)':'var(--border)'}`,background:subEstrategia===s.id?'rgba(167,139,250,.12)':'transparent',color:subEstrategia===s.id?'#a78bfa':'var(--text4)',fontSize:14,fontWeight:700,cursor:'pointer'}}>{s.l}</button>
          ))}
        </div>
      )}

      {/* TEMPO MORTO — agora dentro de Passiva > Sugestão do dia */}
      {aba==='passiva'&&subPassiva==='motor'&&(()=>{
        const hist=lsGet('historico_diario',[]);
        const motor=calcMotorCanais([],lsGet('horas',[]),hist);
        const hoje2=getDK();
        const ia=lsGet('tm_ia_cache',null);
        return(
          <div>
            <div style={{padding:'10px 12px',borderRadius:10,background:'rgba(96,165,250,.06)',border:'1px solid rgba(96,165,250,.2)',marginBottom:12}}>
              <div style={{fontSize:13,color:'#60a5fa',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:2}}>🔄 MOTOR DE CANAIS — Forma 1 + Forma 4</div>
              <div style={{fontSize:13,color:'var(--text4)'}}>Cada canal tem sugestão independente. Penalidade de ausência garante rotação entre todas as matérias.</div>
            </div>
            {ia&&ia.dia===hoje2&&(
              <div style={{padding:'8px 12px',borderRadius:9,background:'rgba(251,191,36,.08)',border:'1px solid rgba(251,191,36,.25)',marginBottom:10,display:'flex',gap:8,alignItems:'flex-start'}}>
                <span style={{fontSize:15,flexShrink:0}}>🤖</span>
                <div><div style={{fontSize:13,color:'#fbbf24',fontFamily:"'DM Mono',monospace",marginBottom:2}}>IA ASSESSORA — hoje</div>
                <div style={{fontSize:14,color:'var(--text)'}}>{ia.motivo}</div></div>
              </div>
            )}
            <div style={{padding:'13px',borderRadius:12,background:tmFeitoAnki?'rgba(52,211,153,.08)':'rgba(167,139,250,.08)',border:`2px solid ${tmFeitoAnki?'rgba(52,211,153,.4)':'rgba(167,139,250,.4)'}`,marginBottom:10}}>
              <div style={{fontSize:13,color:'#a78bfa',fontFamily:"'DM Mono',monospace",letterSpacing:'2px',marginBottom:6}}>🃏 ANKI — deficit × 3 + ausência × 0.4 + travou × 1.5</div>
              <div style={{fontSize:20,fontWeight:900,color:tmFeitoAnki?'#34d399':'var(--text)',fontFamily:"'DM Serif Display',serif",marginBottom:4}}>{ia&&ia.dia===hoje2?ia.anki:motor.anki.materias[0]?.mat||'—'}</div>
              {motor.anki.materias[0]&&<div style={{fontSize:13,color:'var(--text4)',marginBottom:8}}>{motor.anki.materias[0].motivo}</div>}
              <div style={{display:'flex',gap:5,marginBottom:10,flexWrap:'wrap'}}>
                {motor.anki.ranking.slice(0,5).map((r,i)=>(<span key={r.mat} style={{fontSize:13,padding:'2px 7px',borderRadius:5,background:i===0?'rgba(167,139,250,.2)':'rgba(148,163,184,.1)',color:i===0?'#a78bfa':'var(--text4)',fontFamily:"'DM Mono',monospace"}}>{i+1}. {r.mat.split(' ')[0]} {r.pct!==null?r.pct+'%':'?%'}</span>))}
              </div>
              {tmFeitoAnki?<div style={{fontSize:14,color:'#34d399',fontWeight:700}}>✅ Feito hoje!</div>:<button onClick={()=>{setTmFeitoAnki(true);lsSet(`tm_anki_${hoje}`,true);}} style={{padding:'8px 18px',borderRadius:8,border:'none',background:'#a78bfa',color:'#0f172a',fontSize:14,fontWeight:800,cursor:'pointer'}}>✓ Fiz!</button>}
            </div>
            {/* NLM — card mínimo com fila ≥80% */}
            <CardNlmTempoMorto motor={motor} tmFeitoNlm={tmFeitoNlm} setTmFeitoNlm={setTmFeitoNlm} hoje={hoje}/>
            <div style={{padding:'13px',borderRadius:12,background:'rgba(251,191,36,.06)',border:'2px solid rgba(251,191,36,.3)',marginBottom:10}}>
              <div style={{fontSize:13,color:'#fbbf24',fontFamily:"'DM Mono',monospace",letterSpacing:'2px',marginBottom:8}}>📖 REVISÃO 1h — peso edital × 2 + ausência × 0.5 + deficit × 1</div>
              {motor.rev1h.top.slice(0,3).map((r,i)=>(<div key={r.mat} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:9,background:i===0?'rgba(251,191,36,.1)':'rgba(255,255,255,.03)',border:`1px solid ${i===0?'rgba(251,191,36,.3)':'rgba(255,255,255,.06)'}`,marginBottom:5}}><span style={{fontSize:14,fontWeight:900,color:'#fbbf24',width:16,flexShrink:0}}>{i+1}</span><div style={{flex:1}}><div style={{fontSize:15,color:'var(--text)',fontWeight:700}}>{r.mat}</div><div style={{fontSize:13,color:'var(--text4)'}}>{r.diasSemRev!==null?`${r.diasSemRev}d sem revisão`:'sem revisão registrada'} · {r.pct!==null?r.pct+'% acerto':'sem dado'}</div></div></div>))}
            </div>
            <button onClick={()=>{lsSet('tm_ia_cache',null);chamarIaTempoMorto();}} style={{width:'100%',padding:'8px',borderRadius:8,border:'1px solid rgba(251,191,36,.25)',background:'rgba(251,191,36,.05)',color:'#fbbf24',fontSize:13,cursor:'pointer',marginBottom:10}}>🔄 Recalcular com IA</button>
            {motor.travouRecente.length>0&&(<div style={{padding:'10px 12px',borderRadius:10,background:'rgba(248,113,113,.06)',border:'1px solid rgba(248,113,113,.2)'}}>
              <div style={{fontSize:13,color:'#f87171',fontFamily:"'DM Mono',monospace",marginBottom:6}}>🔴 TRAVOU RECENTEMENTE</div>
              {motor.travouRecente.map((t,i)=><div key={i} style={{fontSize:14,color:'var(--text4)',marginBottom:2}}>{t}</div>)}
            </div>)}
          </div>
        );
      })()}

      {/* ═══ PASSIVA — REGISTRAR / HISTÓRICO ═══ */}
      {aba==='passiva'&&subPassiva==='nlm'&&(()=>{
        const regHoje=nlmRegs.filter(r=>r.dia===hoje);
        const matsHoje=new Set(regHoje.map(r=>r.mat));
        const minutosHoje=regHoje.reduce((s,r)=>s+(parseInt(r.tempo)||0),0);
        // Fila de prioridade por matéria (mesma régua da Passiva), marcando o que já foi feito hoje
        const listaPrior=calcPassivaJuridica();
        const porMat={};
        listaPrior.forEach(it=>{ if(!porMat[it.mat])porMat[it.mat]={mat:it.mat,risco:it.risco,decoreba:it.decoreba,titulo:it.titulo}; });
        const filaMats=Object.values(porMat).sort((a,b)=>b.risco-a.risco);
        return(
          <div>
            {/* FILA DE PRIORIDADE — verde = já ouvi hoje */}
            <div style={{padding:'11px 14px',borderRadius:12,background:'rgba(52,211,153,.06)',border:'1px solid rgba(52,211,153,.25)',marginBottom:12}}>
              <div style={{fontSize:13,color:'#34d399',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px',marginBottom:2}}>🎧 PRIORIDADE DE HOJE — verde = já registrado</div>
              <div style={{fontSize:13,color:'var(--text4)',marginBottom:8}}>{regHoje.length>0?`${regHoje.length} sessão(ões) hoje · ${minutosHoje}min`:'Nada registrado hoje ainda'}</div>
              <div style={{display:'flex',flexDirection:'column',gap:3}}>
                {filaMats.map((f,i)=>{
                  const feito=matsHoje.has(f.mat);
                  return(
                    <div key={f.mat} onClick={()=>setNlmForm(fm=>({...fm,mat:f.mat}))} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 7px',borderRadius:6,background:feito?'rgba(52,211,153,.13)':'transparent',cursor:'pointer'}}>
                      <span style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace",width:16}}>{i+1}º</span>
                      {f.decoreba&&<span style={{fontSize:13}}>🔴</span>}
                      <span style={{fontSize:14,color:feito?'#34d399':'var(--text)',flex:1,fontWeight:feito?700:400,display:'flex',alignItems:'center'}}>{feito?'✅ ':''}{f.mat}<BadgeMateria mat={f.mat} tamanho={8}/></span>
                      <span style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace"}}>risco {f.risco}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* FORMULÁRIO */}
            <div style={{padding:'12px',borderRadius:12,background:'rgba(52,211,153,.05)',border:'1px solid rgba(52,211,153,.2)',marginBottom:14}}>
              <div style={{fontSize:13,letterSpacing:'2px',color:'#34d399',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:12}}>🎧 REGISTRAR ESTUDO PASSIVO</div>
              <div style={{marginBottom:8}}>
                <div style={{fontSize:13,color:'#c2ccd8',marginBottom:4}}>MATÉRIA</div>
                <MatBtn value={nlmForm.mat} onChange={v=>setNlmForm(f=>({...f,mat:v}))} placeholder="Ou digitar matéria..."/>
              </div>
              <div style={{marginBottom:8}}>
                <div style={{fontSize:13,color:'#c2ccd8',marginBottom:4}}>ASSUNTO ESTUDADO <span style={{color:'#aab6c6'}}>(recomendado — liga o % à priorização)</span></div>
                <input value={nlmForm.oque||''} onChange={e=>setNlmForm(f=>({...f,oque:e.target.value}))} placeholder="ex: LRF arts. 15 a 24" style={{width:'100%',padding:'9px 10px',borderRadius:7,border:'1px solid rgba(52,211,153,.2)',background:'rgba(52,211,153,.04)',color:'#f1f5f9',fontSize:14,outline:'none',boxSizing:'border-box'}}/>
              </div>
              <div style={{marginBottom:8}}>
                <div style={{fontSize:13,color:'#c2ccd8',marginBottom:4}}>⏱ TEMPO (min)</div>
                <input type="number" value={nlmForm.tempo||''} onChange={e=>setNlmForm(f=>({...f,tempo:e.target.value}))} placeholder="ex: 45" style={{width:'100%',padding:'13px',borderRadius:8,border:'1px solid rgba(52,211,153,.3)',background:'rgba(52,211,153,.06)',color:'#34d399',fontSize:21,fontWeight:900,fontFamily:"'DM Mono',monospace",textAlign:'center',outline:'none',boxSizing:'border-box'}}/>
              </div>
              <div style={{marginBottom:8}}>
                <div style={{fontSize:13,color:'#c2ccd8',marginBottom:5}}>📍 POR ONDE</div>
                <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                  {['NLM','Podcast','Vídeo','Releitura','Áudio-aula','Outro'].map(f=>(
                    <button key={f} onClick={()=>setNlmForm(fm=>({...fm,fonte:f}))}
                      style={{padding:'7px 11px',borderRadius:7,border:`1px solid ${nlmForm.fonte===f?'#34d399':'var(--border)'}`,background:nlmForm.fonte===f?'rgba(52,211,153,.15)':'transparent',color:nlmForm.fonte===f?'#34d399':'var(--text4)',fontSize:13,fontWeight:700,cursor:'pointer'}}>
                      {f}
                    </button>
                  ))}
                </div>
              </div>
              <div style={{marginBottom:8}}>
                <div style={{fontSize:13,color:'#c2ccd8',marginBottom:4}}>🎯 % DE ACERTOS <span style={{color:'#aab6c6'}}>(opcional — se fez autoteste)</span></div>
                <input type="number" min="0" max="100" value={nlmForm.pct||''} onChange={e=>setNlmForm(f=>({...f,pct:e.target.value}))} placeholder="ex: 70" style={{width:'100%',padding:'11px',borderRadius:8,border:'1px solid rgba(52,211,153,.25)',background:'rgba(52,211,153,.04)',color:'#34d399',fontSize:18,fontWeight:800,fontFamily:"'DM Mono',monospace",textAlign:'center',outline:'none',boxSizing:'border-box'}}/>
                {nlmForm.pct!==''&&nlmForm.pct!=null&&nlmForm.oque&&<div style={{fontSize:13,color:'#34d399',marginTop:4,textAlign:'center'}}>✓ Isso vai alimentar a priorização — "{nlmForm.oque}" sobe/desce conforme esse %</div>}
                {nlmForm.pct!==''&&nlmForm.pct!=null&&!nlmForm.oque&&<div style={{fontSize:13,color:'#fb923c',marginTop:4,textAlign:'center'}}>⚠️ Preencha "assunto estudado" acima pra esse % contar na priorização</div>}
              </div>
              <div style={{marginBottom:12}}>
                <div style={{fontSize:13,color:'#c2ccd8',marginBottom:6}}>DIFICULDADE</div>
                <Estrelas val={nlmForm.dif} onChange={v=>setNlmForm(f=>({...f,dif:v}))}/>
                {nlmForm.dif>0&&<div style={{textAlign:'center',fontSize:13,color:CORS_DIF[nlmForm.dif-1],marginTop:3,fontFamily:"'DM Mono',monospace",fontWeight:700}}>{LABELS_DIF[nlmForm.dif-1]}</div>}
              </div>
              <button onClick={salvarNlm} disabled={!nlmForm.mat||!nlmForm.dif} style={{width:'100%',padding:'13px',borderRadius:9,border:'none',background:(nlmForm.mat&&nlmForm.dif)?'#34d399':'rgba(148,163,184,.2)',color:(nlmForm.mat&&nlmForm.dif)?'#0f172a':'#aab6c8',fontSize:15,fontWeight:800,cursor:(nlmForm.mat&&nlmForm.dif)?'pointer':'default'}}>
                {nlmSalvo?'✅ SALVO!':'💾 REGISTRAR'}
              </button>
              {(!nlmForm.mat||!nlmForm.dif)&&<div style={{fontSize:13,color:'#fb923c',marginTop:6,textAlign:'center'}}>Falta: {!nlmForm.mat?'selecionar matéria':''}{!nlmForm.mat&&!nlmForm.dif?' · ':''}{!nlmForm.dif?'marcar dificuldade':''}</div>}
            </div>

            {/* HISTÓRICO */}
            <div style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace",fontWeight:700,marginBottom:8,letterSpacing:'1px'}}>HISTÓRICO RECENTE</div>
            {nlmRegs.length===0&&<div style={{padding:'14px',textAlign:'center',fontSize:14,color:'var(--text4)'}}>Nenhuma sessão registrada ainda.</div>}
            {[...nlmRegs].sort((a,b)=>(b.dt||0)-(a.dt||0)).slice(0,12).map(r=>(
              <div key={r.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 12px',borderRadius:9,background:r.dia===hoje?'rgba(52,211,153,.08)':'rgba(255,255,255,.02)',border:'1px solid rgba(148,163,184,.1)',marginBottom:5}}>
                <div>
                  <div style={{fontSize:14,color:'var(--text)',fontWeight:700}}>{r.mat}{r.fonte&&r.fonte!=='NLM'?<span style={{fontSize:13,color:'#c2ccd8',fontWeight:400}}> · {r.fonte}</span>:''}</div>
                  {r.oque&&<div style={{fontSize:13,color:'#34d399',marginTop:1}}>{r.oque}</div>}
                  <div style={{fontSize:13,color:'#c2ccd8'}}>{r.tempo?`${r.tempo}min`:'—'}{r.dif?` · ${'⭐'.repeat(r.dif)}`:''}{r.pct!=null?` · ${r.pct}% acerto`:''}</div>
                </div>
                <div style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace",flexShrink:0}}>{r.dia===hoje?'hoje':r.dia}</div>
              </div>
            ))}
          </div>
        );
      })()}

      {/* SEMANAL — motor novo: delta da semana, cobertura do edital, decisão sugerida */}
      {aba==='estrategia'&&subEstrategia==='semanal'&&(()=>{
        const estr=calcEstrategiaSemanal();
        const proj=calcProjecaoNotaFinal();
        const CORD=v=>v>0?'#34d399':v<0?'#f87171':'#94a3b8';
        return(
          <div>
            <div style={{padding:'10px 13px',borderRadius:11,background:'rgba(167,139,250,.06)',border:'1px solid rgba(167,139,250,.25)',marginBottom:14}}>
              <div style={{fontSize:13,color:'#a78bfa',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px'}}>🗓️ PAINEL DE DOMINGO — 15 minutos, uma decisão</div>
              <div style={{fontSize:13,color:'var(--text4)',marginTop:2}}>As outras 3 sub-abas executam sozinhas. Aqui é o único lugar onde você decide.</div>
            </div>

            {/* PROJEÇÃO DE NOTA FINAL — se a prova fosse hoje */}
            {TEM_PROVA&&<div style={{padding:'13px 15px',borderRadius:12,background:'rgba(96,165,250,.06)',border:'2px solid rgba(96,165,250,.3)',marginBottom:14}}>
              <div style={{fontSize:13,color:'#60a5fa',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px',marginBottom:8}}>📊 SE A PROVA FOSSE HOJE</div>
              <div style={{display:'flex',gap:8,marginBottom:10}}>
                {[
                  ['Gerais',proj.pontosGerais,'/20',12,proj.passaGerais],
                  ['Específicos',proj.pontosEspec,'/60',36,proj.passaEspec],
                  ['Discursiva',proj.pontosDiscursiva,'/40',24,proj.passaDiscursiva],
                ].map(([l,v,max,corte,passa])=>(
                  <div key={l} style={{flex:1,padding:'8px',borderRadius:9,background:passa===null?'rgba(148,163,184,.08)':passa?'rgba(52,211,153,.1)':'rgba(248,113,113,.1)',border:`1px solid ${passa===null?'rgba(148,163,184,.2)':passa?'rgba(52,211,153,.3)':'rgba(248,113,113,.3)'}`,textAlign:'center'}}>
                    <div style={{fontSize:18,fontWeight:900,color:passa===null?'#aab6c8':passa?'#34d399':'#f87171',fontFamily:"'DM Mono',monospace"}}>{v!=null?v:'—'}{max}</div>
                    <div style={{fontSize:13,color:'var(--text4)',marginTop:2}}>{l} · corte {corte}</div>
                  </div>
                ))}
              </div>
              <div style={{textAlign:'center',padding:'8px',borderRadius:9,background:'rgba(96,165,250,.1)'}}>
                <div style={{fontSize:23,fontWeight:900,color:'#60a5fa',fontFamily:"'DM Mono',monospace"}}>{proj.notaFinal}/120</div>
                <div style={{fontSize:13,color:'var(--text4)'}}>nota final estimada</div>
              </div>
              <div style={{fontSize:13,color:'var(--text4)',marginTop:8,lineHeight:1.5}}>
                Gerais: {proj.cobGerais}/{proj.totalGerais} matérias com dado real · Específicos: {proj.cobEspec}/{proj.totalEspec} · Discursiva: {proj.correcoesRegistradas} correção(ões) registrada(s).
                {proj.correcoesRegistradas===0&&' Sem correção registrada ainda, a nota de discursiva conta como 0 — registre correções na aba Discursiva pra essa projeção ficar real.'}
              </div>
            </div>}

            {/* (c) Decisão da semana */}
            {estr.decisao&&(
              <div style={{padding:'12px 14px',borderRadius:12,background:'rgba(251,191,36,.08)',border:'2px solid rgba(251,191,36,.4)',marginBottom:14}}>
                <div style={{fontSize:13,color:'#fbbf24',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px',marginBottom:4}}>⚡ DECISÃO DA SEMANA</div>
                <div style={{fontSize:15,fontWeight:800,color:'var(--text)'}}>{estr.decisao.texto}</div>
              </div>
            )}

            {/* (a) Delta da semana */}
            <div style={{marginBottom:14}}>
              <div style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace",fontWeight:700,marginBottom:8,letterSpacing:'1px'}}>DELTA DA SEMANA — vs. semana anterior</div>
              {estr.delta.length===0&&<div style={{fontSize:14,color:'var(--text4)',padding:'8px 0'}}>Sem dado comparável ainda (precisa de 2 semanas registradas na mesma matéria).</div>}
              {estr.delta.map(d=>(
                <div key={d.mat} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:8,background:'rgba(255,255,255,.02)',marginBottom:4}}>
                  <span style={{flex:1,fontSize:14,color:'var(--text)'}}>{d.mat}</span>
                  <span style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace"}}>{d.pctAnterior}%→{d.pctAtual}%</span>
                  <span style={{fontSize:14,fontWeight:800,color:CORD(d.delta),fontFamily:"'DM Mono',monospace",width:40,textAlign:'right'}}>{d.delta>0?'+':''}{d.delta}%</span>
                </div>
              ))}
            </div>

            {/* (b) Cobertura do edital */}
            <div>
              <div style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace",fontWeight:700,marginBottom:8,letterSpacing:'1px'}}>COBERTURA DO EDITAL — % de tópicos com dado real (Guruja/TEC), não checklist manual</div>
              {estr.cobertura.map(c=>(
                <div key={c.mat} style={{marginBottom:6}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:2}}>
                    <span style={{color:'var(--text)',display:'flex',alignItems:'center'}}>{c.mat}<BadgeMateria mat={c.mat} tamanho={8}/></span>
                    <span style={{color:'var(--text4)',fontFamily:"'DM Mono',monospace"}}>{c.tocados}/{c.total} · {c.pct}%</span>
                  </div>
                  <div style={{height:4,borderRadius:2,background:'rgba(148,163,184,.15)',overflow:'hidden'}}>
                    <div style={{height:'100%',width:`${c.pct}%`,background:c.pct===0?'#f87171':c.pct<50?'#fb923c':'#34d399',borderRadius:2}}/>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })()}

      {aba==='estrategia'&&subEstrategia==='criticos'&&<div>
        {/* Header */}
        <div style={{padding:'10px 13px',borderRadius:11,background:'rgba(248,113,113,.06)',border:'1px solid rgba(248,113,113,.25)',marginBottom:10}}>
          <div style={{fontSize:13,color:'#f87171',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px'}}>PONTOS CRÍTICOS — por assunto específico</div>
          <div style={{fontSize:13,color:'var(--text4)',marginTop:4}}>🔴 Alta vira Bloco 1 do "Hoje sem pensar" · 🚫 Descartar some de verdade da fila em todo o app — não é só cosmético.</div>
        </div>
        {/* Dificuldade Base — matérias sem questões */}
        <div style={{background:'rgba(96,165,250,.05)',border:'1px solid rgba(96,165,250,.2)',borderRadius:13,padding:'13px',marginBottom:12}}>
          <div style={{fontSize:13,letterSpacing:'2px',color:'#60a5fa',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:8}}>⭐ DIFICULDADE BASE — matérias sem questões ainda</div>
          <div style={{fontSize:13,color:'#c2ccd8',marginBottom:10}}>Para matérias que só fez teoria, defina sua dificuldade percebida. O motor usa isso como dado equivalente.</div>
          {(()=>{
            const mats=CICLO.map(s=>s.mat).filter((v,i,a)=>a.indexOf(v)===i);
            const hist=lsGet('historico_diario',[]);
            const comQuestoes=new Set(hist.filter(r=>parseInt(r.questoes)>0).map(r=>r.materia));
            const difBase=lsGet('dif_base_materias',{});
            const semQuestoes=mats.filter(m=>!comQuestoes.has(m));
            if(!semQuestoes.length)return <div style={{fontSize:13,color:'#34d399'}}>✅ Todas as matérias já têm questões registradas!</div>;
            return(
              <div>
                {semQuestoes.map(mat=>{
                  const dif=difBase[mat]||0;
                  const cor=dif>=4?'#f87171':dif>=3?'#fbbf24':dif>=1?'#34d399':'#aab6c8';
                  return(
                    <div key={mat} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:9,background:'rgba(255,255,255,.03)',border:'1px solid rgba(255,255,255,.08)',marginBottom:5}}>
                      <span style={{flex:1,fontSize:14,color:'#f1f5f9',fontWeight:600}}>{mat}</span>
                      <div style={{display:'flex',gap:3}}>
                        {[1,2,3,4,5].map(n=>(
                          <button key={n} onClick={()=>{const nd={...lsGet('dif_base_materias',{}),[mat]:n};lsSet('dif_base_materias',nd);}} style={{width:22,height:22,borderRadius:'50%',border:`1px solid ${dif>=n?cor:'rgba(255,255,255,.1)'}`,background:dif>=n?`${cor}30`:'transparent',fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:dif>=n?cor:'#aab6c8'}}>★</button>
                        ))}
                      </div>
                      {dif>0&&<span style={{fontSize:13,padding:'1px 5px',borderRadius:3,background:`${cor}20`,color:cor,fontFamily:"'DM Mono',monospace",flexShrink:0}}>{dif>=4?'CRÍTICO':dif>=3?'ATENÇÃO':'OK'}</span>}
                      {dif>0&&<button onClick={()=>{const nd={...lsGet('dif_base_materias',{})};delete nd[mat];lsSet('dif_base_materias',nd);}} style={{padding:'1px 5px',borderRadius:3,border:'none',background:'transparent',color:'#9fabbc',fontSize:13,cursor:'pointer'}}>×</button>}
                    </div>
                  );
                })}
              </div>
            );
          })()}
        </div>

        {/* Manual input */}
        <div style={{background:'rgba(248,113,113,.05)',border:'1px solid rgba(248,113,113,.2)',borderRadius:13,padding:'13px',marginBottom:12}}>
          <div style={{fontSize:13,letterSpacing:'2px',color:'#f87171',fontFamily:"'DM Mono',monospace",fontWeight:800,marginBottom:10}}>✍️ ADICIONAR PONTO CRÍTICO</div>
          <div style={{fontSize:13,color:'#c2ccd8',marginBottom:4}}>MATÉRIA</div>
          <MatBtn value={critForm.mat} onChange={v=>setCritForm(f=>({...f,mat:v}))}/>
          <div style={{fontSize:13,color:'#c2ccd8',marginBottom:4,marginTop:8}}>ASSUNTO <span style={{color:'#aab6c6'}}>(opcional — em branco vale pra matéria inteira)</span></div>
          <input value={critForm.assunto||''} onChange={e=>setCritForm(f=>({...f,assunto:e.target.value}))} placeholder="ex: Garantias e Privilégios do Crédito Tributário" style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1px solid rgba(248,113,113,.2)',background:'rgba(248,113,113,.04)',color:'#f1f5f9',fontSize:15,outline:'none',boxSizing:'border-box'}}/>
          <textarea value={critForm.motivo} onChange={e=>setCritForm(f=>({...f,motivo:e.target.value}))} rows={2} placeholder="Por que? ex: conhecimento raso, preciso revisar..." style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1px solid rgba(248,113,113,.2)',background:'rgba(248,113,113,.04)',color:'#f1f5f9',fontSize:15,outline:'none',resize:'vertical',boxSizing:'border-box',marginTop:8,marginBottom:8}}/>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:10}}>
            {[['alta','🔴 Alta','#f87171'],['media','🟡 Média','#fbbf24'],['baixa','🟢 Baixa','#34d399'],['descartar','🚫 Descartar','#94a3b8']].map(([p,label,cor])=>(
              <button key={p} onClick={()=>setCritForm(f=>({...f,prioridade:p}))} style={{padding:'7px',borderRadius:7,border:`1px solid ${critForm.prioridade===p?cor:'rgba(255,255,255,.1)'}`,background:critForm.prioridade===p?`${cor}25`:'transparent',color:critForm.prioridade===p?cor:'#aab6c8',fontSize:13,fontWeight:700,cursor:'pointer'}}>{label}</button>
            ))}
          </div>
          {critForm.prioridade==='descartar'&&<div style={{fontSize:13,color:'#8091a6',marginBottom:8,lineHeight:1.5}}>⚠️ Isso remove de verdade da fila de Questões, Passiva, Profunda e do Mapa — não é só visual.</div>}
          <div style={{display:'flex',gap:7}}>
            <button onClick={salvarCritico} disabled={!critForm.mat} style={{flex:2,padding:'11px',borderRadius:9,border:'none',background:critForm.mat?'#f87171':'rgba(148,163,184,.2)',color:critForm.mat?'#0f172a':'#aab6c8',fontSize:15,fontWeight:800,cursor:'pointer'}}>{critSalvo?'✅ Salvo!':'+ Adicionar'}</button>
            <button onClick={pedirIaCriticos} disabled={criticoIALoad} style={{flex:1,padding:'11px',borderRadius:9,border:'1px solid rgba(251,191,36,.3)',background:'rgba(251,191,36,.07)',color:'#fbbf24',fontSize:14,fontWeight:700,cursor:'pointer'}}>{criticoIALoad?'⏳...':'🤖 IA sugere'}</button>
          </div>
        </div>
        {/* Lista manuais */}
        {criticosManuais.length>0&&<div style={{marginBottom:14}}>
          <div style={{fontSize:13,color:'#f87171',fontFamily:"'DM Mono',monospace",letterSpacing:'2px',marginBottom:8}}>SUA LISTA ({criticosManuais.length})</div>
          {[...criticosManuais].sort((a,b)=>{const ordem={alta:0,media:1,baixa:2,descartar:3};return(ordem[a.prioridade]??1)-(ordem[b.prioridade]??1);}).map(item=>{
            const cor=item.prioridade==='alta'?'#f87171':item.prioridade==='media'?'#fbbf24':item.prioridade==='descartar'?'#94a3b8':'#34d399';
            const icone=item.prioridade==='descartar'?'🚫':item.prioridade==='alta'?'🔴':item.prioridade==='media'?'🟡':'🟢';
            return(
              <div key={item.id} style={{padding:'10px 12px',borderRadius:11,background:`${cor}07`,border:`1px solid ${cor}28`,marginBottom:6}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:item.motivo?4:0}}>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:2}}>
                      <span style={{fontSize:13}}>{icone}</span>
                      <span style={{fontSize:15,fontWeight:800,color:'#f1f5f9'}}>{item.mat}</span>
                      {item.iaGerado&&<span style={{fontSize:13,padding:'1px 5px',borderRadius:3,background:'rgba(251,191,36,.2)',color:'#fbbf24',fontFamily:"'DM Mono',monospace"}}>🤖 IA</span>}
                    </div>
                    {item.assunto&&<div style={{fontSize:14,color:cor,fontWeight:600,marginBottom:1}}>{item.assunto}</div>}
                    {item.motivo&&<div style={{fontSize:14,color:'#c2ccd8',lineHeight:1.5}}>{item.motivo}</div>}
                  </div>
                  <button onClick={()=>delCritico(item.id)} style={{padding:'2px 7px',borderRadius:4,border:'none',background:'transparent',color:'#aab6c6',fontSize:13,cursor:'pointer',flexShrink:0,marginLeft:8}}>×</button>
                </div>
              </div>
            );
          })}
        </div>}
        {/* Motor automático */}
        <div style={{fontSize:13,color:'#aab6c6',fontFamily:"'DM Mono',monospace",letterSpacing:'2px',marginBottom:8}}>📊 DETECTADOS AUTOMATICAMENTE</div>
        {(()=>{
          const hist=lsGet('historico_diario',[]);
          const gurujaData=lsGet('guruja_data',null);
          const porItem={};
          hist.forEach(r=>{
            if(!r.materia)return;
            if(isDescartado(r.materia,r.assunto))return; // marcado como "não vale meu tempo" — não detecta de novo
            const q=parseInt(r.questoes)||0;const a=parseInt(r.acertei)||0;
            const key=r.assunto?`${r.materia} — ${r.assunto}`:r.materia;
            if(!porItem[key])porItem[key]={mat:r.materia,assunto:r.assunto||'',q:0,a:0,difs:[],lastDt:0,travouCount:0};
            if(q>0){porItem[key].q+=q;porItem[key].a+=a;}
            if(r.dificuldade)porItem[key].difs.push(r.dificuldade);
            if(r.dt>porItem[key].lastDt)porItem[key].lastDt=r.dt||0;
            if(r.travou)porItem[key].travouCount++;
          });
          const todayMs=new Date().setHours(0,0,0,0);
          const criticos=Object.entries(porItem).map(([key,v])=>{
            const pct=v.q>0?Math.round(v.a/v.q*100):null;
            const difMedia=v.difs.length?v.difs.reduce((s,d)=>s+d,0)/v.difs.length:0;
            const dias=Math.floor((todayMs-(v.lastDt||0))/86400000);
            const g=gurujaData?.prioridades?.find(p=>p.mat?.includes(v.mat.split(' ')[0]))?.status==='critica'?2:0;
            const acScore=pct!==null?(1-pct/100)*3:0;
            const score=acScore+difMedia*(dias+1)*0.5+g+v.travouCount*1.2;
            return{key,mat:v.mat,assunto:v.assunto,pct,q:v.q,a:v.a,difMedia,dias,score};
          }).sort((a,b)=>b.score-a.score).slice(0,8);
          if(!criticos.length)return <div style={{textAlign:'center',padding:'20px',color:'#9fabbc',fontSize:14}}>Registre questões para detectar pontos críticos.</div>;
          return criticos.map((item,i)=>{
            const cor=item.pct!==null?(item.pct>=80?'#34d399':item.pct>=60?'#fbbf24':'#f87171'):'#60a5fa';
            return(
              <div key={item.key} style={{padding:'10px 12px',borderRadius:11,background:`${cor}07`,border:`1px solid ${cor}28`,marginBottom:6}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:14,fontWeight:800,color:'#f1f5f9'}}>{item.mat}{item.assunto&&<span style={{color:cor,fontWeight:400}}> — {item.assunto}</span>}</div>
                    {item.q>0&&<BarProg done={item.a} total={item.q} cor={cor} h={3}/>}
                    {item.pct!==null&&item.pct<70&&!item.assunto&&EDITAL[item.mat]&&(
                      <div style={{fontSize:13,color:'#f87171',marginTop:3,padding:'2px 6px',borderRadius:4,background:'rgba(248,113,113,.1)',border:'1px solid rgba(248,113,113,.2)',display:'inline-block'}}>
                        ⚠️ Priorize: {EDITAL[item.mat].top[0].t.slice(0,40)} ({EDITAL[item.mat].top[0].p}% da prova)
                      </div>
                    )}
                    <div style={{display:'flex',gap:5,marginTop:4,flexWrap:'wrap'}}>
                      {item.difMedia>0&&<span style={{fontSize:13,padding:'1px 5px',borderRadius:3,background:`${cor}15`,color:cor}}>dif {item.difMedia.toFixed(1)}★</span>}
                      {item.dias>0&&<span style={{fontSize:13,padding:'1px 5px',borderRadius:3,background:'rgba(148,163,184,.1)',color:'#c2ccd8'}}>{item.dias}d atrás</span>}
                      {item.travouCount>0&&<span style={{fontSize:13,padding:'1px 5px',borderRadius:3,background:'rgba(248,113,113,.1)',color:'#f87171'}}>travou {item.travouCount}x</span>}
                    </div>
                  </div>
                  {item.pct!==null&&<div style={{textAlign:'right',flexShrink:0,marginLeft:8}}><div style={{fontSize:16,fontWeight:900,color:cor,fontFamily:"'DM Mono',monospace"}}>{item.pct}%</div><div style={{fontSize:13,color:'#aab6c6'}}>{item.a}/{item.q}Q</div></div>}
                </div>
              </div>
            );
          });
        })()}
      </div>}

      {/* EDITAL — agora dentro de Estratégia > Edital */}

      {/* TÓPICOS PARA REVISITAR */}
      {/* TÓPICOS PARA REVISITAR — agora dentro de Estratégia > Revisitar */}
      {/* ═══ PROFUNDA ═══ */}
      {aba==='rev1h30'&&<TabRevProfunda totalBlocos={totalBlocos}/>}

      {aba==='estrategia'&&subEstrategia==='revisitar'&&<div>
        <div style={{padding:'10px 12px',borderRadius:10,background:'rgba(251,191,36,.06)',border:'1px solid rgba(251,191,36,.2)',marginBottom:12}}>
          <div style={{fontSize:13,color:'#fbbf24',fontFamily:"'DM Mono',monospace",marginBottom:4}}>📌 TÓPICOS PARA REVISITAR</div>
          <div style={{fontSize:14,color:'#c2ccd8'}}>Lista pessoal de tópicos que precisa voltar — sem data, sem pressão.</div>
        </div>
        <div style={{display:'flex',gap:7,marginBottom:12}}>
          <input value={topicoForm} onChange={e=>setTopicoForm(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTopico()} placeholder="ex: NBC TA 700, art. 37 caput..." style={{flex:1,padding:'9px 11px',borderRadius:9,border:'1px solid rgba(251,191,36,.25)',background:'rgba(251,191,36,.05)',color:'#f1f5f9',fontSize:15,outline:'none'}}/>
          <button onClick={addTopico} style={{padding:'9px 14px',borderRadius:9,border:'none',background:topicoForm.trim()?'#fbbf24':'rgba(148,163,184,.2)',color:topicoForm.trim()?'#0f172a':'#aab6c8',fontSize:16,fontWeight:900,cursor:'pointer'}}>+</button>
        </div>
        {topicos.filter(t=>!t.feito).map(t=>(
          <div key={t.id} style={{display:'flex',alignItems:'center',gap:8,padding:'9px 11px',borderRadius:9,background:'rgba(251,191,36,.06)',border:'1px solid rgba(251,191,36,.2)',marginBottom:5}}>
            <div onClick={()=>togTopico(t.id)} style={{width:16,height:16,borderRadius:'50%',flexShrink:0,border:'2px solid #fbbf24',cursor:'pointer'}}/>
            <span style={{flex:1,fontSize:15,color:'#f1f5f9'}}>{t.txt}</span>
            <button onClick={()=>delTopico(t.id)} style={{padding:'1px 6px',borderRadius:4,border:'none',background:'transparent',color:'#aab6c6',fontSize:13,cursor:'pointer'}}>×</button>
          </div>
        ))}
        {topicos.filter(t=>t.feito).length>0&&<div style={{marginTop:8}}>
          <div style={{fontSize:13,color:'#9fabbc',fontFamily:"'DM Mono',monospace",marginBottom:5}}>REVISADOS ✓</div>
          {topicos.filter(t=>t.feito).slice(0,5).map(t=>(
            <div key={t.id} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 11px',borderRadius:9,background:'rgba(52,211,153,.04)',border:'1px solid rgba(52,211,153,.15)',marginBottom:4,opacity:.7}}>
              <div onClick={()=>togTopico(t.id)} style={{width:16,height:16,borderRadius:'50%',flexShrink:0,border:'2px solid #34d399',background:'#34d399',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:'#0f172a',fontWeight:900}}>✓</div>
              <span style={{flex:1,fontSize:14,color:'#aab6c6',textDecoration:'line-through'}}>{t.txt}</span>
              <button onClick={()=>delTopico(t.id)} style={{padding:'1px 6px',borderRadius:4,border:'none',background:'transparent',color:'#9fabbc',fontSize:13,cursor:'pointer'}}>×</button>
            </div>
          ))}
        </div>}
        {topicos.length===0&&<div style={{textAlign:'center',padding:'30px',color:'#9fabbc',fontSize:15}}>Nenhum tópico ainda.</div>}
      </div>}
    </div>
  );
}

// ─── TAB: AGENDA ─────────────────────────────────────────────
// ─── ABA: MAPA DA PROVA ──────────────────────────────────────
// ═══ ABA DECISÃO (id 'discursiva' preservado) — peso × nível × custo-benefício por matéria ═══
function TabDiscursiva({onRapido,rapidoVer}){
  const[ver,setVer]=useState(0);
  const[editando,setEditando]=useState(false);
  const[sub,setSub]=useState('disp');
  const dec=useMemo(()=>calcDecisaoMaterias(),[ver,rapidoVer]);
  const corte=useMemo(()=>calcOrdemCorte(),[ver,rapidoVer]);
  const foraFeitos=lsGet('fora_feitos',{});
  const salvarCfg=(campo,mat,valor)=>{
    const c=JSON.parse(JSON.stringify(getDecisaoCfg()||{q:{},nivel:{}}));
    if(!c.q)c.q={};if(!c.nivel)c.nivel={};
    const v=parseFloat(String(valor).replace(',','.'));
    if(isNaN(v))delete c[campo][mat];else c[campo][mat]=v;
    lsSet('decisao_cfg',c);setVer(x=>x+1);
  };
  const limparCfg=()=>{lsSet('decisao_cfg',{q:{},nivel:{}});setVer(x=>x+1);};
  const CORV={'NUNCA CORTAR':'#34d399','FAZER':'#60a5fa','SE SOBRAR TEMPO':'#fbbf24','CORTAR PRIMEIRO':'#f87171'};
  const ICV={'NUNCA CORTAR':'🔒','FAZER':'✅','SE SOBRAR TEMPO':'🟡','CORTAR PRIMEIRO':'✂️'};
  const totQ={gerais:0,especificos:0};dec.forEach(d=>{totQ[d.bloco]+=d.q;});
  const chip=(txt,cor)=>(<span style={{fontSize:13,padding:'1px 6px',borderRadius:4,background:`${cor}20`,color:cor,fontFamily:"'DM Mono',monospace",fontWeight:700,whiteSpace:'nowrap'}}>{txt}</span>);
  const Subtab=({id,l})=>(
    <button onClick={()=>setSub(id)} style={{flex:1,padding:'8px 6px',borderRadius:9,cursor:'pointer',fontSize:14,fontWeight:800,border:`1px solid ${sub===id?'#fbbf24':'rgba(148,163,184,.3)'}`,background:sub===id?'rgba(251,191,36,.12)':'transparent',color:sub===id?'#fbbf24':'var(--text4)'}}>{l}</button>
  );
  return(
    <div>
      <div style={{padding:'13px 15px',borderRadius:13,background:'rgba(251,191,36,.07)',border:'1px solid rgba(251,191,36,.28)',marginBottom:12}}>
        <div style={{fontSize:13,color:'#fbbf24',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px',marginBottom:5}}>⚖️ DECISÃO — PESO × SEU NÍVEL × CUSTO-BENEFÍCIO</div>
        <div style={{fontSize:14,color:'var(--text3)',lineHeight:1.6}}>
          Sem edital, todas as matérias têm o mesmo peso. <b>pts</b> = pontos que você ainda pode ganhar na matéria · <b>h</b> = horas estimadas para chegar na meta · <b>pts/h</b> = custo-benefício.
        </div>
        <div style={{fontSize:13,color:'var(--text4)',marginTop:6,lineHeight:1.5}}>
          ℹ️ Planejamento pré-edital: as questões abaixo são divididas por igual entre as matérias ({Math.round(totQ.gerais+totQ.especificos)} no total). Quando houver edital, os pesos reais entram aqui. Edite se tiver informação melhor.
        </div>
      </div>

      <div style={{display:'flex',gap:6,marginBottom:12}}>
        <Subtab id="materias" l="📋 Por matéria"/>
        <Subtab id="corte" l="✂️ Se atrasar"/>
        <Subtab id="disp" l={`🧮 Fora do ciclo (${CICLO_FORA.length})`}/>
      </div>

      {sub==='materias'&&(
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace",fontWeight:700,letterSpacing:'1px'}}>ORDENADO POR pts/h</div>
            <div style={{display:'flex',gap:6}}>
              <button onClick={()=>setEditando(e=>!e)} style={{padding:'5px 10px',borderRadius:8,fontSize:13,fontWeight:800,cursor:'pointer',border:'1px solid rgba(96,165,250,.4)',background:editando?'rgba(96,165,250,.18)':'transparent',color:'#60a5fa'}}>{editando?'✔ fechar edição':'✏️ editar questões/nível'}</button>
              {editando&&<button onClick={limparCfg} style={{padding:'5px 10px',borderRadius:8,fontSize:13,fontWeight:800,cursor:'pointer',border:'1px solid rgba(248,113,113,.4)',background:'transparent',color:'#f87171'}}>voltar ao padrão</button>}
            </div>
          </div>
          {dec.map(d=>{
            const c=CORV[d.veredito];
            const nivCor=d.nivel>=85?'#34d399':d.nivel>=70?'#fbbf24':'#f87171';
            return(
              <div key={d.mat} style={{marginBottom:8,borderRadius:12,border:`1px solid ${c}35`,background:`${c}07`,overflow:'hidden'}}>
                <div style={{padding:'10px 12px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:6}}>
                    <span style={{fontSize:15,fontWeight:900,color:'var(--text)'}}>{ICV[d.veredito]} {d.mat}</span>
                    {TEM_PROVA&&chip(d.bloco==='especificos'?'Específicos ×2':'Gerais ×1',d.bloco==='especificos'?'#a78bfa':'#60a5fa')}
                    <span style={{marginLeft:'auto'}}>{chip(d.veredito,c)}</span>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                    <div style={{flex:1,height:7,borderRadius:4,background:'rgba(148,163,184,.2)',position:'relative',overflow:'hidden'}}>
                      <div style={{position:'absolute',left:0,top:0,bottom:0,width:`${Math.min(100,d.nivel)}%`,background:nivCor,borderRadius:4}}/>
                      <div style={{position:'absolute',left:`${d.teto}%`,top:0,bottom:0,width:2,background:'#e2e8f0'}}/>
                    </div>
                    <span style={{fontSize:14,fontWeight:900,color:nivCor,fontFamily:"'DM Mono',monospace",minWidth:46,textAlign:'right'}}>{Math.round(d.nivel)}%</span>
                  </div>
                  <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:6}}>
                    {chip(`nível: ${d.nivelOrigem}`,d.nivelOrigem==='estimado'?'#fb923c':'#94a3b8')}
                    {chip(`meta ${d.teto}%`,'#94a3b8')}
                    {chip(`~${d.q}q`,'#94a3b8')}
                    {d.estrelas!=null&&chip(`Guruja ★${d.estrelas.toFixed(1)}`,'#fbbf24')}
                    {TEM_PROVA&&PESO_PROVA[d.mat]!=null&&chip(`peso na prova ${PESO_PROVA[d.mat]}%`,'#a78bfa')}
                    {GURUJA_SEMANA[d.mat]&&chip(`Guruja: ${GURUJA_SEMANA[d.mat].pct.toFixed(1).replace('.',',')}% (${GURUJA_SEMANA[d.mat].a}/${GURUJA_SEMANA[d.mat].q}) · média ${GURUJA_SEMANA[d.mat].media!=null?GURUJA_SEMANA[d.mat].media.toFixed(1).replace('.',','):'—'}% · ${GURUJA_SEMANA[d.mat].dif>0?'+':''}${GURUJA_SEMANA[d.mat].dif.toFixed(1).replace('.',',')}`,GURUJA_SEMANA[d.mat].dif<0?'#f87171':'#94a3b8')}
                  </div>
                  <div style={{display:'flex',gap:14,marginBottom:6}}>
                    {[['pts',d.pts.toFixed(1)],['h',d.horas.toFixed(1)],['pts/h',d.cb.toFixed(2)]].map(([l,v])=>(
                      <div key={l}><span style={{fontSize:17,fontWeight:900,color:c,fontFamily:"'DM Mono',monospace"}}>{v}</span><span style={{fontSize:13,color:'var(--text4)',marginLeft:4}}>{l}</span></div>
                    ))}
                  </div>
                  <div style={{fontSize:13,color:'var(--text4)',lineHeight:1.5}}>{d.porque}</div>
                  {editando&&(
                    <div style={{display:'flex',gap:10,marginTop:8,flexWrap:'wrap'}}>
                      <label style={{fontSize:13,color:'var(--text3)'}}>questões estimadas{' '}
                        <input type="number" defaultValue={d.q} onBlur={e=>salvarCfg('q',d.mat,e.target.value)} style={{width:64,padding:'4px 6px',borderRadius:6,border:'1px solid rgba(148,163,184,.4)',background:'transparent',color:'var(--text)',fontSize:14}}/>
                      </label>
                      <label style={{fontSize:13,color:'var(--text3)'}}>nível manual (%){' '}
                        <input type="number" placeholder={String(Math.round(d.nivel))} onBlur={e=>salvarCfg('nivel',d.mat,e.target.value)} style={{width:64,padding:'4px 6px',borderRadius:6,border:'1px solid rgba(148,163,184,.4)',background:'transparent',color:'var(--text)',fontSize:14}}/>
                      </label>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
          <div style={{padding:'10px 12px',borderRadius:10,background:'rgba(148,163,184,.07)',border:'1px solid rgba(148,163,184,.2)',fontSize:13,color:'var(--text4)',lineHeight:1.6}}>
            <b>Como o veredito sai:</b> 🔒 Específicos com muitos pontos em jogo ou nível &lt;70% (com ≥8 questões) nunca é cortado · ✅ pts/h alto ou Específicos com pts/h ≥0,5 · 🟡 pts/h ≥0,35 · ✂️ abaixo disso.
            Nível "estimado" = ainda sem dado real (laranja): troca sozinho quando o Guruja/registros trouxerem acerto. A linha branca na barra é a meta.
          </div>
        </div>
      )}

      {sub==='corte'&&(
        <div>
          <div style={{fontSize:14,color:'var(--text3)',lineHeight:1.6,marginBottom:10}}>
            Se não der para bater a meta, <b>sacrifique de cima para baixo</b>. A ordem segue o plano da semana (nº de corte de cada atividade) e, no empate, o veredito da matéria (peso × seu nível × custo-benefício). 🔒 = peso alto, não corte.
          </div>
          {corte.length===0&&<div style={{padding:14,textAlign:'center',color:'var(--text4)'}}>Nenhuma atividade pendente.</div>}
          {corte.map((c,i)=>{
            const col=CORV[c.dec.veredito];
            return(
              <div key={c.id} style={{display:'flex',gap:10,alignItems:'flex-start',padding:'9px 11px',borderRadius:10,marginBottom:6,border:`1px solid ${col}30`,background:`${col}07`}}>
                <div style={{width:26,height:26,borderRadius:'50%',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:`${col}25`,color:col,fontSize:13,fontWeight:900,fontFamily:"'DM Mono',monospace"}}>{(c.corte==null?99:c.corte)>=99?'🔒':i+1}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:800,color:'var(--text)'}}>{c.ic} {c.mat} <span style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace",fontWeight:600}}>· #{c.id} · {c.tipo}</span></div>
                  <div style={{fontSize:13,color:'var(--text4)',marginTop:1}}>{c.conteudo}</div>
                  <div style={{display:'flex',gap:6,marginTop:4,flexWrap:'wrap'}}>
                    {chip(c.dec.veredito,col)}
                    {chip(`pts/h ${c.dec.cb.toFixed(2)}`,'#94a3b8')}
                    {chip(`Guruja ★${c.est}`,'#fbbf24')}
                    {chip(`nível ${Math.round(c.dec.nivel)}%`,'#94a3b8')}
                    {chip(`⏱ ${fmtMinG(c.min)}`,'#94a3b8')}
                  </div>
                  <CadernoBtn id={c.id} style={{marginTop:7,marginRight:6,padding:'7px 12px'}}/>
                  {onRapido&&<button onClick={()=>onRapido(c)} style={{marginTop:7,padding:'7px 12px',borderRadius:8,fontSize:13,fontWeight:800,cursor:'pointer',border:'1px solid rgba(96,165,250,.45)',background:'rgba(96,165,250,.1)',color:'#60a5fa'}}>⚡ Fiz agora — registrar</button>}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {sub==='disp'&&(()=>{
        const voltaram=CICLO_DISP.filter(d=>CICLO_VOLTA.includes(d.id));
        const trazer=id=>{const v=lsGet('ciclo_volta',[]);if(!v.includes(id))lsSet('ciclo_volta',[...v,id]);window.location.reload();};
        const dispensar=id=>{lsSet('ciclo_volta',lsGet('ciclo_volta',[]).filter(x=>x!==id));window.location.reload();};
        const mono="'DM Mono',monospace";
        const refs=CICLO_FORA.filter(d=>d.tipo==='Reforço');
        const feitasG=[];
        const resto=CICLO_FORA.filter(d=>d.tipo!=='Reforço').map(d=>({d,n:notaFormula(d.id)}))
          .sort((a,b)=>((b.n?b.n.nota:-1)-(a.n?a.n.nota:-1)));
        const totMin=resto.reduce((a,x)=>a+x.d.min,0);
        // por matéria (disciplina da fórmula): média das notas das atividades que ficaram fora
        const grp={};
        resto.forEach(x=>{if(!x.n)return;const g=grp[x.n.disc]||(grp[x.n.disc]={disc:x.n.disc,nivel:x.n.nivel,peso:x.n.peso,W:x.n.W,R:x.n.R,itens:[],min:0,soma:0});g.itens.push(x);g.min+=x.d.min;g.soma+=x.n.nota;});
        const mats=Object.values(grp).map(g=>({...g,media:g.soma/g.itens.length,topo:Math.max(...g.itens.map(x=>x.n.nota))})).sort((a,b)=>b.topo-a.topo);
        const corNota=n=>n>=.6?'#34d399':n>=.45?'#fbbf24':'#f87171';
        let acum=0;
        const card=(d,n,pos)=>{const ff=foraFeitos[d.id];acum+=d.min;return(
          <div key={d.id} style={{padding:'10px 12px',borderRadius:11,marginBottom:8,border:`1px solid ${ff?'rgba(52,211,153,.4)':'rgba(148,163,184,.28)'}`,background:ff?'rgba(52,211,153,.06)':'rgba(148,163,184,.04)'}}>
            <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:4}}>
              <span style={{fontSize:13,fontWeight:900,color:'#fbbf24',fontFamily:mono}}>#{pos}</span>
              <span style={{fontSize:15,fontWeight:900,color:'var(--text)'}}>{d.ic} {d.mat}</span>
              {n&&<span style={{marginLeft:'auto'}}>{chip(`nota ${fmN(n.nota)}`,corNota(n.nota))}</span>}
            </div>
            <div style={{fontSize:14,color:'var(--text)',marginBottom:4}}>{d.conteudo}</div>
            <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:5}}>
              {chip('📍 '+(d.glLongo||d.origem),'#7dd3fc')}
              {chip(`⏱ ${fmtMinG(d.min)}`,'#94a3b8')}
              {chip(`soma ${fmtMinG(acum)}`,'#64748b')}
            </div>
            {n?(<div style={{fontSize:13,color:'var(--text3)',lineHeight:1.6,marginBottom:6}}>
              <b style={{color:'#f87171'}}>40% fraca×peso {fmN(n.W)}</b> <span style={{color:'var(--text4)'}}>({n.disc}: {Math.round(n.nivel)}% · peso {String(n.peso).replace('.',',')}%)</span><br/>
              <b style={{color:'#34d399'}}>40% prioridade {fmN(n.P)}</b> <span style={{color:'var(--text4)'}}>({FORM_PNOME[n.p]})</span> · <b style={{color:'#a78bfa'}}>10% parada há tempo {fmN(n.R)}</b> · <b style={{color:'#fbbf24'}}>10% relevância {fmN(n.Rl)}</b> <span style={{color:'var(--text4)'}}>(★{n.est})</span>
            </div>):<div style={{fontSize:13,color:'var(--text4)',marginBottom:6}}>{d.motivo}</div>}
            {ff?(
              <div style={{fontSize:14,color:'#34d399',fontWeight:700}}>✓ Feita em {new Date(ff.dt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} · {ff.min} min{ff.q>0?` · ${ff.q}q · ${Math.round(ff.a/ff.q*100)}%`:''}</div>
            ):(
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                <CadernoBtn id={d.id} style={{padding:'7px 12px'}}/>
                {onRapido&&<button onClick={()=>onRapido({...d,fora:true})} style={{padding:'7px 12px',borderRadius:8,fontSize:13,fontWeight:800,cursor:'pointer',border:'1px solid rgba(96,165,250,.45)',background:'rgba(96,165,250,.1)',color:'#60a5fa'}}>⚡ Registrar</button>}
                <button onClick={()=>trazer(d.id)} style={{padding:'7px 12px',borderRadius:8,fontSize:13,fontWeight:800,cursor:'pointer',border:'1px solid rgba(52,211,153,.45)',background:'rgba(52,211,153,.1)',color:'#34d399'}}>↩ Trazer para o plano</button>
              </div>
            )}
          </div>
        );};
        return(
          <div>
            <div style={{padding:'12px 14px',borderRadius:12,background:'rgba(96,165,250,.07)',border:'1px solid rgba(96,165,250,.3)',marginBottom:12}}>
              <div style={{fontSize:13,color:'#60a5fa',fontFamily:mono,fontWeight:800,letterSpacing:'1px',marginBottom:5}}>🧮 FORA DO CICLO — NOTA 40/40/10/10</div>
              <div style={{fontSize:14,color:'var(--text3)',lineHeight:1.6}}>
                Atividades da meta atual que você ignorou no Guruja ({resto.length} atividades · {fmtMinG(totMin)}), da maior nota para a menor: <b>se sobrar tempo, reabilite no portal e faça de cima para baixo</b>.
                Nota (0 a 1) = <b>40%</b> o que você está fraca × peso (igual para todas, sem edital) + <b>40%</b> a prioridade do Guruja + <b>10%</b> matéria parada há tempo que vale a pena + <b>10%</b> relevância (estrelas).
              </div>
              <div style={{fontSize:13,color:'var(--text4)',marginTop:6,lineHeight:1.5}}>O seu nível vem do guruja.json mais o que você registrar no app depois da leitura.</div>
            </div>
            {feitasG.length>0&&(
              <div style={{marginBottom:12}}>
                <div style={{fontSize:13,color:'#34d399',fontFamily:mono,fontWeight:800,letterSpacing:'1px',marginBottom:6}}>✅ JÁ FEITAS NO GURUJA — REGISTRE TEMPO, QUESTÕES E ACERTOS</div>
                {feitasG.map(d=>{const ff=foraFeitos[d.id];return(
                  <div key={d.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:10,marginBottom:6,border:'1px solid rgba(52,211,153,.3)',background:'rgba(52,211,153,.05)'}}>
                    <div style={{flex:1,minWidth:0,fontSize:14,color:'var(--text)'}}>{d.ic} {d.mat} — <span style={{color:'var(--text4)'}}>{d.conteudo}</span></div>
                    {ff?<span style={{fontSize:13,color:'#34d399',fontWeight:800}}>✓ registrada</span>:(onRapido&&<button onClick={()=>onRapido({...d,fora:true})} style={{padding:'6px 10px',borderRadius:8,fontSize:13,fontWeight:800,cursor:'pointer',border:'1px solid rgba(96,165,250,.45)',background:'rgba(96,165,250,.1)',color:'#60a5fa',flexShrink:0}}>⚡ Registrar</button>)}
                  </div>
                );})}
              </div>
            )}
            <div style={{fontSize:13,color:'var(--text4)',fontFamily:mono,fontWeight:700,letterSpacing:'1px',marginBottom:6}}>POR MATÉRIA — O QUE FICOU FORA (pela maior nota)</div>
            {mats.map(g=>(
              <div key={g.disc} style={{padding:'9px 12px',borderRadius:11,marginBottom:6,border:`1px solid ${corNota(g.topo)}35`,background:`${corNota(g.topo)}07`}}>
                <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                  <span style={{fontSize:14,fontWeight:900,color:'var(--text)'}}>{g.disc}</span>
                  <span style={{marginLeft:'auto'}}>{chip(`melhor nota ${fmN(g.topo)}`,corNota(g.topo))}</span>
                </div>
                <div style={{fontSize:13,color:'var(--text4)',marginTop:3,lineHeight:1.5}}>
                  você em {Math.round(g.nivel)}% · peso {String(g.peso).replace('.',',')}% · fraca×peso {fmN(g.W)} · parada há tempo {fmN(g.R)} · {g.itens.length} atividade{g.itens.length>1?'s':''} fora ({fmtMinG(g.min)}) · nota média {fmN(g.media)}
                </div>
              </div>
            ))}
            <div style={{fontSize:13,color:'var(--text4)',fontFamily:mono,fontWeight:700,letterSpacing:'1px',margin:'12px 0 6px'}}>ATIVIDADES — DA MAIOR NOTA PARA A MENOR</div>
            {resto.length===0&&<div style={{padding:14,textAlign:'center',color:'var(--text4)'}}>Nada fora do plano: todas as atividades voltaram.</div>}
            {resto.map((x,i)=>card(x.d,x.n,i+1))}
            {refs.length>0&&(
              <div style={{padding:'10px 12px',borderRadius:11,marginTop:4,marginBottom:8,border:'1px solid rgba(125,211,252,.3)',background:'rgba(125,211,252,.05)',fontSize:13,color:'var(--text3)',lineHeight:1.6}}>
                🔁 <b>Reforços nº {refs[0].id-600} a {refs[refs.length-1].id-600}</b> ficam no ciclo à parte (1 por dia, na ordem do Guruja). Veja e registre em <b>Revisão › Reforços</b>.
              </div>
            )}
            {voltaram.length>0&&(
              <div style={{marginTop:6}}>
                <div style={{fontSize:13,color:'var(--text4)',fontFamily:mono,fontWeight:700,letterSpacing:'1px',marginBottom:6}}>JÁ VOLTARAM PARA O PLANO</div>
                {voltaram.map(d=>(
                  <div key={d.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:10,marginBottom:6,border:'1px solid rgba(52,211,153,.25)',background:'rgba(52,211,153,.05)'}}>
                    <div style={{flex:1,minWidth:0,fontSize:14,color:'var(--text)'}}>{d.ic} {d.mat} — <span style={{color:'var(--text4)'}}>{d.conteudo}</span></div>
                    <button onClick={()=>dispensar(d.id)} style={{padding:'6px 10px',borderRadius:8,fontSize:13,fontWeight:800,cursor:'pointer',border:'1px solid rgba(248,113,113,.4)',background:'transparent',color:'#f87171',flexShrink:0}}>✕ Tirar</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
}

function TabMapa(){
  const[aba,setAba]=useState('ranking');
  const[matSel,setMatSel]=useState('todas');
  const[ordemTabela,setOrdemTabela]=useState('risco'); // risco|acerto|peso

  // Lê dados
  const hist=lsGet('historico_diario',[]);
  const guruja=getGurujaAssuntos();
  const todayMs=new Date().setHours(0,0,0,0);

  // Acerto real por assunto do historico
  const acertoPorAssunto=useMemo(()=>{
    const por={};
    hist.forEach(r=>{
      if(!r.materia||!r.assunto||!parseInt(r.questoes))return;
      const k=r.materia+'|||'+r.assunto;
      if(!por[k])por[k]={q:0,a:0,lastDt:0};
      por[k].q+=parseInt(r.questoes)||0;
      por[k].a+=parseInt(r.acertei)||0;
      if((r.dt||0)>por[k].lastDt)por[k].lastDt=r.dt||0;
    });
    return por;
  },[hist.length]);

  // Monta lista completa de assuntos cruzando Guruja + historico
  const todosAssuntos=useMemo(()=>{
    const lista=[];
    Object.entries(guruja).forEach(([mat,dados])=>{
      if(!dados.assuntos)return;
      dados.assuntos.forEach(a=>{
        if(isDescartado(mat,a.titulo))return; // marcado como "não vale meu tempo" — some do Mapa
        const k=mat+'|||'+a.titulo;
        const reg=acertoPorAssunto[k]||null;
        const acertoApp=reg?Math.round(reg.a/reg.q*100):null;
        // Acerto combinado: se tem dado no app, pondera com Guruja
        const acertoComb=acertoApp!==null
          ?Math.round((a.acerto*(a.questoes||20)+acertoApp*(reg.q))/(( a.questoes||20)+reg.q))
          :a.acerto;
        const estudado=reg!==null||a.acerto>0;
        const pesoTopico=a.relevancia*2; // proxy de peso: relevância × 2
        const pontosRisco=Math.round(pesoTopico*(1-acertoComb/100)*10)/10;
        const diasSem=reg?.lastDt?Math.floor((todayMs-reg.lastDt)/86400000):null;
        lista.push({
          mat,titulo:a.titulo,
          pesoEdital:pesoTopico,
          acertoGuruja:a.acerto,
          acertoApp,
          acertoComb,
          diffMedia:a.diffMedia,
          relevancia:a.relevancia,
          tempoCump:a.tempoCump,
          questoesGuruja:a.questoes,
          pontosRisco,
          estudado,
          diasSem,
          status:!estudado?'nao_estudado':statusPct(acertoComb),
        });
      });
    });
    // Matérias sem nenhuma chave no Guruja (ex: Empresarial) não apareceriam — completa com o EDITAL
    EDITAL_MATS.filter(m=>m!=='Discursivas'&&!guruja[m]).forEach(mat=>{
      (EDITAL[mat]?.top||[]).forEach(t=>{

        const k=mat+'|||'+t.t;

        const acertoApp=reg?Math.round(reg.a/reg.q*100):null;
        const acertoComb=acertoApp!==null?acertoApp:t.acerto;
        const estudado=reg!==null||t.acerto!=null;
        const diasSem=reg?.lastDt?Math.floor((todayMs-reg.lastDt)/86400000):null;
        lista.push({
          mat,titulo:t.t,pesoEdital:(t.p||10)/5,acertoGuruja:t.acerto,acertoApp,
          acertoComb:acertoComb||0,diffMedia:0,relevancia:Math.round((t.p||10)/20)||1,
          tempoCump:null,questoesGuruja:null,pontosRisco:estudado?0:5,estudado,diasSem,
          status:!estudado?'nao_estudado':statusPct(acertoComb),
        });
      });
    });
    return lista;
  },[guruja,acertoPorAssunto]);

  const corStatus={dominio:'#34d399',atencao:'#fbbf24',critico:'#f87171',nao_estudado:'#aab6c8'};
  const emojiStatus={dominio:'🟢',atencao:'🟡',critico:'🔴',nao_estudado:'⬜'};
  const labelStatus={dominio:'Dominado',atencao:'Atenção',critico:'Crítico',nao_estudado:'Não estudado'};

  const ABAS_MAPA=[
    {id:'ranking',l:'🏆 Ranking Risco'},
    {id:'tabela', l:'📋 Tabela'},
    {id:'barras',  l:'📊 Barras'},
    {id:'painel',  l:'🎯 Por Matéria'},
    {id:'nao_estudados',l:'⬜ Não estudados'},
  ];

  return(
    <div style={{maxWidth:680,margin:'0 auto'}}>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:20,fontWeight:900,color:'var(--text)',fontFamily:"'DM Serif Display',serif",marginBottom:2}}>📊 Mapa da Prova</div>
        <div style={{fontSize:14,color:'var(--text4)'}}>Toque numa matéria pra filtrar · toque de novo pra ver todas</div>
      </div>

        {EDITAL_MATS.filter(m=>m!=='Discursivas').map(mat=>{

          const vista=jaVista(mat);

          return(

              style={{flexShrink:0,display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'8px 10px',borderRadius:10,border:`2px solid ${ativo?cor:'transparent'}`,background:`${cor}15`,cursor:'pointer'}}>

        return(

            )}
          </div>
        );
      })()}
    </div>
  );
}

// ─── AGENDA DO DIA (férias) — montada sozinha a partir do plano de hoje ───────────────────
const hmToMin=t=>{const[h,m]=String(t).split(':').map(Number);return h*60+m;};
const minToHm=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
function montarAgendaDia({dw,lista,feitosSet,agoraMin,ehHoje,treinoFeito}){
  const C=AGENDA_FERIAS;const dom=dw===0;
  const blocos=[];
  blocos.push({ini:hmToMin(C.acordar),dur:30,ic:'⏰',l:'Acordar · água · 1 olhada no plano de hoje',k:'r',fixo:true});
  blocos.push({ini:hmToMin(C.anki),dur:C.ankiMin,ic:'🃏',l:'Anki PROFUNDO (30 min, fora do ciclo)',k:'a',fixo:true});
  if(treinoFeito&&!dom)blocos.push({ini:null,dur:0,ic:'🏋️',l:'Treino de hoje: feito ✓',k:'d',fixo:true});
  let cur=hmToMin(C.estudoIni);
  // hoje: o que já foi feito aparece como ✓ no início; o que falta recomeça a contar do relógio atual
  const feitas=lista.filter(c=>feitosSet.has(c.id));
  const pend=lista.filter(c=>!feitosSet.has(c.id));
  feitas.forEach(c=>blocos.push({ini:null,dur:c.min,item:c,done:true,k:'s'}));
  if(ehHoje&&pend.length)cur=Math.max(cur,Math.ceil(agoraMin/5)*5);
  let desdePausa=0,total=0,treinoOk=!!treinoFeito||dom,almocoOk=false;
  const almIni=hmToMin(C.almoco);
  const checaAlmoco=()=>{if(!almocoOk&&cur>=almIni){blocos.push({ini:cur,dur:C.almocoMin,ic:'🍽️',l:'Almoço com o Kauê',k:'m',fixo:true});cur+=C.almocoMin;almocoOk=true;desdePausa=0;}};
  pend.forEach(c=>{
    checaAlmoco();
    if(!treinoOk&&total>=C.treinoDepois&&cur<almIni){blocos.push({ini:cur,dur:C.treinoMin,ic:'🏋️',l:'Treino + banho',k:'e',fixo:true});cur+=C.treinoMin;treinoOk=true;desdePausa=0;checaAlmoco();}
    else if(desdePausa>=C.pausaCada){blocos.push({ini:cur,dur:C.pausaMin,ic:'☕',l:'Pausa (levanta, água, olha longe)',k:'b',fixo:true});cur+=C.pausaMin;desdePausa=0;}
    blocos.push({ini:cur,dur:c.min,item:c,done:false,k:'s'});cur+=c.min;desdePausa+=c.min;total+=c.min;
  });
  if(!almocoOk&&cur>=almIni-30&&cur<almIni+120){const i=Math.max(cur,almIni);blocos.push({ini:i,dur:C.almocoMin,ic:'🍽️',l:'Almoço com o Kauê',k:'m',fixo:true});cur=i+C.almocoMin;}
  if(!treinoOk&&cur<hmToMin('14:00')){blocos.push({ini:cur,dur:C.treinoMin,ic:'🏋️',l:'Treino + banho',k:'e',fixo:true});cur+=C.treinoMin;}
  blocos.push({ini:Math.max(cur,hmToMin('13:00')),dur:0,ic:'✅',l:dom?'Estudo encerrado (4h) — tarde livre com o Kauê':'Estudo do dia encerrado',k:'d',fixo:true});
  if(!dom){
    const tiTarde=Math.max(hmToMin(C.tardeTI),cur+15);
    blocos.push({ini:tiTarde,dur:C.tardeTIMin,ic:'🧠',l:'Tempo morto: 30 min de questões de TI (fecha as 2h de TI do dia) + Anki RÁPIDO',k:'t',fixo:true});
    blocos.push({ini:Math.max(hmToMin(C.kaue),tiTarde+C.tardeTIMin),dur:0,ic:'⚓',l:'Tarde livre — Kauê / casa / mercado',k:'f',fixo:true});
  }
  blocos.push({ini:hmToMin(C.dormir),dur:0,ic:'😴',l:'Dormir',k:'z',fixo:true});
  return blocos;
}
function AgendaDia({lista,feitosSet,dw,onIr,onRapido}){
  const now=new Date();const agora=now.getHours()*60+now.getMinutes();
  const[treino,setTreinoL]=useState(()=>lsGet(`treino_${getDK()}`,{fez:null}));

  const bl=montarAgendaDia({dw,lista,feitosSet,agoraMin:agora,ehHoje:true,treinoFeito:treino.fez===true});

  const fim=bl.filter(b=>b.item&&!b.done).slice(-1)[0];

  return(

        <div style={{fontSize:13,color:'#c2ccd8',fontFamily:mono}}>{fmtMinG(minFeito)}/{fmtMinG(minTot)}{fimStr?` · termina ~${fimStr}`:''}</div>

      {bl.map((b,i)=>{
        const it=b.item;const cor=KC[b.k]||'#94a3b8';
        const passou=b.ini!=null&&!it&&b.ini+Math.max(b.dur,1)<=agora;
        const ativo=it&&!b.done&&it.id===proxId;
        return(
          <div key={i} style={{display:'flex',gap:9,alignItems:'flex-start',padding:'7px 0',borderTop:i?'1px solid rgba(148,163,184,.12)':'none',opacity:b.done||passou?.5:1}}>

            <div style={{flex:1,minWidth:0}}>
              {it?(
                <div>
                  <div style={{fontSize:14,fontWeight:ativo?900:700,color:'var(--text)',textDecoration:b.done?'line-through':'none',lineHeight:1.35}}>{ativo?'▶ ':''}{it.ic} {it.mat} <span style={{color:'var(--text4)',fontWeight:600}}>— {it.conteudo}</span></div>
                  <div style={{fontSize:12,color:'#7dd3fc',fontFamily:mono,marginTop:1}}>📍 {it.glLongo} · ⏱ {fmtMinG(it.min)}{b.ini!=null?` · até ${minToHm(b.ini+it.min)}`:''}</div>
                </div>
              ):(
                <div style={{fontSize:14,color:b.k==='d'?'#34d399':'var(--text)',lineHeight:1.35}}>{b.ic} {b.l}{b.dur>0?<span style={{color:'var(--text4)',fontFamily:mono,fontSize:12}}> · {b.dur}min</span>:null}{b.k==='e'&&<button onClick={marcarTreino} style={{marginLeft:8,padding:'3px 8px',borderRadius:6,border:'1px solid rgba(52,211,153,.45)',background:'rgba(52,211,153,.12)',color:'#34d399',fontSize:12,fontWeight:800,cursor:'pointer'}}>já treinei</button>}</div>
              )}
            </div>
            {ativo&&<div style={{display:'flex',gap:5,flexShrink:0}}>
              <CadernoBtn id={it.id} curto/>

              <button onClick={()=>onRapido&&onRapido(it)} style={{padding:'6px 9px',borderRadius:8,border:'1px solid rgba(52,211,153,.45)',background:'rgba(52,211,153,.12)',color:'#34d399',fontSize:13,fontWeight:800,cursor:'pointer'}}>⚡</button>
            </div>}
          </div>
        );
      })}
    </div>
  );
}
