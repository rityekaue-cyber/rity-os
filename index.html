// ─── REVISÃO PROFUNDA — componente próprio (hooks válidos) ───
function TabRevProfunda({totalBlocos}){
  const fila=getFilaRevProfunda();
  const proxima=fila[0];
  const deveAgora=deveRevisaoProfunda(totalBlocos);
  const[hist,setHist]=useState(()=>lsGet('rev_profunda_hist',[]));
  const ultRev=hist.length>0?[...hist].sort((a,b)=>b.cicloRef-a.cicloRef)[0]:null;
  const ultimoCicloRev=ultRev?.cicloRef||0;
  const blocosFaltam=Math.max(0,7-(totalBlocos-ultimoCicloRev));

  // Formulário de registro
  const[matSel,setMatSel]=useState('');
  const[slot1,setSlot1]=useState({fonte:'Obsidian',assunto:'',tempo:'45'});
  const[slot2,setSlot2]=useState({questoes:'',acertei:'',dif:0});
  const[slot3cards,setSlot3Cards]=useState('');
  const[salvo,setSalvo]=useState(false);

  const CORS_DIF=['#34d399','#a3e635','#fbbf24','#fb923c','#f87171'];
  const mats=CICLO.map(s=>s.mat).filter((v,i,a)=>a.indexOf(v)===i);

  // Lista MANUAL de revisão — escrita pela Ritchely (rev_manual). Vai para o topo da aba Hoje.
  const[manual,setManual]=useState(()=>lsGet('rev_manual',[]));
  const[novoMat,setNovoMat]=useState('');
  const[novoAss,setNovoAss]=useState('');
  const[itemSel,setItemSel]=useState(null);
  const gravaManual=n=>{lsSet('rev_manual',n);setManual(n);};
  const addManual=()=>{
    const m=novoMat.trim();if(!m)return;
    gravaManual([...manual,{id:'rm_'+Date.now(),mat:m,assunto:novoAss.trim(),dt:Date.now(),feito:false}]);
    setNovoMat('');setNovoAss('');
  };
  const pendManual=manual.filter(x=>!x.feito);
  const feitosManual=manual.filter(x=>x.feito);
  const toggleManual=id=>gravaManual(manual.map(x=>x.id===id?{...x,feito:!x.feito,feitoEm:!x.feito?Date.now():null}:x));
  const delManual=id=>gravaManual(manual.filter(x=>x.id!==id));
  const subirManual=id=>{const i=manual.findIndex(x=>x.id===id);if(i<=0)return;const n=[...manual];
    // sobe até o item pendente anterior
    let k=i-1;while(k>=0&&n[k].feito)k--;if(k<0)return;[n[k],n[i]]=[n[i],n[k]];gravaManual(n);};
  const iniciarItem=it=>{setItemSel(it.id);setMatSel(it.mat);setSlot1(s=>({...s,assunto:it.assunto||''}));};

  const salvarSessao=()=>{

    if(!matSel)return;
    const novo={
      id:'rp_'+Date.now(),mat:matSel,
      cicloRef:totalBlocos,data:getDK(),dt:Date.now(),
      slot1:{...slot1},
      slot2:{...slot2,pct:slot2.questoes&&slot2.acertei?Math.round(parseInt(slot2.acertei)/parseInt(slot2.questoes)*100):null},
      slot3cards:parseInt(slot3cards)||0,
    };
    const n=[...hist,novo];
    lsSet('rev_profunda_hist',n);setHist(n);
    if(itemSel){gravaManual(manual.map(x=>x.id===itemSel?{...x,feito:true,feitoEm:Date.now()}:x));setItemSel(null);}
    // Adiciona os cards Anki ao registro de sessão do dia
    if(parseInt(slot3cards)>0){
      const ankiRegs=lsGet('rev_anki',[]);
      lsSet('rev_anki',[...ankiRegs,{mat:matSel,cards:parseInt(slot3cards),dif:slot2.dif||3,dia:getDK(),dt:Date.now(),tempo:'15',origem:'rev1h30'}]);
    }
    setSalvo(true);
    setTimeout(()=>{setSalvo(false);setMatSel('');setSlot1({fonte:'Obsidian',assunto:'',tempo:'45'});setSlot2({questoes:'',acertei:'',dif:0});setSlot3Cards('');},2500);
  };

  if(!proxima&&!matSel){}

  return(
    <div>
      {/* Lista manual — o que EU preciso revisar */}
      <div style={{padding:'12px 14px',borderRadius:12,background:'rgba(167,139,250,.07)',border:'1px solid rgba(167,139,250,.3)',marginBottom:14}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div style={{fontSize:13,color:'#a78bfa',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px'}}>✍️ O QUE PRECISO REVISAR — vai para o topo da aba Hoje</div>
          <div style={{fontSize:13,color:'var(--text4)',fontFamily:"'DM Mono',monospace"}}>{pendManual.length} pend. · {hist.length} sessões</div>
        </div>
        <input list="rev-mats" value={novoMat} onChange={e=>setNovoMat(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addManual();}} placeholder="Matéria (digite ou escolha)…"
          style={{width:'100%',padding:'10px 12px',borderRadius:9,border:'1px solid rgba(167,139,250,.3)',background:'rgba(167,139,250,.05)',color:'var(--text)',fontSize:15,outline:'none',boxSizing:'border-box',marginBottom:6}}/>
        <datalist id="rev-mats">{mats.map(m=><option key={m} value={m}/>)}</datalist>
        <div style={{display:'flex',gap:6}}>
          <input value={novoAss} onChange={e=>setNovoAss(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addManual();}} placeholder="Assunto (opcional)…"
            style={{flex:1,minWidth:0,padding:'10px 12px',borderRadius:9,border:'1px solid rgba(167,139,250,.3)',background:'rgba(167,139,250,.05)',color:'var(--text)',fontSize:15,outline:'none',boxSizing:'border-box'}}/>
          <button onClick={addManual} disabled={!novoMat.trim()}
            style={{padding:'10px 16px',borderRadius:9,border:'none',background:novoMat.trim()?'#a78bfa':'var(--border)',color:novoMat.trim()?'#0f172a':'var(--text4)',fontSize:15,fontWeight:900,cursor:'pointer',flexShrink:0}}>+ Add</button>
        </div>
      </div>

      {pendManual.length===0&&<div style={{padding:'12px 14px',borderRadius:10,background:'rgba(255,255,255,.03)',border:'1px dashed var(--border)',fontSize:14,color:'var(--text4)',marginBottom:14,lineHeight:1.6}}>Lista vazia. Escreva acima a matéria que precisa revisar — ela aparece na aba Hoje como prioridade.</div>}
      {pendManual.map((it,i)=>{
        const sel=itemSel===it.id;
        return(
          <div key={it.id} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 12px',borderRadius:10,border:`2px solid ${sel?'#a78bfa':'var(--border)'}`,background:sel?'rgba(167,139,250,.1)':'transparent',marginBottom:6}}>

// ─── REFORÇOS DO GURUJA — ciclo (nº 1 a 12, recomeça ao fechar a volta) ──────────────────
// Cada registro vai para o histórico (matéria, tempo, questões, acertos) e alimenta o nível por matéria (Decisão) e Dados.
function ReforcosCiclo({onRapido,ver}){
  const hist=useMemo(()=>lsGet('historico_diario',[]),[ver]);
  const D=useMemo(()=>{
    const por={};REFORCOS_GURUJA.forEach(r=>{por[r.n]={regs:[],q:0,a:0,min:0};});
    (hist||[]).forEach(h=>{
      const n=h&&h.reforcoN;
      if(!n||!por[n]||h.parcial)return;
      if(PLANO_GURUJA&&h.metaOrdem!=null&&h.metaOrdem!==PLANO_GURUJA.cur.ordem)return;
      const p=por[n];p.regs.push(h);p.q+=parseInt(h.questoes)||0;p.a+=parseInt(h.acertei)||0;p.min+=parseInt(h.tempo)||0;
    });
    const cont=REFORCOS_GURUJA.map(r=>por[r.n].regs.length);
    const menor=cont.length?Math.min(...cont):0;
    const tot=REFORCOS_GURUJA.reduce((s,r)=>({q:s.q+por[r.n].q,a:s.a+por[r.n].a,min:s.min+por[r.n].min,n:s.n+por[r.n].regs.length}),{q:0,a:0,min:0,n:0});
    return{por,menor,volta:menor+1,proximo:REFORCOS_GURUJA.find(r=>por[r.n].regs.length===menor),feitosVolta:cont.filter(c=>c>menor).length,tot};
  },[hist]);
  const pctDe=(a,q)=>q>0?Math.round(a/q*100):null;
  const corPct=p=>p==null?'#aab6c6':p>=80?'#34d399':p>=60?'#fbbf24':'#f87171';
  const mono="'DM Mono',monospace";
  const estrelas=n=>'★'.repeat(n)+'☆'.repeat(5-n);
  const abrir=r=>{if(onRapido)onRapido({id:600+r.n,mat:r.mat,ic:(MAT_INFO[r.mat]||{}).ic||'🔁',conteudo:`Reforço nº ${r.n} — ${r.t}`,min:30,fora:!CICLO.some(c=>c.id===600+r.n),reforcoN:r.n});};
  const planDia=n=>{const c=CICLO.find(x=>x.id===600+n);return c?diaCicloLabel(c.dia):null;};
  const regra=est=>est>=5?'10 questões do tema · o que errar vira Anki (3C)':'5 questões do tema + 5 cartões de Anki dos erros';
  const pr=D.proximo;const pTot=pctDe(D.tot.a,D.tot.q);
  return(
    <div>
      <div style={{padding:'12px 14px',borderRadius:12,background:'rgba(125,211,252,.07)',border:'1px solid rgba(125,211,252,.3)',marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
          <div style={{flex:1,fontSize:13,color:'#7dd3fc',fontFamily:mono,fontWeight:800,letterSpacing:'1px'}}>🔁 REFORÇOS DO GURUJA · {REFORCOS_GURUJA.length?`VOLTA ${D.volta}`:'AGUARDANDO A META'}</div>
          <div style={{fontSize:14,color:'#e8edf5',fontFamily:mono,fontWeight:800}}>{D.feitosVolta}/{REFORCOS_GURUJA.length}</div>
        </div>
        <div style={{height:7,borderRadius:4,background:'rgba(148,163,184,.2)',overflow:'hidden',marginBottom:8}}><div style={{height:'100%',width:`${REFORCOS_GURUJA.length?D.feitosVolta/REFORCOS_GURUJA.length*100:0}%`,background:'#7dd3fc'}}/></div>
        <div style={{display:'flex',gap:14,flexWrap:'wrap',fontSize:13,color:'#c2ccd8'}}>
          <span>⏱ {fmtMinG(D.tot.min)} no total</span>
          <span>📝 {D.tot.q} questões</span>
          <span>✅ {D.tot.a} acertos</span>
          <span style={{color:corPct(pTot),fontWeight:800}}>{pTot==null?'—%':pTot+'%'}</span>
        </div>
        <div style={{fontSize:13,color:'var(--text4)',marginTop:6,lineHeight:1.5}}>Um por dia, na ordem do Guruja. Ao fechar todos, recomeça. Tempo, questões e acertos entram no seu nível por matéria (Decisão) e em Dados.</div>
      </div>
      {pr&&<div style={{padding:'13px 14px',borderRadius:12,background:'rgba(52,211,153,.08)',border:'2px solid rgba(52,211,153,.45)',marginBottom:12}}>
        <div style={{fontSize:13,color:'#34d399',fontFamily:mono,fontWeight:800,letterSpacing:'1px',marginBottom:4}}>▶ PRÓXIMO REFORÇO · Nº {pr.n} DE {REFORCOS_GURUJA.length}</div>
        <div style={{fontSize:17,fontWeight:900,color:'#e8edf5'}}>{(MAT_INFO[pr.mat]||{}).ic||'🔁'} {pr.mat}</div>
        <div style={{fontSize:15,color:'#e8edf5',margin:'2px 0 4px'}}>{pr.t}</div>
        <div style={{fontSize:13,color:'#c2ccd8',fontFamily:mono,marginBottom:6}}>{estrelas(pr.est)} · {pr.cod} · prazo no Guruja: dia {pr.dtg}{planDia(pr.n)?` · no plano: ${planDia(pr.n)}`:''}</div>
        <div style={{fontSize:13,color:'#b4c0d1',marginBottom:10}}>Como fazer (30 min): {regra(pr.est)}</div>
        <button onClick={()=>abrir(pr)} style={{width:'100%',padding:'12px',borderRadius:10,border:'none',background:'#34d399',color:'#050a14',fontSize:15,fontWeight:900,cursor:'pointer'}}>⚡ Registrar tempo, questões e acertos</button>
      </div>}
      <div style={{fontSize:13,color:'var(--text4)',fontFamily:mono,letterSpacing:'1px',marginBottom:6}}>OS REFORÇOS DA META ATUAL, NA ORDEM DO GURUJA</div>
      {REFORCOS_GURUJA.map(r=>{
        const x=D.por[r.n];const feito=x.regs.length>D.menor;const atual=pr&&pr.n===r.n;
        const ult=x.regs[x.regs.length-1];
        const pUlt=ult?pctDe(parseInt(ult.acertei)||0,parseInt(ult.questoes)||0):null;
        const pAc=pctDe(x.a,x.q);
        return(
          <div key={r.n} style={{padding:'9px 11px',borderRadius:10,marginBottom:6,border:`1px solid ${atual?'rgba(52,211,153,.5)':feito?'rgba(52,211,153,.25)':'rgba(148,163,184,.2)'}`,background:feito?'rgba(52,211,153,.05)':'transparent'}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{width:24,height:24,borderRadius:'50%',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,fontFamily:mono,border:`2px solid ${feito?'#34d399':atual?'#34d399':'rgba(148,163,184,.3)'}`,background:feito?'#34d399':'transparent',color:feito?'#050a14':atual?'#34d399':'#aab6c8'}}>{feito?'✓':atual?'▶':r.n}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:700,color:'#e8edf5',lineHeight:1.3}}>{(MAT_INFO[r.mat]||{}).ic||'🔁'} {r.mat} <span style={{color:'#fbbf24',fontFamily:mono,fontSize:12}}>{'★'.repeat(r.est)}</span></div>
                <div style={{fontSize:13,color:'#c2ccd8',lineHeight:1.4}}>{r.t}</div>
                <div style={{fontSize:12,color:'#7dd3fc',fontFamily:mono,marginTop:1}}>#{r.n} · {r.cod} · prazo dia {r.dtg}{planDia(r.n)?` · plano: ${planDia(r.n)}`:''}</div>
                {x.regs.length>0&&<div style={{fontSize:12,color:'#c2ccd8',fontFamily:mono,marginTop:2}}>
                  {x.regs.length}× feito · ⏱ {fmtMinG(x.min)} · 📝 {x.q}q · ✅ {x.a} · <span style={{color:corPct(pAc),fontWeight:800}}>{pAc==null?'—':pAc+'%'}</span>{pUlt!=null&&x.regs.length>1?` · última ${pUlt}%`:''}
                </div>}
              </div>
              <CadernoBtn id={600+r.n} curto style={{padding:'8px 10px',fontSize:14}}/>
              <button onClick={()=>abrir(r)} style={{padding:'8px 10px',borderRadius:8,border:'1px solid rgba(52,211,153,.4)',background:'rgba(52,211,153,.1)',color:'#34d399',fontSize:14,fontWeight:800,cursor:'pointer',flexShrink:0}}>⚡</button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function TabRevisao({totalBlocos,tmSugestao,tmIA,onSyncHistorico,onAddHoras,ankiSugestoes=[],nlmSugestao=null,onRapido,rapidoVer}){
  const hoje=getDK();
  const[aba,setAba]=useState('reforcos');
  const[ankiRegs,setAnkiRegs]=useState(()=>lsGet('rev_anki',[]));
  const[nlmRegs,setNlmRegs]=useState(()=>lsGet('rev_nlm',[]));
  const[rev1h30Regs,setRev1h30Regs]=useState(()=>lsGet('rev_1h30',[]));
  const[cadRegs,setCadRegs]=useState(()=>lsGet('rev_caderno',[]));
  const[topicos,setTopicos]=useState(()=>lsGet('rev_topicos',[]));
  const[editalStatus,setEditalStatus]=useState(()=>lsGet('edital_status',{}));
  const[editalMatSel,setEditalMatSel]=useState(EDITAL_MATS[0]||'Português');
  const[topicoForm,setTopicoForm]=useState('');
  const[criticosManuais,setCriticosManuais]=useState(()=>lsGet('criticos_manuais',[]));
  const[critForm,setCritForm]=useState({mat:'',assunto:'',motivo:'',prioridade:'alta'});
  const[critSalvo,setCritSalvo]=useState(false);
  const[criticoIALoad,setCriticoIALoad]=useState(false);
  const[ankiForm,setAnkiForm]=useState({mat:'',tempo:'',cards:'',questoes:'',dif:0});
  const[ankiSalvo,setAnkiSalvo]=useState(false);
  const[nlmForm,setNlmForm]=useState({mat:'',oque:'',tempo:'',questoes:'',dif:0,fonte:'NLM',pct:''});
  const[nlmSalvo,setNlmSalvo]=useState(false);
  const[cadForm,setCadForm]=useState({mat:'',assunto:'',questoes:'',acertei:'',dificuldade:3,obs:''});
  const[cadSalvo,setCadSalvo]=useState(false);
  const[slots,setSlots]=useState([{mat:'',oque:[],tempo:'',questoes:'',dif:0,salvo:false},{mat:'',oque:[],tempo:'',questoes:'',dif:0,salvo:false},{mat:'',oque:[],tempo:'',questoes:'',dif:0,salvo:false}]);
  const[slotSalvo,setSlotSalvo]=useState(false);
  const[tmFeitoAnki,setTmFeitoAnki]=useState(()=>lsGet(`tm_anki_${hoje}`,false));
  const[tmFeitoNlm,setTmFeitoNlm]=useState(()=>lsGet(`tm_nlm_${hoje}`,false));
  const[cadExpandidos,setCadExpandidos]=useState(()=>new Set());

  const MATS=CICLO.map(c=>c.mat).filter((v,i,a)=>a.indexOf(v)===i);
  const CORS_DIF=['#34d399','#a3e635','#fbbf24','#fb923c','#f87171'];
  const LABELS_DIF=['FÁCIL','TRANQUILO','MÉDIO','DIFÍCIL','MUITO DIFÍCIL'];

  // Tempo Morto calculado no App e passado como prop tmSugestao
  const tempoMorto=tmSugestao||{anki:{mat:'Dir. Financeiro / AFO',difMedia:0,diasSem:0},nlm:{mat:'Dir. Previdenciário',difMedia:0,diasSem:0},ranking:[],travouRecente:[]};

  // Fix 1h30 — conta blocos desde última revisão
  const ultimaRev=rev1h30Regs.length>0?rev1h30Regs[rev1h30Regs.length-1]:null;
  const ultimoBlocoRev=ultimaRev?.blocoRef||0;
  const blocosDesde=totalBlocos-ultimoBlocoRev;
  const deve1h30=blocosDesde>=5&&totalBlocos>0;
  const faltam1h30=Math.max(0,5-blocosDesde);

  // ── IA diária para Tempo Morto (uma vez por dia) ───────────
  const chamarIaTempoMorto=async()=>{
    const dk=getDK();
    const cached=lsGet('tm_ia_cache',null);
    if(cached&&cached.dia===dk)return; // já chamou hoje
    const k=getAK();if(!k||!k.startsWith('sk-ant'))return;
    try{
      const historico2=lsGet('historico_diario',[]);
      const ranking=Object.entries(historico2.reduce((acc,r)=>{if(r.materia&&r.questoes){acc[r.materia]=acc[r.materia]||{q:0,a:0};acc[r.materia].q+=parseInt(r.questoes)||0;acc[r.materia].a+=parseInt(r.acertei)||0;}return acc;},{})).map(([m,v])=>({m,pct:v.q>0?Math.round(v.a/v.q*100):null})).sort((a,b)=>(a.pct||100)-(b.pct||100));
      const ctx=`Ciclo atual: bloco ${totalBlocos}/${N}. Motor local sugere Anki: ${tempoMorto.anki.mat} e NLM: ${tempoMorto.nlm.mat}. ${fmtRanking()}. Travou recentemente: ${tempoMorto.travouRecente.join('; ')||'nada'}. Guruja: ${lsGet('guruja_data',null)?.alerta||'sem dado'}.`;
      const res=await chamarClaude('Você é assistente de estudos no planejamento Consolidar a base do Guruja (pré-edital, FCC). Responda APENAS JSON sem markdown: {"anki":"nome_materia","nlm":"nome_materia","motivo":"1 frase explicando por que essas matérias agora"}',
        [{role:'user',content:ctx}],200);
      const parsed=JSON.parse(res.replace(/```json|```/g,'').trim());
      const cache={...parsed,dia:dk};
      lsSet('tm_ia_cache',cache);
    }catch(e){console.log('TM IA error:',e.message);}
  };

  const toggleEditalStatus=(mat,topico,status)=>{
    // Cicla: '' → 'estudei' → 'domino' → ''
    const ciclo=['','estudei','domino'];
    const atual=editalStatus[mat+':'+topico]||'';
    const proximo=ciclo[(ciclo.indexOf(atual)+1)%ciclo.length];
    const nd={...editalStatus,[mat+':'+topico]:proximo||undefined};
    if(!proximo)delete nd[mat+':'+topico];
    setEditalStatus(nd);lsSet('edital_status',nd);
  };

  const salvarCritico=()=>{
    if(!critForm.mat)return;
    const n=[...criticosManuais,{...critForm,id:Date.now(),dt:Date.now()}];
    setCriticosManuais(n);lsSet('criticos_manuais',n);
    setCritForm({mat:'',assunto:'',motivo:'',prioridade:'alta'});
    setCritSalvo(true);setTimeout(()=>setCritSalvo(false),1500);
  };
  const delCritico=id=>{const n=criticosManuais.filter(x=>x.id!==id);setCriticosManuais(n);lsSet('criticos_manuais',n);};
  const pedirIaCriticos=async()=>{
    if(criticoIALoad)return;
    setCriticoIALoad(true);
    try{
      const hist=lsGet('historico_diario',[]);
      const por={};hist.forEach(r=>{if(r.materia&&r.questoes){por[r.materia]=por[r.materia]||{q:0,a:0};por[r.materia].q+=parseInt(r.questoes)||0;por[r.materia].a+=parseInt(r.acertei)||0;}});
      const ranking=Object.entries(por).map(([m,v])=>({m,pct:v.q>0?Math.round(v.a/v.q*100):null,q:v.q})).sort((a,b)=>(a.pct||100)-(b.pct||100));
      const ctx=`Planejamento Consolidar a base (pré-edital, FCC): todas as matérias têm o mesmo peso. Aproveitamento atual (pior→melhor): ${ranking.slice(0,8).map(r=>`${r.m}:${r.pct!==null?r.pct+'%':'sem dado'}(${r.q}Q)`).join(', ')}. Ciclo atual: bloco ${totalBlocos}/${N}. Manuais já marcados: ${criticosManuais.map(x=>x.mat).join(', ')||'nenhum'}.`;

  const ABAS_REV=[

      {aba==='caderno'&&(()=>{

        const seteAtras=new Date();seteAtras.setDate(seteAtras.getDate()-7);

        return(

              </div>

            {sugestoes.length>0&&(
              <div style={{marginBottom:14}}>
                <div style={{fontSize:13,color:'#a78bfa',fontFamily:"'DM Mono',monospace",fontWeight:800,letterSpacing:'1px',marginBottom:8}}>📋 SUGESTÃO COMPLEMENTAR (déficit recente) — {hoje}</div>
                {pendentes.map(s=>(
                  <div key={s.mat} onClick={()=>setAnkiForm(f=>({...f,mat:s.mat}))} style={{padding:'9px 12px',borderRadius:9,background:'rgba(167,139,250,.06)',border:'1px solid rgba(167,139,250,.2)',marginBottom:5,cursor:'pointer'}}>
                    <div style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>{s.mat}</div>
                    {s.motivo&&<div style={{fontSize:13,color:'var(--text4)'}}>{s.motivo}</div>}
                  </div>
                ))}
                {concluidas.map(s=>(
                  <div key={s.mat} style={{padding:'9px 12px',borderRadius:9,background:'rgba(52,211,153,.06)',marginBottom:5}}>
                    <div style={{fontSize:14,color:'#34d399'}}>✅ {s.mat} — feito hoje</div>
                  </div>

            )}

            <div style={{padding:'12px',borderRadius:12,background:'rgba(167,139,250,.05)',border:'1px solid rgba(167,139,250,.2)'}}>
